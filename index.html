                      {tab.badge > 99 ? '99+' : tab.badge}
                    </span>
                  )}
                  <span style={{ fontSize:'20px', lineHeight:1 }}>{tab.i}</span>
                  <span style={{ fontSize:'10px', fontWeight: active ? 700 : 400 }}>{tab.l}</span>
                  {active && <span style={{ position:'absolute', top:0, left:'20%', right:'20%', height:'2px', background:'#0078d4', borderRadius:'0 0 2px 2px' }} />}
                </button>
              );
            })}
            {/* More button → opens drawer */}
            <button onClick={()=>setMobileNavOpen(true)}
              style={{ flex:1, background:'none', border:'none', color:'#64748b',
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                gap:'2px', cursor:'pointer', padding:'4px 2px' }}>
              <span style={{ fontSize:'20px', lineHeight:1 }}>⋯</span>
              <span style={{ fontSize:'10px' }}>More</span>
            </button>
          </div>

        </div>
      );
    }

    // ============ DASHBOARD ============
    function Dashboard({ stats, dashboardEmployees, allEmployees, alerts, thresholds, dashFilter, setDashFilter, onJump }) {
      const deptCounts = useMemo(() => { const m={}; dashboardEmployees.forEach(e=>{const d=e.department||'Unassigned'; m[d]=(m[d]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8); }, [dashboardEmployees]);
      const natCounts = useMemo(() => { const m={}; dashboardEmployees.forEach(e=>{const d=e.nationality||'Unknown'; m[d]=(m[d]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6); }, [dashboardEmployees]);
      const expiryByType = useMemo(() => { const m={}; EXPIRY_TYPES.forEach(t=>m[t.key]={...t,count:0,expired:0,critical:0}); alerts.forEach(a=>{ if(!m[a.type]) return; m[a.type].count++; if(a.severity==='expired')m[a.type].expired++; if(a.severity==='critical')m[a.type].critical++;}); return Object.values(m); }, [alerts]);

      if (allEmployees.length === 0) return <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'60px', textAlign:'center' }}><div style={{fontSize:'40px',marginBottom:'12px'}}>👥</div><h2 style={{margin:'0 0 8px'}}>No employees yet</h2><p style={{color:'#64748b'}}>Click <strong>Import Excel</strong> top-right to load your data.</p></div>;

      return (
        <div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px 18px', marginBottom:'16px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'16px', flexWrap:'wrap' }}>
            <div style={{ fontSize:'13px', color:'#475569' }}>👁 Showing <strong>{dashboardEmployees.length}</strong> of <strong>{allEmployees.length}</strong> employees {dashFilter==='employed_strict' && <span style={{color:'#94a3b8'}}>(Employed only)</span>}</div>
            <div style={{ display:'flex', gap:'6px' }}>
              {[['employed_strict','Employed only'],['employed_broad','Active workforce'],['all','Show all']].map(([k,l])=>(
                <button key={k} onClick={()=>setDashFilter(k)} style={{ background: dashFilter===k?'#2563eb':'#f1f5f9', color: dashFilter===k?'#fff':'#475569', border:'none', padding:'6px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap:'10px', marginBottom:'20px' }}>
            <Kpi label="Active Employees" value={stats.total} color="#059669" icon="✅" />
            <Kpi label="Departments" value={stats.departments} color="#2563eb" icon="🏢" />
            <Kpi label="Passport Expiring" sub={stats.passportExpired>0?`${stats.passportExpired} expired`:`≤${thresholds.passport}d`} value={stats.passportCount} color="#dc2626" icon="📕" alert={stats.passportCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Emirates ID Expiring" sub={stats.eidExpired>0?`${stats.eidExpired} expired`:`≤${thresholds.eid}d`} value={stats.eidCount} color="#ea580c" icon="🪪" alert={stats.eidCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="CICPA Expiring" sub={stats.cicpaExpired>0?`${stats.cicpaExpired} expired`:`≤${thresholds.cicpa}d`} value={stats.cicpaCount} color="#7c3aed" icon="🛢️" alert={stats.cicpaCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Training Certs Expiring" sub={stats.trainingCertExpired>0?`${stats.trainingCertExpired} expired`:`≤${thresholds.training_cert||30}d`} value={stats.trainingCertCount} color="#0f766e" icon="🎓" alert={stats.trainingCertCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Expired Documents" value={stats.expired} color="#dc2626" icon="⚠️" alert={stats.expired>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Critical (≤7 days)" value={stats.critical} color="#ea580c" icon="🔴" alert={stats.critical>0} onClick={()=>onJump('alerts')} />
          </div>

          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'20px', marginBottom:'16px' }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'14px' }}><h3 style={{ margin:0, fontSize:'14px' }}>Document Expiry Overview</h3><button onClick={()=>onJump('alerts')} style={S.link}>View all →</button></div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'10px' }}>
              {expiryByType.map(t => (
                <div key={t.key} style={{ border:'1px solid #e2e8f0', borderRadius:'10px', padding:'14px', background:'#fafbfc' }}>
                  <div style={{ fontSize:'12px', color:'#475569', fontWeight:600, marginBottom:'2px' }}>{t.label}</div>
                  <div style={{ fontSize:'10px', color:'#94a3b8', marginBottom:'8px' }}>Threshold: {thresholds[t.key]}d</div>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end' }}>
                    <div style={{ fontSize:'26px', fontWeight:700, lineHeight:1 }}>{t.count}</div>
                    {(t.expired>0||t.critical>0) && <div style={{ fontSize:'11px', textAlign:'right' }}>{t.expired>0&&<div style={{color:'#dc2626',fontWeight:600}}>{t.expired} expired</div>}{t.critical>0&&<div style={{color:'#ea580c',fontWeight:600}}>{t.critical} critical</div>}</div>}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr', gap:'14px' }}>
            <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'20px' }}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'12px' }}><h3 style={{ margin:0, fontSize:'14px' }}>Upcoming Expirations</h3><button onClick={()=>onJump('alerts')} style={S.link}>View all →</button></div>
              {alerts.length===0 ? <div style={{ textAlign:'center', padding:'32px', color:'#94a3b8' }}>✓ No upcoming expirations</div> :
                alerts.slice(0,8).map((a,i)=>{ const c=a.severity==='expired'?'#dc2626':a.severity==='critical'?'#ea580c':a.severity==='urgent'?'#ca8a04':'#0891b2';
                  return <div key={i} style={{ display:'flex', alignItems:'center', gap:'12px', padding:'10px 0', borderBottom:'1px solid #f1f5f9' }}>
                    <div style={{ width:'3px', height:'32px', background:c, borderRadius:'2px' }}></div>
                    <div style={{ flex:1 }}><div style={{ fontSize:'13px', fontWeight:600 }}>{a.full_name||'(no name)'}</div><div style={{ fontSize:'11px', color:'#64748b' }}>{a.employee_id} · {a.typeLabel} expires {fmtDateDisplay(a.expiryDate)}</div></div>
                    <div style={{ background:c+'12', color:c, padding:'3px 10px', borderRadius:'12px', fontSize:'11px', fontWeight:700 }}>{a.daysLeft<0?`${Math.abs(a.daysLeft)}d ago`:`${a.daysLeft}d`}</div>
                  </div>; })}
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px' }}><h3 style={{ margin:'0 0 12px', fontSize:'13px' }}>By Department</h3>{deptCounts.map(([d,c])=><Bar key={d} label={d} value={c} max={deptCounts[0][1]} color="#2563eb" />)}</div>
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px' }}><h3 style={{ margin:'0 0 12px', fontSize:'13px' }}>By Nationality</h3>{natCounts.map(([d,c])=><Bar key={d} label={d} value={c} max={natCounts[0][1]} color="#059669" />)}</div>
            </div>
          </div>
        </div>
      );
    }
    function Kpi({ label, value, color, icon, alert, onClick, sub }) {
      return <div className="hr-card" onClick={onClick} style={{ background:'#fff', border:'1px solid #e2e8f0', borderLeft: alert?`3px solid ${color}`:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px', cursor:onClick?'pointer':'default' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'6px' }}><div style={{ fontSize:'11.5px', color:'#64748b', fontWeight:600, lineHeight:1.25 }}>{label}</div><div style={{ fontSize:'16px' }}>{icon}</div></div>
        <div style={{ fontSize:'26px', fontWeight:700, lineHeight:1 }}>{value}</div>
        {sub && <div style={{ fontSize:'10.5px', color: alert?color:'#94a3b8', fontWeight:600, marginTop:'4px' }}>{sub}</div>}
      </div>;
    }
    function Bar({ label, value, max, color }) {
      return <div style={{ marginBottom:'8px' }}><div style={{ display:'flex', justifyContent:'space-between', fontSize:'12px', marginBottom:'3px' }}><span style={{ color:'#475569' }}>{label}</span><span style={{ fontWeight:600 }}>{value}</span></div><div style={{ height:'5px', background:'#f1f5f9', borderRadius:'3px' }}><div style={{ width:`${max>0?(value/max)*100:0}%`, height:'100%', background:color, borderRadius:'3px' }}></div></div></div>;
    }

    // ============ EMPLOYEE LIST ============
    function EmployeeList({ employees, total, search, setSearch, statusFilter, setStatusFilter, thresholds, onEdit, onDelete, onAdd }) {
      // Compute missing-data summary across all employees
      const missingStats = useMemo(() => {
        const counts = { passport: 0, eid: 0, visa: 0, insurance: 0, iloe: 0 };
        const empsMissing = new Set();
        employees.forEach(emp => {
          let hasMissing = false;
          if (!emp.passport_expiry) { counts.passport++; hasMissing = true; }
          if (!emp.eid_expiry)      { counts.eid++;      hasMissing = true; }
          if (!emp.visa_expiry)     { counts.visa++;     hasMissing = true; }
          if (!emp.insurance_expiry){ counts.insurance++; hasMissing = true; }
          if (!emp.iloe_expiry)     { counts.iloe++;     hasMissing = true; }
          if (hasMissing) empsMissing.add(emp.id);
        });
        return { counts, total: empsMissing.size };
      }, [employees]);

      return (
        <div>
          <div style={{ display:'flex', gap:'10px', marginBottom:'14px', flexWrap:'wrap' }}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search name, ID, passport, email…" style={{ ...S.input, flex:1, minWidth:'240px', maxWidth:'380px' }} />
            <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={S.input}>
              <option value="all">All ({total})</option><option value="employed_only">Employed only</option><option value="with_id">With Employee ID</option><option value="pending">Pending</option>
            </select>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ Add Employee</button>
          </div>

          {/* Missing document data alert banner */}
          {missingStats.total > 0 && (
            <div style={{ background:'#fffbeb', border:'1px solid #fcd34d', borderRadius:'10px', padding:'12px 16px', marginBottom:'14px', display:'flex', alignItems:'flex-start', gap:'12px' }}>
              <span style={{ fontSize:'20px', flexShrink:0 }}>⚠️</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:'13px', fontWeight:700, color:'#92400e', marginBottom:'6px' }}>
                  {missingStats.total} employee{missingStats.total!==1?'s':''} have missing expiry date{missingStats.total!==1?'s':''} — no alerts can be generated for missing entries
                </div>
                <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
                  {missingStats.counts.passport > 0 && <span style={{ background:'#fee2e2', color:'#991b1b', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'8px' }}>🛂 Passport: {missingStats.counts.passport}</span>}
                  {missingStats.counts.eid > 0      && <span style={{ background:'#fed7aa', color:'#9a3412', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'8px' }}>🪪 Emirates ID: {missingStats.counts.eid}</span>}
                  {missingStats.counts.visa > 0     && <span style={{ background:'#fef3c7', color:'#92400e', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'8px' }}>📄 Visa: {missingStats.counts.visa}</span>}
                  {missingStats.counts.insurance > 0 && <span style={{ background:'#cffafe', color:'#164e63', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'8px' }}>🏥 Insurance: {missingStats.counts.insurance}</span>}
                  {missingStats.counts.iloe > 0     && <span style={{ background:'#fce7f3', color:'#9d174d', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'8px' }}>🛡️ ILOE: {missingStats.counts.iloe}</span>}
                </div>
                <div style={{ fontSize:'11.5px', color:'#b45309', marginTop:'6px' }}>Rows highlighted in amber below. Click ✏️ on each employee to add the missing details.</div>
              </div>
            </div>
          )}
          {missingStats.total === 0 && employees.length > 0 && (
            <div style={{ background:'#f0fdf4', border:'1px solid #86efac', borderRadius:'10px', padding:'10px 16px', marginBottom:'14px', display:'flex', alignItems:'center', gap:'10px', fontSize:'12.5px', color:'#166534' }}>
              <span>✅</span> All employees have complete expiry date entries for Passport, Emirates ID, Visa, Insurance &amp; ILOE
            </div>
          )}
          <EmployeeTable employees={employees} thresholds={thresholds} onEdit={onEdit} onDelete={onDelete} />
          <div style={{ marginTop:'10px', fontSize:'12px', color:'#64748b' }}>Showing {employees.length} {employees.length===1?'employee':'employees'}</div>
        </div>
      );
    }
    function EmployeeTable({ employees, thresholds, onEdit, onDelete }) {
      const [quickView, setQuickView] = React.useState(null); // employee object for popup
      const colGetters = {
        emp_id: e => e.employee_id||'—',
        name: e => e.full_name||'—',
        position: e => e.position||'—',
        exp: e => e.work_experience ? `${e.work_experience} yrs` : '—',
        nationality: e => e.nationality||'—',
        status: e => e.status||'—',
        joined: e => e.joining_date ? fmtDateDisplay(e.joining_date) : '—',
        source: e => e.hired_from==='Supplier' ? (e.supplier_name||'Supplier') : (e.hired_from||'—'),
        passport: e => expiryStatus(e.passport_expiry, thresholds.passport),
        eid: e => expiryStatus(e.eid_expiry, thresholds.eid),
        visa: e => expiryStatus(e.visa_expiry, thresholds.visa),
        insurance: e => expiryStatus(e.insurance_expiry, thresholds.insurance),
        cicpa: e => expiryStatus(e.cicpa_expiry, thresholds.cicpa),
        iloe: e => expiryStatus(e.iloe_expiry, thresholds.iloe),
      };
      const { filters, setColFilter, clearAll, filteredRows: rows, activeCount } = useColumnFilters(employees, colGetters);
      const FROZEN_W = [90, 170];
      const FROZEN_LEFT = [0, FROZEN_W[0]];
      return (
          <>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
            {activeCount > 0 && (
              <div style={{ padding:'7px 12px', background:'#eff6ff', borderBottom:'1px solid #bfdbfe', display:'flex', alignItems:'center', justifyContent:'space-between', fontSize:'11.5px', color:'#1e40af' }}>
                <span>🔎 {activeCount} column filter{activeCount!==1?'s':''} active — showing {rows.length} of {employees.length}</span>
                <button onClick={clearAll} style={{ background:'none', border:'none', color:'#1e40af', fontWeight:700, cursor:'pointer', fontSize:'11.5px' }}>Clear all filters</button>
              </div>
            )}
            <div className="xl-wrap hr-scroll">
              <table className="xl-table" style={{ width:'100%', fontSize:'12px', minWidth:'900px' }}>
                <thead><tr style={{ background:'#f8fafc' }}>
                  <ExcelTh label="Emp ID" colKey="emp_id" rows={employees} getValue={colGetters.emp_id} filters={filters} setColFilter={setColFilter} frozen left={FROZEN_LEFT[0]} style={{ width:FROZEN_W[0] }} />
                  <ExcelTh label="Name" colKey="name" rows={employees} getValue={colGetters.name} filters={filters} setColFilter={setColFilter} frozen left={FROZEN_LEFT[1]} style={{ width:FROZEN_W[1] }} className="xl-frozen-edge" />
                  <ExcelTh label="Role / Work Visa" colKey="position" rows={employees} getValue={colGetters.position} filters={filters} setColFilter={setColFilter} style={{ width:180, minWidth:180 }} />
                  <ExcelTh label="Exp. Years" colKey="exp" rows={employees} getValue={colGetters.exp} filters={filters} setColFilter={setColFilter} />
                  <ExcelTh label="Nationality" colKey="nationality" rows={employees} getValue={colGetters.nationality} filters={filters} setColFilter={setColFilter} />
                  <ExcelTh label="Status" colKey="status" rows={employees} getValue={colGetters.status} filters={filters} setColFilter={setColFilter} />
                  <ExcelTh label="Joined" colKey="joined" rows={employees} getValue={colGetters.joined} filters={filters} setColFilter={setColFilter} />
                  <th style={S.th}></th>
                </tr></thead>
                <tbody>
                  {rows.length===0 ? <tr><td colSpan={8} style={{ textAlign:'center', padding:'40px', color:'#94a3b8' }}>No employees found</td></tr> :
                    rows.map(emp=>{
                      // Compute missing critical document fields
                      const missingDocs = [];
                      if (!emp.passport_expiry) missingDocs.push('Passport Expiry');
                      if (!emp.eid_expiry) missingDocs.push('Emirates ID Expiry');
                      if (!emp.visa_expiry) missingDocs.push('Visa Expiry');
                      if (!emp.insurance_expiry) missingDocs.push('Insurance Expiry');
                      if (!emp.iloe_expiry) missingDocs.push('ILOE Expiry');
                      const hasMissing = missingDocs.length > 0;
                      const rowBg = hasMissing ? '#fffbeb' : '#fff';
                      return (
                      <tr key={emp.id} className="hr-row" onDoubleClick={()=>onEdit(emp)} title="Double-click to edit" style={{ borderTop:'1px solid #f1f5f9', cursor:'pointer', background: hasMissing ? '#fffbeb' : 'transparent' }}>
                        <td className="xl-frozen" style={{ ...S.td, left:FROZEN_LEFT[0], width:FROZEN_W[0], background:rowBg }}>
                          <div style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
                            <span>{emp.employee_id||'—'}</span>
                            {hasMissing && (
                              <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
                                {missingDocs.map(d => (
                                  <span key={d} title={'Missing: ' + d} style={{ background:'#fef3c7', color:'#92400e', fontSize:'9.5px', fontWeight:700, padding:'1px 5px', borderRadius:'6px', whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:'3px' }}>
                                    ⚠ {d}
                                  </span>
                                ))}
                              </div>
                            )}
                          </div>
                        </td>
                        <td className="xl-frozen xl-frozen-edge" onClick={e=>{e.stopPropagation();setQuickView(emp);}} title="Click to view details" style={{ ...S.td, left:FROZEN_LEFT[1], width:FROZEN_W[1], background:rowBg, fontWeight:600, cursor:'pointer', color:'#2563eb', textDecoration:'underline', textDecorationStyle:'dotted', textUnderlineOffset:'2px' }}>
                          {emp.full_name}
                        </td>
                        <td style={{ ...S.td, width:180, minWidth:180 }}>{emp.position}</td>
                        <td style={{ ...S.td, textAlign:'center' }}>{emp.work_experience ? <span style={{ background:'#eff6ff', color:'#1d4ed8', padding:'2px 8px', borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>{emp.work_experience} yrs</span> : <span style={{ color:'#cbd5e1' }}>—</span>}</td>
                        <td style={S.td}>{emp.nationality}</td>
                        <td style={S.td}>{emp.status && <span title={emp.status} style={{ background: isStrictEmployed(emp.status)?'#d1fae5':'#fef3c7', color: isStrictEmployed(emp.status)?'#065f46':'#92400e', padding:'2px 8px', borderRadius:'10px', fontSize:'11px', fontWeight:600, display:'inline-block', maxWidth:'160px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{emp.status}</span>}</td>
                        <td style={S.td}>{emp.joining_date ? <div><span style={{ fontSize:'11px', whiteSpace:'nowrap' }}>{fmtDateDisplay(emp.joining_date)}</span></div> : <span style={{ color:'#cbd5e1' }}>—</span>}</td>
                        {/* Source/Passport/EID/Visa/Insurance/CICPA/ILOE moved to popup */}
                        <td style={{ ...S.td, textAlign:'right', whiteSpace:'nowrap' }} onClick={ev=>ev.stopPropagation()}><button onClick={()=>onEdit(emp)} style={S.iconBtn}>✏️</button><button onClick={(ev)=>{ev.stopPropagation();onDelete(emp.id);}} style={S.iconBtn}>🗑️</button></td>
                      </tr>
                    );})}
                </tbody>
              </table>
            </div>
          </div>
        {/* Quick View Popup */}
        {quickView && (() => {
          const qv = quickView;
          const fmtD = v => v ? new Date(v).toLocaleDateString('en-GB') : null;
          const daysLeft = v => { if (!v) return null; const d = Math.round((new Date(v)-new Date())/(1000*60*60*24)); return d; };
          const expiryColor = (v, warn) => { const d=daysLeft(v); if(d===null) return '#94a3b8'; if(d<0) return '#dc2626'; if(d<=warn) return '#f59e0b'; return '#16a34a'; };
          const InfoRow = ({label, value, mono}) => value ? (
            <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
              <span style={{ fontSize:'10px', color:'#94a3b8', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.05em' }}>{label}</span>
              <span style={{ fontSize:'12.5px', color:'#1e293b', fontFamily: mono?'ui-monospace,monospace':undefined }}>{value}</span>
            </div>
          ) : null;
          const DocRow = ({label, no, expiry, warnDays=60}) => {
            const d=daysLeft(expiry); const col=expiryColor(expiry,warnDays);
            return (
              <div style={{ display:'flex', flexDirection:'column', gap:'2px', padding:'8px 10px', borderRadius:'8px', background: expiry ? (d<0?'#fef2f2':d<=warnDays?'#fffbeb':'#f0fdf4') : '#f8fafc', border:`1px solid ${expiry?(d<0?'#fecaca':d<=warnDays?'#fde68a':'#bbf7d0'):'#e2e8f0'}` }}>
                <span style={{ fontSize:'10px', color:'#64748b', fontWeight:700, textTransform:'uppercase' }}>{label}</span>
                {no && <span style={{ fontSize:'11px', color:'#334155', fontFamily:'ui-monospace,monospace', fontWeight:600 }}>{no}</span>}
                {expiry
                  ? <span style={{ fontSize:'11.5px', fontWeight:700, color:col }}>{fmtD(expiry)}{d!==null ? ` (${d<0?'Expired '+Math.abs(d)+'d ago':d+'d left'})` : ''}</span>
                  : <span style={{ fontSize:'11px', color:'#94a3b8' }}>Not entered</span>}
              </div>
            );
          };
          return (
          <ResizablePanel
            title={qv.full_name}
            subtitle={`${qv.employee_id} · ${qv.position}`}
            headerColor="linear-gradient(135deg,#1e3a5f,#2563eb)"
            onClose={()=>setQuickView(null)}
            defaultSize="normal"
            zIndex={200}>
            <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden' }}>
            <div style={{ display:'flex', gap:'8px', padding:'8px 14px', background:'#f8fafc', borderBottom:'1px solid #e2e8f0', flexShrink:0 }}>
              <button className="hr-btn" onClick={()=>{setQuickView(null); onEdit(qv);}} style={{ background:'#1a5fa8', color:'#fff', border:'none', padding:'6px 14px', borderRadius:'8px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>✏️ Edit Employee</button>
            </div>
            {/* Body - scrollable */}
            <div style={{ overflowY:'auto', flex:1 }}>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0' }}>
                  {/* Left panel */}
                  <div style={{ padding:'18px 20px', borderRight:'1px solid #e2e8f0', display:'flex', flexDirection:'column', gap:'12px' }}>
                    <div style={{ fontSize:'11px', fontWeight:700, color:'#2563eb', textTransform:'uppercase', letterSpacing:'0.08em', borderBottom:'2px solid #eff6ff', paddingBottom:'6px' }}>Personal &amp; Contact</div>
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }}>
                      <InfoRow label="Nationality" value={qv.nationality} />
                      <InfoRow label="Status" value={qv.status} />
                      <InfoRow label="Experience" value={qv.work_experience ? qv.work_experience+' yrs' : null} />
                      <InfoRow label="Joined" value={fmtD(qv.joining_date)} />
                      <InfoRow label="Mobile" value={qv.mobile} />
                      <InfoRow label="Email" value={qv.email} />
                      <InfoRow label="Hired From" value={qv.hired_from==='Supplier'?(qv.supplier_name||'Supplier'):qv.hired_from} />
                      <InfoRow label="Department" value={qv.department} />
                    </div>
                    <div style={{ fontSize:'11px', fontWeight:700, color:'#7c3aed', textTransform:'uppercase', letterSpacing:'0.08em', borderBottom:'2px solid #f5f3ff', paddingBottom:'6px', marginTop:'4px' }}>Location &amp; Work History</div>
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }}>
                      <InfoRow label="Current Location (UAE)" value={qv.uae_address || qv.current_location_uae} />
                      <InfoRow label="Home Country Address" value={qv.home_address} />
                      <InfoRow label="Previous Job Location" value={qv.previous_job_location || qv.last_employer_location} />
                      <InfoRow label="Previous Employer" value={qv.previous_employer || qv.last_employer} />
                    </div>
                    {qv.skills && (
                      <>
                        <div style={{ fontSize:'11px', fontWeight:700, color:'#059669', textTransform:'uppercase', letterSpacing:'0.08em', borderBottom:'2px solid #f0fdf4', paddingBottom:'6px', marginTop:'4px' }}>Skills</div>
                        <div style={{ display:'flex', flexWrap:'wrap', gap:'5px' }}>
                          {qv.skills.split(',').map((sk,i) => (
                            <span key={i} style={{ background:'#f0fdf4', border:'1px solid #86efac', color:'#166534', padding:'3px 9px', borderRadius:'12px', fontSize:'11px', fontWeight:600 }}>{sk.trim()}</span>
                          ))}
                        </div>
                      </>
                    )}
                  </div>
                  {/* Right panel */}
                  <div style={{ padding:'18px 20px', display:'flex', flexDirection:'column', gap:'12px' }}>
                    <div style={{ fontSize:'11px', fontWeight:700, color:'#dc2626', textTransform:'uppercase', letterSpacing:'0.08em', borderBottom:'2px solid #fef2f2', paddingBottom:'6px' }}>Documents &amp; Expiry</div>
                    <div style={{ display:'flex', flexDirection:'column', gap:'8px' }}>
                      <DocRow label="Passport" no={qv.passport_no} expiry={qv.passport_expiry} warnDays={180} />
                      <DocRow label="Emirates ID" no={qv.eid_no} expiry={qv.eid_expiry} warnDays={60} />
                      <DocRow label="Visa" expiry={qv.visa_expiry} warnDays={60} />
                      <DocRow label="Insurance" no={qv.insurance_id} expiry={qv.insurance_expiry} warnDays={30} />
                      <DocRow label="CICPA Gate Pass" no={qv.cicpa_no} expiry={qv.cicpa_expiry} warnDays={15} />
                      <DocRow label="ILOE" no={qv.iloe_cert_no} expiry={qv.iloe_expiry} warnDays={30} />
                    </div>
                    {qv.cicpa_locations && (
                      <div style={{ padding:'8px 10px', borderRadius:'8px', background:'#faf5ff', border:'1px solid #e9d5ff' }}>
                        <div style={{ fontSize:'10px', color:'#7c3aed', fontWeight:700, textTransform:'uppercase', marginBottom:'4px' }}>CICPA Permitted Locations</div>
                        <div style={{ fontSize:'12px', color:'#4c1d95' }}>{qv.cicpa_locations}</div>
                      </div>
                    )}
                    {(qv.passport_handover || qv.passport_handover_date) && (
                      <div style={{ padding:'8px 10px', borderRadius:'8px', background:'#fff7ed', border:'1px solid #fed7aa' }}>
                        <div style={{ fontSize:'10px', color:'#c2410c', fontWeight:700, textTransform:'uppercase', marginBottom:'4px' }}>Passport Handover</div>
                        <div style={{ fontSize:'12px', color:'#7c2d12' }}>{qv.passport_handover || fmtD(qv.passport_handover_date)}</div>
                      </div>
                    )}
                    <div style={{ fontSize:'11px', fontWeight:700, color:'#0891b2', textTransform:'uppercase', letterSpacing:'0.08em', borderBottom:'2px solid #ecfeff', paddingBottom:'6px', marginTop:'4px' }}>Emergency Contact</div>
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }}>
                      <InfoRow label="Name" value={qv.emergency_name} />
                      <InfoRow label="Relation" value={qv.emergency_relation} />
                      <InfoRow label="Mobile" value={qv.emergency_mobile} />
                      <InfoRow label="Country" value={qv.emergency_country} />
                    </div>
                  </div>
                </div>
                {/* Notes bar */}
                {qv.notes && (
                  <div style={{ margin:'0 20px 16px', padding:'10px 14px', background:'#f8fafc', borderRadius:'8px', border:'1px solid #e2e8f0', fontSize:'12px', color:'#475569' }}>
                    <span style={{ fontWeight:700, color:'#0f172a' }}>Notes: </span>{qv.notes}
                  </div>
                )}
              </div>
            </div>
          </ResizablePanel>
          );
        })()}
          </>
      );
    }
    function DateCell({ value, threshold, docNo, missing }) {
      if (!value) return <td style={{ ...S.td, background: missing ? '#fff7ed' : 'transparent' }}>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          {missing && <span style={{ fontSize:'10px', color:'#c2410c', background:'#ffedd5', border:'1px dashed #fb923c', padding:'2px 7px', borderRadius:'6px', fontWeight:700, whiteSpace:'nowrap' }}>📋 Not entered</span>}
          {docNo && <span style={{ fontSize:'10px', color:'#94a3b8', fontFamily:'ui-monospace, monospace' }}>{docNo}</span>}

                  return <tr key={i} className="hr-row" style={{ borderTop:'1px solid #f1f5f9' }}>

    // ============ MOB-DEMOB ============
    function MobDemobView({ records, employees, onAdd, onEdit, onDelete, onSyncAll, onRedeploy }) {
      const [search, setSearch] = useState('');
      const empIds = new Set(employees.map(e => e.employee_id).filter(Boolean));
      const synced = records.filter(r => empIds.has(r.employee_id)).length;
      const total = empIds.size;
      const missing = total - synced;

      // Compute days worked for a record
      const calcDays = (r) => {
        const mob = r.mobilization_date ? new Date(r.mobilization_date) : null;
        const demob = r.demobilization_date ? new Date(r.demobilization_date) : null;
        if (!mob) return null;
        const end = demob || new Date();
        return Math.round((end - mob) / 86400000);
      };

      // Sort / filter flat list
      const sorted = useMemo(() => {
        const s = search.toLowerCase().trim();
        return [...records]
          .filter(r => {
            if (!s) return true;
            return (r.employee_id||'').toLowerCase().includes(s) ||
                   (r.full_name||'').toLowerCase().includes(s) ||
                   (r.position||'').toLowerCase().includes(s) ||
                   (r.eid_no||'').toLowerCase().includes(s) ||
                   (r.supply||'').toLowerCase().includes(s) ||
                   (r.location||'').toLowerCase().includes(s) ||
                   (r.remarks||'').toLowerCase().includes(s) ||
                   (r.mobilization_date ? fmtDateDisplay(r.mobilization_date).toLowerCase().includes(s) : false) ||
                   (r.demobilization_date ? fmtDateDisplay(r.demobilization_date).toLowerCase().includes(s) : false);
          })
          .sort((a, b) => {
            const na = parseInt((a.employee_id||'').replace(/[^0-9]/g,'') || '0');
            const nb = parseInt((b.employee_id||'').replace(/[^0-9]/g,'') || '0');
            if (na !== nb) return na - nb;
            // Within same employee, sort by mob date desc (latest first)
            return (b.mobilization_date||'') > (a.mobilization_date||'') ? 1 : -1;
          });
      }, [records, search]);

      // Grouped: one entry per employee, with all their assignments
      const grouped = useMemo(() => {
        const s = search.toLowerCase().trim();
        const empMap = {};
        records.forEach(r => {
          const key = r.employee_id || r.full_name || r.id;
          if (!empMap[key]) empMap[key] = { employee_id: r.employee_id, full_name: r.full_name, position: r.position, eid_no: r.eid_no, assignments: [] };
          empMap[key].assignments.push(r);
        });
        return Object.values(empMap)
          .filter(g => {
            if (!s) return true;
            return (g.employee_id||'').toLowerCase().includes(s) ||
                   (g.full_name||'').toLowerCase().includes(s) ||
                   (g.position||'').toLowerCase().includes(s) ||
                   g.assignments.some(r =>
                     (r.supply||'').toLowerCase().includes(s) ||
                     (r.location||'').toLowerCase().includes(s) ||
                     (r.remarks||'').toLowerCase().includes(s)
                   );
          })
          .sort((a, b) => {
            const na = parseInt((a.employee_id||'').replace(/[^0-9]/g,'') || '0');
            const nb = parseInt((b.employee_id||'').replace(/[^0-9]/g,'') || '0');
            return na - nb;
          })
          .map(g => ({
            ...g,
            assignments: [...g.assignments].sort((a, b) =>
              (b.mobilization_date||'') > (a.mobilization_date||'') ? 1 : -1
            )
          }));
      }, [records, search]);

      const DaysTag = ({ r }) => {
        const days = calcDays(r);
        if (days === null) return <span style={{ color:'#cbd5e1' }}>—</span>;
        const ongoing = !r.demobilization_date;
        const bg = ongoing ? '#eff6ff' : '#f0fdf4';
        const color = ongoing ? '#1d4ed8' : '#166534';
        return (
          <span style={{ background: bg, color, fontWeight:700, fontSize:'11px', padding:'2px 8px', borderRadius:'10px', whiteSpace:'nowrap' }}>
            {days}d{ongoing ? ' 🟢' : ' ✓'}
          </span>
        );
      };

      return (
        <div>
          {/* Toolbar */}
          <div style={{ display:'flex', gap:'10px', marginBottom:'14px', alignItems:'center', flexWrap:'wrap' }}>
            <input value={search} onChange={e => setSearch(e.target.value)}
              placeholder="Search by Emp ID, Name, Position, Location, Supply, Remarks…"
              style={{ ...S.input, flex:1, minWidth:'220px', maxWidth:'360px' }} />
            <div style={{ background: missing===0&&total>0 ? '#f0fdf4' : '#fffbeb', border:'1px solid '+(missing===0&&total>0?'#86efac':'#fcd34d'), borderRadius:'8px', padding:'7px 14px', fontSize:'12px', color:missing===0&&total>0?'#166534':'#92400e', fontWeight:600, whiteSpace:'nowrap' }}>
              {missing===0&&total>0 ? '✅' : '⚠️'} {synced}/{total} synced{missing > 0 && ` — ${missing} missing`}
            </div>

            <button className="hr-btn" onClick={onSyncAll}
              style={{ background:'#0f172a', color:'#fff', border:'none', padding:'9px 16px', borderRadius:'8px', fontSize:'13px', fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:'8px' }}>
              Sync All from Employees
              <span style={{ background:'rgba(255,255,255,0.18)', fontSize:'11px', padding:'2px 8px', borderRadius:'8px' }}>{employees.length}</span>
            </button>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ Add Record</button>
          </div>

          {/* ── FLAT VIEW ── */}
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
            <div className="xl-wrap hr-scroll">
              <table className="xl-table" style={{ width:'100%', fontSize:'12px', minWidth:'1100px' }}>
                <thead>
                  <tr style={{ background:'#f8fafc' }}>
                    {['Emp ID','Full Name','Position','EID No','#','Mob. Date','Demob. Date','Days Worked','Supply','Location','Remarks',''].map((h,i) =>
                      <th key={h} className={i<2 ? 'xl-frozen'+(i===1?' xl-frozen-edge':'') : undefined} style={{ ...S.th, ...(i===0?{left:0,width:90,minWidth:90,maxWidth:90}:i===1?{left:90,width:160,minWidth:160,maxWidth:160}:i===2?{width:130,minWidth:130}:{}) }}>{h}</th>
                    )}
                  </tr>
                </thead>
                <tbody>
                  {grouped.length===0
                    ? <tr><td colSpan={12} style={{ textAlign:'center', padding:'40px', color:'#94a3b8' }}>
                        {records.length===0 ? 'No records yet — click "Sync All from Employees" above' : 'No results match your search'}
                      </td></tr>
                    : grouped.map(g => {
                        const totalDays = g.assignments.reduce((sum, r) => sum + (calcDays(r) || 0), 0);
                        const activeAssignment = g.assignments.find(r => !r.demobilization_date);
                        return [
                          <tr key={'hdr-'+g.employee_id} style={{ background:'#f1f5f9', borderTop:'2px solid #cbd5e1' }}>
                            <td className="xl-frozen" style={{ ...S.td, left:0, width:90, minWidth:90, maxWidth:90, background:'#f1f5f9', fontFamily:'ui-monospace,monospace', fontWeight:800, color:'#2563eb', whiteSpace:'nowrap' }}>{g.employee_id}</td>
                            <td className="xl-frozen xl-frozen-edge" style={{ ...S.td, left:90, width:160, minWidth:160, maxWidth:160, background:'#f1f5f9', fontWeight:700 }}>{g.full_name}</td>
                            <td style={{ ...S.td, color:'#475569' }}>{g.position}</td>
                            <td style={{ ...S.td, fontSize:'11px', color:'#64748b' }}>{g.eid_no}</td>
                            <td colSpan={8} style={{ ...S.td }}>
                              <div style={{ display:'flex', gap:'6px', alignItems:'center', flexWrap:'wrap' }}>
                                <span style={{ background:'#f0f9ff', color:'#0369a1', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'10px' }}>
                                  {g.assignments.length} assignment{g.assignments.length!==1?'s':''}
                                </span>
                                <span style={{ background:'#fef3c7', color:'#92400e', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'10px' }}>
                                  {totalDays}d total
                                </span>
                                {activeAssignment && (
                                  <span style={{ background:'#dcfce7', color:'#166534', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'10px' }}>🟢 Active</span>
                                )}
                                {activeAssignment && (
                                  <button onClick={() => {
                                    const demobDate = window.prompt('Close current assignment as of (YYYY-MM-DD):', new Date().toISOString().slice(0,10));
                                    if (demobDate) onRedeploy(activeAssignment, demobDate);
                                  }}
                                    style={{ background:'#fff7ed', color:'#c2410c', border:'1px solid #fdba74', fontSize:'11px', fontWeight:700, padding:'3px 10px', borderRadius:'10px', cursor:'pointer' }}>
                                    🔁 Redeploy
                                  </button>
                                )}
                              </div>
                            </td>
                          </tr>,
                          ...g.assignments.map((r, idx) => (
                            <tr key={r.id} className="hr-row" onDoubleClick={() => onEdit(r)} title="Double-click to edit"
                              style={{ borderTop:'1px solid #f1f5f9', cursor:'pointer', background: !r.demobilization_date ? '#f0fdf4' : '#fff' }}>
                              <td className="xl-frozen" style={{ ...S.td, left:0, width:90, minWidth:90, maxWidth:90, background: !r.demobilization_date ? '#f0fdf4' : '#fff' }}></td>
                              <td className="xl-frozen xl-frozen-edge" style={{ ...S.td, left:90, width:160, minWidth:160, maxWidth:160, background: !r.demobilization_date ? '#f0fdf4' : '#fff' }}></td>
                              <td style={S.td}></td>
                              <td style={S.td}></td>
                              <td style={{ ...S.td, color:'#94a3b8', fontWeight:700, fontSize:'11px' }}>{g.assignments.length - idx}</td>
                              <td style={{ ...S.td, whiteSpace:'nowrap' }}>{r.mobilization_date ? fmtDateDisplay(r.mobilization_date) : '—'}</td>
                              <td style={{ ...S.td, whiteSpace:'nowrap' }}>
                                {r.demobilization_date
                                  ? <span style={{ color:'#64748b' }}>{fmtDateDisplay(r.demobilization_date)}</span>
                                  : <span style={{ background:'#dcfce7', color:'#166534', fontSize:'10.5px', fontWeight:700, padding:'2px 8px', borderRadius:'10px' }}>Active</span>}
                              </td>
                              <td style={{ ...S.td, whiteSpace:'nowrap' }}><DaysTag r={r} /></td>
                              <td style={S.td}>{r.supply ? <span style={{ background:'#eff6ff', color:'#1e40af', fontSize:'11px', fontWeight:600, padding:'2px 8px', borderRadius:'8px' }}>{r.supply}</span> : '—'}</td>
                              <td style={S.td}>{r.location ? <span style={{ background:'#f5f3ff', color:'#6d28d9', fontSize:'11px', fontWeight:600, padding:'2px 8px', borderRadius:'8px' }}>{r.location}</span> : '—'}</td>
                              <td style={{ ...S.td, fontSize:'11px', maxWidth:'160px', whiteSpace:'normal' }}>{r.remarks}</td>
                              <td style={{ ...S.td, textAlign:'right', whiteSpace:'nowrap' }}>
                                <button onClick={() => onEdit(r)} style={S.iconBtn}>&#9998;</button>
                                <button onClick={() => onDelete(r.id)} style={S.iconBtn}>&#128465;</button>
                              </td>
                            </tr>
                          ))
                        ];
                      })
                  }
                </tbody>
              </table>
            </div>
          </div>

          <div style={{ marginTop:'10px', fontSize:'12px', color:'#64748b' }}>
            {records.length} record{records.length!==1?'s':''} · {grouped.length} employee{grouped.length!==1?'s':''}
          </div>
        </div>
      );
    }

    // ============ REPORTS ============
    function ReportsView({ alerts, dashboardEmployees, recipients }) {
      const [copied, setCopied] = useState('');

      // Compute missing-data entries across all active employees
      const MISSING_DOC_FIELDS = [
        { key: 'passport_expiry', label: 'Passport Expiry' },
        { key: 'eid_expiry',      label: 'Emirates ID Expiry' },
        { key: 'visa_expiry',     label: 'Visa Expiry' },
        { key: 'insurance_expiry',label: 'Insurance Expiry' },
        { key: 'iloe_expiry',     label: 'ILOE Expiry' },
      ];
      const missingEntries = useMemo(() => {
        const rows = [];
        dashboardEmployees.forEach(emp => {
          const missing = MISSING_DOC_FIELDS.filter(f => !emp[f.key]).map(f => f.label);
          if (missing.length) rows.push({ employee_id: emp.employee_id, full_name: emp.full_name, missing });
        });
        return rows;
      }, [dashboardEmployees]);

      const emailBody = useMemo(() => {
        const hasAlerts  = alerts.length > 0;
        const hasMissing = missingEntries.length > 0;
        if (!hasAlerts && !hasMissing) return `Dear HR Team,\n\nDocument expiry compliance report from SATCO Arabia as of ${new Date().toLocaleDateString('en-GB')}.\n\nAll documents are within compliance thresholds and all employee records are complete — no action required.\n\nBest regards,\nHR Compliance System\nSATCO Arabia`;
        let b = `Dear HR Team,\n\nDocument expiry compliance report from SATCO Arabia as of ${new Date().toLocaleDateString('en-GB')}.\n\n`;
        if (hasAlerts) b += `Expiry alerts: ${alerts.length} item(s) across ${dashboardEmployees.length} active employee(s) require attention.\n`;
        if (hasMissing) b += `Missing data: ${missingEntries.length} employee(s) have incomplete document records — expiry alerts CANNOT be generated for these until data is entered.\n`;
        b += '\n';
        // Standard document expiry sections
        EXPIRY_TYPES.forEach(t => {
          const items = alerts.filter(a => a.type === t.key);
          if (!items.length) return;
          b += `\n===== ${t.label.toUpperCase()} (${items.length}) =====\n`;
          items.forEach(a => {
            const status = a.daysLeft < 0 ? `EXPIRED ${Math.abs(a.daysLeft)} days ago` : `${a.daysLeft} days remaining`;
            b += `• ${a.full_name || '(no name)'} [${a.employee_id || 'N/A'}] — ${fmtDateDisplay(a.expiryDate)} (${status})\n`;
          });
        });
        // Training certificate alerts
        const trainingAlerts = alerts.filter(a => a.type === 'training_cert');
        if (trainingAlerts.length) {
          b += `\n===== TRAINING CERTIFICATES (${trainingAlerts.length}) =====\n`;
          trainingAlerts.forEach(a => {
            const label = a.typeLabel || 'Training Certificate';
            const issuer = a.issuingCompany ? ` [${a.issuingCompany}]` : '';
            const certNo = a.certNo ? ` — Cert: ${a.certNo}` : '';
            const status = a.daysLeft < 0 ? `EXPIRED ${Math.abs(a.daysLeft)} days ago` : `${a.daysLeft} days remaining`;
            b += `• ${a.full_name || '(no name)'} [${a.employee_id || 'N/A'}] — ${label}${issuer}${certNo} — ${fmtDateDisplay(a.expiryDate)} (${status})\n`;
          });
        }
        // ── MISSING DATA SECTION ──
        if (hasMissing) {
          b += `\n\n===== ⚠ MISSING DOCUMENT DATA — ACTION REQUIRED (${missingEntries.length} employee(s)) =====\n`;
          b += `The following employees have one or more expiry dates NOT entered in the system.\n`;
          b += `No alerts can be automatically generated for missing fields — please update these records immediately.\n\n`;
          missingEntries.forEach(r => {
            b += `• ${r.full_name || '(no name)'} [${r.employee_id || 'N/A'}]\n`;
            r.missing.forEach(m => { b += `    – ${m}: NOT ENTERED\n`; });
          });
        }
        b += `\nPlease take necessary action.\n\nBest regards,\nHR Compliance System\nSATCO Arabia`;
        return b;
      }, [alerts, dashboardEmployees, missingEntries]);

      const waBody = useMemo(() => {
        const hasAlerts  = alerts.length > 0;
        const hasMissing = missingEntries.length > 0;
        if (!hasAlerts && !hasMissing) return 'All clear — no expiry alerts and all records complete.';
        const expired  = alerts.filter(a => a.severity === 'expired');
        const critical = alerts.filter(a => a.severity === 'critical');
        const urgent   = alerts.filter(a => a.severity === 'urgent');
        const getLabel = (a) => a.typeLabel || (a.type === 'training_cert' ? 'Training Cert' : a.type);
        let m = `*HR Compliance Alert*\nSATCO Arabia\n${new Date().toLocaleDateString('en-GB')}\n\n`;
        if (hasAlerts)  m += `Expiry alerts: ${alerts.length} | Expired: ${expired.length} | Critical (≤7d): ${critical.length} | Urgent (≤30d): ${urgent.length}\n`;
        if (hasMissing) m += `⚠ Missing data: ${missingEntries.length} employee(s)\n`;
        m += '\n';
        if (expired.length) {
          m += `*🔴 EXPIRED — Immediate Action Required:*\n`;
          expired.slice(0, 15).forEach(a => { m += `• ${a.full_name} [${a.employee_id}] — ${getLabel(a)} — ${fmtDateDisplay(a.expiryDate)} (${Math.abs(a.daysLeft)}d overdue)\n`; });
          m += '\n';
        }
        if (critical.length) {
          m += `*🟠 CRITICAL (expires within 7 days):*\n`;
          critical.slice(0, 15).forEach(a => { m += `• ${a.full_name} [${a.employee_id}] — ${getLabel(a)} — ${fmtDateDisplay(a.expiryDate)} (${a.daysLeft}d left)\n`; });
          m += '\n';
        }
        if (urgent.length) {
          m += `*🟡 URGENT (expires within 30 days):*\n`;
          urgent.slice(0, 15).forEach(a => { m += `• ${a.full_name} [${a.employee_id}] — ${getLabel(a)} — ${fmtDateDisplay(a.expiryDate)} (${a.daysLeft}d left)\n`; });
          m += '\n';
        }
        if (hasMissing) {
          m += `*📋 MISSING DATA — Cannot generate alerts:*\n`;
          missingEntries.slice(0, 15).forEach(r => {
            m += `• ${r.full_name} [${r.employee_id}] — ${r.missing.join(', ')}\n`;
          });
          if (missingEntries.length > 15) m += `  …and ${missingEntries.length - 15} more\n`;
          m += '\n';
        }
        m += `Please take necessary action.\nHR Compliance System — SATCO Arabia`;
        return m;
      }, [alerts, missingEntries]);

      const totalIssues = alerts.length + missingEntries.length;
      const subject = `HR Compliance: ${alerts.length} expiry alert(s)${missingEntries.length > 0 ? `, ${missingEntries.length} missing record(s)` : ''} — ${new Date().toLocaleDateString('en-GB')}`;
      const copy = (t,l) => { navigator.clipboard.writeText(t); setCopied(l); setTimeout(()=>setCopied(''),2000); };
      const downloadXlsx = () => { const wb=XLSX.utils.book_new(); const rows=alerts.map(a=>({'Employee ID':a.employee_id,'Full Name':a.full_name,Document:a.typeLabel,'Expiry Date':fmtDateISO(a.expiryDate),'Days Remaining':a.daysLeft,Severity:a.severity,Email:a.email,Mobile:a.mobile})); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Alerts'); XLSX.writeFile(wb,`alerts_${new Date().toISOString().slice(0,10)}.xlsx`); };
      return (
        <div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px', marginBottom:'14px' }}>

            <div style={{ display:'flex', flexDirection:'column', gap:'8px' }}>

                : <>

                    <div style={{ fontSize:'13px', color:'#475569' }}>
                      <strong>{alerts.length}</strong> expiry alert(s) across <strong>{dashboardEmployees.length}</strong> active employee(s).{' '}
                      {recipients.length > 0 ? <span>Sending to <strong>{recipients.length}</strong> recipient(s).</span> : <span style={{ color:'#dc2626' }}>No recipients set — add them in Settings.</span>}
                    </div>
                  )}
                  {missingEntries.length > 0 && (
                    <div style={{ background:'#fffbeb', border:'1px solid #fcd34d', borderRadius:'8px', padding:'10px 14px' }}>
                      <div style={{ fontSize:'13px', fontWeight:700, color:'#92400e', marginBottom:'6px' }}>
                        ⚠️ {missingEntries.length} employee(s) have missing expiry date entries — included in email below
                      </div>
                      <div style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
                        {missingEntries.map(r => (
                          <div key={r.employee_id} style={{ fontSize:'12px', color:'#78350f' }}>
                            <strong>{r.full_name}</strong> [{r.employee_id}] — missing: {r.missing.join(', ')}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              }
            </div>
          </div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px', marginBottom:'14px' }}>
            <h3 style={{ margin:'0 0 10px', fontSize:'14px' }}>Download Report</h3>
            <button className="hr-btn" style={S.btnSec} onClick={downloadXlsx}>⬇ Download Excel</button>
          </div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px', marginBottom:'14px' }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'10px', flexWrap:'wrap', gap:'8px' }}>
              <h3 style={{ margin:0, fontSize:'14px' }}>✉️ Email Draft</h3>
              <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
                <button className="hr-btn" style={S.btnSec} onClick={()=>copy(emailBody,'email')}>{copied==='email'?'✓ Copied!':'Copy Body'}</button>
                <a className="hr-btn" style={{ ...S.btnPri, textDecoration:'none', display:'inline-flex', alignItems:'center', gap:'6px' }}
                  href={`mailto:${recipients.map(r=>r.email).join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`}>
                  📨 Open in Email App
                </a>
              </div>
            </div>
            <div style={{ fontSize:'11.5px', color:'#64748b', background:'#f8fafc', padding:'10px 12px', borderRadius:'6px', marginBottom:'10px', lineHeight:1.7 }}>

                </div>

                    🚀 Send Now

              <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
                <button className="hr-btn" style={S.btnSec} onClick={()=>copy(waBody,'wa')}>{copied==='wa'?'✓ Copied!':'Copy'}</button>
                {totalIssues > 0 ? (
                  <button className="hr-btn" onClick={async () => {
                    setCopied('wa_sending');
                    try {
                      const res = await fetch('/api/telegram', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: waBody })
                      });
                      const json = await res.json().catch(() => ({}));
                      if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
                      setCopied('wa_sent');
                      setTimeout(() => setCopied(''), 3500);

                      alert('Telegram send failed: ' + e.message);

                      setTimeout(() => setCopied(''), 3000);

                  </button>

    function DocumentUploadPanel({ data, setField, employeeId }) {
      const BUCKET = 'hr-documents';
      const [activeDoc, setActiveDoc] = useState('passport');
      const [localImgs, setLocalImgs]   = useState({}); // docKey -> dataUrl (for newly uploaded, not yet saved)

      const [empPdfBlobUrl, setEmpPdfBlobUrl] = useState(null);
      useEffect(() => {
        if (!empPreviewDoc || !empPreviewDoc.isPdf || !empPreviewDoc.url) { setEmpPdfBlobUrl(null); return; }
        if (!empPreviewDoc.url.startsWith('data:')) { setEmpPdfBlobUrl(empPreviewDoc.url); return; }
        try {
          const b64 = empPreviewDoc.url.split(',')[1];
          const bytes = atob(b64);
          const arr = new Uint8Array(bytes.length);
          for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
          const blob = new Blob([arr], { type: 'application/pdf' });
          const bUrl = URL.createObjectURL(blob);
          setEmpPdfBlobUrl(bUrl);
          return () => URL.revokeObjectURL(bUrl);
        } catch(e) { setEmpPdfBlobUrl(null); }
      }, [empPreviewDoc]);

      // ── Training cert sub-state — stored in employee_trainings.training_records.__other ──
      // We load from DB on mount, mutate locally, and auto-save on every change.
      const [tcRec, setTcRec] = useState(null);       // the employee_trainings row
      const [tcLoaded, setTcLoaded] = useState(false);

      // Load the training record for this employee
      useEffect(() => {
        if (!employeeId) { setTcLoaded(true); return; }
        db.from('employee_trainings').select('*').eq('employee_id', employeeId).single()
          .then(({ data: row }) => { setTcRec(row || null); setTcLoaded(true); });
      }, [employeeId]);

      const getTrainCerts = () => {
        try {
          const p = JSON.parse(tcRec?.training_records || '{}');
          return p.__other || [];
        } catch { return []; }
      };

      // Mutate __other and immediately persist to Supabase
      const tcMutate = async (fn) => {
        const oldCerts = getTrainCerts();
        const newCerts = fn(oldCerts);
        // Update local state first (optimistic)
        setTcRec(prev => {
          let p = {}; try { p = JSON.parse(prev?.training_records || '{}'); } catch {}
          p.__other = newCerts;
          return { ...(prev || {}), employee_id: employeeId, training_records: JSON.stringify(p) };
        });
        // Persist to DB
        try {
          if (tcRec?.id) {
            let p = {}; try { p = JSON.parse(tcRec.training_records || '{}'); } catch {}
            p.__other = newCerts;
            await db.from('employee_trainings').update({ training_records: JSON.stringify(p) }).eq('id', tcRec.id);
          } else {
            // Row doesn't exist yet — create it
            const initRec = JSON.stringify({ __other: newCerts });
            const { data: newRow } = await db.from('employee_trainings')
              .insert({ employee_id: employeeId, full_name: data.full_name || '', position: data.position || null, training_records: initRec })
              .select().single();
            if (newRow) setTcRec(newRow);
          }
        } catch(e) { console.error('tcMutate save error', e); }
        return newCerts;
      };

      const [tcActiveCid, setTcActiveCid] = useState(null);
      const [tcOcrData,   setTcOcrData]   = useState({});
      const [tcOcrBusy,   setTcOcrBusy]   = useState({});
      const [tcApplied,   setTcApplied]   = useState({});
      const [tcImgErr,    setTcImgErr]     = useState({});

      const tcUpdate = async (cid, fields) => {
        await tcMutate(arr => arr.map(c => c.cid === cid ? { ...c, ...fields } : c));
      };
      const tcAdd = async () => {
        const cid = Math.random().toString(36).slice(2,10);
        await tcMutate(arr => [...arr, { cid, courseName:'', issuingCompany:'', certNo:'', issueDate:'', expiry:'', imgData:'' }]);
        setTcActiveCid(cid);
      };
      const tcRemove = async (cid) => {
        if (!window.confirm('Remove this training certificate?')) return;
        const cur = getTrainCerts();
        const idx = cur.findIndex(c => c.cid === cid);
        const rest = cur.filter(c => c.cid !== cid);
        setTcActiveCid(rest[idx]?.cid || rest[idx-1]?.cid || null);
        await tcMutate(() => rest);
        setTcOcrData(d => { const n={...d}; delete n[cid]; return n; });
        setTcApplied(d => { const n={...d}; delete n[cid]; return n; });
        setTcImgErr(d  => { const n={...d}; delete n[cid]; return n; });
      };
      const tcHandleFile = (cid, file) => {
        if (!file) return;
        setTcImgErr(d => ({ ...d, [cid]: false }));
        setTcOcrBusy(d => ({ ...d, [cid]: true }));
        setTcOcrData(d => ({ ...d, [cid]: null }));
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const dataUrl = ev.target.result;
          // Store the image in Supabase Storage instead of inline base64 —
          // keeps training_records JSON small (huge egress savings on loadAll).
          const url = await uploadCertImage(employeeId, cid, file);

            const base64 = dataUrl.split(',')[1];
            const mtype  = file.type?.startsWith('image/') ? file.type : 'image/jpeg';
            const res = await fetch('/api/claude', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:600,
                messages:[{ role:'user', content:[
                  { type:'image', source:{ type:'base64', media_type:mtype, data:base64 } },
                  { type:'text', text:`OCR this training/safety certificate. Extract:
1. Certificate number
2. Issue date (YYYY-MM-DD)
3. Expiry / valid-until date (YYYY-MM-DD) — NOT issue date
4. Full course / training name (e.g. "Safe Scaffolding Erection and Dismantling")
5. Issuing company / training provider (e.g. "Crosswind", "OPITO", "Bureau Veritas")
Reply ONLY as valid JSON, no markdown:
{"certNo":"...","issueDate":"YYYY-MM-DD","expiryDate":"YYYY-MM-DD","courseName":"...","issuingCompany":"..."}
Use null for missing fields.` }
                ]}]
              })
            });
            const json = await res.json();
            const raw = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
            let result = {};
            try { result = parseClaudeJson(raw); } catch(e) { result = { error: 'Parse failed: '+e.message }; }

          } catch(e) { setTcOcrData(d => ({ ...d, [cid]:{ error:e.message } })); }
          setTcOcrBusy(d => ({ ...d, [cid]: false }));
        };
        reader.readAsDataURL(file);

        const ocr = tcOcrData[cid];

        if (ocr.expiryDate)     u.expiry         = ocr.expiryDate;

        if (imgError[docKey]) return null; // don't retry broken URLs
        if (localImgs[docKey]) return localImgs[docKey];

        if (!file) return;

            const ocrPrompt = (() => {
              if (docKey === 'evisa') return `You are an OCR assistant for a UAE Employment eVisa. Extract:

2. Full Name of the employee
3. Passport Number
4. Profession / Position as printed
5. Expiry date — the "permitted to enter UAE until" date (YYYY-MM-DD)
6. Nationality
Reply ONLY as valid JSON, no markdown:
{"docNumber":"...","fullName":"...","passportNo":"...","profession":"...","expiryDate":"YYYY-MM-DD","nationality":"...","rawText":"...brief..."}
Use null for missing fields.`;
              if (docKey === 'mohre') return `You are an OCR assistant for a UAE MOHRE Employment Contract PDF. Extract:
1. Transaction Number (e.g. MB313042200AE)

Reply ONLY as valid JSON, no markdown:

Reply ONLY as valid JSON, no markdown:

Use null for missing fields. expiryDate must be YYYY-MM-DD.`;

Reply ONLY as valid JSON, no markdown:
{"bankName":"...","accountNo":"...","iban":"...","holderName":"...","rawText":"...brief..."}
Use null for missing fields.`;
              return `You are an OCR assistant. Extract from this ${DOC_TYPES.find(d=>d.key===docKey)?.label||'document'}:
1. Document number
2. Expiry date (EXPIRES date, NOT issue date)
Reply ONLY as valid JSON, no markdown:
{"docNumber":"...","expiryDate":"YYYY-MM-DD","rawText":"...brief OCR text..."}

              method: 'POST', headers: { 'Content-Type': 'application/json' },

              if (parsed.iban) setField('bank_iban', parsed.iban);

              if (parsed.docNumber) setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
              if (parsed.startDate) setField('mohre_contract_start', parsed.startDate);
              if (parsed.basicSalary) setField('basic_salary', parsed.basicSalary);
            } else if (docKey === 'evisa') {
              if (parsed.docNumber) setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
              if (parsed.profession) setField('position', parsed.profession);
            } else if (docKey === 'insurance') {
              if (parsed.docNumber) setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
              if (parsed.companyName) setManualInsuranceCo(parsed.companyName);
            } else {
              if (parsed.docNumber) setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
            }
          } catch(e) {
            setOcrResults(p => ({ ...p, [docKey]: { error: e.message } }));
          }
          setOcrLoading(p => ({ ...p, [docKey]: false }));
          setUploadLoading(p => ({ ...p, [docKey]: false }));
        };
        reader.readAsDataURL(file);
      };

      const applyToForm = (docKey) => {
        const dt = DOC_TYPES.find(d=>d.key===docKey);
        if (!dt) return;
        const exp = manualExpiry[docKey] || ocrResults[docKey]?.expiryDate || '';
        const num = manualNo[docKey]     || ocrResults[docKey]?.docNumber  || '';
        if (exp && dt.expiryKey) setField(dt.expiryKey, exp);
        if (docKey === 'insurance') {
          if (manualInsuranceCo) setField('insurance_id', manualInsuranceCo);
        } else {
          if (num && dt.noKey) setField(dt.noKey, num);
        }
        setApplyStatus(p => ({ ...p, [docKey]: 'applied' }));
        setTimeout(() => setApplyStatus(p => ({ ...p, [docKey]: null })), 3000);
      };

      const rescanEmpDoc = async (docKey) => {
        const src = getImgSrc(docKey);
        if (!src) return;
        const dt = DOC_TYPES.find(d => d.key === docKey);
        setOcrResults(p => ({ ...p, [docKey]: null }));
        setOcrLoading(p => ({ ...p, [docKey]: true }));
        try {
          const base64 = src.split(',')[1];
          const mtype = src.startsWith('data:image/') ? src.split(';')[0].split(':')[1] : 'image/jpeg';
          const res = await fetch('/api/claude', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001', max_tokens: 1000,
              messages: [{ role: 'user', content: [
                { type: 'image', source: { type: 'base64', media_type: mtype, data: base64 } },
                { type: 'text', text: docKey === 'insurance'
                  ? `You are an OCR assistant for a UAE health/medical insurance card or certificate. Extract:
1. Insurance company / provider name (e.g. Daman, AXA Gulf, Orient, GIG Gulf, Fidelity United, Neuron, NAS, ADNIC, Dubai Insurance, Sukoon, etc.)
2. Policy number or card number (the main ID on the card)
3. Expiry date — the date the insurance EXPIRES (YYYY-MM-DD)
4. Employee / member name
Reply ONLY as valid JSON, no markdown:
{"companyName":"...","docNumber":"...","expiryDate":"YYYY-MM-DD","holderName":"...","rawText":"...brief..."}
Use null for missing fields. expiryDate must be YYYY-MM-DD.`
                  : `You are an OCR assistant. Extract from this ${dt?.label||'document'} image:
1. Document number
2. Expiry date (the date the document EXPIRES, NOT the issue date)
Reply ONLY with valid JSON, no markdown:
{"docNumber":"...","expiryDate":"YYYY-MM-DD","rawText":"...brief OCR text..."}
Use null for missing fields. expiryDate must be YYYY-MM-DD.
For passports: expiry is bottom-right of data page, verify via MRZ (YYMMDD format).` }
              ]}]
            })
          });
          const json = await res.json();
          const rawText = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
          let parsed = {};
          try { parsed = parseClaudeJson(rawText); } catch(e) { parsed = { error: 'Parse failed: '+e.message }; }
          setOcrResults(p => ({ ...p, [docKey]: parsed }));
          if (parsed.expiryDate) setManualExpiry(p => ({ ...p, [docKey]: parsed.expiryDate }));
          if (parsed.docNumber)  setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
          if (docKey === 'insurance' && parsed.companyName) setManualInsuranceCo(parsed.companyName);
        } catch(e) {
          setOcrResults(p => ({ ...p, [docKey]: { error: e.message } }));
        }
        setOcrLoading(p => ({ ...p, [docKey]: false }));
      };

      const activeType = DOC_TYPES.find(d => d.key === activeDoc);
      const imgSrc = getImgSrc(activeDoc);
      const fileName = localImgs[activeDoc] ? '(newly uploaded)' : (activeType && data[activeType.imgKey] ? 'Saved document' : null);
      const isTrainingTab = activeDoc === '__training';
      const trainCerts = getTrainCerts();
      const tcCert = tcActiveCid ? trainCerts.find(c => c.cid === tcActiveCid) || null : null;
      const tcOcr  = tcActiveCid ? (tcOcrData[tcActiveCid] || null) : null;
      const tcScan = tcActiveCid ? (tcOcrBusy[tcActiveCid] || false) : false;
      const tcWasApplied = tcActiveCid ? (tcApplied[tcActiveCid] || false) : false;
      const tcImgSrc = (() => {
        if (!tcActiveCid || tcImgErr[tcActiveCid]) return null;
        const img = tcCert?.imgData;
        return img?.startsWith('data:') || img?.startsWith('http') ? img : null;

                    border: `1.5px ${isActive?'solid':'dashed'} ${isActive ? dt.color : hasSaved ? '#86efac' : dt.border}`,
                    padding:'6px 13px', borderRadius:'20px', fontSize:'12px', fontWeight:700,
                    cursor:'pointer', display:'flex', alignItems:'center', gap:'5px', transition:'all 0.15s'
                  }}>
                  {hasSaved ? '✓ ' : '+ '}{dt.label}
                </button>

            })}
            {/* Training Certificates tab */}
            {(() => {
              const hasCerts = trainCerts.length > 0;
              const isActive = activeDoc === '__training';
              return (
                <button type="button" onClick={() => setActiveDoc('__training')}
                  style={{
                    background: isActive ? '#0f766e' : hasCerts ? '#f0fdf4' : '#fff',
                    color: isActive ? '#fff' : hasCerts ? '#166534' : '#475569',

                    padding:'6px 13px', borderRadius:'20px', fontSize:'12px', fontWeight:700,
                    cursor:'pointer', display:'flex', alignItems:'center', gap:'5px', transition:'all 0.15s'

                {imgSrc && !imgError[activeDoc] ? (
                  <div style={{ border:'1px solid #e2e8f0', borderRadius:'8px', overflow:'hidden', background:'#fff' }}>

                      <div

                        <span style={{ fontSize:'48px' }}>📄</span>
                        <span style={{ fontSize:'12px', fontWeight:700, color:'#2563eb' }}>PDF — Click to View</span>
                      </div>
                    ) : (
                      <img src={imgSrc} alt="Document scan"
                        onError={() => { setImgError(p => ({ ...p, [activeDoc]: true })); const dt = DOC_TYPES.find(d=>d.key===activeDoc); if (dt?.imgKey) setField(dt.imgKey, null); }}
                        onClick={() => setEmpPreviewDoc({ url: imgSrc, label: activeType?.label || 'Document', isPdf: false })}
                        style={{ width:'100%', display:'block', maxHeight:'240px', objectFit:'contain', background:'#f8fafc', cursor:'zoom-in' }} crossOrigin="anonymous"

                      </div>

                {ocrResults[activeDoc]?.error && (
                  <div style={{ fontSize:'11.5px', color:'#991b1b', background:'#fee2e2', padding:'10px', borderRadius:'8px' }}>
                    ⚠ Scan issue: {ocrResults[activeDoc].error}<br/>

                {activeDoc === 'insurance' ? (

                  <div>
                    <label style={{ display:'block', fontSize:'11px', color:'#64748b', marginBottom:'4px', fontWeight:600 }}>
                      Insurance Company

                    {(() => {

                      const selVal = isKnown ? curVal : 'Other';

                        <>
                          <select value={selVal} onChange={e => {
                            if (e.target.value === 'Other') setManualInsuranceCo('__other__');
                            else { setManualInsuranceCo(e.target.value); }
                          }} style={{ ...S.input, width:'100%', marginBottom: selVal === 'Other' ? '6px' : 0 }}>
                            <option value="">Select provider…</option>
                            {INSURANCE_COMPANIES.map(c => <option key={c} value={c}>{c}</option>)}

                          {selVal === 'Other' && (
                            <input type="text"
                              value={curVal === '__other__' ? '' : (!isKnown ? curVal : '')}
                              onChange={e => setManualInsuranceCo(e.target.value)}
                              placeholder="Type insurance company name…"
                              style={{ ...S.input, width:'100%' }} />
                          )}
                        </>
                      );
                    })()}
                  </div>
                ) : activeType.noKey && (
                  <div>
                    <label style={{ display:'block', fontSize:'11px', color:'#64748b', marginBottom:'4px', fontWeight:600 }}>
