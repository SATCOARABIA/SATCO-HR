    const parseClaudeJson = (raw) => {
      if (!raw) throw new Error('Empty response');
      const s = String(raw);
      // Find first { and last } using charCodeAt — avoids any Unicode confusion
      let start = -1, end = -1;
      for (let i = 0; i < s.length; i++) {
        if (s.charCodeAt(i) === 123) { start = i; break; }   // 123 = '{'
      }
      for (let i = s.length - 1; i >= 0; i--) {
        if (s.charCodeAt(i) === 125) { end = i; break; }     // 125 = '}'
      }
      if (start === -1 || end <= start) {
        // Show first 40 char codes to diagnose invisible characters
        const codes = [];
        for (let i = 0; i < Math.min(40, s.length); i++) codes.push(s.charCodeAt(i));
        throw new Error('No JSON braces found. Char codes: [' + codes.join(',') + ']');
      }
      return JSON.parse(s.slice(start, end + 1));
    };

    // ============ DATE HELPERS ============
    const parseDate = (v) => {
      if (!v) return null;
      if (v instanceof Date) return v;
      if (typeof v === 'number') { const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000); return isNaN(d) ? null : d; }
      const s = String(v).trim();
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (dmy) { const d = new Date(parseInt(dmy[3]), parseInt(dmy[2]) - 1, parseInt(dmy[1])); return isNaN(d) ? null : d; }
      const d = new Date(s); return isNaN(d) ? null : d;
    };

          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: false });
          let headerRow = 0;
          for (let i = 0; i < Math.min(5, rows.length); i++) {
            const r = (rows[i] || []).map(c => String(c || '').toLowerCase());
            if (r.some(c => c.includes('employeeid') || c.includes('fullname') || c.includes('full name'))) { headerRow = i; break; }
          }
          const headers = (rows[headerRow] || []).map(h => String(h || '').trim());
          const colMap = {
            'employeeid':'employee_id','fullname':'full_name','visa trade':'visa_trade','department':'department',
            'nationality':'nationality','position':'position','work experiance':'work_experience','work experience':'work_experience',
            'joining date':'joining_date','basic salary':'basic_salary','allowance':'allowance','status':'status',
            'date of birth':'dob','passport no':'passport_no','passportexpiry':'passport_expiry','passport expiry':'passport_expiry',
            'eid no':'eid_no','eidhardcopyrecv date':'eid_hardcopy_recv','emiratesidexpiry':'eid_expiry','emirates id expiry':'eid_expiry',
            'visaexpiry':'visa_expiry','visa expiry':'visa_expiry','reference by':'reference_by','reference contact number':'reference_contact',
            'email':'email','india contact number':'india_contact','uae contact number':'uae_contact','location':'location',
            'passport handover':'passport_handover','mobile':'mobile','manageremail':'manager_email','manager email':'manager_email',
            'insurance id no':'insurance_id','insurance efective date':'insurance_effective','insurance effective date':'insurance_effective',
            'insuranceexpiry':'insurance_expiry','insurance expiry':'insurance_expiry',
            'cicpa':'cicpa_no','cicpa no':'cicpa_no','cicpa number':'cicpa_no','cicpa gate pass':'cicpa_no','cicpa gate pass no':'cicpa_no','gate pass no':'cicpa_no','gate pass':'cicpa_no',
            'cicpaexpiry':'cicpa_expiry','cicpa expiry':'cicpa_expiry','cicpa expiry date':'cicpa_expiry','gate pass expiry':'cicpa_expiry',
            'cicpa locations':'cicpa_locations','cicpa permitted locations':'cicpa_locations','permitted locations':'cicpa_locations','gate pass locations':'cicpa_locations','locations':'cicpa_locations',
            'iloe cert no':'iloe_cert_no','iloe certificate no':'iloe_cert_no','iloe no':'iloe_cert_no',
            'iloe inception':'iloe_inception','iloe inception date':'iloe_inception',
            'iloe expiry':'iloe_expiry','iloe expiry date':'iloe_expiry',
            'iloe premium':'iloe_premium','iloe premium aed':'iloe_premium',
          };
          const idxToCol = {};
          headers.forEach((h, i) => { const k = colMap[h.toLowerCase().replace(/\s+/g, ' ').trim()]; if (k) idxToCol[i] = k; });
          const dateFields = new Set(EMPLOYEE_FIELDS.filter(f => f.type === 'date').map(f => f.key));
          const numFields = new Set(EMPLOYEE_FIELDS.filter(f => f.type === 'number').map(f => f.key));
          const toUpsert = [];
          for (let i = headerRow + 1; i < rows.length; i++) {
            const row = rows[i] || []; if (!row.some(c => c != null && c !== '')) continue;
            const emp = {};
            row.forEach((val, idx) => {
              const col = idxToCol[idx]; if (!col || val == null || val === '') return;
              if (dateFields.has(col)) emp[col] = fmtDateISO(val) || null;
              else if (numFields.has(col)) emp[col] = parseFloat(val) || null;
              else emp[col] = String(val).trim();
            });
            if (emp.employee_id || emp.full_name) toUpsert.push(emp);
          }
          // Upsert by employee_id
          const withId = toUpsert.filter(e => e.employee_id);
          const withoutId = toUpsert.filter(e => !e.employee_id);
          if (withId.length) { const { error } = await db.from('employees').upsert(withId, { onConflict: 'employee_id' }); if (error) throw error; }
          if (withoutId.length) { const { error } = await db.from('employees').insert(withoutId); if (error) throw error; }
          await loadAll();
          showToast(`Imported ${toUpsert.length} employees`);
        } catch (e) { showToast('Import failed: ' + e.message, 'error'); }
      };

      const filteredEmps = useMemo(() => {
        let r = employees;
        if (search) { const s = search.toLowerCase(); r = r.filter(e => Object.values(e).some(v => String(v || '').toLowerCase().includes(s))); }
        if (statusFilter === 'employed_only') r = r.filter(e => e.employee_id && isStrictEmployed(e.status));
        else if (statusFilter === 'with_id') r = r.filter(e => e.employee_id);
        else if (statusFilter === 'pending') r = r.filter(e => !isStrictEmployed(e.status));
        return r;
      }, [employees, search, statusFilter]);

      if (loading) return <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', flexDirection:'column', gap:'16px' }}><div className="spinner"></div><div style={{ color:'#64748b' }}>Loading your HR data…</div></div>;

      return (
        <div style={S.app}>
          {/* Sidebar */}
          <aside style={S.sidebar}>
            <div style={S.logo}>
              <div style={{ fontSize:'24px' }}>🏢</div>
              <div><div style={{ fontSize:'15px', fontWeight:700 }}>HR Compliance</div><div style={{ fontSize:'11px', color:'#94a3b8' }}>SATCO Arabia</div></div>
            </div>
            {[
              { k:'dashboard', l:'Dashboard', i:'📊' },
              { k:'employees', l:'All Employees', i:'👥', badge: employees.length },
              { k:'alerts', l:'Expiry Alerts', i:'🔔', badge: alerts.length, red: alerts.some(a=>a.severity==='expired'||a.severity==='critical') },
              { k:'contacts', l:'Contact Directory', i:'📞', badge: contacts.length },
              { k:'mobdemob', l:'Mob / Demob', i:'📋', badge: mobDemob.length },
              { k:'training', l:'Training', i:'🎓', badge: trainings.length },
              { k:'hiring', l:'Hiring Pipeline', i:'🧑‍💼', badge: hiring.filter(h=>h.status!=='Joined'&&h.status!=='Withdrawn').length },
              { k:'interview_sheet', l:'Interview Sheet', i:'📝' },
              { k:'reports', l:'Reports & Email', i:'📤' },
              { k:'settings', l:'Settings', i:'⚙️' },
            ].map(item => {
              const active = view === item.k;
              return (
                <div key={item.k} className="hr-nav-item" onClick={() => setView(item.k)}
                  style={{ ...S.navItem, background: active ? '#1e3a5f' : 'transparent', borderLeft: active ? '3px solid #60a5fa' : '3px solid transparent' }}>
                  <span style={{ fontSize:'16px' }}>{item.i}</span>
                  <span style={{ flex:1, color: active ? '#fff' : '#cbd5e1', fontSize:'13.5px' }}>{item.l}</span>
                  {item.badge > 0 && <span style={{ background: item.red ? '#dc2626' : '#334155', color:'#fff', fontSize:'11px', padding:'2px 7px', borderRadius:'10px', fontWeight:600 }}>{item.badge}</span>}
                </div>
              );
            })}
            <div style={{ marginTop:'auto', padding:'14px 16px', borderTop:'1px solid #1e293b' }}>
              <div style={{ fontSize:'11px', color:'#94a3b8', marginBottom:'8px', wordBreak:'break-all' }}>{user.email}</div>
              <button onClick={onLogout} style={{ background:'transparent', border:'1px solid #334155', color:'#cbd5e1', padding:'6px 12px', borderRadius:'6px', fontSize:'12px', cursor:'pointer', width:'100%' }}>Sign Out</button>
            </div>
          </aside>

          {/* Main */}
          <main style={S.main}>
            <div style={S.topbar}>
              <div>
                <h1 style={{ margin:0, fontSize:'20px', fontWeight:700 }}>
                  {{ dashboard:'Dashboard', employees:'Employee Directory', alerts:'Expiry Alerts', contacts:'Contact Directory', mobdemob:'Mobilization / Demobilization', training:'Training', hiring:'Hiring of New Employees', interview_sheet:'Interview Sheet Generator', reports:'Reports & Email', settings:'Settings' }[view]}
                </h1>
                <div style={{ fontSize:'12px', color:'#64748b', marginTop:'3px' }}>{new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</div>
              </div>
              <div style={{ display:'flex', gap:'10px' }}>
                <label className="hr-btn" style={{ ...S.btnSec, cursor:'pointer' }}>⬆ Import Excel
                  <input type="file" accept=".xlsx,.xls" style={{ display:'none' }} onChange={e => e.target.files[0] && importExcel(e.target.files[0])} /></label>
                <button className="hr-btn" style={S.btnSec} onClick={exportExcel}>⬇ Export Excel</button>
              </div>
            </div>

            <div style={S.content}>
              {view === 'dashboard' && <Dashboard stats={stats} dashboardEmployees={dashboardEmployees} allEmployees={employees} alerts={alerts} thresholds={thresholds} dashFilter={dashFilter} setDashFilter={setDashFilter} onJump={setView} />}
              {view === 'employees' && <EmployeeList employees={filteredEmps} total={employees.length} search={search} setSearch={setSearch} statusFilter={statusFilter} setStatusFilter={setStatusFilter} thresholds={thresholds} onEdit={setEditingEmp} onDelete={deleteEmployee} onAdd={() => setEditingEmp({})} />}
              {view === 'alerts' && <AlertsView alerts={alerts} thresholds={thresholds} dashboardEmployees={allActiveEmployees} />}
              {view === 'contacts' && <ContactsView contacts={contacts} employees={employees} onAdd={() => setEditingContact({})} onEdit={setEditingContact} onDelete={deleteContact} onSyncAll={syncAllContacts} />}
              {view === 'mobdemob' && <MobDemobView records={mobDemob} employees={employees} onAdd={() => setEditingMob({})} onEdit={setEditingMob} onDelete={deleteMob} onSyncAll={syncAllMobDemob} />}
              {view === 'training' && <TrainingView records={trainings} employees={employees} onSave={saveTraining} onSyncAll={syncAllTrainings} showToast={showToast} loadAll={loadAll} />}
              {view === 'hiring' && <HiringView records={hiring} onAdd={() => setEditingHiring({})} onEdit={setEditingHiring} onDelete={deleteHiring} onSaveDoc={saveHiringDoc} showToast={showToast} onOpenSheet={setInterviewSheetCandidate} />}
              {view === 'interview_sheet' && <InterviewSheetView hiring={hiring} showToast={showToast} onOpenSheet={setInterviewSheetCandidate} />}
              {view === 'reports' && <ReportsView alerts={alerts} dashboardEmployees={allActiveEmployees} recipients={recipients} />}
              {view === 'settings' && <SettingsView thresholds={thresholds} setThresholds={setThresholds} recipients={recipients} onAddRecipient={saveRecipient} onDeleteRecipient={deleteRecipient} employeeCount={employees.length} />}
            </div>
          </main>

          {editingEmp && <EmployeeModal employee={editingEmp} onSave={saveEmployee} onClose={() => setEditingEmp(null)} />}
          {editingMob && <MobDemobModal record={editingMob} employees={employees} onSave={saveMob} onClose={() => setEditingMob(null)} />}
          {editingContact && <ContactModal record={editingContact} employees={employees} onSave={saveContact} onClose={() => setEditingContact(null)} />}
          {editingHiring && <HiringModal record={editingHiring} onSave={saveHiring} onClose={() => setEditingHiring(null)} showToast={showToast} onOpenSheet={setInterviewSheetCandidate} />}
          {interviewSheetCandidate !== null && <InterviewSheetOverlay candidate={interviewSheetCandidate} onClose={() => { setInterviewSheetCandidate(null); loadAll(); }} showToast={showToast}
            onHiringUpdate={(patch) => {
              // Called by both savePdf (silent) and Save to Candidate — keeps Kanban in sync without loadAll
              if (patch && patch.id) setHiring(prev => prev.map(r => r.id === patch.id ? {...r, ...patch} : r));
            }}
            onAfterSave={(patch) => {
              // Called only by Save to Candidate — also updates candidate prop so sheet stays consistent
              if (patch && patch.id) setHiring(prev => prev.map(r => r.id === patch.id ? {...r, ...patch} : r));
              setInterviewSheetCandidate(prev => ({...prev, ...patch}));
            }} />}
          {toast && <div style={{ position:'fixed', bottom:'24px', right:'24px', background: toast.type==='error' ? '#dc2626' : '#0f172a', color:'#fff', padding:'12px 20px', borderRadius:'8px', boxShadow:'0 8px 24px rgba(0,0,0,0.25)', animation:'slideIn 0.2s', fontSize:'13px', zIndex:200 }}>{toast.type==='error' ? '⚠ ' : '✓ '}{toast.msg}</div>}
        </div>
      );
    }

    // ============ DASHBOARD ============
    function Dashboard({ stats, dashboardEmployees, allEmployees, alerts, thresholds, dashFilter, setDashFilter, onJump }) {
      const deptCounts = useMemo(() => { const m={}; dashboardEmployees.forEach(e=>{const d=e.department||'Unassigned'; m[d]=(m[d]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8); }, [dashboardEmployees]);
      const natCounts = useMemo(() => { const m={}; dashboardEmployees.forEach(e=>{const d=e.nationality||'Unknown'; m[d]=(m[d]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6); }, [dashboardEmployees]);
      const expiryByType = useMemo(() => { const m={}; EXPIRY_TYPES.forEach(t=>m[t.key]={...t,count:0,expired:0,critical:0}); alerts.forEach(a=>{ if(!m[a.type]) return; m[a.type].count++; if(a.severity==='expired')m[a.type].expired++; if(a.severity==='critical')m[a.type].critical++;}); return Object.values(m); }, [alerts]);

      if (allEmployees.length === 0) return <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'60px', textAlign:'center' }}><div style={{fontSize:'40px',marginBottom:'12px'}}>👥</div><h2 style={{margin:'0 0 8px'}}>No employees yet</h2><p style={{color:'#64748b'}}>Click <strong>Import Excel</strong> top-right to load your data.</p></div>;

      return (
        <div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px 18px', marginBottom:'16px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'16px', flexWrap:'wrap' }}>
            <div style={{ fontSize:'13px', color:'#475569' }}>👁 Showing <strong>{dashboardEmployees.length}</strong> of <strong>{allEmployees.length}</strong> employees {dashFilter==='employed_strict' && <span style={{color:'#94a3b8'}}>(Employed only)</span>}</div>
            <div style={{ display:'flex', gap:'6px' }}>
              {[['employed_strict','Employed only'],['employed_broad','Active workforce'],['all','Show all']].map(([k,l])=>(
                <button key={k} onClick={()=>setDashFilter(k)} style={{ background: dashFilter===k?'#2563eb':'#f1f5f9', color: dashFilter===k?'#fff':'#475569', border:'none', padding:'6px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap:'10px', marginBottom:'20px' }}>
            <Kpi label="Active Employees" value={stats.total} color="#059669" icon="✅" />
            <Kpi label="Departments" value={stats.departments} color="#2563eb" icon="🏢" />
            <Kpi label="Passport Expiring" sub={stats.passportExpired>0?`${stats.passportExpired} expired`:`≤${thresholds.passport}d`} value={stats.passportCount} color="#dc2626" icon="📕" alert={stats.passportCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Emirates ID Expiring" sub={stats.eidExpired>0?`${stats.eidExpired} expired`:`≤${thresholds.eid}d`} value={stats.eidCount} color="#ea580c" icon="🪪" alert={stats.eidCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="CICPA Expiring" sub={stats.cicpaExpired>0?`${stats.cicpaExpired} expired`:`≤${thresholds.cicpa}d`} value={stats.cicpaCount} color="#7c3aed" icon="🛢️" alert={stats.cicpaCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Training Certs Expiring" sub={stats.trainingCertExpired>0?`${stats.trainingCertExpired} expired`:`≤${thresholds.training_cert||30}d`} value={stats.trainingCertCount} color="#0f766e" icon="🎓" alert={stats.trainingCertCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Expired Documents" value={stats.expired} color="#dc2626" icon="⚠️" alert={stats.expired>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Critical (≤7 days)" value={stats.critical} color="#ea580c" icon="🔴" alert={stats.critical>0} onClick={()=>onJump('alerts')} />
          </div>

          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'20px', marginBottom:'16px' }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'14px' }}><h3 style={{ margin:0, fontSize:'14px' }}>Document Expiry Overview</h3><button onClick={()=>onJump('alerts')} style={S.link}>View all →</button></div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'10px' }}>
              {expiryByType.map(t => (
                <div key={t.key} style={{ border:'1px solid #e2e8f0', borderRadius:'10px', padding:'14px', background:'#fafbfc' }}>
                  <div style={{ fontSize:'12px', color:'#475569', fontWeight:600, marginBottom:'2px' }}>{t.label}</div>
                  <div style={{ fontSize:'10px', color:'#94a3b8', marginBottom:'8px' }}>Threshold: {thresholds[t.key]}d</div>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end' }}>
                    <div style={{ fontSize:'26px', fontWeight:700, lineHeight:1 }}>{t.count}</div>
                    {(t.expired>0||t.critical>0) && <div style={{ fontSize:'11px', textAlign:'right' }}>{t.expired>0&&<div style={{color:'#dc2626',fontWeight:600}}>{t.expired} expired</div>}{t.critical>0&&<div style={{color:'#ea580c',fontWeight:600}}>{t.critical} critical</div>}</div>}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr', gap:'14px' }}>
            <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'20px' }}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'12px' }}><h3 style={{ margin:0, fontSize:'14px' }}>Upcoming Expirations</h3><button onClick={()=>onJump('alerts')} style={S.link}>View all →</button></div>
              {alerts.length===0 ? <div style={{ textAlign:'center', padding:'32px', color:'#94a3b8' }}>✓ No upcoming expirations</div> :
                alerts.slice(0,8).map((a,i)=>{ const c=a.severity==='expired'?'#dc2626':a.severity==='critical'?'#ea580c':a.severity==='urgent'?'#ca8a04':'#0891b2';
                  return <div key={i} style={{ display:'flex', alignItems:'center', gap:'12px', padding:'10px 0', borderBottom:'1px solid #f1f5f9' }}>
                    <div style={{ width:'3px', height:'32px', background:c, borderRadius:'2px' }}></div>
                    <div style={{ flex:1 }}><div style={{ fontSize:'13px', fontWeight:600 }}>{a.full_name||'(no name)'}</div><div style={{ fontSize:'11px', color:'#64748b' }}>{a.employee_id} · {a.typeLabel} expires {fmtDateDisplay(a.expiryDate)}</div></div>
                    <div style={{ background:c+'12', color:c, padding:'3px 10px', borderRadius:'12px', fontSize:'11px', fontWeight:700 }}>{a.daysLeft<0?`${Math.abs(a.daysLeft)}d ago`:`${a.daysLeft}d`}</div>
                  </div>; })}
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px' }}><h3 style={{ margin:'0 0 12px', fontSize:'13px' }}>By Department</h3>{deptCounts.map(([d,c])=><Bar key={d} label={d} value={c} max={deptCounts[0][1]} color="#2563eb" />)}</div>
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px' }}><h3 style={{ margin:'0 0 12px', fontSize:'13px' }}>By Nationality</h3>{natCounts.map(([d,c])=><Bar key={d} label={d} value={c} max={natCounts[0][1]} color="#059669" />)}</div>
            </div>
          </div>
        </div>
      );
    }
    function Kpi({ label, value, color, icon, alert, onClick, sub }) {
      return <div className="hr-card" onClick={onClick} style={{ background:'#fff', border:'1px solid #e2e8f0', borderLeft: alert?`3px solid ${color}`:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px', cursor:onClick?'pointer':'default' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'6px' }}><div style={{ fontSize:'11.5px', color:'#64748b', fontWeight:600, lineHeight:1.25 }}>{label}</div><div style={{ fontSize:'16px' }}>{icon}</div></div>
        <div style={{ fontSize:'26px', fontWeight:700, lineHeight:1 }}>{value}</div>
        {sub && <div style={{ fontSize:'10.5px', color: alert?color:'#94a3b8', fontWeight:600, marginTop:'4px' }}>{sub}</div>}
      </div>;
    }
    function Bar({ label, value, max, color }) {
      return <div style={{ marginBottom:'8px' }}><div style={{ display:'flex', justifyContent:'space-between', fontSize:'12px', marginBottom:'3px' }}><span style={{ color:'#475569' }}>{label}</span><span style={{ fontWeight:600 }}>{value}</span></div><div style={{ height:'5px', background:'#f1f5f9', borderRadius:'3px' }}><div style={{ width:`${max>0?(value/max)*100:0}%`, height:'100%', background:color, borderRadius:'3px' }}></div></div></div>;
    }

    // ============ EMPLOYEE LIST ============
    function EmployeeList({ employees, total, search, setSearch, statusFilter, setStatusFilter, thresholds, onEdit, onDelete, onAdd }) {
      return (
        <div>
          <div style={{ display:'flex', gap:'10px', marginBottom:'14px', flexWrap:'wrap' }}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search name, ID, passport, email…" style={{ ...S.input, flex:1, minWidth:'240px', maxWidth:'380px' }} />
            <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={S.input}>
              <option value="all">All ({total})</option><option value="employed_only">Employed only</option><option value="with_id">With Employee ID</option><option value="pending">Pending</option>
            </select>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ Add Employee</button>
          </div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
            <div className="hr-scroll" style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'12px', minWidth:'1500px' }}>
                <thead><tr style={{ background:'#f8fafc' }}>{['Emp ID','Name','Position as per Work Visa','Exp. Years','Nationality','Status','Joined','Source','Passport','EID','Visa','Insurance','CICPA',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
                <tbody>
                  {employees.length===0 ? <tr><td colSpan={15} style={{ textAlign:'center', padding:'40px', color:'#94a3b8' }}>No employees found</td></tr> :
                    employees.map(emp=>(
                      <tr key={emp.id} className="hr-row" onDoubleClick={()=>onEdit(emp)} title="Double-click to edit" style={{ borderTop:'1px solid #f1f5f9', cursor:'pointer' }}>
                        <td style={S.td}>{emp.employee_id||'—'}</td>
                        <td style={{ ...S.td, fontWeight:600 }}>
                          {emp.full_name}
                        </td>
                        <td style={S.td}>{emp.position}</td>
                        <td style={{ ...S.td, textAlign:'center' }}>{emp.work_experience ? <span style={{ background:'#eff6ff', color:'#1d4ed8', padding:'2px 8px', borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>{emp.work_experience} yrs</span> : <span style={{ color:'#cbd5e1' }}>—</span>}</td>
                        <td style={S.td}>{emp.nationality}</td>
                        <td style={S.td}>{emp.status && <span title={emp.status} style={{ background: isStrictEmployed(emp.status)?'#d1fae5':'#fef3c7', color: isStrictEmployed(emp.status)?'#065f46':'#92400e', padding:'2px 8px', borderRadius:'10px', fontSize:'11px', fontWeight:600, display:'inline-block', maxWidth:'160px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{emp.status}</span>}</td>
                        <td style={S.td}>{emp.joining_date ? <div><span style={{ fontSize:'11px', whiteSpace:'nowrap' }}>{fmtDateDisplay(emp.joining_date)}</span></div> : <span style={{ color:'#cbd5e1' }}>—</span>}</td>
                        <td style={S.td}>{emp.hired_from==='Supplier' ? <div><span style={{ background:'#ede9fe', color:'#7c3aed', padding:'2px 8px', borderRadius:'10px', fontSize:'11px', fontWeight:600 }}>🏢 Supplier</span>{emp.supplier_name && <div style={{ fontSize:'10.5px', color:'#64748b', marginTop:'2px', maxWidth:'120px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{emp.supplier_name}</div>}</div> : emp.hired_from ? <span style={{ background:'#dcfce7', color:'#166534', padding:'2px 8px', borderRadius:'10px', fontSize:'11px', fontWeight:600 }}>Direct</span> : <span style={{ color:'#cbd5e1' }}>—</span>}</td>
                        <DateCell value={emp.passport_expiry} threshold={thresholds.passport} docNo={emp.passport_no} />
                        <DateCell value={emp.eid_expiry} threshold={thresholds.eid} docNo={emp.eid_no} />
                        <DateCell value={emp.visa_expiry} threshold={thresholds.visa} />
                        <InsuranceCell value={emp.insurance_expiry} threshold={thresholds.insurance} company={emp.insurance_id} />
                        <CicpaCell value={emp.cicpa_expiry} threshold={thresholds.cicpa} docNo={emp.cicpa_no} locations={emp.cicpa_locations} />
                        <IloeCell value={emp.iloe_expiry} threshold={thresholds.iloe} certNo={emp.iloe_cert_no} />
                        <td style={{ ...S.td, textAlign:'right', whiteSpace:'nowrap' }} onClick={ev=>ev.stopPropagation()}><button onClick={()=>onEdit(emp)} style={S.iconBtn}>✏️</button><button onClick={(ev)=>{ev.stopPropagation();onDelete(emp.id);}} style={S.iconBtn}>🗑️</button></td>
                      </tr>
                    ))}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{ marginTop:'10px', fontSize:'12px', color:'#64748b' }}>Showing {employees.length} {employees.length===1?'employee':'employees'}</div>
        </div>
      );
    }
    function DateCell({ value, threshold, docNo }) {
      if (!value) return <td style={S.td}>
        {docNo ? <div style={{ fontSize:'10px', color:'#94a3b8', fontFamily:'ui-monospace, monospace' }}>{docNo}</div> : <span style={{ color:'#cbd5e1' }}>—</span>}
      </td>;
      const d = daysUntil(value); if (d===null) return <td style={S.td}><span style={{ color:'#cbd5e1' }}>—</span></td>;
      let c='#475569', bg='transparent';
      if (d<0){c='#dc2626';bg='#fee2e2';} else if(d<=7){c='#ea580c';bg='#fed7aa';} else if(d<=threshold){c='#ca8a04';bg='#fef3c7';}
      return <td style={S.td}>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          <span style={{ fontSize:'11px', whiteSpace:'nowrap' }}>{fmtDateDisplay(value)}</span>
          <span style={{ fontSize:'10px', color:c, background:bg, padding:'1px 6px', borderRadius:'8px', alignSelf:'flex-start', fontWeight:600, whiteSpace:'nowrap' }}>{d<0?`${Math.abs(d)}d ago`:`${d}d`}</span>
          {docNo && <span style={{ fontSize:'10px', color:'#94a3b8', fontFamily:'ui-monospace, monospace', marginTop:'2px', whiteSpace:'nowrap' }}>{docNo}</span>}
        </div>
      </td>;
    }
    function InsuranceCell({ value, threshold, company }) {
      const d = value ? daysUntil(value) : null;
      let c='#475569', bg='transparent';
      if (d !== null) {
        if (d<0){c='#dc2626';bg='#fee2e2';} else if(d<=7){c='#ea580c';bg='#fed7aa';} else if(d<=threshold){c='#ca8a04';bg='#fef3c7';}
      }
      if (!company && !value) return <td style={S.td}><span style={{ color:'#cbd5e1' }}>—</span></td>;
      return <td style={S.td}>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          {company && <span style={{ fontSize:'11px', fontWeight:600, color:'#0891b2', whiteSpace:'nowrap' }}>{company}</span>}
          {value && <span style={{ fontSize:'11px', color:'#64748b', whiteSpace:'nowrap' }}>{fmtDateDisplay(value)}</span>}
          {d !== null && <span style={{ fontSize:'10px', color:c, background:bg, padding:'1px 6px', borderRadius:'8px', alignSelf:'flex-start', fontWeight:600, whiteSpace:'nowrap' }}>{d<0?`${Math.abs(d)}d ago`:`${d}d`}</span>}
        </div>
      </td>;
    }

    function CicpaCell({ value, threshold, docNo, locations }) {
      const locs = (locations || '').split(',').map(s=>s.trim()).filter(Boolean);
      // Empty case: no date but possibly some other data
      if (!value && !docNo && locs.length === 0) return <td style={S.td}><span style={{ color:'#cbd5e1' }}>—</span></td>;
      const d = value ? daysUntil(value) : null;
      let c='#475569', bg='transparent';
      if (d != null) {
        if (d<0){c='#dc2626';bg='#fee2e2';} else if(d<=7){c='#ea580c';bg='#fed7aa';} else if(d<=threshold){c='#ca8a04';bg='#fef3c7';}
      }
      return <td style={S.td}>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px', minWidth:'110px' }}>
          {value && <span style={{ fontSize:'11px', whiteSpace:'nowrap' }}>{fmtDateDisplay(value)}</span>}
          {d != null && <span style={{ fontSize:'10px', color:c, background:bg, padding:'1px 6px', borderRadius:'8px', alignSelf:'flex-start', fontWeight:600, whiteSpace:'nowrap' }}>{d<0?`${Math.abs(d)}d ago`:`${d}d`}</span>}
          {docNo && <span style={{ fontSize:'10px', color:'#94a3b8', fontFamily:'ui-monospace, monospace', marginTop:'1px', whiteSpace:'nowrap' }}>{docNo}</span>}
          {locs.length > 0 && (
            <div style={{ display:'flex', flexWrap:'wrap', gap:'3px', marginTop:'3px' }}>
              {locs.map(loc => (
                <span key={loc} style={{ background:'#ede9fe', color:'#6d28d9', padding:'1px 6px', borderRadius:'8px', fontSize:'9.5px', fontWeight:600 }}>{loc}</span>
              ))}
            </div>
          )}
        </div>
      </td>;
    }

    function IloeCell({ value, threshold, certNo }) {
      const d = value ? daysUntil(value) : null;
      let c='#475569', bg='transparent';
      if (d !== null) {
        if (d<0){c='#dc2626';bg='#fee2e2';} else if(d<=7){c='#ea580c';bg='#fed7aa';} else if(d<=threshold){c='#ca8a04';bg='#fef3c7';}
      }
      if (!certNo && !value) return <td style={S.td}><span style={{ color:'#cbd5e1' }}>—</span></td>;
      return <td style={S.td}>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          {certNo && <span style={{ fontSize:'10px', fontFamily:'ui-monospace,monospace', color:'#be185d', fontWeight:600, whiteSpace:'nowrap' }}>{certNo}</span>}
          {value && <span style={{ fontSize:'11px', color:'#64748b', whiteSpace:'nowrap' }}>{fmtDateDisplay(value)}</span>}
          {d !== null && <span style={{ fontSize:'10px', color:c, background:bg, padding:'1px 6px', borderRadius:'8px', alignSelf:'flex-start', fontWeight:600, whiteSpace:'nowrap' }}>{d<0?`${Math.abs(d)}d ago`:`${d}d`}</span>}
        </div>
      </td>;
    }

    // ============ ALERTS ============
    function AlertsView({ alerts, thresholds, dashboardEmployees }) {
      const [filter, setFilter] = useState('all');
      const filtered = filter==='all' ? alerts : alerts.filter(a=>a.type===filter);
      const trainingAlertCount = alerts.filter(a=>a.type==='training_cert').length;
      return (
        <div>
          <div style={{ background:'#eff6ff', border:'1px solid #bfdbfe', borderRadius:'10px', padding:'12px 16px', marginBottom:'14px', fontSize:'12.5px', color:'#1e40af' }}>ℹ️ Alerts are computed for {dashboardEmployees.length} active employees.</div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px', marginBottom:'14px', display:'flex', gap:'8px', flexWrap:'wrap' }}>
            <button onClick={()=>setFilter('all')} style={{ ...S.chip, ...(filter==='all'?S.chipActive:{}) }}>All ({alerts.length})</button>
            {EXPIRY_TYPES.map(t=>{const c=alerts.filter(a=>a.type===t.key).length; return <button key={t.key} onClick={()=>setFilter(t.key)} style={{ ...S.chip, ...(filter===t.key?S.chipActive:{}) }}>{t.label} ({c}) <span style={{color:'#94a3b8',fontSize:'10.5px'}}>≤{thresholds[t.key]}d</span></button>;})}
            <button onClick={()=>setFilter('training_cert')} style={{ ...S.chip, ...(filter==='training_cert' ? { background:'#ccfbf1', color:'#0f766e', borderColor:'#5eead4' } : {}), border:'1px solid #99f6e4' }}>
              🎓 Training Certs ({trainingAlertCount}) <span style={{color:'#94a3b8',fontSize:'10.5px'}}>≤{thresholds.training_cert||30}d</span>
            </button>
          </div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
            {filtered.length===0 ? <div style={{ padding:'60px', textAlign:'center', color:'#94a3b8' }}>✓ All clear — no expiring documents</div> :
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'12px', minWidth:'900px' }}>
                <thead><tr style={{ background:'#f8fafc' }}>{['Severity','Employee','Document / Course','Issuer / Cert No','Expiry Date','Days','Contact'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
                <tbody>{filtered.map((a,i)=>{const c=a.severity==='expired'?'#dc2626':a.severity==='critical'?'#ea580c':a.severity==='urgent'?'#ca8a04':'#0891b2';
                  return <tr key={i} className="hr-row" style={{ borderTop:'1px solid #f1f5f9' }}>
                    <td style={S.td}><span style={{ background:c+'15', color:c, padding:'3px 9px', borderRadius:'10px', fontSize:'10.5px', fontWeight:700, textTransform:'uppercase' }}>{a.severity}</span></td>
                    <td style={S.td}><div style={{ fontWeight:600 }}>{a.full_name}</div><div style={{ fontSize:'11px', color:'#94a3b8' }}>{a.employee_id}</div></td>
                    <td style={S.td}>
                      <div>{a.typeLabel}</div>
                      {a.type === 'training_cert' && <div style={{ fontSize:'10.5px', color:'#0f766e', background:'#f0fdfa', display:'inline-block', padding:'1px 6px', borderRadius:'8px', marginTop:'2px', fontWeight:600 }}>🎓 Training Cert</div>}
                    </td>
                    <td style={{ ...S.td, fontSize:'11.5px', color:'#64748b' }}>
                      {a.issuingCompany && <div style={{ fontWeight:600, color:'#0f172a' }}>{a.issuingCompany}</div>}
                      {a.certNo && <div style={{ fontFamily:'ui-monospace,monospace', fontSize:'11px', color:'#64748b' }}>{a.certNo}</div>}
                      {!a.issuingCompany && !a.certNo && '—'}
                    </td>
                    <td style={{ ...S.td, whiteSpace:'nowrap' }}>{fmtDateDisplay(a.expiryDate)}</td>
                    <td style={{ ...S.td, fontWeight:700, color:c, whiteSpace:'nowrap' }}>{a.daysLeft<0?`${Math.abs(a.daysLeft)}d overdue`:`${a.daysLeft}d`}</td>
                    <td style={{ ...S.td, fontSize:'11px' }}>{a.email&&<div>{a.email}</div>}{a.mobile&&<div style={{color:'#94a3b8'}}>{a.mobile}</div>}</td>
                  </tr>;})}</tbody>
              </table>}
          </div>
        </div>
      );
    }

    // ============ MOB-DEMOB ============
    function MobDemobView({ records, employees, onAdd, onEdit, onDelete, onSyncAll }) {
      const [search, setSearch] = useState('');
      const [viewMode, setViewMode] = useState('flat'); // 'flat' | 'grouped'

      const empIds = new Set(employees.map(e => e.employee_id).filter(Boolean));
      const synced = records.filter(r => empIds.has(r.employee_id)).length;
      const total = empIds.size;
      const missing = total - synced;

      // Compute days worked for a record
      const calcDays = (r) => {
        const mob = r.mobilization_date ? new Date(r.mobilization_date) : null;
        const demob = r.demobilization_date ? new Date(r.demobilization_date) : null;
        if (!mob) return null;
        const end = demob || new Date();
        return Math.round((end - mob) / 86400000);
      };

      // Sort / filter flat list
      const sorted = useMemo(() => {
        const s = search.toLowerCase().trim();
        return [...records]
          .filter(r => {
            if (!s) return true;
            return (r.employee_id||'').toLowerCase().includes(s) ||
                   (r.full_name||'').toLowerCase().includes(s) ||
                   (r.position||'').toLowerCase().includes(s) ||
                   (r.eid_no||'').toLowerCase().includes(s) ||
                   (r.supply||'').toLowerCase().includes(s) ||
                   (r.location||'').toLowerCase().includes(s) ||
                   (r.remarks||'').toLowerCase().includes(s) ||
                   (r.mobilization_date ? fmtDateDisplay(r.mobilization_date).toLowerCase().includes(s) : false) ||
                   (r.demobilization_date ? fmtDateDisplay(r.demobilization_date).toLowerCase().includes(s) : false);
          })
          .sort((a, b) => {
            const na = parseInt((a.employee_id||'').replace(/[^0-9]/g,'') || '0');
            const nb = parseInt((b.employee_id||'').replace(/[^0-9]/g,'') || '0');
            if (na !== nb) return na - nb;
            // Within same employee, sort by mob date desc (latest first)
            return (b.mobilization_date||'') > (a.mobilization_date||'') ? 1 : -1;
          });
      }, [records, search]);

      // Grouped: one entry per employee, with all their assignments
      const grouped = useMemo(() => {
        const s = search.toLowerCase().trim();
        const empMap = {};
        records.forEach(r => {
          const key = r.employee_id || r.full_name || r.id;
          if (!empMap[key]) empMap[key] = { employee_id: r.employee_id, full_name: r.full_name, position: r.position, eid_no: r.eid_no, assignments: [] };
          empMap[key].assignments.push(r);
        });
        return Object.values(empMap)
          .filter(g => {
            if (!s) return true;
            return (g.employee_id||'').toLowerCase().includes(s) ||
                   (g.full_name||'').toLowerCase().includes(s) ||
                   (g.position||'').toLowerCase().includes(s) ||
                   g.assignments.some(r =>
                     (r.supply||'').toLowerCase().includes(s) ||
                     (r.location||'').toLowerCase().includes(s) ||
                     (r.remarks||'').toLowerCase().includes(s)
                   );
          })
          .sort((a, b) => {
            const na = parseInt((a.employee_id||'').replace(/[^0-9]/g,'') || '0');
            const nb = parseInt((b.employee_id||'').replace(/[^0-9]/g,'') || '0');
            return na - nb;
          })
          .map(g => ({
            ...g,
            assignments: [...g.assignments].sort((a, b) =>
              (b.mobilization_date||'') > (a.mobilization_date||'') ? 1 : -1
            )
          }));
      }, [records, search]);

      const DaysTag = ({ r }) => {
        const days = calcDays(r);
        if (days === null) return <span style={{ color:'#cbd5e1' }}>—</span>;
        const ongoing = !r.demobilization_date;
        const bg = ongoing ? '#eff6ff' : '#f0fdf4';
        const color = ongoing ? '#1d4ed8' : '#166534';
        return (
          <span style={{ background: bg, color, fontWeight:700, fontSize:'11px', padding:'2px 8px', borderRadius:'10px', whiteSpace:'nowrap' }}>
            {days}d{ongoing ? ' 🟢' : ' ✓'}
          </span>
        );
      };

      return (
        <div>
          {/* Toolbar */}
          <div style={{ display:'flex', gap:'10px', marginBottom:'14px', alignItems:'center', flexWrap:'wrap' }}>
            <input value={search} onChange={e => setSearch(e.target.value)}
              placeholder="Search by Emp ID, Name, Position, Location, Supply, Remarks…"
              style={{ ...S.input, flex:1, minWidth:'220px', maxWidth:'360px' }} />
            <div style={{ background: missing===0&&total>0 ? '#f0fdf4' : '#fffbeb', border:'1px solid '+(missing===0&&total>0?'#86efac':'#fcd34d'), borderRadius:'8px', padding:'7px 14px', fontSize:'12px', color:missing===0&&total>0?'#166534':'#92400e', fontWeight:600, whiteSpace:'nowrap' }}>
              {missing===0&&total>0 ? '✅' : '⚠️'} {synced}/{total} synced{missing > 0 && ` — ${missing} missing`}
            </div>
            {/* View toggle */}
            <div style={{ display:'flex', border:'1px solid #e2e8f0', borderRadius:'8px', overflow:'hidden' }}>
              {[['flat','📋 Flat'],['grouped','👤 By Employee']].map(([v,l]) => (
                <button key={v} onClick={() => setViewMode(v)}
                  style={{ padding:'7px 13px', fontSize:'12px', fontWeight:600, border:'none', cursor:'pointer', background: viewMode===v ? '#0f172a' : '#fff', color: viewMode===v ? '#fff' : '#64748b' }}>
                  {l}
                </button>
              ))}
            </div>
            <button className="hr-btn" onClick={onSyncAll}
              style={{ background:'#0f172a', color:'#fff', border:'none', padding:'9px 16px', borderRadius:'8px', fontSize:'13px', fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:'8px' }}>
              Sync All from Employees
              <span style={{ background:'rgba(255,255,255,0.18)', fontSize:'11px', padding:'2px 8px', borderRadius:'8px' }}>{employees.length}</span>
            </button>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ Add Record</button>
          </div>

          {/* ── FLAT VIEW ── */}
          {viewMode === 'flat' && (
            <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
              <div className="hr-scroll" style={{ overflowX:'auto' }}>
                <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'12px', minWidth:'1050px' }}>
                  <thead>
                    <tr style={{ background:'#f8fafc' }}>
                      {['Emp ID','Full Name','Position','EID No','Mob. Date','Demob. Date','Days Worked','Supply','Location','Remarks',''].map(h =>
                        <th key={h} style={S.th}>{h}</th>
                      )}
                    </tr>
                  </thead>
                  <tbody>
                    {sorted.length===0
                      ? <tr><td colSpan={11} style={{ textAlign:'center', padding:'40px', color:'#94a3b8' }}>
                          {records.length===0 ? 'No records yet — click "Sync All from Employees" above' : 'No results match your search'}
                        </td></tr>
                      : sorted.map(r => (
                        <tr key={r.id} className="hr-row" onDoubleClick={() => onEdit(r)} title="Double-click to edit" style={{ borderTop:'1px solid #f1f5f9', cursor:'pointer' }}>
                          <td style={{ ...S.td, fontFamily:'ui-monospace,monospace', fontWeight:700, color:'#2563eb' }}>{r.employee_id}</td>
                          <td style={{ ...S.td, fontWeight:600 }}>{r.full_name}</td>
                          <td style={S.td}>{r.position}</td>
                          <td style={{ ...S.td, fontSize:'11px' }}>{r.eid_no}</td>
                          <td style={{ ...S.td, whiteSpace:'nowrap' }}>{r.mobilization_date ? fmtDateDisplay(r.mobilization_date) : '—'}</td>
                          <td style={{ ...S.td, whiteSpace:'nowrap' }}>
                            {r.demobilization_date
                              ? <span style={{ color:'#64748b' }}>{fmtDateDisplay(r.demobilization_date)}</span>
                              : <span style={{ background:'#dcfce7', color:'#166534', fontSize:'10.5px', fontWeight:700, padding:'2px 8px', borderRadius:'10px' }}>Active</span>}
                          </td>
                          <td style={{ ...S.td, whiteSpace:'nowrap' }}><DaysTag r={r} /></td>
                          <td style={S.td}>{r.supply ? <span style={{ background:'#eff6ff', color:'#1e40af', fontSize:'11px', fontWeight:600, padding:'2px 8px', borderRadius:'8px' }}>{r.supply}</span> : '—'}</td>
                          <td style={S.td}>{r.location ? <span style={{ background:'#f5f3ff', color:'#6d28d9', fontSize:'11px', fontWeight:600, padding:'2px 8px', borderRadius:'8px' }}>{r.location}</span> : '—'}</td>
                          <td style={{ ...S.td, fontSize:'11px', maxWidth:'160px', whiteSpace:'normal' }}>{r.remarks}</td>
                          <td style={{ ...S.td, textAlign:'right', whiteSpace:'nowrap' }}>
                            <button onClick={() => onEdit(r)} style={S.iconBtn}>&#9998;</button>
                            <button onClick={() => onDelete(r.id)} style={S.iconBtn}>&#128465;</button>
                          </td>
                        </tr>
                      ))
                    }
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── GROUPED BY EMPLOYEE VIEW ── */}
          {viewMode === 'grouped' && (
            <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
              {grouped.length === 0
                ? <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'40px', textAlign:'center', color:'#94a3b8' }}>
                    {records.length===0 ? 'No records yet — click "Sync All from Employees" above' : 'No results match your search'}
                  </div>
                : grouped.map(g => {
                  const totalDays = g.assignments.reduce((sum, r) => sum + (calcDays(r) || 0), 0);
                  const activeAssignment = g.assignments.find(r => !r.demobilization_date);
                  const allSupplies = [...new Set(g.assignments.map(r => r.supply).filter(Boolean))];
                  const allLocations = [...new Set(g.assignments.map(r => r.location).filter(Boolean))];
                  return (
                    <div key={g.employee_id} style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
                      {/* Employee header */}
                      <div style={{ background:'#f8fafc', borderBottom:'1px solid #e2e8f0', padding:'10px 16px', display:'flex', alignItems:'center', gap:'14px', flexWrap:'wrap' }}>
                        <div style={{ fontFamily:'ui-monospace,monospace', fontWeight:800, color:'#2563eb', fontSize:'13px' }}>{g.employee_id}</div>
                        <div style={{ fontWeight:700, fontSize:'13px', flex:1 }}>{g.full_name}</div>
                        <div style={{ fontSize:'11.5px', color:'#64748b' }}>{g.position}</div>
                        {/* Summary chips */}
                        <div style={{ display:'flex', gap:'6px', flexWrap:'wrap', alignItems:'center' }}>
                          <span style={{ background:'#f0f9ff', color:'#0369a1', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'10px' }}>
                            {g.assignments.length} assignment{g.assignments.length!==1?'s':''}
                          </span>
                          <span style={{ background:'#fef3c7', color:'#92400e', fontSize:'11px', fontWeight:700, padding:'2px 9px', borderRadius:'10px' }}>
                            {totalDays}d total
                          </span>
                          {activeAssignment && (

    const SETTINGS_EDGE_FN = [

      '  }',
      '',

      '  for (const tr of (trainings || [])) {',

      const BUCKET = 'hr-documents';

      useEffect(() => {
        if (!empPreviewDoc || !empPreviewDoc.isPdf || !empPreviewDoc.url) { setEmpPdfBlobUrl(null); return; }
        try {
          const b64 = empPreviewDoc.url.split(',')[1];
          const bytes = atob(b64);
          const arr = new Uint8Array(bytes.length);
          for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
          const blob = new Blob([arr], { type: 'application/pdf' });
          const bUrl = URL.createObjectURL(blob);
          setEmpPdfBlobUrl(bUrl);
          return () => URL.revokeObjectURL(bUrl);
        } catch(e) { setEmpPdfBlobUrl(null); }
      }, [empPreviewDoc]);

      // We load from DB on mount, mutate locally, and auto-save on every change.
      const [tcRec, setTcRec] = useState(null);       // the employee_trainings row
      const [tcLoaded, setTcLoaded] = useState(false);

      // Load the training record for this employee
      useEffect(() => {
        if (!employeeId) { setTcLoaded(true); return; }
        db.from('employee_trainings').select('*').eq('employee_id', employeeId).single()
          .then(({ data: row }) => { setTcRec(row || null); setTcLoaded(true); });
      }, [employeeId]);

      const getTrainCerts = () => {
        try {
          const p = JSON.parse(tcRec?.training_records || '{}');
          return p.__other || [];
        } catch { return []; }
      };

      // Mutate __other and immediately persist to Supabase
      const tcMutate = async (fn) => {
        const oldCerts = getTrainCerts();
        const newCerts = fn(oldCerts);
        // Update local state first (optimistic)
        setTcRec(prev => {
          let p = {}; try { p = JSON.parse(prev?.training_records || '{}'); } catch {}
          p.__other = newCerts;
          return { ...(prev || {}), employee_id: employeeId, training_records: JSON.stringify(p) };
        });
        // Persist to DB
        try {
          if (tcRec?.id) {
            let p = {}; try { p = JSON.parse(tcRec.training_records || '{}'); } catch {}
            p.__other = newCerts;
            await db.from('employee_trainings').update({ training_records: JSON.stringify(p) }).eq('id', tcRec.id);
          } else {
            // Row doesn't exist yet — create it
            const initRec = JSON.stringify({ __other: newCerts });
            const { data: newRow } = await db.from('employee_trainings')
              .insert({ employee_id: employeeId, full_name: data.full_name || '', position: data.position || null, training_records: initRec })
              .select().single();
            if (newRow) setTcRec(newRow);
          }
        } catch(e) { console.error('tcMutate save error', e); }
        return newCerts;
      };

      const [tcActiveCid, setTcActiveCid] = useState(null);
      const [tcOcrData,   setTcOcrData]   = useState({});
      const [tcOcrBusy,   setTcOcrBusy]   = useState({});
      const [tcApplied,   setTcApplied]   = useState({});
      const [tcImgErr,    setTcImgErr]     = useState({});

      const tcUpdate = async (cid, fields) => {
        await tcMutate(arr => arr.map(c => c.cid === cid ? { ...c, ...fields } : c));
      };
      const tcAdd = async () => {
        const cid = Math.random().toString(36).slice(2,10);
        await tcMutate(arr => [...arr, { cid, courseName:'', issuingCompany:'', certNo:'', issueDate:'', expiry:'', imgData:'' }]);
        setTcActiveCid(cid);
      };
      const tcRemove = async (cid) => {
        if (!window.confirm('Remove this training certificate?')) return;
        const cur = getTrainCerts();
        const idx = cur.findIndex(c => c.cid === cid);
        const rest = cur.filter(c => c.cid !== cid);
        setTcActiveCid(rest[idx]?.cid || rest[idx-1]?.cid || null);
        await tcMutate(() => rest);
        setTcOcrData(d => { const n={...d}; delete n[cid]; return n; });
        setTcApplied(d => { const n={...d}; delete n[cid]; return n; });
        setTcImgErr(d  => { const n={...d}; delete n[cid]; return n; });
      };
      const tcHandleFile = (cid, file) => {
        if (!file) return;
        setTcImgErr(d => ({ ...d, [cid]: false }));
        setTcOcrBusy(d => ({ ...d, [cid]: true }));
        setTcOcrData(d => ({ ...d, [cid]: null }));
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const dataUrl = ev.target.result;
          await tcUpdate(cid, { imgData: dataUrl });
          try {
            const base64 = dataUrl.split(',')[1];
            const mtype  = file.type?.startsWith('image/') ? file.type : 'image/jpeg';
            const res = await fetch('/api/claude', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:600,
                messages:[{ role:'user', content:[
                  { type:'image', source:{ type:'base64', media_type:mtype, data:base64 } },
                  { type:'text', text:`OCR this training/safety certificate. Extract:
1. Certificate number
2. Issue date (YYYY-MM-DD)
3. Expiry / valid-until date (YYYY-MM-DD) — NOT issue date
4. Full course / training name (e.g. "Safe Scaffolding Erection and Dismantling")
5. Issuing company / training provider (e.g. "Crosswind", "OPITO", "Bureau Veritas")
Reply ONLY as valid JSON, no markdown:
{"certNo":"...","issueDate":"YYYY-MM-DD","expiryDate":"YYYY-MM-DD","courseName":"...","issuingCompany":"..."}
Use null for missing fields.` }
                ]}]
              })
            });
            const json = await res.json();
            const raw = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
            let result = {};
            try { result = parseClaudeJson(raw); } catch(e) { result = { error: 'Parse failed: '+e.message }; }
            setTcOcrData(d => ({ ...d, [cid]: result }));
          } catch(e) { setTcOcrData(d => ({ ...d, [cid]:{ error:e.message } })); }
          setTcOcrBusy(d => ({ ...d, [cid]: false }));
        };
        reader.readAsDataURL(file);
      };
      const tcApplyOcr = async (cid) => {
        const ocr = tcOcrData[cid];
        if (!ocr || ocr.error) return;
        const u = {};
        if (ocr.certNo)         u.certNo         = ocr.certNo;
        if (ocr.issueDate)      u.issueDate      = ocr.issueDate;
        if (ocr.expiryDate)     u.expiry         = ocr.expiryDate;
        if (ocr.courseName)     u.courseName     = ocr.courseName;
        if (ocr.issuingCompany) u.issuingCompany = ocr.issuingCompany;
        if (Object.keys(u).length) await tcUpdate(cid, u);
        setTcApplied(d => ({ ...d, [cid]: true }));
        setTimeout(() => setTcApplied(d => ({ ...d, [cid]: false })), 3000);
      };

      // Get the display URL: prefer newly uploaded local preview, else stored URL from DB
      const getImgSrc = (docKey) => {
        if (imgError[docKey]) return null; // don't retry broken URLs
        if (localImgs[docKey]) return localImgs[docKey];
        const dt = DOC_TYPES.find(d=>d.key===docKey);
        const stored = dt && data[dt.imgKey] ? data[dt.imgKey] : null;
        // base64 data URLs always work; only http URLs can go stale
        if (stored && stored.startsWith('data:')) return stored;
        if (stored && stored.startsWith('http')) return stored;
        return null;
      };

      const handleFileChange = async (docKey, file) => {
        if (!file) return;
        setActiveDoc(docKey);
        setImgError(p => ({ ...p, [docKey]: false }));
        setUploadLoading(p => ({ ...p, [docKey]: true }));

        const isPdf = file.type === 'application/pdf';
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const dataUrl = ev.target.result;
          setLocalImgs(p => ({ ...p, [docKey]: dataUrl }));

          // Save as base64 directly into the employee record
          const dt2 = DOC_TYPES.find(d=>d.key===docKey);
          if (dt2?.imgKey) setField(dt2.imgKey, dataUrl);

          // OCR — supports images AND PDFs
          setOcrResults(p => ({ ...p, [docKey]: null }));
          setOcrLoading(p => ({ ...p, [docKey]: true }));
          try {
            const base64 = dataUrl.split(',')[1];
            const mtype = isPdf ? 'application/pdf' : (file.type?.startsWith('image/') ? file.type : 'image/jpeg');

            const ocrPrompt = (() => {
              if (docKey === 'evisa') return `You are an OCR assistant for a UAE Employment eVisa. Extract:
1. Entry Permit / eVisa Number (e.g. 101/2026/2/0146278)
2. Full Name of the employee
3. Passport Number
4. Profession / Position as printed
5. Expiry date — the "permitted to enter UAE until" date (YYYY-MM-DD)
6. Nationality
Reply ONLY as valid JSON, no markdown:
{"docNumber":"...","fullName":"...","passportNo":"...","profession":"...","expiryDate":"YYYY-MM-DD","nationality":"...","rawText":"...brief..."}
Use null for missing fields.`;
              if (docKey === 'mohre') return `You are an OCR assistant for a UAE MOHRE Employment Contract PDF. Extract:
1. Transaction Number (e.g. MB313042200AE)
2. Employee Full Name (Second Party / Worker name)
3. Profession / Job Title
4. Contract Start Date (YYYY-MM-DD)
5. Contract End Date (YYYY-MM-DD) — this is the expiry
6. Basic Salary in AED
Reply ONLY as valid JSON, no markdown:
{"docNumber":"...","fullName":"...","profession":"...","startDate":"YYYY-MM-DD","expiryDate":"YYYY-MM-DD","basicSalary":"...","rawText":"...brief..."}
Use null for missing fields.`;
              if (docKey === 'insurance') return `You are an OCR assistant for a UAE health/medical insurance card or certificate. Extract:
1. Insurance company / provider name (e.g. Daman, AXA Gulf, Orient, GIG Gulf, Fidelity United, Neuron, NAS, ADNIC, Dubai Insurance, Sukoon, etc.)
2. Policy number or card number (the main ID on the card)
3. Expiry date — the date the insurance EXPIRES (YYYY-MM-DD)
4. Employee / member name
Reply ONLY as valid JSON, no markdown:
{"companyName":"...","docNumber":"...","expiryDate":"YYYY-MM-DD","holderName":"...","rawText":"...brief..."}
Use null for missing fields. expiryDate must be YYYY-MM-DD.`;
              if (docKey === 'bank') return `You are an OCR assistant for a bank document (cheque / letter / statement). Extract:
1. Bank Name
2. Account Number
3. IBAN
4. Account Holder Name
Reply ONLY as valid JSON, no markdown:
{"bankName":"...","accountNo":"...","iban":"...","holderName":"...","rawText":"...brief..."}
Use null for missing fields.`;
              return `You are an OCR assistant. Extract from this ${DOC_TYPES.find(d=>d.key===docKey)?.label||'document'}:
1. Document number
2. Expiry date (EXPIRES date, NOT issue date)
Reply ONLY as valid JSON, no markdown:
{"docNumber":"...","expiryDate":"YYYY-MM-DD","rawText":"...brief OCR text..."}
Use null for missing fields. expiryDate must be YYYY-MM-DD.
For passports: expiry is bottom-right of data page; verify via MRZ (YYMMDD format).`;
            })();

            const contentBlock = isPdf
              ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:base64 } }
              : { type:'image', source:{ type:'base64', media_type:mtype, data:base64 } };

            const res = await fetch('/api/claude', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:1000,
                messages:[{ role:'user', content:[ contentBlock, { type:'text', text:ocrPrompt } ] }] })
            });
            const json = await res.json();
            const rawText = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
            let parsed = {};
            try { parsed = parseClaudeJson(rawText); } catch(e) { parsed = { error: 'Parse failed: '+e.message, rawText }; }
            setOcrResults(p => ({ ...p, [docKey]: parsed }));
            if (parsed.expiryDate) setManualExpiry(p => ({ ...p, [docKey]: parsed.expiryDate }));
            if (docKey === 'bank') {
              if (parsed.bankName) setField('bank_name', parsed.bankName);
              if (parsed.accountNo) setManualNo(p => ({ ...p, [docKey]: parsed.accountNo }));
              if (parsed.iban) setField('bank_iban', parsed.iban);
            } else if (docKey === 'mohre') {
              if (parsed.docNumber) setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
              if (parsed.startDate) setField('mohre_contract_start', parsed.startDate);
              if (parsed.basicSalary) setField('basic_salary', parsed.basicSalary);
            } else if (docKey === 'evisa') {
              if (parsed.docNumber) setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
              if (parsed.profession) setField('position', parsed.profession);
            } else if (docKey === 'insurance') {
              if (parsed.docNumber) setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
              if (parsed.companyName) setManualInsuranceCo(parsed.companyName);
            } else {
              if (parsed.docNumber) setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
            }
          } catch(e) {
            setOcrResults(p => ({ ...p, [docKey]: { error: e.message } }));
          }
          setOcrLoading(p => ({ ...p, [docKey]: false }));
          setUploadLoading(p => ({ ...p, [docKey]: false }));
        };
        reader.readAsDataURL(file);
      };

      const applyToForm = (docKey) => {
        const dt = DOC_TYPES.find(d=>d.key===docKey);
        if (!dt) return;
        const exp = manualExpiry[docKey] || ocrResults[docKey]?.expiryDate || '';
        const num = manualNo[docKey]     || ocrResults[docKey]?.docNumber  || '';
        if (exp && dt.expiryKey) setField(dt.expiryKey, exp);
        if (docKey === 'insurance') {
          if (manualInsuranceCo) setField('insurance_id', manualInsuranceCo);
        } else {
          if (num && dt.noKey) setField(dt.noKey, num);
        }
        setApplyStatus(p => ({ ...p, [docKey]: 'applied' }));
        setTimeout(() => setApplyStatus(p => ({ ...p, [docKey]: null })), 3000);
      };

      const rescanEmpDoc = async (docKey) => {
        const src = getImgSrc(docKey);
        if (!src) return;
        const dt = DOC_TYPES.find(d => d.key === docKey);
        setOcrResults(p => ({ ...p, [docKey]: null }));
        setOcrLoading(p => ({ ...p, [docKey]: true }));
        try {
          const base64 = src.split(',')[1];
          const mtype = src.startsWith('data:image/') ? src.split(';')[0].split(':')[1] : 'image/jpeg';
          const res = await fetch('/api/claude', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001', max_tokens: 1000,
              messages: [{ role: 'user', content: [
                { type: 'image', source: { type: 'base64', media_type: mtype, data: base64 } },
                { type: 'text', text: docKey === 'insurance'
                  ? `You are an OCR assistant for a UAE health/medical insurance card or certificate. Extract:
1. Insurance company / provider name (e.g. Daman, AXA Gulf, Orient, GIG Gulf, Fidelity United, Neuron, NAS, ADNIC, Dubai Insurance, Sukoon, etc.)
2. Policy number or card number (the main ID on the card)
3. Expiry date — the date the insurance EXPIRES (YYYY-MM-DD)
4. Employee / member name
Reply ONLY as valid JSON, no markdown:
{"companyName":"...","docNumber":"...","expiryDate":"YYYY-MM-DD","holderName":"...","rawText":"...brief..."}
Use null for missing fields. expiryDate must be YYYY-MM-DD.`
                  : `You are an OCR assistant. Extract from this ${dt?.label||'document'} image:
1. Document number
2. Expiry date (the date the document EXPIRES, NOT the issue date)
Reply ONLY with valid JSON, no markdown:
{"docNumber":"...","expiryDate":"YYYY-MM-DD","rawText":"...brief OCR text..."}
Use null for missing fields. expiryDate must be YYYY-MM-DD.
For passports: expiry is bottom-right of data page, verify via MRZ (YYMMDD format).` }
              ]}]
            })
          });
          const json = await res.json();
          const rawText = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
          let parsed = {};
          try { parsed = parseClaudeJson(rawText); } catch(e) { parsed = { error: 'Parse failed: '+e.message }; }
          setOcrResults(p => ({ ...p, [docKey]: parsed }));
          if (parsed.expiryDate) setManualExpiry(p => ({ ...p, [docKey]: parsed.expiryDate }));
          if (parsed.docNumber)  setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
          if (docKey === 'insurance' && parsed.companyName) setManualInsuranceCo(parsed.companyName);
        } catch(e) {
          setOcrResults(p => ({ ...p, [docKey]: { error: e.message } }));
        }
        setOcrLoading(p => ({ ...p, [docKey]: false }));
      };

      const activeType = DOC_TYPES.find(d => d.key === activeDoc);
      const imgSrc = getImgSrc(activeDoc);
      const fileName = localImgs[activeDoc] ? '(newly uploaded)' : (activeType && data[activeType.imgKey] ? 'Saved document' : null);
      const isTrainingTab = activeDoc === '__training';
      const trainCerts = getTrainCerts();
      const tcCert = tcActiveCid ? trainCerts.find(c => c.cid === tcActiveCid) || null : null;
      const tcOcr  = tcActiveCid ? (tcOcrData[tcActiveCid] || null) : null;
      const tcScan = tcActiveCid ? (tcOcrBusy[tcActiveCid] || false) : false;
      const tcWasApplied = tcActiveCid ? (tcApplied[tcActiveCid] || false) : false;
      const tcImgSrc = (() => {
        if (!tcActiveCid || tcImgErr[tcActiveCid]) return null;
        const img = tcCert?.imgData;
        return img?.startsWith('data:') || img?.startsWith('http') ? img : null;
      })();
      // Auto-select first cert when tab opened and certs exist
      if (isTrainingTab && trainCerts.length > 0 && !tcActiveCid) {
        setTimeout(() => setTcActiveCid(trainCerts[0].cid), 0);
      }

      return (
        <div style={{ background:'#fafbfc', border:'1px solid #e2e8f0', borderRadius:'10px', padding:'14px', marginBottom:'4px' }}>
          {/* ── Tab strip ── */}
          <div style={{ display:'flex', gap:'7px', flexWrap:'wrap', marginBottom:'14px' }}>
            {DOC_TYPES.map(dt => {
              const hasSaved = !!(data[dt.imgKey] || localImgs[dt.key]);
              const isActive = activeDoc === dt.key;
              return (
                <button key={dt.key} type="button" onClick={() => setActiveDoc(dt.key)}
                  style={{
                    background: isActive ? dt.color : hasSaved ? '#f0fdf4' : '#fff',
                    color: isActive ? '#fff' : hasSaved ? '#166534' : '#475569',
                    border: `1.5px ${isActive?'solid':'dashed'} ${isActive ? dt.color : hasSaved ? '#86efac' : dt.border}`,
                    padding:'6px 13px', borderRadius:'20px', fontSize:'12px', fontWeight:700,
                    cursor:'pointer', display:'flex', alignItems:'center', gap:'5px', transition:'all 0.15s'
                  }}>
                  {hasSaved ? '✓ ' : '+ '}{dt.label}
                </button>
              );
            })}
            {/* Training Certificates tab */}
            {(() => {
              const hasCerts = trainCerts.length > 0;
              const isActive = activeDoc === '__training';
              return (
                <button type="button" onClick={() => setActiveDoc('__training')}
                  style={{
                    background: isActive ? '#0f766e' : hasCerts ? '#f0fdf4' : '#fff',
                    color: isActive ? '#fff' : hasCerts ? '#166534' : '#475569',
                    border: `1.5px ${isActive ? 'solid' : 'dashed'} ${isActive ? '#0f766e' : hasCerts ? '#86efac' : '#99f6e4'}`,
                    padding:'6px 13px', borderRadius:'20px', fontSize:'12px', fontWeight:700,
                    cursor:'pointer', display:'flex', alignItems:'center', gap:'5px', transition:'all 0.15s'
                  }}>
                  {hasCerts ? '✓ ' : '+ '}Training Certs {hasCerts ? `(${trainCerts.length})` : ''}
                </button>
              );
            })()}
          </div>

          {/* ── Standard doc panel ── */}
          {!isTrainingTab && activeType && (
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px' }}>
              {/* LEFT — image/pdf preview / upload */}
              <div style={{ display:'flex', flexDirection:'column', gap:'8px' }}>
                {imgSrc && !imgError[activeDoc] ? (
                  <div style={{ border:'1px solid #e2e8f0', borderRadius:'8px', overflow:'hidden', background:'#fff' }}>
                    {imgSrc.startsWith('data:application/pdf') ? (
                      <div
                        onClick={() => setEmpPreviewDoc({ url: imgSrc, label: activeType?.label || 'Document', isPdf: true })}
                        style={{ width:'100%', minHeight:'180px', maxHeight:'240px', background:'#eff6ff', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'8px', cursor:'zoom-in' }}
                        title="Click to view PDF">
                        <span style={{ fontSize:'48px' }}>📄</span>
                        <span style={{ fontSize:'12px', fontWeight:700, color:'#2563eb' }}>PDF — Click to View</span>
                      </div>
                    ) : (
                      <img src={imgSrc} alt="Document scan"
                        onError={() => { setImgError(p => ({ ...p, [activeDoc]: true })); const dt = DOC_TYPES.find(d=>d.key===activeDoc); if (dt?.imgKey) setField(dt.imgKey, null); }}
                        onClick={() => setEmpPreviewDoc({ url: imgSrc, label: activeType?.label || 'Document', isPdf: false })}
                        style={{ width:'100%', display:'block', maxHeight:'240px', objectFit:'contain', background:'#f8fafc', cursor:'zoom-in' }} crossOrigin="anonymous"
                        title="Click to view full size" />
                    )}
                    <div style={{ padding:'8px 12px', display:'flex', justifyContent:'space-between', alignItems:'center', borderTop:'1px solid #f1f5f9', background:'#fff' }}>
                      <span style={{ fontSize:'11px', color:'#64748b' }}>{localImgs[activeDoc] ? '📎 New upload' : '☁️ Saved document'}</span>
                      <div style={{ display:'flex', gap:'8px', alignItems:'center' }}>
                        <button type="button" onClick={() => rescanEmpDoc(activeDoc)}
                          style={{ background:'#eff6ff', color:'#2563eb', border:'1px solid #bfdbfe', padding:'3px 10px', borderRadius:'6px', fontSize:'11px', fontWeight:600, cursor:'pointer' }}>
                          🤖 Re-scan
                        </button>
                        <label style={{ cursor:'pointer', fontSize:'11px', color:'#2563eb', fontWeight:600 }}>
                          🔄 Replace
                          <input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" style={{ display:'none' }}
                            onChange={e => e.target.files[0] && handleFileChange(activeDoc, e.target.files[0])} />
                        </label>
                      </div>
                    </div>
                  </div>
                ) : (
                  <label style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'10px', border:`2px dashed ${activeType.border}`, borderRadius:'8px', padding:'32px 16px', cursor:'pointer', background:'#fff', minHeight:'180px' }}>
                    {imgError[activeDoc] ? (
                      <><span style={{ fontSize:'28px' }}>📷</span><span style={{ fontSize:'12px', color:'#475569', fontWeight:600, textAlign:'center' }}>Previous image link expired.<br/>Click to upload a new one.</span></>
                    ) : (
                      <><span style={{ fontSize:'32px' }}>📄</span><span style={{ fontSize:'13px', color:'#475569', fontWeight:600, textAlign:'center' }}>Click to upload {activeType.label}</span></>
                    )}
                    <span style={{ fontSize:'11px', color:'#94a3b8' }}>JPG, PNG, WEBP, or PDF</span>
                    <input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" style={{ display:'none' }}
                      onChange={e => e.target.files[0] && handleFileChange(activeDoc, e.target.files[0])} />
                  </label>
                )}
              </div>

              {/* RIGHT — OCR + editable fields */}
              <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                <div style={{ fontSize:'12px', fontWeight:700, color:'#475569' }}>🔍 Auto-detect</div>
                {ocrLoading[activeDoc] && (
                  <div style={{ display:'flex', alignItems:'center', gap:'10px', padding:'12px', background:'#eff6ff', borderRadius:'8px' }}>
                    <div className="spinner" style={{ width:'18px', height:'18px', borderWidth:'2px', flexShrink:0 }}></div>
                    <span style={{ fontSize:'12px', color:'#1e40af' }}>Scanning document…</span>
                  </div>
                )}
                {!ocrLoading[activeDoc] && !imgSrc && (
                  <div style={{ fontSize:'12px', color:'#94a3b8', padding:'12px', background:'#f8fafc', borderRadius:'8px', lineHeight:1.5 }}>
                    Upload a scan to auto-detect the number & expiry.<br/>
                    <span style={{ fontSize:'11px' }}>You can also type values manually below.</span>
                  </div>
                )}
                {ocrResults[activeDoc]?.error && (
                  <div style={{ fontSize:'11.5px', color:'#991b1b', background:'#fee2e2', padding:'10px', borderRadius:'8px' }}>
                    ⚠ Scan issue: {ocrResults[activeDoc].error}<br/>
                    <span style={{ fontSize:'10.5px' }}>Enter values manually below.</span>
                  </div>
                )}

          const dt2 = DOC_TYPES.find(d=>d.key===docKey);
          if (dt2?.imgKey) {
            setField(dt2.imgKey, dataUrl);
            console.log('[UPLOAD] base64 saved to field:', dt2.imgKey);
          }

          setOcrResults(p => ({ ...p, [docKey]: null }));
          setOcrLoading(p => ({ ...p, [docKey]: true }));
          try {
            const base64 = dataUrl.split(',')[1];

            const res = await fetch('/api/claude', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
