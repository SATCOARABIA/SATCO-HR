<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SATCO Arabia — HR Compliance</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
    input, select, textarea, button { font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #2563eb; outline-offset: -1px; }
    .hr-btn { transition: filter 0.15s; }
    .hr-btn:hover { filter: brightness(0.95); }
    .hr-row:hover { background: #f8fafc !important; }
    .hr-nav-item { transition: all 0.15s; }
    .hr-nav-item:hover { background: #1e3a5f; }
    .hr-card { transition: transform 0.15s, box-shadow 0.15s; }
    .hr-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,23,42,0.08); }
    @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .hr-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .hr-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    // ============================================================
    // CONFIG — Supabase configuration setup
    // ============================================================
    const SUPABASE_URL = 'https://oaerqjrkdpuhiproppaz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1MuBMmnSDo7RuMkmjEeeZw_j-u0tfoG';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================================
    // DATA MODEL — structural matching mappings
    // ============================================================
    const EMPLOYEE_FIELDS = [
      { key: 'employee_id', label: 'Employee ID', group: 'identity', required: true },
      { key: 'full_name', label: 'Full Name', group: 'identity', required: true },
      { key: 'visa_trade', label: 'Visa Trade', group: 'employment' },
      { key: 'department', label: 'Department', group: 'employment' },
      { key: 'nationality', label: 'Nationality', group: 'identity' },
      { key: 'position', label: 'Position', group: 'employment' },
      { key: 'work_experience', label: 'Work Experience', group: 'employment' },
      { key: 'joining_date', label: 'Joining Date', group: 'employment', type: 'date' },
      { key: 'basic_salary', label: 'Basic Salary', group: 'salary', type: 'number' },
      { key: 'allowance', label: 'Allowance', group: 'salary', type: 'number' },
      { key: 'status', label: 'Status', group: 'employment' },
      { key: 'dob', label: 'Date of Birth', group: 'identity', type: 'date' },
      { key: 'passport_no', label: 'Passport No', group: 'documents' },
      { key: 'passport_expiry', label: 'Passport Expiry', group: 'documents', type: 'date', expiry: 'passport' },
      { key: 'eid_no', label: 'EID No', group: 'documents' },
      { key: 'eid_hardcopy_recv', label: 'EID Hard Copy Recv Date', group: 'documents', type: 'date' },
      { key: 'eid_expiry', label: 'Emirates ID Expiry', group: 'documents', type: 'date', expiry: 'eid' },
      { key: 'visa_expiry', label: 'Visa Expiry', group: 'documents', type: 'date', expiry: 'visa' },
      { key: 'reference_by', label: 'Reference By', group: 'contact' },
      { key: 'reference_contact', label: 'Reference Contact Number', group: 'contact' },
      { key: 'email', label: 'Email', group: 'contact' },
      { key: 'india_contact', label: 'India Contact Number', group: 'contact' },
      { key: 'uae_contact', label: 'UAE Contact Number', group: 'contact' },
      { key: 'location', label: 'Location', group: 'contact' },
      { key: 'passport_handover', label: 'Passport Handover', group: 'documents' },
      { key: 'mobile', label: 'Mobile', group: 'contact' },
      { key: 'manager_email', label: 'Manager Email', group: 'contact' },
      { key: 'insurance_id', label: 'Insurance ID No', group: 'documents' },
      { key: 'insurance_effective', label: 'Insurance Effective Date', group: 'documents', type: 'date' },
      { key: 'insurance_expiry', label: 'Insurance Expiry', group: 'documents', type: 'date', expiry: 'insurance' },
      { key: 'cicpa_no', label: 'CICPA Gate Pass No', group: 'documents' },
      { key: 'cicpa_expiry', label: 'CICPA Expiry', group: 'documents', type: 'date', expiry: 'cicpa' },
      { key: 'cicpa_locations', label: 'CICPA Permitted Locations', group: 'documents', type: 'locations' },
    ];

    const CICPA_LOCATIONS = ['Ruwais', 'Habshan', 'Fujairah', 'Das Island', 'Ghasha', 'Shah', 'Mender', 'Bab', 'Asab'];

    const EXPIRY_TYPES = [
      { key: 'passport', label: 'Passport', col: 'passport_expiry', defaultDays: 180, color: '#dc2626' },
      { key: 'eid', label: 'Emirates ID', col: 'eid_expiry', defaultDays: 60, color: '#ea580c' },
      { key: 'visa', label: 'Visa', col: 'visa_expiry', defaultDays: 60, color: '#ca8a04' },
      { key: 'insurance', label: 'Insurance', col: 'insurance_expiry', defaultDays: 30, color: '#0891b2' },
      { key: 'cicpa', label: 'CICPA Gate Pass', col: 'cicpa_expiry', defaultDays: 15, color: '#7c3aed' },
    ];

    const DEFAULT_THRESHOLDS = { passport: 180, eid: 60, visa: 60, insurance: 30, cicpa: 15 };

    const isStrictEmployed = (s) => {
      if (!s) return false;
      const l = String(s).toLowerCase().trim();
      return l === 'employee' || l === 'employed';
    };
    const isBroadEmployed = (s) => {
      if (!s) return false;
      const l = String(s).toLowerCase().trim();
      return ['employee','employed','work permit','workpermit','employment visa issued'].some(x => l === x || l.includes(x));
    };

    // ============ DATE UTILITIES ============
    const parseDate = (v) => {
      if (!v) return null;
      if (v instanceof Date) return v;
      if (typeof v === 'number') { const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000); return isNaN(d) ? null : d; }
      const s = String(v).trim();
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (dmy) { const d = new Date(parseInt(dmy[3]), parseInt(dmy[2]) - 1, parseInt(dmy[1])); return isNaN(d) ? null : d; }
      const d = new Date(s); return isNaN(d) ? null : d;
    };
    const fmtDateISO = (v) => { const d = parseDate(v); return d ? d.toISOString().slice(0, 10) : ''; };
    const fmtDateDisplay = (v) => { const d = parseDate(v); return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; };
    const daysUntil = (v) => {
      const d = parseDate(v); if (!d) return null;
      const t = new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0);
      return Math.round((d - t) / 86400000);
    };

    // ============================================================
    // LOGIN PANEL VIEW
    // ============================================================
    function Login({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const submit = async () => {
        setError(''); setBusy(true);
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        setBusy(false);
        if (error) { setError(error.message); return; }
        onLogin(data.user);
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%)' }}>
          <div style={{ background: '#fff', borderRadius: '16px', padding: '40px', width: '400px', boxShadow: '0 25px 50px rgba(0,0,0,0.3)' }}>
            <div style={{ textAlign: 'center', marginBottom: '28px' }}>
              <div style={{ width: '56px', height: '56px', borderRadius: '14px', background: '#2563eb', margin: '0 auto 16px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '26px' }}>🏢</div>
              <h1 style={{ margin: 0, fontSize: '22px', color: '#0f172a' }}>SATCO Arabia</h1>
              <div style={{ color: '#64748b', fontSize: '14px', marginTop: '4px' }}>HR Compliance Portal</div>
            </div>
            <label style={{ fontSize: '13px', fontWeight: 600, color: '#475569', display: 'block', marginBottom: '6px' }}>Email</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()}
              placeholder="you@satcoarabia.com"
              style={{ width: '100%', padding: '11px 14px', border: '1px solid #cbd5e1', borderRadius: '8px', fontSize: '14px', marginBottom: '16px' }} />
            <label style={{ fontSize: '13px', fontWeight: 600, color: '#475569', display: 'block', marginBottom: '6px' }}>Password</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()}
              placeholder="••••••••"
              style={{ width: '100%', padding: '11px 14px', border: '1px solid #cbd5e1', borderRadius: '8px', fontSize: '14px', marginBottom: '20px' }} />
            {error && <div style={{ background: '#fee2e2', color: '#991b1b', padding: '10px 14px', borderRadius: '8px', fontSize: '13px', marginBottom: '16px' }}>{error}</div>}
            <button className="hr-btn" onClick={submit} disabled={busy}
              style={{ width: '100%', padding: '12px', background: '#2563eb', color: '#fff', border: 'none', borderRadius: '8px', fontSize: '15px', fontWeight: 600, cursor: 'pointer' }}>
              {busy ? 'Signing in…' : 'Sign In'}
            </button>
          </div>
        </div>
      );
    }

    // ============================================================
    // APPLICATION ENGINE CENTRAL CORE
    // ============================================================
    function HRApp({ user, onLogout }) {
      const [view, setView] = useState('dashboard');
      const [employees, setEmployees] = useState([]);
      const [mobDemob, setMobDemob] = useState([]);
      const [recipients, setRecipients] = useState([]);
      const [thresholds, setThresholds] = useState(DEFAULT_THRESHOLDS);
      const [dashFilter, setDashFilter] = useState('employed_strict');
      const [loading, setLoading] = useState(true);
      const [editingEmp, setEditingEmp] = useState(null);
      const [editingMob, setEditingMob] = useState(null);
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3500); };

      const loadAll = async () => {
        const [e, m, r] = await Promise.all([
          db.from('employees').select('*').order('employee_id'),
          db.from('mob_demob').select('*'),
          db.from('recipients').select('*'),
        ]);
        if (e.data) setEmployees(e.data);
        if (m.data) setMobDemob(m.data);
        if (r.data) setRecipients(r.data);
        setLoading(false);
      };
      useEffect(() => { loadAll(); }, []);

      const dashboardEmployees = useMemo(() => employees.filter(e => {
        if (!e.employee_id) return false;
        if (dashFilter === 'all') return true;
        if (dashFilter === 'employed_broad') return isBroadEmployed(e.status);
        return isStrictEmployed(e.status);
      }), [employees, dashFilter]);

      const alerts = useMemo(() => {
        const out = [];
        dashboardEmployees.forEach(emp => {
          EXPIRY_TYPES.forEach(et => {
            const d = daysUntil(emp[et.col]);
            if (d === null) return;
            const th = thresholds[et.key] || et.defaultDays;
            if (d <= th) out.push({
              employee_id: emp.employee_id, full_name: emp.full_name, email: emp.email,
              mobile: emp.uae_contact || emp.mobile || emp.india_contact, manager_email: emp.manager_email,
              type: et.key, typeLabel: et.label, color: et.color, expiryDate: emp[et.col], daysLeft: d,
              severity: d < 0 ? 'expired' : d <= 7 ? 'critical' : d <= 30 ? 'urgent' : 'warning',
            });
          });
        });
        return out.sort((a, b) => a.daysLeft - b.daysLeft);
      }, [dashboardEmployees, thresholds]);

      const stats = useMemo(() => ({
        total: dashboardEmployees.length,
        totalAll: employees.length,
        expired: alerts.filter(a => a.severity === 'expired').length,
        critical: alerts.filter(a => a.severity === 'critical').length,
        departments: [...new Set(dashboardEmployees.map(e => e.department).filter(Boolean))].length,
        passportCount: alerts.filter(a => a.type === 'passport').length,
        passportExpired: alerts.filter(a => a.type === 'passport' && a.severity === 'expired').length,
        eidCount: alerts.filter(a => a.type === 'eid').length,
        eidExpired: alerts.filter(a => a.type === 'eid' && a.severity === 'expired').length,
        cicpaCount: alerts.filter(a => a.type === 'cicpa').length,
        cicpaExpired: alerts.filter(a => a.type === 'cicpa' && a.severity === 'expired').length,
      }), [dashboardEmployees, employees, alerts]);

      const saveEmployee = async (emp) => {
        const clean = {};
        EMPLOYEE_FIELDS.forEach(f => {
          let v = emp[f.key];
          if (v === '' || v === undefined) v = null;
          if (f.type === 'number' && v != null) v = parseFloat(v) || null;
          clean[f.key] = v;
        });
        if (emp.id) {
          const { error } = await db.from('employees').update(clean).eq('id', emp.id);
          if (error) return showToast(error.message, 'error');
        } else {
          const { error } = await db.from('employees').insert(clean);
          if (error) return showToast(error.message, 'error');
        }
        await loadAll(); setEditingEmp(null); showToast('Employee saved');
      };

      const deleteEmployee = async (id) => {
        if (!window.confirm('Delete this employee?')) return;
        const { error } = await db.from('employees').delete().eq('id', id);
        if (error) return showToast(error.message, 'error');
        await loadAll(); showToast('Employee deleted');
      };

      const saveMob = async (rec) => {
        const clean = { employee_id: rec.employee_id || null, full_name: rec.full_name || null, position: rec.position || null,
          eid_no: rec.eid_no || null, mobilization_date: rec.mobilization_date || null, supply: rec.supply || null,
          location: rec.location || null, remarks: rec.remarks || null };
        if (rec.id) { const { error } = await db.from('mob_demob').update(clean).eq('id', rec.id); if (error) return showToast(error.message, 'error'); }
        else { const { error } = await db.from('mob_demob').insert(clean); if (error) return showToast(error.message, 'error'); }
        await loadAll(); setEditingMob(null); showToast('Record saved');
      };

      const deleteMob = async (id) => {
        if (!window.confirm('Delete this record?')) return;
        await db.from('mob_demob').delete().eq('id', id); await loadAll(); showToast('Record deleted');
      };

      const saveRecipient = async (email) => {
        const { error } = await db.from('recipients').insert({ email, role: 'hr' });
        if (error) return showToast(error.message, 'error');
        await loadAll(); showToast('Recipient added');
      };
      const deleteRecipient = async (id) => { await db.from('recipients').delete().eq('id', id); await loadAll(); };

      const exportExcel = () => {
        const wb = XLSX.utils.book_new();
        const rows = employees.map(e => { const r = {}; EMPLOYEE_FIELDS.forEach(f => r[f.label] = e[f.key] || ''); return r; });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Employees');
        const md = mobDemob.map(r => ({ 'Employee ID': r.employee_id, 'Full Name': r.full_name, Position: r.position, 'EID NO': r.eid_no, 'Mobilization Date': r.mobilization_date, Supply: r.supply, Location: r.location, Remarks: r.remarks }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(md), 'Mob-Demob');
        XLSX.writeFile(wb, `HR_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
        showToast('Exported to Excel');
      };

      const importExcel = async (file) => {
        try {
          const data = await file.arrayBuffer();
          const wb = XLSX.read(data, { cellDates: true });
          const sheetName = wb.SheetNames.find(n => /^employee/i.test(n)) || wb.SheetNames[0];
          const ws = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: false });
          let headerRow = 0;
          for (let i = 0; i < Math.min(5, rows.length); i++) {
            const r = (rows[i] || []).map(c => String(c || '').toLowerCase());
            if (r.some(c => c.includes('employeeid') || c.includes('fullname') || c.includes('full name'))) { headerRow = i; break; }
          }
          const headers = (rows[headerRow] || []).map(h => String(h || '').trim());
          const colMap = {
            'employeeid':'employee_id','fullname':'full_name','visa trade':'visa_trade','department':'department',
            'nationality':'nationality','position':'position','work experience':'work_experience','joining date':'joining_date',
            'basic salary':'basic_salary','allowance':'allowance','status':'status','date of birth':'dob','passport no':'passport_no',
            'passport expiry':'passport_expiry','eid no':'eid_no','eid hardcopy recv date':'eid_hardcopy_recv','emirates id expiry':'eid_expiry',
            'visa expiry':'visa_expiry','reference by':'reference_by','reference contact number':'reference_contact','email':'email',
            'india contact number':'india_contact','uae contact number':'uae_contact','location':'location','passport handover':'passport_handover',
            'mobile':'mobile','manager email':'manager_email','insurance id no':'insurance_id','insurance effective date':'insurance_effective',
            'insurance expiry':'insurance_expiry','cicpa gate pass no':'cicpa_no','cicpa expiry':'cicpa_expiry','cicpa permitted locations':'cicpa_locations',
          };
          const idxToCol = {};
          headers.forEach((h, i) => { const k = colMap[h.toLowerCase().replace(/\s+/g, ' ').trim()]; if (k) idxToCol[i] = k; });
          const dateFields = new Set(EMPLOYEE_FIELDS.filter(f => f.type === 'date').map(f => f.key));
          const numFields = new Set(EMPLOYEE_FIELDS.filter(f => f.type === 'number').map(f => f.key));
          const toUpsert = [];
          for (let i = headerRow + 1; i < rows.length; i++) {
            const row = rows[i] || []; if (!row.some(c => c != null && c !== '')) continue;
            const emp = {};
            row.forEach((val, idx) => {
              const col = idxToCol[idx]; if (!col || val == null || val === '') return;
              if (dateFields.has(col)) emp[col] = fmtDateISO(val) || null;
              else if (numFields.has(col)) emp[col] = parseFloat(val) || null;
              else emp[col] = String(val).trim();
            });
            if (emp.employee_id || emp.full_name) toUpsert.push(emp);
          }
          const withId = toUpsert.filter(e => e.employee_id);
          const withoutId = toUpsert.filter(e => !e.employee_id);
          if (withId.length) { const { error } = await db.from('employees').upsert(withId, { onConflict: 'employee_id' }); if (error) throw error; }
          if (withoutId.length) { const { error } = await db.from('employees').insert(withoutId); if (error) throw error; }
          await loadAll();
          showToast(`Imported ${toUpsert.length} employees`);
        } catch (e) { showToast('Import failed: ' + e.message, 'error'); }
      };

      const filteredEmps = useMemo(() => {
        let r = employees;
        if (search) { const s = search.toLowerCase(); r = r.filter(e => Object.values(e).some(v => String(v || '').toLowerCase().includes(s))); }
        if (statusFilter === 'employed_only') r = r.filter(e => e.employee_id && isStrictEmployed(e.status));
        else if (statusFilter === 'with_id') r = r.filter(e => e.employee_id);
        else if (statusFilter === 'pending') r = r.filter(e => !isStrictEmployed(e.status));
        return r;
      }, [employees, search, statusFilter]);

      if (loading) return <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', flexDirection:'column', gap:'16px' }}><div className="spinner"></div><div style={{ color:'#64748b' }}>Loading data array…</div></div>;

      return (
        <div style={S.app}>
          {/* Layout Navigation Sidebar */}
          <aside style={S.sidebar}>
            <div style={S.logo}>
              <div style={{ fontSize:'24px' }}>🏢</div>
              <div><div style={{ fontSize:'15px', fontWeight:700 }}>HR Compliance</div><div style={{ fontSize:'11px', color:'#94a3b8' }}>SATCO Arabia</div></div>
            </div>
            {[
              { k:'dashboard', l:'Dashboard', i:'📊' },
              { k:'employees', l:'All Employees', i:'👥', badge: employees.length },
              { k:'alerts', l:'Expiry Alerts', i:'🔔', badge: alerts.length, red: alerts.some(a=>a.severity==='expired'||a.severity==='critical') },
              { k:'mobdemob', l:'Mob / Demob', i:'📋', badge: mobDemob.length },
              { k:'reports', l:'Reports & Email', i:'📤' },
              { k:'settings', l:'Settings', i:'⚙️' },
            ].map(item => {
              const active = view === item.k;
              return (
                <div key={item.k} className="hr-nav-item" onClick={() => setView(item.k)}
                  style={{ ...S.navItem, background: active ? '#1e3a5f' : 'transparent', borderLeft: active ? '3px solid #60a5fa' : '3px solid transparent' }}>
                  <span style={{ fontSize:'16px' }}>{item.i}</span>
                  <span style={{ flex:1, color: active ? '#fff' : '#cbd5e1', fontSize:'13.5px' }}>{item.l}</span>
                  {item.badge > 0 && <span style={{ background: item.red ? '#dc2626' : '#334155', color:'#fff', fontSize:'11px', padding:'2px 7px', borderRadius:'10px', fontWeight:600 }}>{item.badge}</span>}
                </div>
              );
            })}
            <div style={{ marginTop:'auto', padding:'14px 16px', borderTop:'1px solid #1e293b' }}>
              <div style={{ fontSize:'11px', color:'#94a3b8', marginBottom:'8px', wordBreak:'break-all' }}>{user.email}</div>
              <button onClick={onLogout} style={{ background:'transparent', border:'1px solid #334155', color:'#cbd5e1', padding:'6px 12px', borderRadius:'6px', fontSize:'12px', cursor:'pointer', width:'100%' }}>Sign Out</button>
            </div>
          </aside>

          {/* Core View Content Wrapper */}
          <main style={S.main}>
            <div style={S.topbar}>
              <div>
                <h1 style={{ margin:0, fontSize:'20px', fontWeight:700 }}>

    function ExpiryChip({ date, th }) {
      if (!date) return <span style={{ color:'#cbd5e1' }}>—</span>;
      const d = daysUntil(date);
      let bg='#f1f5f9', c='#475569';
      if (d < 0) { bg='#fee2e2'; c='#991b1b'; }
      else if (d <= 7) { bg='#ffedd5'; c='#c2410c'; }
      else if (d <= th) { bg='#fef9c3'; c='#854d0e'; }
      return <span style={{ padding:'3px 6px', borderRadius:'4px', background:bg, color:c, fontWeight:500, fontSize:'11.5px', whiteSpace:'nowrap' }}>{d < 0 ? 'EXPIRED' : `${d} days`}</span>;
    }

    // ============ INTELLIGENT SCANNING INTERACTION VIEW ============
    function DocumentsPanel({ employee, setEmployee }) {
      const [ocrLoading, setOcrLoading] = useState(false);
      const [ocrProgress, setOcrProgress] = useState('');
      const [scanResults, setScanResults] = useState(null);

      const handleFileUpload = async (e, docType) => {
        const file = e.target.files[0];
        if (!file) return;

        setOcrLoading(true);
        setScanResults(null);
        setOcrProgress('Initializing OCR engine streams...');

        try {
          const worker = await Tesseract.createWorker('eng');
          setOcrProgress('Running pixel matrix matching...');
          const ret = await worker.recognize(file);
          const text = ret.data.text;
          await worker.terminate();

          const detectedFields = extractDocFields(text, docType);
          setScanResults({
            text: text,
            number: detectedFields.number,
            date: detectedFields.date,
            type: docType
          });

        } catch (err) {
          console.error(err);
          alert('OCR runtime analysis pipeline fault: ' + err.message);
        } finally {
          setOcrLoading(false);
          setOcrProgress('');
        }
      };

      const applyField = (key, value) => {
        setEmployee(prev => ({ ...prev, [key]: value }));
        alert(`Assigned field update: ${value}`);
      };

      return (
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: '20px', padding: '4px' }}>
          <div>
            <h4 style={{ margin:'0 0 12px', color:'#1e3a5f', borderBottom:'2px solid #e2e8f0', paddingBottom:'6px' }}>Identity & Work Credentials</h4>
            
            {[
              { label: 'Passport Registration', valKey: 'passport_no', dateKey: 'passport_expiry', type: 'passport' },
              { label: 'Emirates ID Card (EID)', valKey: 'eid_no', dateKey: 'eid_expiry', type: 'eid' },
              { label: 'Visa Endorsement', valKey: null, dateKey: 'visa_expiry', type: 'visa' }
            ].map((d, idx) => (
              <div key={idx} style={{ background:'#fafbfc', border:'1px solid #e2e8f0', borderRadius:'8px', padding:'12px', marginBottom:'12px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'8px' }}>
                  <span style={{ fontSize:'13px', fontWeight:700, color:'#334155' }}>{d.label}</span>
                  <label className="hr-btn" style={{ ...S.btnSec, fontSize:'11px', padding:'3px 8px', cursor: ocrLoading?'not-allowed':'pointer' }}>
                    📷 Auto-Scan
                    <input type="file" accept="image/*" style={{ display:'none' }} disabled={ocrLoading} onChange={(e) => handleFileUpload(e, d.type)} />
                  </label>
                </div>

                {d.valKey && (
                  <div style={{ marginBottom:'6px' }}>
                    <label style={S.modalLabel}>{d.label} ID</label>

                )}
                <div>
                  <label style={S.modalLabel}>Expiration Limit</label>
                  <input type="date" value={employee[d.dateKey] || ''} onChange={e => setEmployee({ ...employee, [d.dateKey]: e.target.value })} style={S.input} />
                </div>
              </div>
            ))}
          </div>

          {/* Corrected Interactive Native React Scanner Output Window */}
          <div style={{ background:'#f8fafc', border:'1px solid #cbd5e1', borderRadius:'12px', padding:'16px', display:'flex', flexDirection:'column', gap:'12px' }}>
            <h4 style={{ margin:0, color:'#334155' }}>Intelligent OCR Co-Pilot View</h4>
            <p style={{ margin:0, fontSize:'12px', color:'#64748b', lineHeight:1.45 }}>Upload credentials. The processing pipeline isolates noise and matches long-term expiration dates.</p>
            
            {ocrLoading && (
              <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'10px', background:'#fff', border:'2px dashed #cbd5e1', borderRadius:'8px', padding:'20px' }}>
                <div className="spinner"></div>
                <div style={{ fontSize:'12px', color:'#2563eb', fontWeight:600 }}>{ocrProgress}</div>
              </div>
            )}

            {!ocrLoading && !scanResults && (
              <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center' }}>
                <div style={{ border:'2px dashed #cbd5e1', borderRadius:'8px', padding:'30px', color:'#94a3b8', textAlign:'center' }}>
                  <div style={{ fontSize:'28px', marginBottom:'4px' }}>📄</div>
                  <div style={{ fontSize:'12px', fontWeight:500 }}>Scanner Standby Tracker</div>
                </div>
              </div>
            )}

            {!ocrLoading && scanResults && (
              <div style={{ background:'#fff', border:'1px solid #cbd5e1', borderRadius:'8px', padding:'14px', display:'flex', flex('column'), gap:'12px', boxShadow: '0 4px 12px rgba(0,0,0,0.05)' }}>

                    </div>
                </div>

                <details style={{ marginTop:'4px' }}>
                  <summary style={{ fontSize:'11px', color:'#64748b', cursor:'pointer', fontWeight:500 }}>View Raw Text Stream</summary>
                  <pre style={{ background:'#f8fafc', border:'1px solid #e2e8f0', padding:'8px', borderRadius:'6px', fontSize:'10px', maxHeight:'80px', overflowY:'auto', whiteSpace:'pre-wrap', marginTop:'4px', color:'#334155' }}>{scanResults.text}</pre>
                </details>
              </div>
            )}
          </div>
        </div>
      );
    }

    function extractDocFields(text, docType) {
      const out = { number: null, date: null };
      if (!text) return out;
      
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      const foundDates = [];
      
      const dateRegexes = [
        /\b(\d{1,2})[\/\-\s](\d{1,2})[\/\-\s](\d{4})\b/,
        /\b(\d{1,2})[\/\-\s](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[\/\-\s]+(\d{4})\b/i,
        /\b(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/
      ];

      const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
      const today = new Date();
      today.setHours(0,0,0,0);

      for (const line of lines) {
        for (const rx of dateRegexes) {
          const m = line.match(rx);
          if (m) {
            let parsedDate = null;
            if (m[1].length === 4) {
              parsedDate = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
            } else if (isNaN(m[2])) {
              const monthIndex = months[m[2].toLowerCase().slice(0,3)];
              if (monthIndex !== undefined) parsedDate = new Date(parseInt(m[3]), monthIndex, parseInt(m[1]));
            } else {
              parsedDate = new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
            }

            if (parsedDate && !isNaN(parsedDate.getTime())) {
              const lower = line.toLowerCase();
              const hasExpiryHint = ['expir', 'valid until', 'expiry', 'exp'].some(h => lower.includes(h));
              foundDates.push({ dateObj: parsedDate, isExpiryHint: hasExpiryHint });
            }
          }
        }
      }

      if (foundDates.length > 0) {
        const explicitExpiry = foundDates.find(d => d.isExpiryHint && d.dateObj >= today);
        if (explicitExpiry) {
          out.date = fmtDateISO(explicitExpiry.dateObj);
        } else {
          const futureDates = foundDates.filter(d => d.dateObj >= today);
          if (futureDates.length > 0) {
            futureDates.sort((a, b) => b.dateObj - a.dateObj);
            out.date = fmtDateISO(futureDates[0].dateObj);
          } else {
            foundDates.sort((a, b) => b.dateObj - a.dateObj);
            out.date = fmtDateISO(foundDates[0].dateObj);
          }
        }
      }

      if (docType === 'eid') {
        const m = text.match(/\b(784[\s\-]?\d{4}[\s\-]?\d{7}[\s\-]?\d)\b/);
        if (m) out.number = m[1].replace(/\s/g, '-');
      } else if (docType === 'passport') {
        const m = text.match(/\b([A-Z]\d{7,8})\b/) || text.match(/\b([A-Z]{1,2}\d{6,8})\b/);
        if (m) out.number = m[1];
      }
      return out;
    }

    // ============ COMPREHENSIVE EMPLOYEE MODAL ============
    function EmployeeModal({ employee, onSave, onClose }) {
      const [activeTab, setActiveTab] = useState('identity');
      const [state, setState] = useState({ ...employee });

      const tabs = [
        { id:'identity', label:'Identity Details', icon:'🪪' },
        { id:'employment', label:'Work Profile', icon:'💼' },
        { id:'salary', label:'Compensation', icon:'💵' },
        { id:'contact', label:'Contact Links', icon:'📞' },
        { id:'ocr_docs', label:'Document Scanning (OCR)', icon:'📷' }
      ];

      const fields = EMPLOYEE_FIELDS.filter(f => f.group === activeTab);

      return (
        <div style={S.overlay}>
          <div style={S.modal}>
            <div style={{ padding:'16px 20px', borderBottom:'1px solid #e2e8f0', display:'flex', justifyContent:'space-between', alignItems:'center', background:'#1e3a5f', color:'#fff', borderTopLeftRadius:'12px', borderTopRightRadius:'12px' }}>
              <h2 style={{ margin:0, fontSize:'16px', fontWeight:700 }}>{employee.id ? `Modify Profile: ${state.full_name || ''}` : 'Register New Employee Record'}</h2>
              <button onClick={onClose} style={{ background:'transparent', border:'none', color:'#fff', fontSize:'20px', cursor:'pointer' }}>×</button>
            </div>
            
            <div style={{ display:'flex', background:'#f8fafc', borderBottom:'1px solid #e2e8f0', padding:'0 10px' }}>
              {tabs.map(t => (
                <div key={t.id} onClick={()=>setActiveTab(t.id)}
                  style={{ padding:'12px 14px', fontSize:'12.5px', fontWeight:600, cursor:'pointer', borderBottom: activeTab===t.id?'3px solid #2563eb':'3px solid transparent', color: activeTab===t.id?'#2563eb':'#64748b', display:'flex', alignItems:'center', gap:'6px' }}>
                  <span>{t.icon}</span>{t.label}
                </div>
              ))}
            </div>

            <div className="hr-scroll" style={{ padding:'20px', flex:1, overflowY:'auto' }}>
              {activeTab === 'ocr_docs' ? (
                <DocumentsPanel employee={state} setEmployee={setState} />
              ) : (
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px' }}>
                  {fields.map(f => (
                    <div key={f.key} style={{ gridColumn: f.type==='locations'?'span 2':'span 1' }}>
                      <label style={S.modalLabel}>{f.label} {f.required && <span style={{color:'#dc2626'}}>*</span>}</label>
                      {f.type === 'date' ? (
                        <input type="date" value={state[f.key] || ''} onChange={e=>setState({...state, [f.key]:e.target.value})} style={S.input} />
                      ) : f.type === 'number' ? (
                        <input type="number" value={state[f.key] ?? ''} onChange={e=>setState({...state, [f.key]:e.target.value})} style={S.input} />
                      ) : f.type === 'locations' ? (
                        <LocationPicker selected={state[f.key] || ''} onChange={val=>setState({...state, [f.key]:val})} />
                      ) : (
                        <input type="text" value={state[f.key] || ''} onChange={e=>setState({...state, [f.key]:e.target.value})} style={S.input} />
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ padding:'14px 20px', borderTop:'1px solid #e2e8f0', display:'flex', justifyContent:'flex-end', gap:'10px', background:'#f8fafc', borderBottomLeftRadius:'12px', borderBottomRightRadius:'12px' }}>
              <button className="hr-btn" onClick={onClose} style={S.btnSec}>Cancel</button>
              <button className="hr-btn" onClick={()=>onSave(state)} style={S.btnPri}>Save Employee</button>
            </div>
          </div>
        </div>
      );
    }

    function LocationPicker({ selected, onChange }) {
      const currentSet = useMemo(() => new Set(selected.split(',').map(x=>x.trim()).filter(Boolean)), [selected]);
      const toggle = (loc) => {
        if (currentSet.has(loc)) currentSet.delete(loc);
        else currentSet.add(loc);
        onChange([...currentSet].join(', '));
      };
      return (
        <div style={{ display:'flex', gap:'6px', flexWrap:'wrap', marginTop:'4px' }}>
          {CICPA_LOCATIONS.map(l => {
            const has = currentSet.has(l);
            return <span key={l} onClick={()=>toggle(l)} style={{ ...S.chip, background:has?'#eff6ff':'#fff', color:has?'#1d4ed8':'#475569', borderColor:has?'#bfdbfe':'#cbd5e1' }}>{has?'✓ ':''} {l}</span>;
          })}
        </div>
      );
    }

    // ============ MOB / DEMOB LOGISTIC MODAL ============
    function MobDemobModal({ record, employees, onSave, onClose }) {
      const [state, setState] = useState({ ...record });
      const handleEmpSelect = (id) => {
        const matched = employees.find(e => e.employee_id === id);
        if (matched) setState({ ...state, employee_id: id, full_name: matched.full_name, position: matched.position, eid_no: matched.eid_no });
        else setState({ ...state, employee_id: id });
      };

      return (
        <div style={S.overlay}>
          <div style={{ ...S.modal, maxWidth:'480px' }}>
            <div style={{ padding:'14px 18px', borderBottom:'1px solid #e2e8f0', display:'flex', justifyContent:'space-between', alignItems:'center', background:'#1e3a5f', color:'#fff', borderTopLeftRadius:'12px', borderTopRightRadius:'12px' }}>
              <h2 style={{ margin:0, fontSize:'15px', fontWeight:700 }}>{record.id ? 'Edit Mobilization Log' : 'Create New Mobilization Deployment'}</h2>
              <button onClick={onClose} style={{ background:'transparent', border:'none', color:'#fff', fontSize:'20px', cursor:'pointer' }}>×</button>
            </div>
            <div style={{ padding:'18px', display:'flex', flexDirection:'column', gap:'12px' }}>
              <div>
                <label style={S.modalLabel}>Link Employee Profile</label>
                <select value={state.employee_id || ''} onChange={e=>handleEmpSelect(e.target.value)} style={S.input}>
                  <option value="">-- Choose registered ID or type custom below --</option>
                  {employees.filter(e=>e.employee_id).map(e=><option key={e.id} value={e.employee_id}>{e.employee_id} - {e.full_name}</option>)}
                </select>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }}>
                <div><label style={S.modalLabel}>Employee ID</label><input value={state.employee_id || ''} onChange={e=>setState({...state, employee_id:e.target.value})} style={S.input} /></div>
                <div><label style={S.modalLabel}>Full Name</label><input value={state.full_name || ''} onChange={e=>setState({...state, full_name:e.target.value})} style={S.input} /></div>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }}>
                <div><label style={S.modalLabel}>Designation/Position</label><input value={state.position || ''} onChange={e=>setState({...state, position:e.target.value})} style={S.input} /></div>
                <div><label style={S.modalLabel}>Emirates ID (EID)</label><input value={state.eid_no || ''} onChange={e=>setState({...state, eid_no:e.target.value})} style={S.input} /></div>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }}>
                <div><label style={S.modalLabel}>Mobilization Date</label><input type="date" value={state.mobilization_date || ''} onChange={e=>setState({...state, mobilization_date:e.target.value})} style={S.input} /></div>
                <div><label style={S.modalLabel}>Supply Class</label><select value={state.supply || ''} onChange={e=>setState({...state, supply:e.target.value})} style={S.input}><option value="">Select class</option><option value="SATCO Supply">SATCO Supply</option><option value="Outsource">Outsource</option></select></div>
              </div>
              <div>
                <label style={S.modalLabel}>Target Field Location</label>
                <select value={state.location || ''} onChange={e=>setState({...state, location:e.target.value})} style={S.input}>
                  <option value="">Select ADNOC Site / Location</option>
                  {CICPA_LOCATIONS.map(l=><option key={l} value={l}>{l}</option>)}
                </select>
              </div>
              <div><label style={S.modalLabel}>Remarks & Shift Logistics</label><textarea value={state.remarks || ''} onChange={e=>setState({...state, remarks:e.target.value})} style={{ ...S.input, height:'60px', resize:'none' }} /></div>
            </div>
            <div style={{ padding:'12px 18px', borderTop:'1px solid #e2e8f0', display:'flex', justifyContent:'flex-end', gap:'8px', background:'#f8fafc', borderBottomLeftRadius:'12px', borderBottomRightRadius:'12px' }}>
              <button className="hr-btn" onClick={onClose} style={S.btnSec}>Cancel</button>
              <button className="hr-btn" onClick={()=>onSave(state)} style={S.btnPri}>Save Record</button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // STYLES STACK DEFINITION
    // ============================================================
    const S = {
      app: { display: 'flex', minHeight: '100vh', background: '#f1f5f9' },
      sidebar: { width: '250px', background: '#0f172a', display: 'flex', flexDirection: 'column', color: '#cbd5e1', borderRight: '1px solid #1e293b' },
      logo: { padding: '20px 16px', borderBottom: '1px solid #1e293b', display: 'flex', alignItems: 'center', gap: '10px' },
      navItem: { display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 16px', cursor: 'pointer', userSelect: 'none' },
      main: { flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 },
      topbar: { background: '#fff', padding: '16px 24px', borderBottom: '1px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
      content: { padding: '24px', flex: 1, overflowY: 'auto', maxWidth: '1440px', width: '100%', margin: '0 auto' },
      input: { background: '#fff', border: '1px solid #cbd5e1', borderRadius: '6px', padding: '8px 12px', fontSize: '13px', color: '#0f172a', width: '100%', outline: 'none' },
      btnPri: { background: '#2563eb', color: '#fff', border: 'none', padding: '8px 16px', borderRadius: '6px', fontSize: '13px', fontWeight: 600, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' },
      btnSec: { background: '#fff', color: '#475569', border: '1px solid #cbd5e1', padding: '8px 14px', borderRadius: '6px', fontSize: '13px', fontWeight: 600, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' },
      th: { padding: '10px 14px', textAlign: 'left', fontSize: '11.5px', fontWeight: 600, color: '#64748b', textTransform: 'uppercase', borderBottom: '1px solid #e2e8f0' },
      td: { padding: '12px 14px', color: '#475569', borderBottom: '1px solid #f1f5f9', verticalAlign: 'middle' },
      link: { background: 'transparent', border: 'none', color: '#2563eb', fontSize: '12.5px', fontWeight: 600, cursor: 'pointer', padding: 0 },
      modalLabel: { fontSize: '11.5px', fontWeight: 600, color: '#475569', display: 'block', marginBottom: '4px' },
      chip: { border: '1px solid #cbd5e1', padding: '6px 11px', borderRadius: '16px', fontSize: '11.5px', fontWeight: 600, cursor: 'pointer' },
      overlay: { position: 'fixed', inset: 0, background: 'rgba(15,23,42,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100, animation: 'fadeIn 0.15s' },
      modal: { background: '#fff', borderRadius: '12px', width: '90%', maxWidth: '780px', maxHeight: '88vh', display: 'flex', flexDirection: 'column', boxShadow: '0 25px 50px rgba(0,0,0,0.25)' },
    };

    function Root() {
      const [user, setUser] = useState(null);
      const [checking, setChecking] = useState(true);
      useEffect(() => {
        db.auth.getSession().then(({ data }) => { setUser(data.session?.user || null); setChecking(false); });
        const { data: sub } = db.auth.onAuthStateChange((_e, session) => setUser(session?.user || null));
        return () => sub.subscription.unsubscribe();
      }, []);
      const logout = async () => { await db.auth.signOut(); setUser(null); };
      if (checking) return <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh' }}><div className="spinner"></div></div>;

      return user ? <HRApp user={user} onLogout={logout} /> : <Login onLogin={setUser} />;
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<Root />);
  </script>
</body>
