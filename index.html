    // Flat list for quick lookup
    const ALL_STANDARD_TRAININGS = TRAINING_CATEGORIES.flatMap(c => c.trainings.map(t => ({ ...t, categoryId: c.id, categoryLabel: c.label })));

    const isStrictEmployed = (s) => {
      if (!s) return false;
      const l = String(s).toLowerCase().trim();
      return l === 'employee' || l === 'employed';
    };
    const isBroadEmployed = (s) => {
      if (!s) return false;
      const l = String(s).toLowerCase().trim();
      return ['employee','employed','work permit','workpermit','employment visa issued'].some(x => l === x || l.includes(x));
    };

    // ============ DATE HELPERS ============
    const parseDate = (v) => {
      if (!v) return null;
      if (v instanceof Date) return v;
      if (typeof v === 'number') { const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000); return isNaN(d) ? null : d; }
      const s = String(v).trim();
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (dmy) { const d = new Date(parseInt(dmy[3]), parseInt(dmy[2]) - 1, parseInt(dmy[1])); return isNaN(d) ? null : d; }
      const d = new Date(s); return isNaN(d) ? null : d;
    };
    const fmtDateISO = (v) => { const d = parseDate(v); return d ? d.toISOString().slice(0, 10) : ''; };
    const fmtDateDisplay = (v) => { const d = parseDate(v); return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; };
    const daysUntil = (v) => {
      const d = parseDate(v); if (!d) return null;
      const t = new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0);
      return Math.round((d - t) / 86400000);
    };

    // ============================================================
    // LOGIN SCREEN
    // ============================================================
    function Login({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const submit = async () => {
        setError(''); setBusy(true);
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        setBusy(false);
        if (error) { setError(error.message); return; }
        onLogin(data.user);
      };

      return (

    // ============================================================
    // MAIN APP
    // ============================================================
    function HRApp({ user, onLogout }) {
      const [view, setView] = useState('dashboard');
      const [employees, setEmployees] = useState([]);
      const [mobDemob, setMobDemob] = useState([]);
      const [recipients, setRecipients] = useState([]);
      const [contacts, setContacts] = useState([]);
      const [trainings, setTrainings] = useState([]);
      const [editingContact, setEditingContact] = useState(null);
      const [thresholds, setThresholds] = useState(DEFAULT_THRESHOLDS);
      const [dashFilter, setDashFilter] = useState('employed_strict');
      const [loading, setLoading] = useState(true);
      const [editingEmp, setEditingEmp] = useState(null);
      const [editingMob, setEditingMob] = useState(null);
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3500); };

      // Ensure storage bucket exists (runs once on mount)
      useEffect(() => {
        db.storage.createBucket('employee-documents', { public: true }).catch(() => {}); // silently ignore if already exists
      }, []);

      const loadAll = async () => {
        const [e, m, r, c, tr] = await Promise.all([
          db.from('employees').select('*').order('employee_id'),
          db.from('mob_demob').select('*').order('employee_id'),
          db.from('recipients').select('*'),
          db.from('employee_contacts').select('*').order('employee_number'),
          db.from('employee_trainings').select('*').order('employee_id'),
        ]);
        if (e.data) setEmployees(e.data);
        if (m.data) setMobDemob(m.data);
        if (r.data) setRecipients(r.data);
        if (c.data) setContacts(c.data);
        if (tr.data) setTrainings(tr.data);
        setLoading(false);
      };
      useEffect(() => { loadAll(); }, []);

      const dashboardEmployees = useMemo(() => employees.filter(e => {
        if (!e.employee_id) return false;
        if (dashFilter === 'all') return true;
        if (dashFilter === 'employed_broad') return isBroadEmployed(e.status);
        return isStrictEmployed(e.status);
      }), [employees, dashFilter]);

      const alerts = useMemo(() => {
        const out = [];
        dashboardEmployees.forEach(emp => {
          EXPIRY_TYPES.forEach(et => {
            const d = daysUntil(emp[et.col]);
            if (d === null) return;
            const th = thresholds[et.key] || et.defaultDays;
            if (d <= th) out.push({
              employee_id: emp.employee_id, full_name: emp.full_name, email: emp.email,
              mobile: emp.uae_contact || emp.mobile || emp.india_contact, manager_email: emp.manager_email,
              type: et.key, typeLabel: et.label, color: et.color, expiryDate: emp[et.col], daysLeft: d,
              severity: d < 0 ? 'expired' : d <= 7 ? 'critical' : d <= 30 ? 'urgent' : 'warning',
            });
          });
        });
        // Training certificate expiry alerts (30 days threshold)
        const TRAINING_CERT_THRESHOLD = thresholds.training_cert || 30;
        trainings.forEach(tr => {
          const emp = dashboardEmployees.find(e => e.employee_id === tr.employee_id);
          if (!emp) return; // only alert for active employees
          let parsed = {};
          try { parsed = JSON.parse(tr.training_records || '{}'); } catch {}
          // Standard trainings
          ALL_STANDARD_TRAININGS.forEach(t => {
            const rec = parsed[t.id];
            if (!rec?.expiry) return;
            const d = daysUntil(rec.expiry);
            if (d === null || d > TRAINING_CERT_THRESHOLD) return;
            out.push({
              employee_id: tr.employee_id, full_name: tr.full_name, email: emp.email,
              mobile: emp.uae_contact || emp.mobile || emp.india_contact,
              type: 'training_cert',
              typeLabel: rec.courseName || t.label,
              issuingCompany: rec.issuingCompany || '',
              certNo: rec.certNo || '',
              color: '#0f766e',
              expiryDate: rec.expiry, daysLeft: d,
              severity: d < 0 ? 'expired' : d <= 7 ? 'critical' : d <= 30 ? 'urgent' : 'warning',
            });
          });
          // Other / custom trainings
          (parsed.__other || []).forEach(ot => {
            if (!ot.expiry) return;
            const d = daysUntil(ot.expiry);
            if (d === null || d > TRAINING_CERT_THRESHOLD) return;
            out.push({
              employee_id: tr.employee_id, full_name: tr.full_name, email: emp.email,
              mobile: emp.uae_contact || emp.mobile || emp.india_contact,
              type: 'training_cert',
              typeLabel: ot.label,
              issuingCompany: ot.issuingCompany || '',
              certNo: ot.certNo || '',
              color: '#0f766e',
              expiryDate: ot.expiry, daysLeft: d,
              severity: d < 0 ? 'expired' : d <= 7 ? 'critical' : d <= 30 ? 'urgent' : 'warning',
            });
          });
        });
        return out.sort((a, b) => a.daysLeft - b.daysLeft);
      }, [dashboardEmployees, thresholds, trainings]);

      const stats = useMemo(() => ({
        total: dashboardEmployees.length,
        totalAll: employees.length,
        expired: alerts.filter(a => a.severity === 'expired').length,
        critical: alerts.filter(a => a.severity === 'critical').length,
        departments: [...new Set(dashboardEmployees.map(e => e.department).filter(Boolean))].length,
        passportCount: alerts.filter(a => a.type === 'passport').length,
        passportExpired: alerts.filter(a => a.type === 'passport' && a.severity === 'expired').length,
        eidCount: alerts.filter(a => a.type === 'eid').length,
        eidExpired: alerts.filter(a => a.type === 'eid' && a.severity === 'expired').length,
        cicpaCount: alerts.filter(a => a.type === 'cicpa').length,
        cicpaExpired: alerts.filter(a => a.type === 'cicpa' && a.severity === 'expired').length,
        trainingCertCount: alerts.filter(a => a.type === 'training_cert').length,
        trainingCertExpired: alerts.filter(a => a.type === 'training_cert' && a.severity === 'expired').length,
      }), [dashboardEmployees, employees, alerts]);

      // ===== CRUD =====
      const saveEmployee = async (emp) => {
        const clean = {};
        EMPLOYEE_FIELDS.forEach(f => {
          let v = emp[f.key];
          if (v === '' || v === undefined) v = null;
          if (f.type === 'number' && v != null) v = parseFloat(v) || null;
          clean[f.key] = v;
        });
        if (emp.id) {
          const { error } = await db.from('employees').update(clean).eq('id', emp.id);
          if (error) return showToast(error.message, 'error');
        } else {
          const { error } = await db.from('employees').insert(clean);
          if (error) return showToast(error.message, 'error');
        }

        // Auto-sync: push Emp ID + Name into Contact Directory, Mob/Demob, and Trainings
        if (clean.employee_id && clean.full_name) {
          const { data: existingArr } = await db.from('employee_contacts')
            .select('id')
            .eq('employee_number', clean.employee_id)
            .limit(1);
          if (existingArr && existingArr.length > 0) {
            await db.from('employee_contacts')
              .update({ full_name: clean.full_name })
              .eq('employee_number', clean.employee_id);
          } else {
            await db.from('employee_contacts').insert({
              employee_number: clean.employee_id,
              full_name: clean.full_name,
            });
          }
          await db.from('mob_demob')
            .update({ full_name: clean.full_name })
            .eq('employee_id', clean.employee_id);
          // Sync to trainings table — create row if not exists
          const { data: trExist } = await db.from('employee_trainings')
            .select('id').eq('employee_id', clean.employee_id).limit(1);
          if (!trExist || trExist.length === 0) {
            await db.from('employee_trainings').insert({
              employee_id: clean.employee_id,
              full_name: clean.full_name,
              position: clean.position || null,
              cicpa_locations: clean.cicpa_locations || null,
            });
          } else {
            await db.from('employee_trainings').update({
              full_name: clean.full_name,
              position: clean.position || null,
              cicpa_locations: clean.cicpa_locations || null,
            }).eq('employee_id', clean.employee_id);
          }
        }

        await loadAll(); setEditingEmp(null); showToast('Employee saved — all tabs synced');
      };
      const deleteEmployee = async (id) => {
        if (!window.confirm('Delete this employee?')) return;
        const { error } = await db.from('employees').delete().eq('id', id);
        if (error) return showToast(error.message, 'error');
        await loadAll(); showToast('Employee deleted');
      };
      const saveMob = async (rec) => {
        const clean = { employee_id: rec.employee_id || null, full_name: rec.full_name || null, position: rec.position || null,
          eid_no: rec.eid_no || null, mobilization_date: rec.mobilization_date || null, supply: rec.supply || null,
          location: rec.location || null, remarks: rec.remarks || null };
        if (rec.id) { const { error } = await db.from('mob_demob').update(clean).eq('id', rec.id); if (error) return showToast(error.message, 'error'); }
        else { const { error } = await db.from('mob_demob').insert(clean); if (error) return showToast(error.message, 'error'); }
        await loadAll(); setEditingMob(null); showToast('Record saved');
      };
      const deleteMob = async (id) => {
        if (!window.confirm('Delete this record?')) return;
        await db.from('mob_demob').delete().eq('id', id); await loadAll(); showToast('Record deleted');
      };
      const saveRecipient = async (email) => {
        const { error } = await db.from('recipients').insert({ email, role: 'hr' });
        if (error) return showToast(error.message, 'error');
        await loadAll(); showToast('Recipient added');
      };
      const saveContact = async (rec) => {
        const clean = {
          employee_number: rec.employee_number || null,
          full_name: rec.full_name || null,
          mobile_uae: rec.mobile_uae || null,
          mobile_home: rec.mobile_home || null,
          email: rec.email || null,
          whatsapp: rec.whatsapp || null,
          home_address: rec.home_address || null,
          uae_address: rec.uae_address || null,
          emergency_name: rec.emergency_name || null,
          emergency_relation: rec.emergency_relation || null,
          emergency_country: rec.emergency_country || null,
          emergency_mobile: rec.emergency_mobile || null,
          notes: rec.notes || null,
        };
        if (rec.id) {
          const { error } = await db.from('employee_contacts').update(clean).eq('id', rec.id);
          if (error) return showToast(error.message, 'error');
        } else {
          const { error } = await db.from('employee_contacts').insert(clean);
          if (error) return showToast(error.message, 'error');
        }
        await loadAll(); setEditingContact(null); showToast('Contact saved');
      };
      const deleteContact = async (id) => {
        if (!window.confirm('Delete this contact record?')) return;
        await db.from('employee_contacts').delete().eq('id', id);
        await loadAll(); showToast('Contact deleted');
      };

      const syncAllContacts = async () => {
        if (!employees.length) return showToast('No employees found to sync', 'error');
        showToast('Syncing contacts...');
        // Fetch current state
        const { data: existingRows, error: fetchErr } = await db.from('employee_contacts').select('employee_number, id');
        if (fetchErr) return showToast('Fetch error: ' + fetchErr.message, 'error');
        const existingMap = {};
        (existingRows || []).forEach(r => { existingMap[r.employee_number] = r.id; });
        let created = 0, updated = 0, errors = 0;
        for (const emp of employees) {
          if (!emp.employee_id || !emp.full_name) continue;
          if (existingMap[emp.employee_id]) {
            // Update name only — don't overwrite phone/address fields
            const { error } = await db.from('employee_contacts')
              .update({ full_name: emp.full_name })
              .eq('id', existingMap[emp.employee_id]);
            if (error) errors++; else updated++;
          } else {
            const { error } = await db.from('employee_contacts')
              .insert({ employee_number: emp.employee_id, full_name: emp.full_name });
            if (error) errors++; else created++;
          }
        }
        await loadAll();
        if (errors > 0) showToast(errors + ' errors — check DB Setup SQL in Settings', 'error');
        else showToast('Contact Directory: ' + created + ' added, ' + updated + ' updated');
      };

      const syncAllMobDemob = async () => {
        if (!employees.length) return showToast('No employees found to sync', 'error');
        showToast('Syncing Mob/Demob...');
        // Fetch current state
        const { data: existingRows, error: fetchErr } = await db.from('mob_demob').select('employee_id, id');
        if (fetchErr) return showToast('Fetch error: ' + fetchErr.message, 'error');
        const existingMap = {};
        (existingRows || []).forEach(r => { existingMap[r.employee_id] = r.id; });
        let created = 0, updated = 0, errors = 0;
        for (const emp of employees) {
          if (!emp.employee_id || !emp.full_name) continue;
          if (existingMap[emp.employee_id]) {
            // Update name only
            const { error } = await db.from('mob_demob')
              .update({ full_name: emp.full_name })
              .eq('id', existingMap[emp.employee_id]);
            if (error) errors++; else updated++;
          } else {
            const { error } = await db.from('mob_demob')
              .insert({ employee_id: emp.employee_id, full_name: emp.full_name, position: emp.position || null, eid_no: emp.eid_no || null });
            if (error) errors++; else created++;
          }
        }
        await loadAll();
        if (errors > 0) showToast(errors + ' errors occurred during sync', 'error');
        else showToast('Mob/Demob: ' + created + ' added, ' + updated + ' updated');
      };

      const saveTraining = async (rec) => {
        const clean = {
          employee_id: rec.employee_id || null,
          full_name: rec.full_name || null,
          position: rec.position || null,
          cicpa_locations: rec.cicpa_locations || null,
          training_records: rec.training_records || null,
          notes: rec.notes || null,
        };
        if (rec.id) {
          const { error } = await db.from('employee_trainings').update(clean).eq('id', rec.id);
          if (error) return showToast(error.message, 'error');
        } else {
          const { error } = await db.from('employee_trainings').insert(clean);
          if (error) return showToast(error.message, 'error');
        }
        await loadAll(); showToast('Training record saved');
      };

      const syncAllTrainings = async () => {
        if (!employees.length) return showToast('No employees found to sync', 'error');
        showToast('Syncing Training records...');
        const { data: existingRows, error: fetchErr } = await db.from('employee_trainings').select('employee_id, id, full_name, position, cicpa_locations');
        if (fetchErr) return showToast('Fetch error: ' + fetchErr.message, 'error');
        const existingMap = {};
        (existingRows || []).forEach(r => { existingMap[r.employee_id] = r; });
        let created = 0, updated = 0, errors = 0;
        for (const emp of employees) {
          if (!emp.employee_id || !emp.full_name) continue;
          if (existingMap[emp.employee_id]) {
            const { error } = await db.from('employee_trainings')
              .update({ full_name: emp.full_name, position: emp.position || null, cicpa_locations: emp.cicpa_locations || null })
              .eq('id', existingMap[emp.employee_id].id);
            if (error) errors++; else updated++;
          } else {
            const { error } = await db.from('employee_trainings')
              .insert({ employee_id: emp.employee_id, full_name: emp.full_name, position: emp.position || null, cicpa_locations: emp.cicpa_locations || null });
            if (error) errors++; else created++;
          }
        }
        await loadAll();
        if (errors > 0) showToast(errors + ' errors occurred during sync', 'error');
        else showToast('Training: ' + created + ' added, ' + updated + ' updated');
      };

      const deleteRecipient = async (id) => { await db.from('recipients').delete().eq('id', id); await loadAll(); };

      // ===== Excel export =====
      const exportExcel = () => {
        const wb = XLSX.utils.book_new();
        const rows = employees.map(e => { const r = {}; EMPLOYEE_FIELDS.forEach(f => r[f.label] = e[f.key] || ''); return r; });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Employees');
        const md = mobDemob.map(r => ({ 'Employee ID': r.employee_id, 'Full Name': r.full_name, Position: r.position, 'EID NO': r.eid_no, 'Mobilization Date': r.mobilization_date, Supply: r.supply, Location: r.location, Remarks: r.remarks }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(md), 'Mob-Demob');
        XLSX.writeFile(wb, `HR_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
        showToast('Exported to Excel');
      };

      // ===== Excel import =====
      const importExcel = async (file) => {
        try {
          const data = await file.arrayBuffer();
          const wb = XLSX.read(data, { cellDates: true });
          const sheetName = wb.SheetNames.find(n => /^employee/i.test(n)) || wb.SheetNames[0];
          const ws = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: false });
          let headerRow = 0;
          for (let i = 0; i < Math.min(5, rows.length); i++) {
            const r = (rows[i] || []).map(c => String(c || '').toLowerCase());
            if (r.some(c => c.includes('employeeid') || c.includes('fullname') || c.includes('full name'))) { headerRow = i; break; }
          }
          const headers = (rows[headerRow] || []).map(h => String(h || '').trim());
          const colMap = {
            'employeeid':'employee_id','fullname':'full_name','visa trade':'visa_trade','department':'department',
            'nationality':'nationality','position':'position','work experiance':'work_experience','work experience':'work_experience',
            'joining date':'joining_date','basic salary':'basic_salary','allowance':'allowance','status':'status',
            'date of birth':'dob','passport no':'passport_no','passportexpiry':'passport_expiry','passport expiry':'passport_expiry',
            'eid no':'eid_no','eidhardcopyrecv date':'eid_hardcopy_recv','emiratesidexpiry':'eid_expiry','emirates id expiry':'eid_expiry',
            'visaexpiry':'visa_expiry','visa expiry':'visa_expiry','reference by':'reference_by','reference contact number':'reference_contact',
            'email':'email','india contact number':'india_contact','uae contact number':'uae_contact','location':'location',
            'passport handover':'passport_handover','mobile':'mobile','manageremail':'manager_email','manager email':'manager_email',
            'insurance id no':'insurance_id','insurance efective date':'insurance_effective','insurance effective date':'insurance_effective',
            'insuranceexpiry':'insurance_expiry','insurance expiry':'insurance_expiry',
            'cicpa':'cicpa_no','cicpa no':'cicpa_no','cicpa number':'cicpa_no','cicpa gate pass':'cicpa_no','cicpa gate pass no':'cicpa_no','gate pass no':'cicpa_no','gate pass':'cicpa_no',
            'cicpaexpiry':'cicpa_expiry','cicpa expiry':'cicpa_expiry','cicpa expiry date':'cicpa_expiry','gate pass expiry':'cicpa_expiry',
            'cicpa locations':'cicpa_locations','cicpa permitted locations':'cicpa_locations','permitted locations':'cicpa_locations','gate pass locations':'cicpa_locations','locations':'cicpa_locations',
          };
          const idxToCol = {};
          headers.forEach((h, i) => { const k = colMap[h.toLowerCase().replace(/\s+/g, ' ').trim()]; if (k) idxToCol[i] = k; });
          const dateFields = new Set(EMPLOYEE_FIELDS.filter(f => f.type === 'date').map(f => f.key));
          const numFields = new Set(EMPLOYEE_FIELDS.filter(f => f.type === 'number').map(f => f.key));
          const toUpsert = [];
          for (let i = headerRow + 1; i < rows.length; i++) {
            const row = rows[i] || []; if (!row.some(c => c != null && c !== '')) continue;
            const emp = {};
            row.forEach((val, idx) => {
              const col = idxToCol[idx]; if (!col || val == null || val === '') return;
              if (dateFields.has(col)) emp[col] = fmtDateISO(val) || null;
              else if (numFields.has(col)) emp[col] = parseFloat(val) || null;
              else emp[col] = String(val).trim();
            });
            if (emp.employee_id || emp.full_name) toUpsert.push(emp);
          }
          // Upsert by employee_id
          const withId = toUpsert.filter(e => e.employee_id);
          const withoutId = toUpsert.filter(e => !e.employee_id);
          if (withId.length) { const { error } = await db.from('employees').upsert(withId, { onConflict: 'employee_id' }); if (error) throw error; }
          if (withoutId.length) { const { error } = await db.from('employees').insert(withoutId); if (error) throw error; }
          await loadAll();
          showToast(`Imported ${toUpsert.length} employees`);
        } catch (e) { showToast('Import failed: ' + e.message, 'error'); }
      };

      const filteredEmps = useMemo(() => {
        let r = employees;
        if (search) { const s = search.toLowerCase(); r = r.filter(e => Object.values(e).some(v => String(v || '').toLowerCase().includes(s))); }
        if (statusFilter === 'employed_only') r = r.filter(e => e.employee_id && isStrictEmployed(e.status));
        else if (statusFilter === 'with_id') r = r.filter(e => e.employee_id);
        else if (statusFilter === 'pending') r = r.filter(e => !isStrictEmployed(e.status));
        return r;
      }, [employees, search, statusFilter]);

      if (loading) return <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', flexDirection:'column', gap:'16px' }}><div className="spinner"></div><div style={{ color:'#64748b' }}>Loading your HR data…</div></div>;

      return (
        <div style={S.app}>
          {/* Sidebar */}
          <aside style={S.sidebar}>
            <div style={S.logo}>
              <div style={{ fontSize:'24px' }}>🏢</div>
              <div><div style={{ fontSize:'15px', fontWeight:700 }}>HR Compliance</div><div style={{ fontSize:'11px', color:'#94a3b8' }}>SATCO Arabia</div></div>
            </div>
            {[
              { k:'dashboard', l:'Dashboard', i:'📊' },
              { k:'employees', l:'All Employees', i:'👥', badge: employees.length },
              { k:'alerts', l:'Expiry Alerts', i:'🔔', badge: alerts.length, red: alerts.some(a=>a.severity==='expired'||a.severity==='critical') },
              { k:'contacts', l:'Contact Directory', i:'📞', badge: contacts.length },
              { k:'mobdemob', l:'Mob / Demob', i:'📋', badge: mobDemob.length },
              { k:'training', l:'Training', i:'🎓', badge: trainings.length },
              { k:'reports', l:'Reports & Email', i:'📤' },
              { k:'settings', l:'Settings', i:'⚙️' },
            ].map(item => {
              const active = view === item.k;
              return (
                <div key={item.k} className="hr-nav-item" onClick={() => setView(item.k)}
                  style={{ ...S.navItem, background: active ? '#1e3a5f' : 'transparent', borderLeft: active ? '3px solid #60a5fa' : '3px solid transparent' }}>
                  <span style={{ fontSize:'16px' }}>{item.i}</span>
                  <span style={{ flex:1, color: active ? '#fff' : '#cbd5e1', fontSize:'13.5px' }}>{item.l}</span>
                  {item.badge > 0 && <span style={{ background: item.red ? '#dc2626' : '#334155', color:'#fff', fontSize:'11px', padding:'2px 7px', borderRadius:'10px', fontWeight:600 }}>{item.badge}</span>}
                </div>
              );
            })}
            <div style={{ marginTop:'auto', padding:'14px 16px', borderTop:'1px solid #1e293b' }}>
              <div style={{ fontSize:'11px', color:'#94a3b8', marginBottom:'8px', wordBreak:'break-all' }}>{user.email}</div>
              <button onClick={onLogout} style={{ background:'transparent', border:'1px solid #334155', color:'#cbd5e1', padding:'6px 12px', borderRadius:'6px', fontSize:'12px', cursor:'pointer', width:'100%' }}>Sign Out</button>
            </div>
          </aside>

          {/* Main */}
          <main style={S.main}>
            <div style={S.topbar}>
              <div>
                <h1 style={{ margin:0, fontSize:'20px', fontWeight:700 }}>
                  {{ dashboard:'Dashboard', employees:'Employee Directory', alerts:'Expiry Alerts', contacts:'Contact Directory', mobdemob:'Mobilization / Demobilization', training:'Training', reports:'Reports & Email', settings:'Settings' }[view]}
                </h1>
                <div style={{ fontSize:'12px', color:'#64748b', marginTop:'3px' }}>{new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</div>
              </div>
              <div style={{ display:'flex', gap:'10px' }}>
                <label className="hr-btn" style={{ ...S.btnSec, cursor:'pointer' }}>⬆ Import Excel
                  <input type="file" accept=".xlsx,.xls" style={{ display:'none' }} onChange={e => e.target.files[0] && importExcel(e.target.files[0])} /></label>
                <button className="hr-btn" style={S.btnSec} onClick={exportExcel}>⬇ Export Excel</button>
              </div>
            </div>

            <div style={S.content}>
              {view === 'dashboard' && <Dashboard stats={stats} dashboardEmployees={dashboardEmployees} allEmployees={employees} alerts={alerts} thresholds={thresholds} dashFilter={dashFilter} setDashFilter={setDashFilter} onJump={setView} />}
              {view === 'employees' && <EmployeeList employees={filteredEmps} total={employees.length} search={search} setSearch={setSearch} statusFilter={statusFilter} setStatusFilter={setStatusFilter} thresholds={thresholds} onEdit={setEditingEmp} onDelete={deleteEmployee} onAdd={() => setEditingEmp({})} />}
              {view === 'alerts' && <AlertsView alerts={alerts} thresholds={thresholds} dashboardEmployees={dashboardEmployees} />}
              {view === 'contacts' && <ContactsView contacts={contacts} employees={employees} onAdd={() => setEditingContact({})} onEdit={setEditingContact} onDelete={deleteContact} onSyncAll={syncAllContacts} />}
              {view === 'mobdemob' && <MobDemobView records={mobDemob} employees={employees} onAdd={() => setEditingMob({})} onEdit={setEditingMob} onDelete={deleteMob} onSyncAll={syncAllMobDemob} />}
              {view === 'training' && <TrainingView records={trainings} employees={employees} onSave={saveTraining} onSyncAll={syncAllTrainings} showToast={showToast} loadAll={loadAll} />}
              {view === 'reports' && <ReportsView alerts={alerts} dashboardEmployees={dashboardEmployees} recipients={recipients} />}
              {view === 'settings' && <SettingsView thresholds={thresholds} setThresholds={setThresholds} recipients={recipients} onAddRecipient={saveRecipient} onDeleteRecipient={deleteRecipient} employeeCount={employees.length} />}
            </div>
          </main>

          {editingEmp && <EmployeeModal employee={editingEmp} onSave={saveEmployee} onClose={() => setEditingEmp(null)} />}
          {editingMob && <MobDemobModal record={editingMob} employees={employees} onSave={saveMob} onClose={() => setEditingMob(null)} />}
          {editingContact && <ContactModal record={editingContact} employees={employees} onSave={saveContact} onClose={() => setEditingContact(null)} />}
          {toast && <div style={{ position:'fixed', bottom:'24px', right:'24px', background: toast.type==='error' ? '#dc2626' : '#0f172a', color:'#fff', padding:'12px 20px', borderRadius:'8px', boxShadow:'0 8px 24px rgba(0,0,0,0.25)', animation:'slideIn 0.2s', fontSize:'13px', zIndex:200 }}>{toast.type==='error' ? '⚠ ' : '✓ '}{toast.msg}</div>}
        </div>
      );
    }

    // ============ DASHBOARD ============
    function Dashboard({ stats, dashboardEmployees, allEmployees, alerts, thresholds, dashFilter, setDashFilter, onJump }) {
      const deptCounts = useMemo(() => { const m={}; dashboardEmployees.forEach(e=>{const d=e.department||'Unassigned'; m[d]=(m[d]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8); }, [dashboardEmployees]);
      const natCounts = useMemo(() => { const m={}; dashboardEmployees.forEach(e=>{const d=e.nationality||'Unknown'; m[d]=(m[d]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6); }, [dashboardEmployees]);
      const expiryByType = useMemo(() => { const m={}; EXPIRY_TYPES.forEach(t=>m[t.key]={...t,count:0,expired:0,critical:0}); alerts.forEach(a=>{m[a.type].count++; if(a.severity==='expired')m[a.type].expired++; if(a.severity==='critical')m[a.type].critical++;}); return Object.values(m); }, [alerts]);

      if (allEmployees.length === 0) return <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'60px', textAlign:'center' }}><div style={{fontSize:'40px',marginBottom:'12px'}}>👥</div><h2 style={{margin:'0 0 8px'}}>No employees yet</h2><p style={{color:'#64748b'}}>Click <strong>Import Excel</strong> top-right to load your data.</p></div>;

      return (
        <div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px 18px', marginBottom:'16px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'16px', flexWrap:'wrap' }}>
            <div style={{ fontSize:'13px', color:'#475569' }}>👁 Showing <strong>{dashboardEmployees.length}</strong> of <strong>{allEmployees.length}</strong> employees {dashFilter==='employed_strict' && <span style={{color:'#94a3b8'}}>(Employed only)</span>}</div>
            <div style={{ display:'flex', gap:'6px' }}>
              {[['employed_strict','Employed only'],['employed_broad','Active workforce'],['all','Show all']].map(([k,l])=>(
                <button key={k} onClick={()=>setDashFilter(k)} style={{ background: dashFilter===k?'#2563eb':'#f1f5f9', color: dashFilter===k?'#fff':'#475569', border:'none', padding:'6px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap:'10px', marginBottom:'20px' }}>
            <Kpi label="Active Employees" value={stats.total} color="#059669" icon="✅" />
            <Kpi label="Departments" value={stats.departments} color="#2563eb" icon="🏢" />
            <Kpi label="Passport Expiring" sub={stats.passportExpired>0?`${stats.passportExpired} expired`:`≤${thresholds.passport}d`} value={stats.passportCount} color="#dc2626" icon="📕" alert={stats.passportCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Emirates ID Expiring" sub={stats.eidExpired>0?`${stats.eidExpired} expired`:`≤${thresholds.eid}d`} value={stats.eidCount} color="#ea580c" icon="🪪" alert={stats.eidCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="CICPA Expiring" sub={stats.cicpaExpired>0?`${stats.cicpaExpired} expired`:`≤${thresholds.cicpa}d`} value={stats.cicpaCount} color="#7c3aed" icon="🛢️" alert={stats.cicpaCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Training Certs Expiring" sub={stats.trainingCertExpired>0?`${stats.trainingCertExpired} expired`:`≤${thresholds.training_cert||30}d`} value={stats.trainingCertCount} color="#0f766e" icon="🎓" alert={stats.trainingCertCount>0} onClick={()=>onJump('alerts')} />
            <Kpi label="Expired Documents" value={stats.expired} color="#dc2626" icon="⚠️" alert={stats.expired>0} onClick={()=>onJump('alerts')} />

            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'14px' }}><h3 style={{ margin:0, fontSize:'14px' }}>Document Expiry Overview</h3><button onClick={()=>onJump('alerts')} style={S.link}>View all →</button></div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'10px' }}>
              {expiryByType.map(t => (

                  <div style={{ fontSize:'10px', color:'#94a3b8', marginBottom:'8px' }}>Threshold: {thresholds[t.key]}d</div>

                    <div style={{ fontSize:'26px', fontWeight:700, lineHeight:1 }}>{t.count}</div>

              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'12px' }}><h3 style={{ margin:0, fontSize:'14px' }}>Upcoming Expirations</h3><button onClick={()=>onJump('alerts')} style={S.link}>View all →</button></div>
              {alerts.length===0 ? <div style={{ textAlign:'center', padding:'32px', color:'#94a3b8' }}>✓ No upcoming expirations</div> :
                alerts.slice(0,8).map((a,i)=>{ const c=a.severity==='expired'?'#dc2626':a.severity==='critical'?'#ea580c':a.severity==='urgent'?'#ca8a04':'#0891b2';
                  return <div key={i} style={{ display:'flex', alignItems:'center', gap:'12px', padding:'10px 0', borderBottom:'1px solid #f1f5f9' }}>
                    <div style={{ width:'3px', height:'32px', background:c, borderRadius:'2px' }}></div>

                    <div style={{ background:c+'12', color:c, padding:'3px 10px', borderRadius:'12px', fontSize:'11px', fontWeight:700 }}>{a.daysLeft<0?`${Math.abs(a.daysLeft)}d ago`:`${a.daysLeft}d`}</div>
                  </div>; })}
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px' }}><h3 style={{ margin:'0 0 12px', fontSize:'13px' }}>By Department</h3>{deptCounts.map(([d,c])=><Bar key={d} label={d} value={c} max={deptCounts[0][1]} color="#2563eb" />)}</div>
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'18px' }}><h3 style={{ margin:'0 0 12px', fontSize:'13px' }}>By Nationality</h3>{natCounts.map(([d,c])=><Bar key={d} label={d} value={c} max={natCounts[0][1]} color="#059669" />)}</div>
            </div>
          </div>
        </div>
      );
    }
    function Kpi({ label, value, color, icon, alert, onClick, sub }) {
      return <div className="hr-card" onClick={onClick} style={{ background:'#fff', border:'1px solid #e2e8f0', borderLeft: alert?`3px solid ${color}`:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px', cursor:onClick?'pointer':'default' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'6px' }}><div style={{ fontSize:'11.5px', color:'#64748b', fontWeight:600, lineHeight:1.25 }}>{label}</div><div style={{ fontSize:'16px' }}>{icon}</div></div>
        <div style={{ fontSize:'26px', fontWeight:700, lineHeight:1 }}>{value}</div>
        {sub && <div style={{ fontSize:'10.5px', color: alert?color:'#94a3b8', fontWeight:600, marginTop:'4px' }}>{sub}</div>}
      </div>;
    }
    function Bar({ label, value, max, color }) {
      return <div style={{ marginBottom:'8px' }}><div style={{ display:'flex', justifyContent:'space-between', fontSize:'12px', marginBottom:'3px' }}><span style={{ color:'#475569' }}>{label}</span><span style={{ fontWeight:600 }}>{value}</span></div><div style={{ height:'5px', background:'#f1f5f9', borderRadius:'3px' }}><div style={{ width:`${max>0?(value/max)*100:0}%`, height:'100%', background:color, borderRadius:'3px' }}></div></div></div>;
    }

    // ============ EMPLOYEE LIST ============
    function EmployeeList({ employees, total, search, setSearch, statusFilter, setStatusFilter, thresholds, onEdit, onDelete, onAdd }) {
      return (
        <div>
          <div style={{ display:'flex', gap:'10px', marginBottom:'14px', flexWrap:'wrap' }}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search name, ID, passport, email…" style={{ ...S.input, flex:1, minWidth:'240px', maxWidth:'380px' }} />
            <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={S.input}>
              <option value="all">All ({total})</option><option value="employed_only">Employed only</option><option value="with_id">With Employee ID</option><option value="pending">Pending</option>
            </select>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ Add Employee</button>
          </div>

            <div className="hr-scroll" style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'12.5px', minWidth:'1100px' }}>
                <thead><tr style={{ background:'#f8fafc' }}>{['Emp ID','Name','Position','Department','Nationality','Status','Passport','EID','Visa','Insurance','CICPA',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>

                    employees.map(e=>(
                      <tr key={e.id} className="hr-row" style={{ borderTop:'1px solid #f1f5f9' }}>

                        <td style={{ ...S.td, fontWeight:600 }}>{e.full_name}</td>
                        <td style={S.td}>{e.position}</td><td style={S.td}>{e.department}</td><td style={S.td}>{e.nationality}</td>
                        <td style={S.td}>{e.status && <span title={e.status} style={{ background: isStrictEmployed(e.status)?'#d1fae5':'#fef3c7', color: isStrictEmployed(e.status)?'#065f46':'#92400e', padding:'2px 8px', borderRadius:'10px', fontSize:'11px', fontWeight:600, display:'inline-block', maxWidth:'160px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{e.status}</span>}</td>
                        <DateCell value={e.passport_expiry} threshold={thresholds.passport} docNo={e.passport_no} />
                        <DateCell value={e.eid_expiry} threshold={thresholds.eid} docNo={e.eid_no} />
                        <DateCell value={e.visa_expiry} threshold={thresholds.visa} />
                        <InsuranceCell value={e.insurance_expiry} threshold={thresholds.insurance} company={e.insurance_id} />
                        <CicpaCell value={e.cicpa_expiry} threshold={thresholds.cicpa} docNo={e.cicpa_no} locations={e.cicpa_locations} />
                        <td style={{ ...S.td, textAlign:'right', whiteSpace:'nowrap' }}><button onClick={()=>onEdit(e)} style={S.iconBtn}>✏️</button><button onClick={()=>onDelete(e.id)} style={S.iconBtn}>🗑️</button></td>
                      </tr>
                    ))}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{ marginTop:'10px', fontSize:'12px', color:'#64748b' }}>Showing {employees.length} {employees.length===1?'employee':'employees'}</div>
        </div>
      );
    }
    function DateCell({ value, threshold, docNo }) {
      if (!value) return <td style={S.td}>
        {docNo ? <div style={{ fontSize:'10.5px', color:'#94a3b8', fontFamily:'ui-monospace, monospace' }}>{docNo}</div> : <span style={{ color:'#cbd5e1' }}>—</span>}
      </td>;
      const d = daysUntil(value); if (d===null) return <td style={S.td}><span style={{ color:'#cbd5e1' }}>—</span></td>;
      let c='#475569', bg='transparent';
      if (d<0){c='#dc2626';bg='#fee2e2';} else if(d<=7){c='#ea580c';bg='#fed7aa';} else if(d<=threshold){c='#ca8a04';bg='#fef3c7';}
      return <td style={S.td}>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          <span style={{ fontSize:'11.5px' }}>{fmtDateDisplay(value)}</span>
          <span style={{ fontSize:'10px', color:c, background:bg, padding:'1px 6px', borderRadius:'8px', alignSelf:'flex-start', fontWeight:600 }}>{d<0?`${Math.abs(d)}d ago`:`${d}d`}</span>
          {docNo && <span style={{ fontSize:'10.5px', color:'#94a3b8', fontFamily:'ui-monospace, monospace', marginTop:'2px' }}>{docNo}</span>}
        </div>
      </td>;
    }
    function InsuranceCell({ value, threshold, company }) {
      const d = value ? daysUntil(value) : null;
      let c='#475569', bg='transparent';
      if (d !== null) {
        if (d<0){c='#dc2626';bg='#fee2e2';} else if(d<=7){c='#ea580c';bg='#fed7aa';} else if(d<=threshold){c='#ca8a04';bg='#fef3c7';}
      }
      if (!company && !value) return <td style={S.td}><span style={{ color:'#cbd5e1' }}>—</span></td>;
      return <td style={S.td}>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          {company && <span style={{ fontSize:'11.5px', fontWeight:600, color:'#0891b2' }}>{company}</span>}
          {value && <span style={{ fontSize:'11px', color:'#64748b' }}>{fmtDateDisplay(value)}</span>}
          {d !== null && <span style={{ fontSize:'10px', color:c, background:bg, padding:'1px 6px', borderRadius:'8px', alignSelf:'flex-start', fontWeight:600 }}>{d<0?`${Math.abs(d)}d ago`:`${d}d`}</span>}
        </div>
      </td>;
    }

    function CicpaCell({ value, threshold, docNo, locations }) {
      const locs = (locations || '').split(',').map(s=>s.trim()).filter(Boolean);
      // Empty case: no date but possibly some other data
      if (!value && !docNo && locs.length === 0) return <td style={S.td}><span style={{ color:'#cbd5e1' }}>—</span></td>;
      const d = value ? daysUntil(value) : null;
      let c='#475569', bg='transparent';
      if (d != null) {
        if (d<0){c='#dc2626';bg='#fee2e2';} else if(d<=7){c='#ea580c';bg='#fed7aa';} else if(d<=threshold){c='#ca8a04';bg='#fef3c7';}
      }
      return <td style={S.td}>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px', minWidth:'130px' }}>
          {value && <span style={{ fontSize:'11.5px' }}>{fmtDateDisplay(value)}</span>}
          {d != null && <span style={{ fontSize:'10px', color:c, background:bg, padding:'1px 6px', borderRadius:'8px', alignSelf:'flex-start', fontWeight:600 }}>{d<0?`${Math.abs(d)}d ago`:`${d}d`}</span>}
          {docNo && <span style={{ fontSize:'10.5px', color:'#94a3b8', fontFamily:'ui-monospace, monospace', marginTop:'1px' }}>{docNo}</span>}
          {locs.length > 0 && (
            <div style={{ display:'flex', flexWrap:'wrap', gap:'3px', marginTop:'3px' }}>
              {locs.map(loc => (
                <span key={loc} style={{ background:'#ede9fe', color:'#6d28d9', padding:'1px 6px', borderRadius:'8px', fontSize:'9.5px', fontWeight:600 }}>{loc}</span>
              ))}
            </div>
          )}
        </div>
      </td>;
    }

          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px', marginBottom:'14px', display:'flex', gap:'8px', flexWrap:'wrap' }}>

            <button onClick={()=>setFilter('training_cert')} style={{ ...S.chip, ...(filter==='training_cert' ? { background:'#ccfbf1', color:'#0f766e', borderColor:'#5eead4' } : {}), border:'1px solid #99f6e4' }}>

          </div>
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
            {filtered.length===0 ? <div style={{ padding:'60px', textAlign:'center', color:'#94a3b8' }}>✓ All clear — no expiring documents</div> :
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'13px' }}>

                <tbody>{filtered.map((a,i)=>{const c=a.severity==='expired'?'#dc2626':a.severity==='critical'?'#ea580c':a.severity==='urgent'?'#ca8a04':'#0891b2';
                  return <tr key={i} className="hr-row" style={{ borderTop:'1px solid #f1f5f9' }}>
                    <td style={S.td}><span style={{ background:c+'15', color:c, padding:'3px 9px', borderRadius:'10px', fontSize:'10.5px', fontWeight:700, textTransform:'uppercase' }}>{a.severity}</span></td>
                    <td style={S.td}><div style={{ fontWeight:600 }}>{a.full_name}</div><div style={{ fontSize:'11px', color:'#94a3b8' }}>{a.employee_id}</div></td>
                    <td style={S.td}>
                      <div>{a.typeLabel}</div>

                    </td>
                    <td style={{ ...S.td, fontSize:'11.5px', color:'#64748b' }}>

                      {a.certNo && <div style={{ fontFamily:'ui-monospace,monospace', fontSize:'11px', color:'#64748b' }}>{a.certNo}</div>}
                      {!a.issuingCompany && !a.certNo && '—'}
                    </td>
                    <td style={S.td}>{fmtDateDisplay(a.expiryDate)}</td>
                    <td style={{ ...S.td, fontWeight:700, color:c }}>{a.daysLeft<0?`${Math.abs(a.daysLeft)}d overdue`:`${a.daysLeft}d`}</td>
                    <td style={{ ...S.td, fontSize:'11.5px' }}>{a.email&&<div>{a.email}</div>}{a.mobile&&<div style={{color:'#94a3b8'}}>{a.mobile}</div>}</td>
                  </tr>;})}</tbody>
              </table>}

        </div>

    // ============ MOB-DEMOB ============
    function MobDemobView({ records, employees, onAdd, onEdit, onDelete, onSyncAll }) {
      const [search, setSearch] = useState('');

      const empIds = new Set(employees.map(e => e.employee_id).filter(Boolean));
      const synced = records.filter(r => empIds.has(r.employee_id)).length;
      const total = empIds.size;
      const missing = total - synced;

      // Sort by employee_id numerically (SA1001, SA1002 ...) then filter
      const sorted = useMemo(() => {
        const s = search.toLowerCase().trim();
        return [...records]
          .filter(r => {
            if (!s) return true;
            return (r.employee_id||'').toLowerCase().includes(s) ||
                   (r.full_name||'').toLowerCase().includes(s) ||
                   (r.position||'').toLowerCase().includes(s) ||
                   (r.eid_no||'').toLowerCase().includes(s) ||
                   (r.supply||'').toLowerCase().includes(s) ||
                   (r.location||'').toLowerCase().includes(s) ||
                   (r.remarks||'').toLowerCase().includes(s) ||
                   (r.mobilization_date ? fmtDateDisplay(r.mobilization_date).toLowerCase().includes(s) : false);
          })
          .sort((a, b) => {
            const na = (a.employee_id||'').replace(/[^0-9]/g,'');
            const nb = (b.employee_id||'').replace(/[^0-9]/g,'');
            return parseInt(na||'0') - parseInt(nb||'0');
          });
      }, [records, search]);

      return (
        <div>
          {/* Toolbar */}
          <div style={{ display:'flex', gap:'10px', marginBottom:'14px', alignItems:'center', flexWrap:'wrap' }}>
            <input
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Search by Emp ID, Name, Position, Location, Supply, Remarks…"
              style={{ ...S.input, flex:1, minWidth:'220px', maxWidth:'380px' }}
            />
            <div style={{ background: missing===0&&total>0 ? '#f0fdf4' : '#fffbeb', border:'1px solid '+(missing===0&&total>0?'#86efac':'#fcd34d'), borderRadius:'8px', padding:'7px 14px', fontSize:'12px', color:missing===0&&total>0?'#166534':'#92400e', fontWeight:600, whiteSpace:'nowrap' }}>
              {missing===0&&total>0 ? '✅' : '⚠️'} {synced}/{total} synced
              {missing > 0 && <span> &mdash; {missing} missing</span>}
            </div>
            <button className="hr-btn" onClick={onSyncAll}
              style={{ background:'#0f172a', color:'#fff', border:'none', padding:'9px 16px', borderRadius:'8px', fontSize:'13px', fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:'8px' }}>
              Sync All from Employees
              <span style={{ background:'rgba(255,255,255,0.18)', fontSize:'11px', padding:'2px 8px', borderRadius:'8px' }}>{employees.length}</span>
            </button>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ Add Record</button>
          </div>

          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
            <div className="hr-scroll" style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'13px', minWidth:'900px' }}>
                <thead>
                  <tr style={{ background:'#f8fafc' }}>
                    {['Emp ID','Full Name','Position','EID No','Mob. Date','Supply','Location','Remarks',''].map(h =>
                      <th key={h} style={S.th}>{h}</th>
                    )}
                  </tr>
                </thead>
                <tbody>
                  {sorted.length===0
                    ? <tr><td colSpan={9} style={{ textAlign:'center', padding:'40px', color:'#94a3b8' }}>
                        {records.length===0 ? 'No records yet — click "Sync All from Employees" above' : 'No results match your search'}
                      </td></tr>
                    : sorted.map(r => (
                      <tr key={r.id} className="hr-row" style={{ borderTop:'1px solid #f1f5f9' }}>
                        <td style={{ ...S.td, fontFamily:'ui-monospace,monospace', fontWeight:700, color:'#2563eb' }}>{r.employee_id}</td>
                        <td style={{ ...S.td, fontWeight:600 }}>{r.full_name}</td>
                        <td style={S.td}>{r.position}</td>
                        <td style={{ ...S.td, fontSize:'11.5px' }}>{r.eid_no}</td>
                        <td style={S.td}>{r.mobilization_date ? fmtDateDisplay(r.mobilization_date) : '—'}</td>
                        <td style={S.td}>{r.supply}</td>
                        <td style={S.td}>{r.location}</td>
                        <td style={{ ...S.td, fontSize:'11.5px', maxWidth:'160px' }}>{r.remarks}</td>
                        <td style={{ ...S.td, textAlign:'right', whiteSpace:'nowrap' }}>
                          <button onClick={() => onEdit(r)} style={S.iconBtn}>&#9998;</button>
                          <button onClick={() => onDelete(r.id)} style={S.iconBtn}>&#128465;</button>
                        </td>
                      </tr>
                    ))
                  }
                </tbody>
              </table>
            </div>
          </div>
          <div style={{ marginTop:'10px', fontSize:'12px', color:'#64748b' }}>
            {search ? sorted.length + ' of ' + records.length : records.length} record{records.length!==1?'s':''}
          </div>
        </div>
      );
    }

    // ============ REPORTS ============
    function ReportsView({ alerts, dashboardEmployees, recipients }) {
      const [copied, setCopied] = useState('');

                <a className="hr-btn" style={{ ...S.btnPri, textDecoration:'none' }} href={`mailto:${recipients.map(r=>r.email).join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`}>Open in Email</a></div>

    const DOC_TYPES = [
      { key:'passport',   label:'Passport',        color:'#dc2626', border:'#fca5a5', noKey:'passport_no',   expiryKey:'passport_expiry',   imgKey:'passport_img'  },
      { key:'eid',        label:'Emirates ID',      color:'#ea580c', border:'#fdba74', noKey:'eid_no',        expiryKey:'eid_expiry',         imgKey:'eid_img'       },
      { key:'visa',       label:'Visa',             color:'#ca8a04', border:'#fcd34d', noKey:null,            expiryKey:'visa_expiry',        imgKey:'visa_img'      },
      { key:'insurance',  label:'Insurance',        color:'#0891b2', border:'#67e8f9', noKey:'insurance_id',  expiryKey:'insurance_expiry',   imgKey:'insurance_img' },
      { key:'cicpa',      label:'CICPA Gate Pass',  color:'#7c3aed', border:'#c4b5fd', noKey:'cicpa_no',      expiryKey:'cicpa_expiry',       imgKey:'cicpa_img'     },

    function DocumentUploadPanel({ data, setField, employeeId }) {
      const BUCKET = 'hr-documents';
      const [activeDoc, setActiveDoc] = useState('passport');
      const [localImgs, setLocalImgs]   = useState({}); // docKey -> dataUrl (for newly uploaded, not yet saved)
      const [uploadLoading, setUploadLoading] = useState({}); // docKey -> bool
      const [ocrResults, setOcrResults]   = useState({});
      const [ocrLoading, setOcrLoading]   = useState({});
      const [manualExpiry, setManualExpiry] = useState({});
      const [manualNo, setManualNo]         = useState({});
      const [applyStatus, setApplyStatus]   = useState({});
      const [imgError, setImgError]         = useState({});

      // Get the display URL: prefer newly uploaded local preview, else stored URL from DB
      const getImgSrc = (docKey) => {
        if (imgError[docKey]) return null; // don't retry broken URLs
        if (localImgs[docKey]) return localImgs[docKey];
        const dt = DOC_TYPES.find(d=>d.key===docKey);
        const stored = dt && data[dt.imgKey] ? data[dt.imgKey] : null;
        // base64 data URLs always work; only http URLs can go stale
        if (stored && stored.startsWith('data:')) return stored;
        if (stored && stored.startsWith('http')) return stored;
        return null;
      };

      const handleFileChange = async (docKey, file) => {
        if (!file) return;
        setActiveDoc(docKey);
        setImgError(p => ({ ...p, [docKey]: false }));
        setUploadLoading(p => ({ ...p, [docKey]: true }));

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const dataUrl = ev.target.result;
          setLocalImgs(p => ({ ...p, [docKey]: dataUrl }));

          // Save image as base64 directly into the employee record (no storage bucket needed)
          const dt2 = DOC_TYPES.find(d=>d.key===docKey);
          if (dt2?.imgKey) {
            setField(dt2.imgKey, dataUrl);
            console.log('[UPLOAD] base64 saved to field:', dt2.imgKey);
          }

          // OCR
          setOcrResults(p => ({ ...p, [docKey]: null }));
          setOcrLoading(p => ({ ...p, [docKey]: true }));
          try {
            const base64 = dataUrl.split(',')[1];
            const mtype  = file.type && file.type.startsWith('image/') ? file.type : 'image/jpeg';
            const res = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [{
                  role: 'user',
                  content: [
                    { type: 'image', source: { type: 'base64', media_type: mtype, data: base64 } },
                    { type: 'text', text: `You are an OCR assistant. Extract from this ${DOC_TYPES.find(d=>d.key===docKey)?.label||'document'} image:
1. Document number
2. Expiry date (the date the document EXPIRES, NOT the issue date)

Reply ONLY with valid JSON, no markdown:
{"docNumber":"...","expiryDate":"YYYY-MM-DD","rawText":"...brief OCR text..."}

Use null for missing fields. expiryDate must be YYYY-MM-DD.
For passports: "Date of Expiry" is bottom-right of data page. Verify via MRZ second line — expiry is first 6 digits after the document number checksum (format YYMMDD).` }
                  ]
                }]
              })
            });
            const json = await res.json();
            const rawText = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
            const cleaned = rawText.replace(/```json|```/g,'').trim();
            let parsed = {};
            try { parsed = JSON.parse(cleaned); } catch { parsed = { error: 'Could not parse OCR response', rawText }; }
            setOcrResults(p => ({ ...p, [docKey]: parsed }));
            if (parsed.expiryDate) setManualExpiry(p => ({ ...p, [docKey]: parsed.expiryDate }));
            if (parsed.docNumber)  setManualNo(p => ({ ...p, [docKey]: parsed.docNumber }));
          } catch(e) {
            setOcrResults(p => ({ ...p, [docKey]: { error: e.message } }));
          }
          setOcrLoading(p => ({ ...p, [docKey]: false }));
          setUploadLoading(p => ({ ...p, [docKey]: false }));
        };
        reader.readAsDataURL(file);
      };

      const applyToForm = (docKey) => {
        const dt = DOC_TYPES.find(d=>d.key===docKey);
        if (!dt) return;
        const exp = manualExpiry[docKey] || ocrResults[docKey]?.expiryDate || '';
        const num = manualNo[docKey]     || ocrResults[docKey]?.docNumber  || '';
        if (exp) setField(dt.expiryKey, exp);
        if (num && dt.noKey) setField(dt.noKey, num);
        setApplyStatus(p => ({ ...p, [docKey]: 'applied' }));
        setTimeout(() => setApplyStatus(p => ({ ...p, [docKey]: null })), 3000);
      };

      const activeType = DOC_TYPES.find(d => d.key === activeDoc);
      const imgSrc = getImgSrc(activeDoc);
      const fileName = localImgs[activeDoc] ? '(newly uploaded)' : (activeType && data[activeType.imgKey] ? 'Saved document' : null);

      return (
        <div style={{ background:'#fafbfc', border:'1px solid #e2e8f0', borderRadius:'10px', padding:'14px', marginBottom:'4px' }}>
          {/* Tab strip */}
          <div style={{ display:'flex', gap:'7px', flexWrap:'wrap', marginBottom:'14px' }}>
            {DOC_TYPES.map(dt => {
              const hasSaved = !!(data[dt.imgKey] || localImgs[dt.key]);
              const isActive = activeDoc === dt.key;
              return (
                <button key={dt.key} type="button" onClick={() => setActiveDoc(dt.key)}
                  style={{
                    background: isActive ? dt.color : hasSaved ? '#f0fdf4' : '#fff',
                    color: isActive ? '#fff' : hasSaved ? '#166534' : '#475569',
                    border: `1.5px ${isActive?'solid':'dashed'} ${isActive ? dt.color : hasSaved ? '#86efac' : dt.border}`,
                    padding:'6px 13px', borderRadius:'20px', fontSize:'12px', fontWeight:700,
                    cursor:'pointer', display:'flex', alignItems:'center', gap:'5px', transition:'all 0.15s'
                  }}>
                  {hasSaved ? '✓ ' : '+ '}{dt.label}
                </button>
              );
            })}
          </div>

          {/* Panel body */}
          {activeType && (
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px' }}>

              {/* LEFT — image preview / upload */}
              <div style={{ display:'flex', flexDirection:'column', gap:'8px' }}>
                {uploadLoading[activeDoc] && (
                  <div style={{ display:'flex', alignItems:'center', gap:'8px', padding:'12px', background:'#eff6ff', borderRadius:'8px' }}>
                    <div className="spinner" style={{ width:'16px', height:'16px', borderWidth:'2px', flexShrink:0 }}></div>
                    <span style={{ fontSize:'12px', color:'#1e40af' }}>Processing image…</span>
                  </div>
                )}
                {imgSrc && !imgError[activeDoc] ? (
                  <div style={{ border:'1px solid #e2e8f0', borderRadius:'8px', overflow:'hidden', background:'#fff' }}>
                    <img
                      src={imgSrc}
                      alt="Document scan"
                      onError={() => {
                        setImgError(p => ({ ...p, [activeDoc]: true }));
                        // Clear the broken URL from form data so it doesn't get re-saved
                        const dt = DOC_TYPES.find(d=>d.key===activeDoc);
                        if (dt?.imgKey) setField(dt.imgKey, null);
                      }}
                      style={{ width:'100%', display:'block', maxHeight:'240px', objectFit:'contain', background:'#f8fafc' }}
                      crossOrigin="anonymous"
                    />
                    <div style={{ padding:'8px 12px', display:'flex', justifyContent:'space-between', alignItems:'center', borderTop:'1px solid #f1f5f9', background:'#fff' }}>
                      <span style={{ fontSize:'11px', color:'#64748b', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:'150px' }}>
                        {localImgs[activeDoc] ? '📎 New upload' : '☁️ Saved document'}
                      </span>
                      <label style={{ cursor:'pointer', fontSize:'11px', color:'#2563eb', fontWeight:600, whiteSpace:'nowrap' }}>
                        🔄 Replace
                        <input type="file" accept="image/jpeg,image/png,image/webp" style={{ display:'none' }}
                          onChange={e => e.target.files[0] && handleFileChange(activeDoc, e.target.files[0])} />
                      </label>
                    </div>
                  </div>
                ) : (
                  <label style={{
                    display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                    gap:'10px', border:`2px dashed ${activeType.border}`, borderRadius:'8px',
                    padding:'32px 16px', cursor:'pointer', background:'#fff', minHeight:'180px'
                  }}>
                    {imgError[activeDoc] ? (
                      <>
                        <span style={{ fontSize:'28px' }}>📷</span>
                        <span style={{ fontSize:'12px', color:'#475569', fontWeight:600, textAlign:'center' }}>Previous image link expired.<br/>Click to upload a new one.</span>
                        <span style={{ fontSize:'11px', color:'#94a3b8' }}>JPG, PNG, or WEBP</span>
                      </>
                    ) : (
                      <>
                        <span style={{ fontSize:'32px' }}>📷</span>
                        <span style={{ fontSize:'13px', color:'#475569', fontWeight:600, textAlign:'center' }}>Click to upload {activeType.label}</span>
                        <span style={{ fontSize:'11px', color:'#94a3b8' }}>JPG, PNG, or WEBP</span>
                      </>
                    )}
                    <input type="file" accept="image/jpeg,image/png,image/webp" style={{ display:'none' }}
                      onChange={e => e.target.files[0] && handleFileChange(activeDoc, e.target.files[0])} />
                  </label>
                )}
              </div>

              {/* RIGHT — OCR + editable fields */}
              <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                <div style={{ fontSize:'12px', fontWeight:700, color:'#475569' }}>🔍 Auto-detect</div>

                {ocrLoading[activeDoc] && (
                  <div style={{ display:'flex', alignItems:'center', gap:'10px', padding:'12px', background:'#eff6ff', borderRadius:'8px' }}>
                    <div className="spinner" style={{ width:'18px', height:'18px', borderWidth:'2px', flexShrink:0 }}></div>
                    <span style={{ fontSize:'12px', color:'#1e40af' }}>Scanning document…</span>
                  </div>
                )}

                {!ocrLoading[activeDoc] && !imgSrc && (
                  <div style={{ fontSize:'12px', color:'#94a3b8', padding:'12px', background:'#f8fafc', borderRadius:'8px', lineHeight:1.5 }}>
                    Upload a scan to auto-detect the number & expiry.<br/>
                    <span style={{ fontSize:'11px' }}>You can also type values manually below.</span>
                  </div>
                )}

                {ocrResults[activeDoc]?.error && (
                  <div style={{ fontSize:'11.5px', color:'#991b1b', background:'#fee2e2', padding:'10px', borderRadius:'8px' }}>

      const parsed = (() => { try { return JSON.parse(trRec?.training_records || '{}'); } catch { return {}; } })();

        return { bg:'#fff', color:'#94a3b8', label:'○ Pending' };

    function TrainingCertUploadPanel({ trainingId, trainingLabel, empId, existingImgUrl, existingCertNo, existingExpiry, existingIssuingCompany, existingCourseName, onApply }) {
      const [localImg, setLocalImg] = useState(null);
      const [ocrResult, setOcrResult] = useState(null);
      const [ocrLoading, setOcrLoading] = useState(false);
      const [manualNo, setManualNo] = useState(existingCertNo || '');
      const [manualExpiry, setManualExpiry] = useState(existingExpiry || '');
      const [manualCourse, setManualCourse] = useState(existingCourseName || '');
      const [manualIssuer, setManualIssuer] = useState(existingIssuingCompany || '');
      const [applyDone, setApplyDone] = useState(false);

      const handleFile = async (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const dataUrl = ev.target.result;
          setLocalImg(dataUrl);
          setOcrLoading(true);
          setOcrResult(null);
          try {
            const base64 = dataUrl.split(',')[1];
            const mtype = file.type && file.type.startsWith('image/') ? file.type : 'image/jpeg';
            const res = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 600,
                messages: [{
                  role: 'user',
                  content: [
                    { type: 'image', source: { type: 'base64', media_type: mtype, data: base64 } },
                    { type: 'text', text: `You are an OCR assistant for training/safety certificates. Extract from this certificate image:
1. Certificate / registration number (any ID or cert number on the cert)
2. Expiry / valid-until date (NOT issue date) — format as YYYY-MM-DD
3. Course / training name (the full title of the course or training, e.g. "Safe Scaffolding Erection and Dismantling")
4. Issuing company / training provider (the organization that issued the certificate, e.g. "Crosswind", "OPITO", "Bureau Veritas")
5. Holder's name if visible

Reply ONLY with valid JSON, no markdown fences:
{"certNo":"...","expiryDate":"YYYY-MM-DD","courseName":"...","issuingCompany":"...","holderName":"...","rawText":"...brief..."}
Use null for any missing fields.` }
                  ]
                }]
              })
            });
            const json = await res.json();
            const raw = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
            let parsed = {};
            try { parsed = JSON.parse(raw.replace(/```json|```/g,'').trim()); } catch { parsed = { error: 'Parse failed', rawText: raw }; }
            setOcrResult(parsed);
            if (parsed.certNo) setManualNo(parsed.certNo);
            if (parsed.expiryDate) setManualExpiry(parsed.expiryDate);
            if (parsed.courseName) setManualCourse(parsed.courseName);
            if (parsed.issuingCompany) setManualIssuer(parsed.issuingCompany);
          } catch(e) {
            setOcrResult({ error: e.message });
          }
          setOcrLoading(false);
        };
        reader.readAsDataURL(file);
      };

      const apply = () => {
        onApply({ certNo: manualNo, expiry: manualExpiry, imgData: localImg || existingImgUrl, courseName: manualCourse, issuingCompany: manualIssuer });
        setApplyDone(true);
        setTimeout(() => setApplyDone(false), 2500);
      };

      const imgSrc = localImg || existingImgUrl;

      return (
        <div style={{ background:'#fafbfc', border:'1px solid #e2e8f0', borderRadius:'8px', padding:'12px' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px' }}>
            {/* Left: image */}
            <div>
              {imgSrc ? (
                <div style={{ border:'1px solid #e2e8f0', borderRadius:'6px', overflow:'hidden', background:'#fff', marginBottom:'6px' }}>
                  <img src={imgSrc} alt="Certificate" style={{ width:'100%', maxHeight:'160px', objectFit:'contain', display:'block' }} />
                  <div style={{ padding:'6px 10px', borderTop:'1px solid #f1f5f9', display:'flex', justifyContent:'flex-end' }}>
                    <label style={{ fontSize:'11px', color:'#2563eb', fontWeight:600, cursor:'pointer' }}>🔄 Replace
                      <input type="file" accept="image/jpeg,image/png,image/webp" style={{ display:'none' }} onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
                    </label>
                  </div>
                </div>
              ) : (
                <label style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'8px', border:'2px dashed #c4b5fd', borderRadius:'6px', padding:'24px 10px', cursor:'pointer', background:'#fff', minHeight:'120px', marginBottom:'6px' }}>
                  <span style={{ fontSize:'24px' }}>📄</span>
                  <span style={{ fontSize:'11.5px', color:'#475569', fontWeight:600, textAlign:'center' }}>Upload certificate</span>
                  <span style={{ fontSize:'10.5px', color:'#94a3b8' }}>JPG, PNG, WEBP</span>
                  <input type="file" accept="image/jpeg,image/png,image/webp" style={{ display:'none' }} onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
                </label>
              )}
            </div>
            {/* Right: OCR + fields */}
            <div style={{ display:'flex', flexDirection:'column', gap:'8px' }}>
              <div style={{ fontSize:'11.5px', fontWeight:700, color:'#475569' }}>🔍 Auto-detect</div>
              {ocrLoading && (
                <div style={{ display:'flex', alignItems:'center', gap:'8px', padding:'10px', background:'#eff6ff', borderRadius:'6px' }}>
                  <div className="spinner" style={{ width:'14px', height:'14px', borderWidth:'2px', flexShrink:0 }}></div>
                  <span style={{ fontSize:'11px', color:'#1e40af' }}>Scanning certificate…</span>
                </div>
              )}
              {ocrResult?.error && <div style={{ fontSize:'11px', color:'#991b1b', background:'#fee2e2', padding:'8px', borderRadius:'6px' }}>⚠ {ocrResult.error}</div>}
              <div>
                <label style={{ fontSize:'11px', color:'#64748b', display:'block', marginBottom:'3px', fontWeight:600 }}>
                  Course / Training Name
                  {ocrResult?.courseName && !ocrResult.error && <span style={{ color:'#059669', marginLeft:'5px', fontSize:'10px' }}>● detected</span>}
                </label>
                <input type="text" value={manualCourse} onChange={e => setManualCourse(e.target.value)} placeholder="e.g. Safe Scaffolding Erection and Dismantling"
                  style={{ ...S.input, width:'100%', fontSize:'12px', background: ocrResult?.courseName ? '#f0fdf4' : '#fff', border: ocrResult?.courseName ? '2px solid #86efac' : '1px solid #cbd5e1' }} />
              </div>
              <div>
                <label style={{ fontSize:'11px', color:'#64748b', display:'block', marginBottom:'3px', fontWeight:600 }}>
                  Issuing Company / Training Provider
                  {ocrResult?.issuingCompany && !ocrResult.error && <span style={{ color:'#059669', marginLeft:'5px', fontSize:'10px' }}>● detected</span>}
                </label>
                <input type="text" value={manualIssuer} onChange={e => setManualIssuer(e.target.value)} placeholder="e.g. Crosswind, OPITO, Bureau Veritas"
                  style={{ ...S.input, width:'100%', fontSize:'12px', background: ocrResult?.issuingCompany ? '#f0fdf4' : '#fff', border: ocrResult?.issuingCompany ? '2px solid #86efac' : '1px solid #cbd5e1' }} />
              </div>
              <div>
                <label style={{ fontSize:'11px', color:'#64748b', display:'block', marginBottom:'3px', fontWeight:600 }}>
                  Certificate No
                  {ocrResult?.certNo && !ocrResult.error && <span style={{ color:'#0891b2', marginLeft:'5px', fontSize:'10px' }}>● detected</span>}
                </label>
                <input type="text" value={manualNo} onChange={e => setManualNo(e.target.value)} placeholder="e.g. T2026-6614-01"
                  style={{ ...S.input, width:'100%', fontSize:'12px', background: ocrResult?.certNo ? '#f0f9ff' : '#fff' }} />
              </div>
              <div>
                <label style={{ fontSize:'11px', color:'#64748b', display:'block', marginBottom:'3px', fontWeight:600 }}>
                  Expiry Date
                  {ocrResult?.expiryDate && !ocrResult.error && <span style={{ color:'#ca8a04', marginLeft:'5px', fontSize:'10px' }}>● detected</span>}
                </label>
                <input type="date" value={manualExpiry} onChange={e => setManualExpiry(e.target.value)}
                  style={{ ...S.input, width:'100%', fontSize:'12px', border: ocrResult?.expiryDate ? '2px solid #f59e0b' : '1px solid #cbd5e1' }} />
              </div>
              <button type="button" onClick={apply} style={{ ...S.btnPri, marginTop:'auto', fontSize:'12px', background: applyDone ? '#059669' : '#7c3aed' }}>
                {applyDone ? '✓ Saved to record!' : 'Use → Save to Training record'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function TrainingModal({ record, employees, onSave, onClose, showToast }) {
      const [data, setData] = useState(() => {
        const recs = (() => { try { return JSON.parse(record.training_records || '{}'); } catch { return {}; } })();
        return { ...record, _parsed: recs };
      });
      const [activeCat, setActiveCat] = useState('baseline');
      const [expandedTr, setExpandedTr] = useState(null);
      const [otherTrainings, setOtherTrainings] = useState(() => {
        try {
          const p = JSON.parse(record.training_records || '{}');
          return (p.__other || []);
        } catch { return []; }
      });
      const [newOther, setNewOther] = useState({ label:'', certNo:'', expiry:'', notes:'' });

      const setRec = (trainingId, fields) => {
        setData(d => {
          const p = { ...d._parsed };
          p[trainingId] = { ...(p[trainingId] || {}), ...fields };
          return { ...d, _parsed: p };
        });
      };

      const toggleStatus = (trainingId) => {
        setData(d => {
          const p = { ...d._parsed };
          const cur = p[trainingId] || {};
          const cycle = ['', 'valid', 'expired', 'not_required'];
          const idx = cycle.indexOf(cur.status || '');
          p[trainingId] = { ...cur, status: cycle[(idx + 1) % cycle.length] };
          return { ...d, _parsed: p };
        });
      };

      const statusStyle = (s) => {
        if (s === 'valid') return { bg:'#dcfce7', color:'#166534', label:'✓ Valid' };
        if (s === 'expired') return { bg:'#fee2e2', color:'#991b1b', label:'⚠ Expired' };
        if (s === 'not_required') return { bg:'#f1f5f9', color:'#64748b', label:'— N/A' };
        return { bg:'#fff', color:'#94a3b8', label:'○ Pending' };
      };

      const handleSave = async () => {
        const allRecs = { ...data._parsed, __other: otherTrainings };
        const saveData = { ...data, training_records: JSON.stringify(allRecs), _parsed: undefined };
        delete saveData._parsed;
        await onSave(saveData);
      };

      const activeCatObj = TRAINING_CATEGORIES.find(c => c.id === activeCat);
      const parsed = data._parsed || {};

      return (
        <div style={S.overlay} onClick={onClose}>
          <div style={{ ...S.modal, maxWidth:'820px' }} onClick={e => e.stopPropagation()}>

                  {data.employee_id} {data.position ? '· ' + data.position : ''} {data.cicpa_locations ? '· CICPA: ' + data.cicpa_locations : ''}

              <button onClick={onClose} style={S.iconBtn}>✖</button>

              {/* Left: category tabs */}
