          if (ocr.passportExpiry)     { dataRef.current.passport_expiry_candidate  = ocr.passportExpiry; }
          if (ocr.placeOfIssue)       { dataRef.current.place_of_issue             = ocr.placeOfIssue; }
          if (ocr.experienceYears)    { dataRef.current.experience                 = String(ocr.experienceYears); }
          if (ocr.position)           { dataRef.current.position                   = ocr.position; }
          if (ocr.phone)              { dataRef.current.phone                      = ocr.phone; }
          if (ocr.email)              { dataRef.current.email                      = ocr.email; }
          if (ocr.currentEmployer)    { dataRef.current.current_employer            = ocr.currentEmployer; }
          if (ocr.currentDesignation) { dataRef.current.current_designation         = ocr.currentDesignation; }
          if (ocr.skills)             { dataRef.current.skills                      = ocr.skills; }
          if (ocr.meExperience)       { dataRef.current.me_experience               = ocr.meExperience; }
          if (ocr.meNotes)            { dataRef.current.me_notes                    = ocr.meNotes; }
          // Never populate notice period / available_from from a resume scan

          // ── Save resume-extracted fields to DB immediately ───────────────────
          if (dataRef.current.id) {
            const RESUME_SAVE_KEYS = [
              'candidate_name','passport_no','passport_expiry_candidate','place_of_issue',
              'experience','position','phone','email',
              'current_employer','current_designation','skills',
              'me_experience','me_notes'
            ];
            const resumePatch = {};
            RESUME_SAVE_KEYS.forEach(k => { resumePatch[k] = dataRef.current[k] || null; });
            await db.from('hiring_pipeline').update(resumePatch).eq('id', dataRef.current.id);
          }
        }
        // ── Interview Sheet — apply ALL extracted fields and save to DB ──────
        if (docKey === 'interview_sheet_url') {
          const map = {
            fullName:          'candidate_name',
            dob:               'dob_candidate',
            nationality:       'nationality',
            passportNo:        'passport_no',
            passportExpiry:    'passport_expiry_candidate',
            placeOfIssue:      'place_of_issue',
            religion:          'religion',
            maritalStatus:     'marital_status',
            phone:             'phone',
            whatsapp:          'whatsapp',
            email:             'email',
            languages:         'languages',
            currentLocation:   'current_location',
            address:           'home_address',
            referredBy:        'referred_by',
            position:          'position',
            experienceYears:   'experience',
            currentEmployer:   'current_employer',
            currentDesignation:'current_designation',
            currentSalary:     'current_salary',
            // noticePeriod intentionally excluded — filled during interview, not from OCR
            skills:            'skills',
            meExperience:      'me_experience',
            meNotes:           'me_notes',
            otherCerts:        'other_certifications',
            dependants:        'dependants_count',
            children:          'children_count',
            familyUae:         'family_in_uae',
            emergencyContact:  'emergency_contact',
            scoreTechnical:    'interview_score_technical',
            scoreComm:         'interview_score_comm',
            scoreSafety:       'interview_score_safety',
            scoreExp:          'interview_score_exp',
            scoreAttitude:     'interview_score_attitude',
            scoreDocs:         'interview_score_docs',
            interviewDate:     'interview_date',
            interviewedBy:     'interviewed_by',
            interviewMode:     'interview_mode',
            verdict:           'interview_verdict',
            verdictReason:     'verdict_reason',
            interviewNotes:    'interview_notes',
            basicSalary:       'basic_salary',
            allowance:         'allowance',
            accommodation:     'accommodation',
            transport:         'transport_by',
            food:              'food_by',
            joiningDate:       'expected_arrival_date',
            visaCategory:      'visa_category',
            deploymentSite:    'deployment_site',
            offerNotes:        'remarks',
            medicalConditions: 'medical_conditions',
            onMedication:      'on_medication',
            colourBlind:       'colour_blindness',
            visionAids:        'vision_aids',
            fitHeight:         'fit_for_height',
            fitCse:            'fit_for_cse',
            gamkaResult:       'gamka_result',
            gamkaDate:         'gamka_date',
            medicalNotes:      'medical_notes',
          };
          let fieldsApplied = 0;
          Object.entries(map).forEach(([ocrKey, dbKey]) => {
            const val = ocr[ocrKey];

          // Compute total interview score

              'position','experience','current_employer','current_designation','skills',
              'me_experience','me_notes','interview_date','interviewed_by','interview_mode',
              'interview_score','interview_score_technical','interview_score_comm',
              'interview_score_safety','interview_score_exp','interview_score_attitude',
              'interview_score_docs','interview_verdict','verdict_reason','interview_notes',
              'basic_salary','allowance','deployment_site','visa_category','expected_arrival_date',

            const patch = {};
            SAVE_KEYS.forEach(k => { patch[k] = dataRef.current[k] || null; });
            const { error } = await db.from('hiring_pipeline').update(patch).eq('id', dataRef.current.id);
            if (error) {
              showToast('⚠️ DB save error: ' + error.message, 'error');
            } else {
              showToast(`✅ ${fieldsApplied} fields extracted from interview sheet and saved to hiring record!`);

          setDocState(s => ({ ...s, [docKey]: { ...s[docKey], applied: true } }));
          setRenderKey(k => k+1);
          setTimeout(() => setDocState(s => ({ ...s, [docKey]: { ...s[docKey], applied: false } })), 4000);
          return; // skip default flow below
        }

        setDocState(s => ({ ...s, [docKey]: { ...s[docKey], applied: true } }));
        setRenderKey(k => k+1);
        setTimeout(() => setDocState(s => ({ ...s, [docKey]: { ...s[docKey], applied: false } })), 3000);
        showToast('Details auto-filled from document ✓');

      const rescanDoc = async (docKey, docType) => {
        const savedUrl = dataRef.current[docKey];
        if (!savedUrl || !docType?.ocrPrompt) return;
        const isPdf = savedUrl.startsWith('data:application/pdf');

            contentParts = [
              { type:'image', source:{ type:'base64', media_type:mtype, data:base64 } },
              { type:'text', text: docType.ocrPrompt }

          const res = await fetch('/api/claude', {

            headers:{ 'Content-Type':'application/json' },

          });
          if (!res.ok) { const t = await res.text(); throw new Error(`API error ${res.status}: ${t.slice(0,120)}`); }
          const json = await res.json();
          const raw = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
          let ocr = {};
          try {
            ocr = parseClaudeJson(raw);

      const tabs = [

                    <F label="Current Location" fieldKey="current_location" opts={['India','UAE','Pakistan','Bangladesh','Sri Lanka','Nepal','Philippines','Other']} />

                    hint:'Visa stamped or digitally linked to EID. PRO collects passport and returns to employee.' },
                  { ref:'B7', phase:'B', label:'Emirates ID Card Issued & Collected', who:'PRO / Employee', tat:'3–5 WD after visa stamp', dateField:'eid_issued_date', track:'both',
                    hint:'Primary proof of residency. Collected from ICP centre or posted. Matches eid_no and eid_expiry in employee record.' },
                  { ref:'B8', phase:'B', label:'Labour Card Issued (MOHRE)', who:'PRO', tat:'3–5 WD', dateField:'labour_card_date', refField:'labour_card_ref', refLabel:'Labour Card Ref / Transaction No.', track:'both',
                    hint:'Final compliance step. All preceding approvals must be complete. Fee: AED 250–3,450 (varies by MOHRE company category). Issued digitally.' },
                ];

                const visibleSteps = SOP_STEPS.filter(s =>
                  s.track === 'both' ||
                  (s.track === 'overseas_only' && !uae) ||
                  (s.track === 'uae_only' && uae)
                );

                // Count completed steps
                const totalSteps = visibleSteps.length;
                const doneSteps = visibleSteps.filter(s => d[s.dateField]).length;
                const pct = totalSteps > 0 ? Math.round(doneSteps/totalSteps*100) : 0;

                // Check critical warnings
                const entryPermitExpiry = d.entry_permit_expiry;
                const arrivalDate = d.arrival_date;

                const contractDeadlineDays = arrivalDate && !contractRegDate ? 14 - (daysSinceArrival||0) : null;

                              <input key={`${step.dateField}-${renderKey}`} type="date"
                                defaultValue={d[step.dateField]||''}

                                style={{ width:'100%', padding:'7px 10px', border:'1px solid #cbd5e1', borderRadius:'7px', fontSize:'13px', fontFamily:'inherit', background:'#fff' }} />
                            </div>
                            {step.refField && (
                              <div>
                                <label style={{ fontSize:'11px', fontWeight:600, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', display:'block', marginBottom:'4px' }}>

                                </label>
                                <input key={`${step.refField}-${renderKey}`} type="text"
                                  defaultValue={d[step.refField]||''}
                                  onChange={e=>{ d[step.refField]=e.target.value; }}

                                  style={{ width:'100%', padding:'7px 10px', border:'1px solid #cbd5e1', borderRadius:'7px', fontSize:'13px', fontFamily:'inherit' }} />
                              </div>

                            {step.expiryField && (
                              <div>

                                </label>
                                <input key={`${step.expiryField}-${renderKey}`} type="date"
                                  defaultValue={d[step.expiryField]||''}
                                  onChange={e=>{ d[step.expiryField]=e.target.value; setRenderKey(k=>k+1); }}
                                  style={{ width:'100%', padding:'7px 10px', border:'1px solid #cbd5e1', borderRadius:'7px', fontSize:'13px', fontFamily:'inherit' }} />
                              </div>
                            )}
                            {step.resultField && (
                              <div>
                                <label style={{ fontSize:'11px', fontWeight:600, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', display:'block', marginBottom:'4px' }}>Result</label>
                                <select key={`${step.resultField}-${renderKey}`}
                                  defaultValue={d[step.resultField]||''}
                                  onChange={e=>{ d[step.resultField]=e.target.value; }}
                                  style={{ width:'100%', padding:'7px 10px', border:'1px solid #cbd5e1', borderRadius:'7px', fontSize:'13px', fontFamily:'inherit', background:'#fff' }}>
                                  <option value=''>— Select —</option>
                                  {step.resultOpts.map(o=><option key={o} value={o}>{o}</option>)}
                                </select>
                              </div>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                };

                return (
                  <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
                    {/* Header: progress + critical alerts */}
                    <div style={{ background:'linear-gradient(135deg,#0f766e,#0891b2)', borderRadius:'12px', padding:'16px 20px', color:'#fff' }}>
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'12px' }}>
                        <div>
                          <div style={{ fontSize:'15px', fontWeight:800 }}>🛂 Residence Visa Processing</div>
                          <div style={{ fontSize:'11.5px', opacity:0.85, marginTop:'2px' }}>SOP-HR-001 · Abu Dhabi Mainland · {uae ? '🇦🇪 UAE Track (transfer)' : '🌍 Overseas Track (new visa)'}</div>

                        <div style={{ textAlign:'center', background:'rgba(255,255,255,0.15)', borderRadius:'10px', padding:'8px 16px' }}>

                      <div style={{ background:'rgba(255,255,255,0.2)', borderRadius:'6px', height:'8px', overflow:'hidden' }}>

                    {/* Critical live alerts */}

                      <div style={{ background:'#fef2f2', border:'2px solid #fca5a5', borderRadius:'10px', padding:'10px 14px', display:'flex', gap:'10px', alignItems:'center' }}>
                        <span style={{ fontSize:'20px' }}>🚨</span>
                        <div>
                          <div style={{ fontWeight:700, color:'#991b1b', fontSize:'13px' }}>Entry Permit Expiring Soon!</div>

                      </div>

                    {contractDeadlineDays !== null && contractDeadlineDays <= 7 && (
                      <div style={{ background:'#fff7ed', border:'2px solid #fed7aa', borderRadius:'10px', padding:'10px 14px', display:'flex', gap:'10px', alignItems:'center' }}>

                        <div>
                          <div style={{ fontWeight:700, color:'#92400e', fontSize:'13px' }}>MOHRE Contract Registration Deadline!</div>
                          <div style={{ fontSize:'12px', color:'#b45309' }}>{contractDeadlineDays <= 0 ? 'OVERDUE — register contract immediately to avoid MOHRE penalties' : `${contractDeadlineDays} days left to register contract with MOHRE (14-day legal deadline)`}</div>
                        </div>
                      </div>
                    )}

                    {/* Cost tracker */}
                    <div style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:'10px', padding:'12px 16px', display:'flex', alignItems:'center', gap:'12px' }}>
                      <span style={{ fontSize:'18px' }}>💰</span>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:'12px', fontWeight:700, color:'#475569' }}>Total Visa Cost (AED) — Budget: AED 3,000–7,000 per employee</div>

                      </div>
                      <input key={`visa_total_cost-${renderKey}`} type="number" placeholder="e.g. 4500"
                        defaultValue={d['visa_total_cost']||''}
                        onChange={e=>{ d['visa_total_cost']=e.target.value; }}
                        style={{ width:'130px', padding:'7px 10px', border:'1px solid #cbd5e1', borderRadius:'7px', fontSize:'13px', fontFamily:'inherit', textAlign:'right', background:'#fff' }} />
                    </div>

                    {/* PHASE A steps (overseas only) */}
                    {phaseASteps.length > 0 && (
                      <div>
                        <div style={{ fontSize:'12px', fontWeight:800, color:'#b45309', textTransform:'uppercase', letterSpacing:'0.8px', marginBottom:'10px', display:'flex', alignItems:'center', gap:'8px' }}>
                          <span style={{ background:'#b45309', color:'#fff', borderRadius:'6px', padding:'2px 8px', fontSize:'11px' }}>PHASE A</span>
                          Pre-Arrival — Employer / PRO Actions
                          <span style={{ fontSize:'11px', fontWeight:500, color:'#64748b', textTransform:'none', letterSpacing:0 }}>({phaseASteps.filter(s=>d[s.dateField]).length}/{phaseASteps.length} done)</span>
                        </div>
                        {phaseASteps.map(step => <StepRow key={step.ref} step={step} />)}
                      </div>
                    )}

                    {/* PHASE B steps */}
                    <div>
                      <div style={{ fontSize:'12px', fontWeight:800, color:'#0f766e', textTransform:'uppercase', letterSpacing:'0.8px', marginBottom:'10px', display:'flex', alignItems:'center', gap:'8px' }}>
                        <span style={{ background:'#0f766e', color:'#fff', borderRadius:'6px', padding:'2px 8px', fontSize:'11px' }}>PHASE B</span>
                        Post-Arrival — In-Country Processing
                        <span style={{ fontSize:'11px', fontWeight:500, color:'#64748b', textTransform:'none', letterSpacing:0 }}>({phaseBSteps.filter(s=>d[s.dateField]).length}/{phaseBSteps.length} done)</span>
                      </div>
                      {phaseBSteps.map(step => <StepRow key={step.ref} step={step} />)}
                    </div>

                    {/* Completion banner */}
                    {pct===100 && (
                      <div style={{ background:'#dcfce7', border:'2px solid #86efac', borderRadius:'12px', padding:'16px 20px', textAlign:'center' }}>
                        <div style={{ fontSize:'24px', marginBottom:'4px' }}>🎉</div>
                        <div style={{ fontWeight:800, color:'#166534', fontSize:'14px' }}>Visa Processing Complete!</div>
                        <div style={{ fontSize:'12px', color:'#166534', marginTop:'4px' }}>All {totalSteps} SOP-HR-001 steps completed. Employee is fully legal to reside and work in Abu Dhabi.</div>
                      </div>
                    )}

                    {/* SOP reference */}
                    <div style={{ background:'#f1f5f9', border:'1px solid #cbd5e1', borderRadius:'8px', padding:'10px 14px', fontSize:'11px', color:'#64748b', lineHeight:1.7 }}>
                      📋 <strong>SOP-HR-001</strong> · Abu Dhabi Employment Residence Visa · Mainland Company Sponsorship (2026)<br/>
                      Authority: MOHRE (mohre.gov.ae) · ICP Smart Services (icp.gov.ae) · Typical total: 3–5 weeks<br/>
                      All costs employer-borne under Federal Decree-Law No. 33 of 2021. Passport held by PRO from B0 to B6.
                    </div>
                  </div>
                );
              })()}

              {/* ── TAB: Documents ── */}
              {activeTab==='documents' && (
                <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
                  <SectionHead label="Document Uploads with AI Auto-Detection" />
                  <div style={{ background:'#eff6ff', border:'1px solid #bfdbfe', borderRadius:'8px', padding:'12px', fontSize:'12px', color:'#1e40af', lineHeight:1.7 }}>
                    🤖 <strong>AI-powered documents:</strong> Upload Passport or Resume — Claude fills candidate details automatically. Upload a <strong>filled Interview Sheet</strong> (printed &amp; scanned, or PDF filled in Acrobat) — Claude extracts all scores, verdict, salary, and medical data and <strong>saves directly to this candidate's hiring record</strong>.
                  </div>

                  <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
                    {HIRING_DOC_TYPES.map(dt => {
                      const st = docState[dt.key] || {};
                      const savedUrl = dataRef.current[dt.key];
                      const preview = st.preview || (savedUrl?.startsWith('data:') ? savedUrl : null);
                      const isImg = preview?.startsWith('data:image');
                      const hasDoc = !!(st.preview || savedUrl);
                      return (
                        <div key={dt.key} style={{ border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden', background:'#fff' }}>
                          {/* Doc header row */}
                          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px', background: hasDoc?'#f0fdf4':'#f8fafc', borderBottom: hasDoc?'1px solid #86efac':'1px solid #e2e8f0' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                              <span style={{ fontSize:'14px' }}>{hasDoc?'✅':''}</span>
                              <span style={{ fontWeight:700, fontSize:'13px', color:'#0f172a' }}>{dt.label}</span>
                              {dt.ocrPrompt && <span style={{ fontSize:'10.5px', background:'#dbeafe', color:'#1d4ed8', padding:'1px 7px', borderRadius:'8px', fontWeight:600 }}>🤖 AI scan</span>}
                            </div>
                            <div style={{ display:'flex', gap:'8px', alignItems:'center' }}>
                              {hasDoc && savedUrl && !savedUrl.startsWith('data:') && (
                                <a href={savedUrl} target="_blank" rel="noopener noreferrer" style={{ fontSize:'11.5px', color:'#2563eb', fontWeight:600 }}>📎 View</a>
                              )}
                              {hasDoc && (
                                <button onClick={()=>{ dataRef.current[dt.key]=''; setDocState(s=>({...s,[dt.key]:{}})); }} style={{ ...S.iconBtn, fontSize:'11px', color:'#dc2626' }}>✖ Remove</button>
                              )}
                              <label style={{ background:'#2563eb', color:'#fff', padding:'5px 12px', borderRadius:'6px', fontSize:'11.5px', fontWeight:600, cursor:'pointer' }}>
                                {hasDoc?'↺ Replace':'⬆ Upload'}
                                <input type="file" accept={dt.accept} style={{ display:'none' }} onChange={e=>e.target.files[0]&&handleDocFile(dt.key,e.target.files[0])} />
                              </label>
                            </div>
                          </div>

                          {/* Preview */}
                          {hasDoc && (
                            <div style={{ padding:'14px 16px', display:'flex', gap:'16px', flexWrap:'wrap' }}>
                              {/* Clickable thumbnail */}
                              <div style={{ flexShrink:0 }}>
                                {(st.preview||savedUrl||'').startsWith('data:image') ? (
                                  <img
                                    src={st.preview||savedUrl} alt="doc"
                                    onClick={()=>setPreviewDoc({ url: st.preview||savedUrl, isPdf:false, label:dt.label })}
                                    style={{ width:'120px', height:'80px', objectFit:'cover', borderRadius:'8px', border:'2px solid #2563eb', cursor:'zoom-in' }}
                                    title="Click to view full size"
                                  />
                                ) : (
                                  <div
                                    onClick={()=>setPreviewDoc({ url: st.preview||savedUrl, isPdf:true, label:dt.label })}
                                    style={{ width:'120px', height:'80px', background:'#eff6ff', borderRadius:'8px', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'4px', border:'2px solid #2563eb', cursor:'zoom-in' }}
                                    title="Click to view document"
                                  >
                                    <span style={{ fontSize:'28px' }}>📄</span>
                                    <span style={{ fontSize:'10px', fontWeight:700, color:'#2563eb' }}>Click to View</span>
                                  </div>
                                )}
                              </div>

                              {/* OCR panel */}
                              <div style={{ flex:1 }}>
                                {st.scanning && (
                                  <div style={{ display:'flex', alignItems:'center', gap:'8px', color:'#2563eb', fontSize:'12.5px', fontWeight:600 }}>
                                    <div style={{ width:'14px', height:'14px', border:'2px solid #93c5fd', borderTopColor:'#2563eb', borderRadius:'50%', animation:'spin 0.8s linear infinite', flexShrink:0 }}></div>

                                  </div>
                                )}
                                {!st.scanning && st.ocr && !st.ocr.error && (
                                  <div>
                                    <div style={{ fontSize:'11.5px', fontWeight:700, color:'#059669', marginBottom:'8px' }}>✅ AI detected the following:</div>
                                    <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'4px 12px', marginBottom:'10px' }}>
                                      {Object.entries(st.ocr).filter(([k,v])=>v&&k!=='error').map(([k,v])=>(
                                        <div key={k} style={{ fontSize:'11px' }}>
                                          <span style={{ color:'#64748b', textTransform:'capitalize' }}>{k.replace(/([A-Z])/g,' $1').toLowerCase()}: </span>
                                          <span style={{ fontWeight:600, color:'#0f172a' }}>{String(v)}</span>
                                        </div>
                                      ))}
                                    </div>
                                    <div style={{ display:'flex', gap:'8px' }}>
                                      <button onClick={()=>applyOcr(dt.key)} style={{ background: st.applied?'#059669':'#2563eb', color:'#fff', border:'none', padding:'6px 14px', borderRadius:'6px', fontSize:'12px', fontWeight:700, cursor:'pointer', transition:'background 0.2s' }}>
                                        {st.applied ? '✓ Applied to form!' : '⬇ Apply to Form'}
                                      </button>
                                      {dt.ocrPrompt && <button onClick={()=>rescanDoc(dt.key, dt)} style={{ background:'#f8fafc', color:'#475569', border:'1px solid #cbd5e1', padding:'6px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>🔄 Re-scan</button>}
                                    </div>
                                  </div>
                                )}
                                {!st.scanning && st.ocr?.error && (
                                  <div>
                                    <div style={{ fontSize:'11.5px', color:'#dc2626', marginBottom:'8px' }}>⚠ Could not read document: {st.ocr.error}</div>
                                    {dt.ocrPrompt && <button onClick={()=>rescanDoc(dt.key, dt)} style={{ background:'#fef2f2', color:'#dc2626', border:'1px solid #fca5a5', padding:'5px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>🔄 Retry Scan</button>}
                                  </div>
                                )}
                                {!st.scanning && !st.ocr && !dt.ocrPrompt && (
                                  <div style={{ fontSize:'12px', color:'#64748b' }}>Document uploaded successfully.</div>
                                )}
                                {!st.scanning && !st.ocr && dt.ocrPrompt && hasDoc && (
                                  <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                                    <span style={{ fontSize:'12px', color:'#94a3b8' }}>Document saved.</span>
                                    <button onClick={()=>rescanDoc(dt.key, dt)} style={{ background:'#eff6ff', color:'#2563eb', border:'1px solid #bfdbfe', padding:'5px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>🤖 Scan Now</button>
                                  </div>
                                )}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>

            {/* Document Preview Lightbox */}
            {previewDoc && (() => {
              // Save to folder = download
              const handleSaveToFolder = () => {
                const a = document.createElement('a');
                a.href = previewDoc.url;
                const ext = previewDoc.isPdf ? 'pdf' : 'jpg';
                a.download = `${previewDoc.label.replace(/[^a-z0-9]/gi,'_')}.${ext}`;
                a.click();
              };
              // Open blob URL in new tab — most reliable for PDFs
              const handleOpenTab = () => {
                if (pdfBlobUrl) { window.open(pdfBlobUrl, '_blank'); }
                else if (previewDoc.url) {
                  // fallback: build blob on the fly
                  try {

                    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
                    const blob = new Blob([arr], { type:'application/pdf' });

                      </div>
                    </div>
                    <div style={{ flex:1, overflow:'hidden', display:'flex' }}>
                      {previewDoc.isPdf ? (
                        pdfBlobUrl
                          ? <object data={pdfBlobUrl} type="application/pdf" style={{ width:'100%', height:'85vh', border:'none' }}>
                              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'14px', padding:'40px', color:'#64748b' }}>
                                <div style={{ fontSize:'48px' }}>📄</div>
                                <div style={{ fontWeight:600 }}>PDF cannot display inline in this browser.</div>
                                <button onClick={()=>window.open(pdfBlobUrl,'_blank')} style={{ background:'#2563eb', color:'#fff', border:'none', padding:'10px 22px', borderRadius:'8px', fontSize:'13px', fontWeight:700, cursor:'pointer' }}>🔗 Open PDF in New Tab</button>
                              </div>
                            </object>
                          : <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:'16px', color:'#94a3b8', padding:'40px', textAlign:'center' }}>
                              <div style={{ fontSize:'48px' }}>📄</div>
                              <div style={{ fontWeight:600, color:'#64748b' }}>Building PDF preview…</div>
                            </div>
                      ) : (
                        <div style={{ overflow:'auto', flex:1, padding:'8px', display:'flex', alignItems:'center', justifyContent:'center' }}>
                          <img src={previewDoc.url} alt="Document" style={{ maxWidth:'80vw', maxHeight:'85vh', objectFit:'contain', display:'block' }} />
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* Footer */}
            <div style={{ padding:'14px 22px', borderTop:'1px solid #e2e8f0', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div style={{ fontSize:'11.5px', color:'#94a3b8' }}>
                {record.id ? `Last updated: ${record.updated_at ? new Date(record.updated_at).toLocaleDateString('en-GB') : '—'}` : 'New candidate record'}
              </div>
              <div style={{ display:'flex', gap:'10px' }}>
                <button className="hr-btn" style={S.btnSec} onClick={onClose}>Cancel</button>
                <button className="hr-btn" style={S.btnPri} onClick={collectAndSave}>💾 Save Candidate</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

  <script type="text/babel" data-presets="react">
    // ── PART 4: Interview Sheet · Styles · Root ──
    // Normalise stored value to match dropdown option (case-insensitive)
    function normaliseOpt(val, opts) {
      if (!val) return '';
      const v = val.trim();
      // exact match first
      if (opts.includes(v)) return v;
      // case-insensitive match
      const lower = v.toLowerCase();
      return opts.find(o => o.toLowerCase() === lower) || v;
    }

    // ── Sheet Field components defined OUTSIDE InterviewSheetOverlay ──────────
    // Must be outside so React doesn't recreate them on every render (which kills input focus)
    function SheetField({ label, fk, type, opts, wide, placeholder, fd, setField }) {
      const tp = type || 'text';
      return (
        <div style={{ gridColumn: wide?'span 2':'span 1', display:'flex', flexDirection:'column', gap:'3px' }}>
          <label style={{ fontSize:'10.5px', fontWeight:700, color:'#475569', textTransform:'uppercase', letterSpacing:'0.06em' }}>{label}</label>
          {opts ? (
            <select data-fk={fk} value={fd[fk]||''} onChange={e=>setField(fk,e.target.value)} style={{ padding:'7px 8px', border:'1px solid #cbd5e1', borderRadius:'6px', fontSize:'12.5px', background:'#fff' }}>
              <option value="">—</option>
              {opts.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          ) : tp==='textarea' ? (
            <textarea data-fk={fk} value={fd[fk]||''} onChange={e=>setField(fk,e.target.value)} placeholder={placeholder||''} style={{ padding:'7px 8px', border:'1px solid #cbd5e1', borderRadius:'6px', fontSize:'12.5px', minHeight:'64px', resize:'vertical', fontFamily:'inherit' }} />
          ) : tp==='number' ? (
            <input data-fk={fk} type="number" min="0" value={fd[fk]||''} onChange={e=>setField(fk,e.target.value)} placeholder={placeholder||''} style={{ padding:'7px 8px', border:'1px solid #cbd5e1', borderRadius:'6px', fontSize:'12.5px' }} />
          ) : tp==='date' ? (
            <input data-fk={fk} type="date" value={fd[fk]||''} onChange={e=>setField(fk,e.target.value)} style={{ padding:'7px 8px', border:'1px solid #cbd5e1', borderRadius:'6px', fontSize:'12.5px' }} />
          ) : (
            <input data-fk={fk} type="text" value={fd[fk]||''} onChange={e=>setField(fk,e.target.value)} placeholder={placeholder||''} style={{ padding:'7px 8px', border:'1px solid #cbd5e1', borderRadius:'6px', fontSize:'12.5px' }} />

    }

    function InterviewSheetOverlay({ candidate, onClose, showToast, onAfterSave, onHiringUpdate }) {

        name: candidate.candidate_name||'', position: candidate.position||'',

        edu_inst:  candidate.education ? (candidate.education.split('—')[2]||'').replace(/\(.*\)/,'').trim() : '',
        edu_year:  candidate.education ? (candidate.education.match(/\((\d{4})\)/)||['',''])[1] : '',
        position_applied: candidate.position||'',
        exp_years: candidate.experience||'',
        curr_employer: candidate.current_employer||'',
        curr_designation: candidate.current_designation||'',
        curr_salary: candidate.current_salary||'', notice: '',
        skills: candidate.skills||'',
        me_experience: candidate.me_experience||'',
        me_notes: candidate.me_notes||'',
        other_certs: candidate.other_certifications||'',
        dependants: candidate.dependants_count||'', children: candidate.children_count||'',
        family_uae: candidate.family_in_uae||'', emergency_contact: candidate.emergency_contact||'',
        int_date: candidate.interview_date || '',
        int_mode: candidate.interview_mode||'',
        int_by: candidate.interviewed_by||'',
        int_notes: candidate.interview_notes||'',
        verdict: candidate.interview_verdict||'',
        verdict_reason: candidate.verdict_reason||'',
        basic_salary: candidate.basic_salary ? String(Math.abs(Number(candidate.basic_salary))) : '',
        allowance: candidate.allowance||'',
        accommodation: candidate.accommodation||'', transport: candidate.transport_by||'', food: candidate.food_by||'',
        joining_date: candidate.expected_arrival_date||'', visa_cat: candidate.visa_category||'',
        deployment: candidate.deployment_site||'',
        offer_notes: candidate.offer_notes||'',
        medical_cond: normaliseOpt(candidate.medical_conditions, ['None','Diabetes','Hypertension','Heart condition','Asthma / Respiratory','Back / Spine issue','Vision impairment','Other'])||'',
        on_medication: normaliseOpt(candidate.on_medication, ['No','Yes – stable, cleared by doctor'])||'',
        colour_blind: normaliseOpt(candidate.colour_blindness, ['No','Yes – partial','Yes – complete'])||'',
        vision: normaliseOpt(candidate.vision_aids, ['No','Glasses / Contacts','Hearing aid','Both'])||'',
        fit_height: normaliseOpt(candidate.fit_for_height, ['Yes – fit','Not assessed yet','No – restricted'])||'',
        fit_cse: normaliseOpt(candidate.fit_for_cse, ['Yes – fit','Not assessed yet','No – restricted'])||'',
        medical_notes: candidate.medical_notes||'',
        gamka: normaliseOpt(candidate.gamka_result, ['Not done yet','FIT – valid','Conditionally Fit','UNFIT'])||'',
        gamka_date: candidate.gamka_date||'',
      });
      const [scores, setScores] = useState({
        technical: parseInt(candidate.interview_score_technical)||0,
        comm: parseInt(candidate.interview_score_comm)||0,
        safety: parseInt(candidate.interview_score_safety)||0,
        exp: parseInt(candidate.interview_score_exp)||0,
        attitude: parseInt(candidate.interview_score_attitude)||0,
        docs: parseInt(candidate.interview_score_docs)||0,
      });
      const [answers, setAnswers] = useState({});
      const [scanning, setScanning] = useState(false);
      const [scanFiles, setScanFiles] = useState([]);
      const [scanMsg, setScanMsg] = useState('');
      const [autoScanned, setAutoScanned] = useState(false);
      const [pdfGenerating, setPdfGenerating] = useState(false);
      const [saving, setSaving] = useState(false);

      const totalScore = Object.values(scores).reduce((a,b)=>a+b,0);
      const grade = totalScore>=26?'⭐ Excellent':totalScore>=21?'✅ Good':totalScore>=17?'🟡 Average':totalScore>0?'⚠️ Low':'—';

      // f() and set() are now defined below inside the liveRef block (see Field component)

      // Prompt text for AI extraction — defined before useEffect so it's in closure scope
      const EXTRACT_PROMPT = `You are an expert HR document reader. You may receive a resume/CV, a passport scan, or both. Extract ALL available information from every document provided.
IMPORTANT: For passport images, extract the MRZ data too (bottom 2 lines) for passport number, nationality, DOB, and expiry.
Reply ONLY with valid JSON — no markdown fences, no preamble, no explanation. Use null for any missing field.
{
  "fullName": "full name as in passport or resume",
  "dob": "YYYY-MM-DD or null",
  "nationality": "country nationality e.g. Indian",
  "passportNo": "passport number",
  "passportExpiry": "YYYY-MM-DD or null",
  "placeOfIssue": "city/country of passport issue",
  "phone": "+country-code number",
  "whatsApp": "+country-code number or same as phone",
  "email": "email address",
  "address": "home address",
  "languages": "comma-separated languages",
  "currentLocation": "current country — look for UAE visa, residency, or address clues; or country code in phone number (971=UAE, 91=India, 92=Pakistan)",
  "religion": "religion if visible OR infer from name/nationality context (e.g. Indian Hindu names, Islamic names for Gulf/Pakistani candidates) — return Islam, Hinduism, Christianity, or Other; null only if truly ambiguous",
  "maritalStatus": "Single or Married or Divorced or Widowed",
  "position": "job title applied for or current role",
  "totalExperience": "total years as number string",
  "currentEmployer": "current or most recent company",
  "currentDesignation": "current or most recent job title",
  "currentSalary": "current salary if mentioned",
  "skills": "comma-separated key technical skills",
  "education": {"level": "highest qualification", "specialisation": "field/trade", "institution": "college/university", "year": "graduation year"},
  "referredBy": "referred by name if mentioned",
  "meExperience": "yes if worked in UAE/Saudi Arabia/Qatar/Kuwait/Bahrain/Oman/Iraq, otherwise no",
  "meNotes": "list ALL companies from experience table regardless of country, format: Company (Country) — Role, Period; ..."
}`;

      // Auto-scan saved documents on first open
      React.useEffect(() => {
        if (autoScanned) return;
        const resumeData    = candidate.resume_url;
        const passportData  = candidate.passport_img_url;
        if (!resumeData && !passportData) return; // nothing stored, skip

        setAutoScanned(true);
        setScanning(true);
        setScanMsg('Reading saved documents…');

        (async () => {
          try {
            const parts = [];
            // Add passport if available
            if (passportData && passportData.startsWith('data:')) {
              const isPdf = passportData.startsWith('data:application/pdf');
              const b64   = passportData.split(',')[1];
              parts.push(isPdf
                ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:b64}}
                : {type:'image',    source:{type:'base64', media_type: passportData.split(';')[0].split(':')[1], data:b64}});
            }
            // Add resume if available
            if (resumeData && resumeData.startsWith('data:')) {
              const isPdf = resumeData.startsWith('data:application/pdf');
              const b64   = resumeData.split(',')[1];
              parts.push(isPdf
                ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:b64}}
                : {type:'image',    source:{type:'base64', media_type: resumeData.split(';')[0].split(':')[1], data:b64}});
            }
            if (parts.length === 0) { setScanning(false); setScanMsg(''); return; }

            parts.push({type:'text', text: EXTRACT_PROMPT});
            setScanMsg(`Extracting from ${parts.length - 1} saved doc(s)…`);

            const resp = await fetch('/api/claude', {
              method:'POST',
              headers:{
                'Content-Type':'application/json'
              },
              body: JSON.stringify({model:'claude-haiku-4-5-20251001', max_tokens:2000, messages:[{role:'user',content:parts}]})
            });
            if (!resp.ok) throw new Error(`API ${resp.status} — check ANTHROPIC_KEY in Vercel env vars`);
            const json   = await resp.json();
            const raw    = (json.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
            const d = parseClaudeJson(raw);

            setFd(prev => { const next = {...prev,
              name:           d.fullName            || prev.name,
              dob:            d.dob                 || prev.dob,
              nationality:    normaliseOpt(d.nationality, ['Indian','Pakistani','Bangladeshi','Sri Lankan','Nepali','Filipino','Egyptian','Sudanese','Ethiopian','Other']) || prev.nationality,
              passport_no:    d.passportNo          || prev.passport_no,
              passport_expiry:d.passportExpiry      || prev.passport_expiry,
              place_of_issue: d.placeOfIssue        || prev.place_of_issue,
              phone:          d.phone               || prev.phone,
              whatsapp:       d.whatsApp||d.phone   || prev.whatsapp,
              email:          d.email               || prev.email,
              address:        (() => {
                const a = d.address || prev.address || '';
                // Detect garbage: if any single character repeats >10 times in a row, discard
                if (/(.)\1{10,}/.test(a)) return prev.address || '';
                return a.slice(0, 200) || prev.address;
              })(),
              languages:      d.languages           || prev.languages,
              location:       (() => {
                const loc = normaliseOpt(d.currentLocation, ['India','UAE','Pakistan','Bangladesh','Sri Lanka','Nepal','Philippines','Oman','Saudi Arabia','Qatar','Kuwait','Bahrain','Other']);
                if (loc) return loc;
                if (prev.location) return prev.location;
                // Infer from phone country code
                const ph = d.phone || '';
                if (ph.startsWith('+971')) return 'UAE';
                if (ph.startsWith('+91')) return 'India';
                if (ph.startsWith('+92')) return 'Pakistan';
                if (ph.startsWith('+880')) return 'Bangladesh';
                return '';
              })(),
              religion:       (() => {
                const rel = normaliseOpt(d.religion, ['Islam','Hinduism','Christianity','Other']);
                if (rel) return rel;
                if (prev.religion) return prev.religion;
                // Infer from nationality when not stated
                const nat = (d.nationality || '').toLowerCase();
                if (nat.includes('indian') || nat.includes('nepali') || nat.includes('sri lankan')) return 'Hinduism';
                if (nat.includes('pakistani') || nat.includes('bangladeshi') || nat.includes('egyptian') || nat.includes('sudanese')) return 'Islam';
                if (nat.includes('filipino')) return 'Christianity';
                return '';
              })(),
              marital:        normaliseOpt(d.maritalStatus, ['Single','Married','Divorced','Widowed']) || prev.marital,
              position_applied: d.position         || prev.position_applied,
              exp_years:       d.totalExperience   || prev.exp_years,
              curr_employer:   d.currentEmployer   || prev.curr_employer,
              curr_designation:d.currentDesignation|| prev.curr_designation,
              curr_salary:     d.currentSalary     || prev.curr_salary,
              skills:          d.skills            || prev.skills,
              referred_by:     d.referredBy        || prev.referred_by,
              edu_level:       (d.education&&d.education.level)         || prev.edu_level,
              edu_spec:        (d.education&&d.education.specialisation) || prev.edu_spec,
              edu_inst:        (d.education&&d.education.institution)    || prev.edu_inst,
              edu_year:        (d.education&&d.education.year)           || prev.edu_year,
              me_experience:   d.meExperience       || prev.me_experience,
              me_notes:        d.meNotes            || prev.me_notes,
            }; fdRef.current = next; return next; });
            showToast(`✅ Auto-filled from saved ${parts.length-1 > 1 ? 'resume + passport' : 'document'}`);
          } catch(e) {
            console.error('Auto-scan error:', e);
            showToast('⚠️ Auto-scan failed: ' + e.message, 'error');
          }
          setScanning(false);
          setScanMsg('');
        })();
      }, []); // run once on mount
      // fdRef mirrors fd state — always current even mid-type
      // Buttons read from fdRef; inputs are controlled via fd state
      const fdRef = React.useRef(fd);
      React.useEffect(() => { fdRef.current = fd; }, [fd]);
      const setField = (key, val) => setFd(p => { const n={...p,[key]:val}; fdRef.current=n; return n; });
      const f = (key) => fdRef.current[key] || '';

      // Field and SH are defined outside this component (see SheetField / SheetSH below)
      // They receive fd and setField as props to avoid being redefined on every render

      const toBase64 = (file) => new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=()=>rej(new Error('read failed'));r.readAsDataURL(file);});

      const addScanFile = (file) => {

          if (prev.length >= 3) { showToast('Max 3 documents at once', 'error'); return prev; }

      const scanAllDocs = async () => {
        if (scanFiles.length === 0) { showToast('Add at least one document first', 'error'); return; }
        setScanning(true);
        setScanMsg('Reading documents…');
        try {
          // Build content parts — all docs + single instruction at end
          const parts = [];
          for (const file of scanFiles) {
            const b64 = await toBase64(file);
            const isPdf = file.type === 'application/pdf';
            parts.push(isPdf
              ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:b64}}
              : {type:'image', source:{type:'base64', media_type:file.type, data:b64}});
          }
          parts.push({type:'text', text: EXTRACT_PROMPT});

          setScanMsg('AI extracting details…');
          const resp = await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,messages:[{role:'user',content:parts}]})});
          if (!resp.ok) throw new Error(`API ${resp.status} — check ANTHROPIC_KEY`);
          const json = await resp.json();
          const raw = (json.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
          const d = parseClaudeJson(raw);
          setFd(prev => ({...prev,
            name: d.fullName||prev.name,
            dob: d.dob||prev.dob,
            nationality: normaliseOpt(d.nationality, ['Indian','Pakistani','Bangladeshi','Sri Lankan','Nepali','Filipino','Egyptian','Sudanese','Ethiopian','Other'])||prev.nationality,
            passport_no: d.passportNo||prev.passport_no,

            email: d.email||prev.email,
            address: (() => { const a = d.address||''; return /(.)\1{10,}/.test(a) ? prev.address||'' : (a.slice(0,200)||prev.address); })(),
            languages: d.languages||prev.languages,
            location: (() => {
              const loc = normaliseOpt(d.currentLocation, ['India','UAE','Pakistan','Bangladesh','Sri Lanka','Nepal','Philippines','Oman','Saudi Arabia','Qatar','Kuwait','Bahrain','Other']);
              if (loc) return loc;
              if (prev.location) return prev.location;
              const ph = d.phone || '';
              if (ph.startsWith('+971')) return 'UAE';
              if (ph.startsWith('+91')) return 'India';
              if (ph.startsWith('+92')) return 'Pakistan';
              if (ph.startsWith('+880')) return 'Bangladesh';

            })(),

              if (prev.religion) return prev.religion;
              const nat = (d.nationality || '').toLowerCase();
              if (nat.includes('indian') || nat.includes('nepali') || nat.includes('sri lankan')) return 'Hinduism';
              if (nat.includes('pakistani') || nat.includes('bangladeshi') || nat.includes('egyptian') || nat.includes('sudanese')) return 'Islam';
              if (nat.includes('filipino')) return 'Christianity';

            })(),
            marital: normaliseOpt(d.maritalStatus, ['Single','Married','Divorced','Widowed'])||prev.marital,

            exp_years: d.totalExperience||prev.exp_years,

            curr_designation: d.currentDesignation||prev.curr_designation,
            curr_salary: d.currentSalary||prev.curr_salary,
            skills: d.skills||prev.skills,
            referred_by: d.referredBy||prev.referred_by,
            edu_level: (d.education&&d.education.level)||prev.edu_level,
            edu_spec: (d.education&&d.education.specialisation)||prev.edu_spec,
            edu_inst: (d.education&&d.education.institution)||prev.edu_inst,
            edu_year: (d.education&&d.education.year)||prev.edu_year,
            me_experience: d.meExperience||prev.me_experience,
            me_notes: d.meNotes||prev.me_notes,
          }));
          setScanFiles([]); // clear after success
          showToast(`✅ ${scanFiles.length} document(s) scanned — details filled in`);
          // Save newly uploaded docs back to the candidate record so they persist
          if (candidate.id) {
            const patch = {};
            // If we scanned new files, try to save them to the appropriate field
            // We can't know which is passport vs resume from the overlay, so save
            // the first image/pdf as a general scan record on interview_sheet_url
            // (the proper fields resume_url/passport_img_url are set via the Documents tab)
            // Just trigger a DB refresh so the hiring list re-fetches updated data
            await db.from('hiring_pipeline')
              .update({ updated_at: new Date().toISOString() })
              .eq('id', candidate.id);
          }
        } catch(e) {
          console.error('Scan error:', e);
          showToast('⚠️ Scan failed: ' + e.message, 'error');
        }
        setScanning(false);
        setScanMsg('');
      };

      const resumePromptText = () => `You are an expert HR document reader. You may receive a resume/CV, a passport scan, or both. Extract ALL available information from every document provided.
IMPORTANT: For passport images, extract the MRZ data too (bottom 2 lines) for passport number, nationality, DOB, and expiry.
Reply ONLY with valid JSON — no markdown fences, no preamble, no explanation. Use null for any missing field.
{

      const printSheet = async () => {
        // ── build a pre-filled, fillable PDF with pdf-lib ──────────────────
        const { PDFDocument, rgb, StandardFonts, PDFName, PDFString, PDFArray,
                PDFNumber, PDFBool, PDFDict, PDFHexString } = PDFLib;

        // ── colours ─────────────────────────────────────────────────────────
        const NAVY   = rgb(0.059, 0.153, 0.267);   // #0f2744
        const BLUE   = rgb(0.102, 0.337, 0.859);   // #1a56db
        const LGRAY  = rgb(0.945, 0.961, 0.980);   // #f1f5f9
        const DGRAY  = rgb(0.282, 0.349, 0.412);   // #475569
        const MGRAY  = rgb(0.580, 0.631, 0.690);   // #94a3b8
        const BORDER = rgb(0.796, 0.851, 0.906);   // #cbd5e1
        const WHITE  = rgb(1, 1, 1);
        const BLACK  = rgb(0, 0, 0);
        const AMBER  = rgb(0.851, 0.471, 0.027);   // #d97706
        const GREEN_B= rgb(0.941, 0.996, 0.961);   // #f0fdf4
        const GREEN_D= rgb(0.525, 0.937, 0.675);   // #86efac
        const GREEN_T= rgb(0.024, 0.373, 0.243);   // #065f46
        const RED    = rgb(0.863, 0.149, 0.149);   // #dc2626
        const ORANGE = rgb(0.851, 0.471, 0.027);

        const pdfDoc = await PDFDocument.create();
        const bold   = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
        const reg    = await pdfDoc.embedFont(StandardFonts.Helvetica);

        // A4 in pts
        const PW = 595.28, PH = 841.89;
        const ML = 14*2.835, MR = 14*2.835;   // 14mm in pts
        const CW = PW - ML - MR;

        const today = new Date();
        const dateStr = today.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
        const refStr  = `SATCO/HR/${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
        const candName= f('name') || 'Candidate';
        const fname   = `SATCO_Interview_${candName.replace(/\s+/g,'_')}_${today.toISOString().slice(0,10)}.pdf`;

        // ── acroform field tracker ───────────────────────────────────────────
        const allFields = [];

        // ── page factory ────────────────────────────────────────────────────
        let page, pageH;
        const pages = [];
        const addPage = () => {
          page  = pdfDoc.addPage([PW, PH]);
          pageH = PH;
          pages.push(page);
          // footer
          page.drawText('SATCO Arabia General Contracting  |  satcoarabiaengg.com  |  CONFIDENTIAL',
            { x:ML, y:8*2.835, font:reg, size:6, color:MGRAY });
          page.drawText(refStr, { x:PW-MR-60, y:8*2.835, font:reg, size:6, color:MGRAY });
          return PH - 14*2.835;   // returns starting y (top)
        };

        // ── drawing helpers (y is top-down from top of page; PDF y is bottom-up) ──
        const py = (y) => y;   // already in PDF coords (we track from bottom up)

        const drawRect = (x, y, w, h, opts={}) => {
          page.drawRectangle({ x, y, width:w, height:h,
            color:       opts.fill   || undefined,
            borderColor: opts.stroke || undefined,
            borderWidth: opts.lw     || (opts.stroke ? 0.5 : 0),
            opacity: 1,
          });
        };

        // Strip chars that WinAnsi (Helvetica) cannot encode — anything outside latin-1 + cp1252 extras
        const toWinAnsi = (s) => s.replace(/[^\x00-\xFF\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u2026\u20AC]/g, '')
          .replace(/\u2013/g,'-').replace(/\u2014/g,'--')
          .replace(/\u2018/g,"'").replace(/\u2019/g,"'")
          .replace(/\u201C/g,'"').replace(/\u201D/g,'"')
          .replace(/\u2022/g,'*').replace(/\u2026/g,'...')
          .replace(/\u20AC/g,'EUR');
        const drawText = (txt, x, y, opts={}) => {
          if (!txt && txt!==0) return;
          const s   = toWinAnsi(String(txt));
          if (!s) return;
          const fnt = opts.bold ? bold : reg;
          const sz  = opts.size || 8;
          const col = opts.color || BLACK;
          // clip to maxW if specified
          let drawn = s;
          if (opts.maxW) {
            let w = fnt.widthOfTextAtSize(drawn, sz);
            while (drawn.length > 1 && w > opts.maxW) {
              drawn = drawn.slice(0, -1);
              w = fnt.widthOfTextAtSize(drawn+'...', sz);
            }
            if (drawn !== s) drawn += '...';
          }
          page.drawText(drawn, { x, y, font:fnt, size:sz, color:col });
        };

        // Section header — returns new y below header
        const drawSection = (num, title, y) => {
          const H = 17;
          drawRect(ML, y-H, CW, H, { fill:NAVY });
          // circle
          drawRect(ML+5, y-H+3.5, 11, 11, { fill:BLUE });
          drawText(String(num), ML+7.5, y-H+5.5, { bold:true, size:7, color:WHITE });
          drawText(title.toUpperCase(), ML+22, y-H+5, { bold:true, size:8, color:WHITE });
          return y - H - 4;
        };

        // ── Text fit helpers ─────────────────────────────────────────────────
        // Clip a string to fit within maxPts width at given font size, adding ellipsis
        const clipText = (str, font, size, maxPts) => {
          if (!str) return '';
          const s = toWinAnsi(String(str)); // convert first so measurement matches drawn text
          if (font.widthOfTextAtSize(s, size) <= maxPts) return s;
          const ellipsis = '...';
          let cut = s;
          while (cut.length > 1) {
            cut = cut.slice(0, -1);
            if (font.widthOfTextAtSize(cut + ellipsis, size) <= maxPts) return cut + ellipsis;
          }
          return ellipsis;
        };

        // Word-wrap text into lines that fit within maxPts, breaking long words
        const wrapText = (str, font, size, maxPts) => {
          if (!str) return [];
          const words = toWinAnsi(String(str)).split(/\s+/); // convert first so measurement matches
          const lines = [];
          let line = '';
          for (const word of words) {
            // Break a word that is itself too wide
            let w = word;
            while (font.widthOfTextAtSize(w, size) > maxPts && w.length > 1) {
              // find how many chars fit
              let sub = w;
              while (sub.length > 1 && font.widthOfTextAtSize(sub, size) > maxPts) sub = sub.slice(0,-1);
              const part = sub;
              if (line) { lines.push(line); line = ''; }
              lines.push(part);
              w = w.slice(part.length);
            }
            if (!w) continue;
            const test = line ? line + ' ' + w : w;
            if (font.widthOfTextAtSize(test, size) > maxPts) {
              if (line) lines.push(line);
              line = w;
            } else {
              line = test;
            }
          }
          if (line) lines.push(line);
          return lines;
        };

        // Label + pre-filled value + register AcroForm field — returns height consumed
        const drawField = (label, fieldName, x, y, w, value='', opts={}) => {
          const LH  = 10;
          const isMulti   = opts.multi || false;
          const isDrop    = opts.dropOpts && opts.dropOpts.length > 0;
          const val       = String(value || '');
          const FONT_SZ   = 8;
          const TEXT_PAD  = 4;       // left padding inside box
          const maxTxtW   = w - TEXT_PAD*2 - (isDrop ? 14 : 4); // extra 4pt safety margin

          // For multi-line: calculate required height based on content
          let IH;
          if (opts.fh) {
            IH = opts.fh;
          } else if (isMulti) {
            const lines = wrapText(val, reg, FONT_SZ, maxTxtW);
            const linesNeeded = Math.max(lines.length, 2);
            IH = Math.min(Math.max(linesNeeded * 10 + 6, 24), 64);
          } else {
            IH = 16;
          }
          const PAD = 4;
          const iy  = y - LH - 2 - IH;

          // Label
          drawText(label.toUpperCase(), x, y - LH + 1, { bold:true, size:6.5, color:DGRAY });

          // Box — light blue tint for dropdowns, white for text
          page.drawRectangle({
            x, y:iy, width:w, height:IH,
            color: isDrop ? rgb(0.941, 0.953, 0.996) : WHITE,
            borderColor: BORDER, borderWidth: 0.7, opacity:1
          });

          // Dropdown arrow indicator
          if (isDrop) {
            drawText('v', x + w - 9, iy + IH/2 - 3.5, { size:6, color:MGRAY });
          }

          // Value text
          if (val) {
            if (isMulti) {
              const lines = wrapText(val, reg, FONT_SZ, maxTxtW);
              let lineY = iy + IH - 10;
              for (const ln of lines) {
                if (lineY < iy + 2) break; // clip to box
                page.drawText(toWinAnsi(ln), { x:x+TEXT_PAD, y:lineY, font:reg, size:FONT_SZ, color:BLACK });
                lineY -= 10;
              }
            } else {
              // Single line — always clip to fit
              const fitted = clipText(val, reg, FONT_SZ, maxTxtW);
              page.drawText(toWinAnsi(fitted), { x:x+TEXT_PAD, y:iy+IH/2-3.5, font:reg, size:FONT_SZ, color:BLACK });
            }
          } else {
            // Empty field — faint underscore
            page.drawLine({ start:{x:x+TEXT_PAD, y:iy+3}, end:{x:x+w-TEXT_PAD, y:iy+3},
              thickness:0.3, color:LGRAY });
          }

          // Register AcroForm field
          allFields.push({ page, name:fieldName, x, y:iy, w, h:IH,
            value:val, opts:opts.dropOpts||[], multi:isMulti,
            ftype: isDrop ? 'combo' : 'text' });

          return LH + 2 + IH + PAD;
        };

        // Grid layout: array of field specs, returns new y
        const drawGrid = (fields, y, cols=2) => {
          const gap = 4*2.835;
          const cw  = (CW - (cols-1)*gap) / cols;
          const xs  = Array.from({length:cols}, (_,i) => ML + i*(cw+gap));
          let ci=0, rowY=y, rowH=0;
          for (const f2 of fields) {
            const span = f2.wide ? cols : 1;
            const fw   = cw*span + gap*(span-1);
            const fx   = xs[ci];
            const h    = drawField(f2.label, f2.name, fx, rowY, fw,
              f2.value, { fh:f2.fh, multi:f2.multi, dropOpts:f2.opts });
            rowH = Math.max(rowH, h);
            ci += span;
            if (ci >= cols) { rowY -= rowH; rowH=0; ci=0; }
          }
          if (ci) rowY -= rowH;
          return rowY - 2;
        };

        // Check page space, add new page if needed
        let curY;
        const checkPage = (need=50) => {
          if (curY < 14*2.835 + need) curY = addPage();

        // ── PAGE 1 ──────────────────────────────────────────────────────────
        curY = addPage();

        // Banner
        drawRect(ML, curY-28*2.835, CW, 22*2.835, { fill:NAVY });
        drawText('SATCO Arabia General Contracting', ML+5*2.835, curY-17*2.835, { bold:true, size:15, color:WHITE });
        drawText('Abu Dhabi, UAE  |  satcoarabiaengg.com', ML+5*2.835, curY-22.5*2.835, { size:8, color:rgb(0.576,0.769,0.988) });
        // Right box
        const tx = PW - MR - 70*2.835;
        drawRect(tx, curY-27*2.835, 68*2.835, 21*2.835, { fill:BLUE });
        drawText('CANDIDATE INTERVIEW SHEET', tx+4*2.835, curY-17.5*2.835, { bold:true, size:9.5, color:WHITE });
        drawText(`Date : ${dateStr}`, tx+4*2.835, curY-22*2.835, { size:7.5, color:rgb(0.749,0.855,0.996) });
        drawText(`Ref  : ${refStr}`,  tx+4*2.835, curY-25.5*2.835, { size:7.5, color:rgb(0.749,0.855,0.996) });
        curY -= 32*2.835;

        // ── S1: PERSONAL ────────────────────────────────────────────────────
        curY = drawSection(1, 'Personal & Passport Details', curY);
        curY = drawGrid([
          { label:'Full Name (as per passport) *', name:'candidate_name', value:f('name'),       wide:true },

          { label:'Passport Number *',             name:'passport_no',    value:f('passport_no') },
          { label:'Passport Expiry *',             name:'passport_expiry',value:f('passport_expiry') },
          { label:'Place of Issue',                name:'place_of_issue', value:f('place_of_issue') },
          { label:'Religion',                      name:'religion',       value:f('religion'),
            opts:['','Islam','Hinduism','Christianity','Other'] },

            opts:['','Single','Married','Divorced','Widowed'] },

          { label:'Email',                         name:'email',          value:f('email'), wide:true },
          { label:'Current Location',              name:'current_location',value:f('location'),

          { label:'Languages Known',               name:'languages',      value:f('languages'), wide:true, multi:true, fh:20 },
          { label:'Referred By',                   name:'referred_by',    value:f('referred_by') },
          { label:'Permanent Home Address',        name:'home_address',   value:(f('address')||'').slice(0,200), wide:true, multi:true, fh:40 },
        ], curY);

        // ── S2: EDUCATION ───────────────────────────────────────────────────
        checkPage(75);
        curY = drawSection(2, 'Education Qualification', curY);

          { label:'Highest Qualification', name:'edu_level', value:f('edu_level'),

          { label:'Specialisation / Trade', name:'edu_spec', value:f('edu_spec') },
          { label:'Institution / College',  name:'edu_inst', value:f('edu_inst') },
          { label:'Year of Passing',        name:'edu_year', value:f('edu_year') },
        ], curY);

        // ── S3: EXPERIENCE ──────────────────────────────────────────────────
        checkPage(110);
        curY = drawSection(3, 'Professional Experience', curY);
        curY = drawGrid([
          { label:'Position Applied For *',        name:'position_applied',    value:f('position_applied') },
          { label:'Total Years of Experience *',   name:'experience',          value:f('exp_years') },
          { label:'Current / Last Employer',       name:'current_employer',    value:f('curr_employer') },
          { label:'Current / Last Designation',    name:'current_designation', value:f('curr_designation') },
          { label:'Current Salary',                name:'current_salary',      value:f('curr_salary') },
          { label:'Notice Period / Available From',name:'notice_period',       value:f('notice') },
          { label:'Key Skills & Competencies',     name:'skills',              value:f('skills'), wide:true, multi:true },
        ], curY);

        // ── S4: MIDDLE EAST ─────────────────────────────────────────────────
        checkPage(75);
        curY = drawSection(4, 'Experience & Middle East', curY);
        curY = drawGrid([
          { label:'Has Middle East / Gulf Experience?', name:'me_experience', value:f('me_experience'),
            opts:['','Yes','No'] },
          { label:'Work History (All Companies)', name:'me_notes',      value:f('me_notes'), multi:true, fh:32 },
        ], curY);

        // ── S5: CERTIFICATIONS ──────────────────────────────────────────────
        checkPage(60);
        curY = drawSection(5, 'Certifications & Training', curY);

        const HSE_CERTS = [
          'ADNOC HSE Induction & LSR','H2S Awareness (Level 1)','H2S / SCBA (Level 2)',
          'Basic Fire Fighting / Fire Warden','First Aid / CPR','Working at Height Medical',

          'Rigger Level 2','Scaffold Erector (CISRS/STI)','DROPS Awareness',
