        ];
        const PROF_CERTS = [
          'CSWIP 3.1 Welding Inspector','AWS-CWI','API 510','API 570','API 653',
          'NACE Coating Inspector Lvl 2','NDT Level II','ISO 9001 Lead Auditor',
          'SOE Card (UAE)','ADNOC TPA','PMP / PMI','NEBOSH IGC','IOSH',
        ];

        const CW2 = (CW - 4*2.835) / 2;
        drawText('HSE & SITE CERTIFICATIONS',      ML,         curY-10, { bold:true, size:6.5, color:DGRAY });
        drawText('PROFESSIONAL CERTIFICATIONS',    ML+CW2+4*2.835, curY-10, { bold:true, size:6.5, color:DGRAY });
        drawText('EXPIRY',  ML+CW2-22, curY-10, { bold:true, size:6, color:MGRAY });
        drawText('EXPIRY',  ML+CW-22,  curY-10, { bold:true, size:6, color:MGRAY });
        curY -= 14;

        for (let i=0; i < Math.max(HSE_CERTS.length, PROF_CERTS.length); i++) {
          checkPage(14);
          const rowY = curY;
          [[0, HSE_CERTS,  'hse'], [1, PROF_CERTS, 'prof']].forEach(([col, list, base]) => {
            if (i >= list.length) return;
            const cert = list[i];
            const cx = col===0 ? ML : ML+CW2+4*2.835;
            const BX = 9;
            drawRect(cx, rowY-BX, BX, BX, { fill:WHITE, stroke:BORDER, lw:0.5 });
            allFields.push({ page, name:`${base}_${i}_chk`, x:cx, y:rowY-BX, w:BX, h:BX,
              value:'', opts:[], multi:false, isCheck:true });
            drawText(cert.slice(0,36), cx+13, rowY-7.5, { size:7.5, color:BLACK });
            const EW = 24*2.835;
            const ex = cx+CW2-EW-2;
            drawRect(ex, rowY-BX-1, EW, BX+2, { fill:WHITE, stroke:BORDER, lw:0.5 });
            allFields.push({ page, name:`${base}_${i}_exp`, x:ex, y:rowY-BX-1, w:EW, h:BX+2, value:'', opts:[], multi:false });
            page.drawLine({ start:{x:cx,y:rowY-BX-4}, end:{x:cx+CW2,y:rowY-BX-4},
              thickness:0.3, color:LGRAY });
          });
          curY -= 14;
        }

        checkPage(48);
        drawText('OTHER CERTIFICATES / TRADE TESTS', ML, curY-10, { bold:true, size:6.5, color:DGRAY });
        curY -= 14;
        const OH = 26;
        drawRect(ML, curY-OH, CW, OH, { fill:WHITE, stroke:BORDER, lw:0.6 });
        allFields.push({ page, name:'other_certs', x:ML, y:curY-OH, w:CW, h:OH, value:f('other_certs')||'', opts:[], multi:true });
        if (f('other_certs')) drawText(f('other_certs'), ML+4, curY-OH+OH/2-3, { size:8, color:BLACK, maxW:CW-10 });
        curY -= OH + 8;

        // ── S6: FAMILY ──────────────────────────────────────────────────────
        checkPage(70);
        curY = drawSection(6, 'Family Details', curY);
        curY = drawGrid([
          { label:'No. of Dependants', name:'dependants',        value:f('dependants') },
          { label:'No. of Children',   name:'children',          value:f('children') },
          { label:'Family in UAE?',    name:'family_uae',        value:f('family_uae'),
            opts:['','No - family in home country','Yes - on family visa'] },
          { label:'Emergency Contact', name:'emergency_contact', value:f('emergency_contact') },
        ], curY);

        // ── S7: INTERVIEW ASSESSMENT ────────────────────────────────────────
        checkPage(130);
        curY = drawSection(7, 'Interview Assessment — Filled by Interviewer', curY);

        const SCORE_CRITERIA = [
          ['Technical Knowledge',   'technical'],
          ['Communication Skills',  'comm'],
          ['Safety Awareness',      'safety'],
          ['Experience Match',      'exp'],
          ['Attitude & Discipline', 'attitude'],
          ['Certifications & Docs', 'docs'],
        ];
        const SC_W = (CW - 4*2.835) / 2;
        let scY = curY;
        SCORE_CRITERIA.forEach(([lbl, key], idx) => {
          const sx = idx%2===0 ? ML : ML+SC_W+4*2.835;
          if (idx%2===0 && idx>0) scY -= 34;
          drawRect(sx, scY-30, SC_W, 30, { fill:LGRAY, stroke:BORDER, lw:0.4 });
          drawText(lbl.toUpperCase(), sx+4, scY-12, { bold:true, size:6.5, color:DGRAY });
          for (let n=1; n<=5; n++) {
            const bx = sx+4+(n-1)*18, by = scY-27;
            const sv = scores[key]||0;
            const filled = sv >= n;
            drawRect(bx, by, 14, 11, { fill: filled ? rgb(0.984,0.753,0.141) : WHITE, stroke: filled ? AMBER : BORDER, lw: filled ? 0.8 : 0.4 });
            drawText(String(n), bx+4, by+2, { bold: filled, size:7, color: filled ? rgb(0.573,0.251,0.055) : DGRAY });
          }
          const efx = sx+SC_W-18;
          drawRect(efx, scY-27, 14, 11, { fill:WHITE, stroke:AMBER, lw:1 });
          const sv = scores[key]||0;
          if (sv) drawText(String(sv), efx+4, scY-23, { bold:true, size:8, color:rgb(0.573,0.251,0.055) });
          allFields.push({ page, name:`score_${key}`, x:efx, y:scY-27, w:14, h:11, value:String(sv||''), opts:[], multi:false });
        });
        scY -= 34;
        curY = scY;

        // Total score
        const totBox = { x:PW-MR-34*2.835, y:curY, w:32*2.835, h:28 };
        drawRect(totBox.x, totBox.y, totBox.w, totBox.h, { fill:NAVY });
        const tsStr = String(totalScore||'—');
        drawText(tsStr, totBox.x+totBox.w/2 - bold.widthOfTextAtSize(tsStr,18)/2, curY+10,
          { bold:true, size:18, color:WHITE });
        drawText('/ 30', totBox.x+totBox.w/2 - reg.widthOfTextAtSize('/ 30',7)/2, curY+3,
          { size:7, color:rgb(0.576,0.769,0.988) });
        drawText(grade.replace(/[^\x20-\x7E\xA0-\xFF]/g,'').trim(), totBox.x+2, curY+20,
          { size:6.5, color:rgb(0.431,0.906,0.682) });
        allFields.push({ page, name:'score_total', x:totBox.x, y:totBox.y, w:totBox.w, h:totBox.h,
          value:String(totalScore||''), opts:[], multi:false });
        curY -= 34;

        // Q&A
        const IVW_QS = [
          'Describe your experience with the trade / discipline applied for.',
          'What types of projects / clients have you worked for? (Oil & Gas, EPC, Offshore)',
          'Are you familiar with ADNOC standards and permit-to-work systems?',
          'Explain a safety incident you witnessed and how you handled it.',
          'What are your salary expectations and when can you join?',
          'Any family obligations that may affect remote site deployment?',
          'Are you comfortable with shift work, overtime, or site rotations?',
          'Do you have any outstanding visa bans or immigration issues?',
          'References — who can vouch for your work? (Name / Contact)',
        ];
        drawText('INTERVIEW Q&A', ML, curY-9, { bold:true, size:7.5, color:DGRAY });
        page.drawLine({ start:{x:ML,y:curY-11}, end:{x:ML+CW,y:curY-11}, thickness:0.6, color:BORDER });
        curY -= 15;

        IVW_QS.forEach((q, i) => {
          checkPage(38);
          drawText(`Q${i+1}.  ${q}`, ML, curY-9, { bold:true, size:8, color:BLACK, maxW:CW-4 });
          const AH = 20;
          drawRect(ML, curY-9-AH-2, CW, AH, { fill:WHITE, stroke:BORDER, lw:0.5 });
          const ans = answers[i]||'';
          if (ans) drawText(ans, ML+4, curY-9-AH-2+AH/2-3.5, { size:8, color:BLACK, maxW:CW-10 });
          allFields.push({ page, name:`q${i+1}`, x:ML, y:curY-9-AH-2, w:CW, h:AH, value:ans, opts:[], multi:true });
          curY -= AH+15;
        });

        // Recommendation
        checkPage(100);
        drawText('RECOMMENDATION', ML, curY-9, { bold:true, size:7, color:DGRAY });
        const ry = curY-9;
        const VERDICTS = [['Selected','#059669'],['On Hold','#d97706'],['Not Suitable','#dc2626']];
        const curVerdict = f('verdict');
        VERDICTS.forEach(([vlbl, vcol], vi) => {
          const bx = ML+vi*56*2.835;
          const isSel = curVerdict.toLowerCase() === vlbl.toLowerCase();
          const col3 = parseInt(vcol.slice(1),16);
          const vrgb = rgb(((col3>>16)&255)/255, ((col3>>8)&255)/255, (col3&255)/255);
          drawRect(bx, ry-18, 52*2.835, 15, { fill: isSel?vrgb:WHITE, stroke:vrgb, lw:0.8 });
          drawText(vlbl, bx+4, ry-12, { bold:true, size:8, color: isSel?WHITE:vrgb });
        });
        allFields.push({ page, name:'verdict', x:ML, y:ry-18, w:CW, h:15, value:curVerdict, opts:[], multi:false });
        curY = ry - 24;

        curY = drawGrid([
          { label:'Interview Date',           name:'interview_date', value:f('int_date') },
          { label:'Interviewed By',           name:'interviewed_by', value:f('int_by') },
          { label:'Interview Mode',           name:'interview_mode', value:f('int_mode'),
            opts:['','In-person (Abu Dhabi)','In-person (Dubai)','Video Call (WhatsApp)','Video Call (Teams)','Telephone'] },
          { label:'Overall Grade',            name:'grade',          value:grade.replace(/[⭐✅🟡⚠️]/g,'').trim() },
          { label:'Verdict Reason / Notes',   name:'verdict_reason', value:f('verdict_reason'),   wide:true, multi:true, fh:26 },
          { label:'Interviewer Observations', name:'interview_notes',value:f('int_notes'),          wide:true, multi:true, fh:26 },
        ], curY);

        // ── S8: OFFER ───────────────────────────────────────────────────────
        checkPage(130);
        curY = drawSection(8, 'Offer & Joining Details', curY);
        curY = drawGrid([
          { label:'Basic Salary (AED)', name:'basic_salary', value:f('basic_salary') },
          { label:'Allowance (AED)',    name:'allowance',    value:f('allowance') },
        ], curY);

        const totalCtcPdf = (parseFloat(f('basic_salary'))||0) + (parseFloat(f('allowance'))||0);
        // CTC summary box — green highlighted, clearly labelled
        page.drawRectangle({ x:ML, y:curY-18, width:CW, height:18,
          color:GREEN_B, borderColor:GREEN_D, borderWidth:0.8, opacity:1 });
        drawText('TOTAL CTC (AED):', ML+6, curY-11, { bold:true, size:8, color:GREEN_T });
        const ctcVal = totalCtcPdf > 0 ? totalCtcPdf.toLocaleString() : '___________';
        drawText(ctcVal, ML+90, curY-11, { bold:true, size:9, color:GREEN_T });
        allFields.push({ page, name:'total_ctc', x:ML+88, y:curY-18, w:CW-92, h:18,
          value:String(totalCtcPdf||''), opts:[], multi:false, ftype:'text' });
        curY -= 22;

        curY = drawGrid([
          { label:'Accommodation',        name:'accommodation',  value:f('accommodation'),
            opts:['','Provided by SATCO','Provided by Client','Self-arranged'] },
          { label:'Transport',            name:'transport',      value:f('transport'),
            opts:['','Provided by SATCO','Provided by Client','Self-arranged'] },
          { label:'Food',                 name:'food',           value:f('food'),
            opts:['','Provided by SATCO','Provided by Client','Self-arranged'] },
          { label:'Expected Joining Date',name:'joining_date',   value:f('joining_date') },
          { label:'Visa Category',        name:'visa_category',  value:f('visa_cat'),
            opts:['','Employment Visa (Fresh)','Visit Visa conversion','Transfer from current employer'] },
          { label:'Deployment Site',      name:'deployment_site',value:f('deployment') },
          { label:'Special Terms / Notes',name:'offer_notes',    value:f('offer_notes'), wide:true, multi:true, fh:28 },
        ], curY);

        // ── S9: MEDICAL ─────────────────────────────────────────────────────
        checkPage(130);
        curY = drawSection(9, 'Medical & Health Declaration', curY);
        curY = drawGrid([
          { label:'Known Medical Conditions',   name:'medical_conditions',value:f('medical_cond'),
            opts:['','None','Diabetes','Hypertension','Heart condition','Asthma / Respiratory','Back / Spine issue','Vision impairment','Other'] },
          { label:'On Medication?',             name:'on_medication',     value:f('on_medication'),
            opts:['','No','Yes - stable, cleared by doctor'] },
          { label:'Colour Blindness?',          name:'colour_blind',      value:f('colour_blind'),
            opts:['','No','Yes - partial','Yes - complete'] },
          { label:'Vision / Hearing Aids?',     name:'vision_aids',       value:f('vision'),
            opts:['','No','Glasses / Contacts','Hearing aid','Both'] },
          { label:'Fit for Working at Height?', name:'fit_height',        value:f('fit_height'),
            opts:['','Yes - fit','Not assessed yet','No - restricted'] },
          { label:'Fit for Confined Space?',    name:'fit_cse',           value:f('fit_cse'),
            opts:['','Yes - fit','Not assessed yet','No - restricted'] },
          { label:'Pre-Employment Medical Result',       name:'gamka_result',      value:f('gamka'),
            opts:['','Not done yet','FIT - valid','Conditionally Fit','UNFIT'] },
          { label:'GAMKA Date',                 name:'gamka_date',        value:f('gamka_date') },
          { label:'Additional Medical Notes',   name:'medical_notes',     value:f('medical_notes')||'', wide:true, multi:true, fh:28 },
        ], curY);

        // ── S10: SIGN-OFF ───────────────────────────────────────────────────
        checkPage(80);
        curY = drawSection(10, 'Sign-Off', curY);
        curY -= 6;
        const SW = (CW - 8*2.835) / 2;
        [['Interviewer Signature','interviewer_name'],['Approved By (HR Manager)','approver_name']].forEach(([role, fn], xi) => {
          const sx = xi===0 ? ML : ML+SW+8*2.835;
          page.drawLine({ start:{x:sx,y:curY-6}, end:{x:sx+SW,y:curY-6}, thickness:1.2, color:NAVY });
          drawText(role, sx, curY-15, { size:8, color:DGRAY });
          drawText('NAME:', sx, curY-32, { bold:true, size:7, color:MGRAY });
          drawRect(sx+24, curY-36, SW-26, 13, { fill:WHITE, stroke:BORDER, lw:0.5 });
          allFields.push({ page, name:fn, x:sx+24, y:curY-36, w:SW-26, h:13, value:'', opts:[], multi:false });
          drawText('DATE:', sx, curY-52, { bold:true, size:7, color:MGRAY });
          drawRect(sx+24, curY-56, SW-26, 13, { fill:WHITE, stroke:BORDER, lw:0.5 });
          allFields.push({ page, name:fn+'_date', x:sx+24, y:curY-56, w:SW-26, h:13, value:'', opts:[], multi:false });
        });

        // ── INJECT ACROFORM FIELDS ───────────────────────────────────────────
        // pdf-lib doesn't have a form field API that keeps visual layout,
        // so we manually write widget annotations into the raw PDF context.
        const context = pdfDoc.context;

        // Get page refs
        const pageRefs = pdfDoc.getPages().map(p => pdfDoc.catalog.Pages().get(PDFName.of('Kids')));

        // Build field refs for AcroForm
        const fieldRefs = [];

        for (const fd2 of allFields) {
          const pg = fd2.page;
          const pgRef = pdfDoc.getPages().indexOf(pg);
          if (pgRef < 0) continue;
          const pageObj = pdfDoc.getPage(pgRef);

          // Build annotation dict
          const rect = context.obj([fd2.x, fd2.y, fd2.x+fd2.w, fd2.y+fd2.h]);

          let annotDict;
          if (fd2.isCheck) {
            annotDict = context.obj({
              Type:    PDFName.of('Annot'),
              Subtype: PDFName.of('Widget'),
              FT:      PDFName.of('Btn'),
              T:       PDFString.of(fd2.name),
              V:       PDFName.of('Off'),
              DV:      PDFName.of('Off'),
              Ff:      PDFNumber.of(0),
              AS:      PDFName.of('Off'),
              Rect:    rect,
              DA:      PDFString.of('/ZaDb 10 Tf 0 g'),
            });
          } else if (fd2.opts && fd2.opts.length > 0) {
            const optArr = context.obj(fd2.opts.map(o => PDFString.of(o)));
            annotDict = context.obj({
              Type:    PDFName.of('Annot'),
              Subtype: PDFName.of('Widget'),
              FT:      PDFName.of('Ch'),
              T:       PDFString.of(fd2.name),
              V:       PDFString.of(fd2.value || ''),
              DV:      PDFString.of(''),
              Ff:      PDFNumber.of(131072),
              Opt:     optArr,
              Rect:    rect,
              DA:      PDFString.of('/Helv 8 Tf 0 g'),
              BS:      context.obj({ S: PDFName.of('S'), W: PDFNumber.of(1) }),
              MK:      context.obj({ BG: context.obj([PDFNumber.of(1), PDFNumber.of(1), PDFNumber.of(1)]) }),
            });
          } else {
            const flags = fd2.multi ? 4096 : 0;
            annotDict = context.obj({
              Type:    PDFName.of('Annot'),
              Subtype: PDFName.of('Widget'),
              FT:      PDFName.of('Tx'),
              T:       PDFString.of(fd2.name),
              V:       PDFString.of(fd2.value || ''),
              DV:      PDFString.of(''),
              Ff:      PDFNumber.of(flags),
              Rect:    rect,
              DA:      PDFString.of('/Helv 8 Tf 0 g'),
              BS:      context.obj({ S: PDFName.of('S'), W: PDFNumber.of(1) }),
              MK:      context.obj({ BG: context.obj([PDFNumber.of(1), PDFNumber.of(1), PDFNumber.of(1)]) }),
            });
          }

          const annotRef = context.register(annotDict);
          fieldRefs.push(annotRef);

          // Add annotation to page
          const existingAnnots = pageObj.node.get(PDFName.of('Annots'));
          if (existingAnnots) {
            existingAnnots.push(annotRef);
          } else {
            pageObj.node.set(PDFName.of('Annots'), context.obj([annotRef]));
          }
        }

        // Set AcroForm on catalog
        const acroFormRef = context.register(context.obj({
          Fields:          context.obj(fieldRefs),
          NeedAppearances: PDFBool.True,
          DA:              PDFString.of('/Helv 9 Tf 0 g'),
        }));
        pdfDoc.catalog.set(PDFName.of('AcroForm'), acroFormRef);

        // ── DOWNLOAD ────────────────────────────────────────────────────────
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type:'application/pdf' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = fname;
        a.click();
        URL.revokeObjectURL(url);
      };

      const totalCtc = (parseFloat(f('basic_salary'))||0) + (parseFloat(f('allowance'))||0);
      const savePdf = async () => {
        // Sweep DOM to capture any unfocused field values into fdRef before PDF generation
        document.querySelectorAll('#interviewSheetBody input, #interviewSheetBody select, #interviewSheetBody textarea').forEach(el => {
          const fk = el.getAttribute('data-fk');
          if (fk) { fdRef.current[fk] = el.value; }
        });
        setPdfGenerating(true);
        // ── Auto-save all form data to Supabase so dropdowns persist on re-open ──
        if (candidate.id) {
          try {
            const scoreTotal = Object.values(scores).reduce((a,b)=>a+b,0);
            const autoPatch = {
              candidate_name: f('name')||null, dob_candidate: f('dob')||null,
              nationality: f('nationality')||null, passport_no: f('passport_no')||null,
              passport_expiry_candidate: f('passport_expiry')||null,
              place_of_issue: f('place_of_issue')||null,
              religion: f('religion')||null,
              marital_status: f('marital')||null,
              phone: f('phone')||null, whatsapp: f('whatsapp')||null,
              email: f('email')||null,
              current_location: f('location')||null,
              languages: f('languages')||null,
              home_address: f('address')||null,
              referred_by: f('referred_by')||null,
              position: f('position_applied')||null,
              experience: f('exp_years')||null,
              current_employer: f('curr_employer')||null,
              current_designation: f('curr_designation')||null,
              skills: f('skills')||null,
              me_experience: f('me_experience')||null,
              me_notes: f('me_notes')||null,
              interview_date: f('int_date')||null,
              interviewed_by: f('int_by')||null,
              interview_mode: f('int_mode')||null,
              interview_notes: f('int_notes')||null,
              interview_verdict: f('verdict')||null,
              verdict_reason: f('verdict_reason')||null,
              interview_score: scoreTotal||null,
              interview_score_technical: scores.technical||null,
              interview_score_comm: scores.comm||null,
              interview_score_safety: scores.safety||null,
              interview_score_exp: scores.exp||null,
              interview_score_attitude: scores.attitude||null,
              interview_score_docs: scores.docs||null,
              interview_qa: Object.values(answers).filter(Boolean).join(' | ')||null,
              basic_salary: f('basic_salary')||null,
              allowance: f('allowance')||null,
              deployment_site: f('deployment')||null,
              visa_category: f('visa_cat')||null,
              accommodation: f('accommodation')||null,
              transport_by: f('transport')||null,
              food_by: f('food')||null,
              expected_arrival_date: f('joining_date')||null,
              offer_notes: f('offer_notes')||null,
              current_salary: f('curr_salary')||null,
              medical_conditions: f('medical_cond')||null,
              on_medication: f('on_medication')||null,
              colour_blindness: f('colour_blind')||null,
              vision_aids: f('vision')||null,
              fit_for_height: f('fit_height')||null,
              fit_for_cse: f('fit_cse')||null,
              gamka_result: f('gamka')||null,
              gamka_date: f('gamka_date')||null,
              medical_notes: f('medical_notes')||null,
              other_certifications: f('other_certs')||null,
              dependants_count: f('dependants')||null,
              children_count: f('children')||null,
              family_in_uae: f('family_uae')||null,
              emergency_contact: f('emergency_contact')||null,
            };
            await db.from('hiring_pipeline').update(autoPatch).eq('id', candidate.id);
            // Update in-memory hiring array so Kanban reflects the save immediately (no candidate prop update)
            if (onHiringUpdate) onHiringUpdate({...autoPatch, id: candidate.id});
          } catch(e) { console.warn('Auto-save on PDF:', e.message); }
        }
        try { await printSheet(); } catch(e) { showToast('PDF error: '+e.message,'error'); console.error(e); }
        setPdfGenerating(false);
      };

      return (
        <div style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.7)', zIndex:999, display:'flex', flexDirection:'column' }}>
          {/* Toolbar */}
          <div className="no-print" style={{ background:'#0f2744', padding:'10px 20px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
              <div style={{ background:'#1a56db', borderRadius:'8px', width:'36px', height:'36px', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'18px' }}>🏢</div>
              <div>
                <div style={{ color:'#fff', fontWeight:700, fontSize:'15px' }}>SATCO Arabia — Interview Sheet</div>
                <div style={{ color:'#93c5fd', fontSize:'11px' }}>
                  {f('name')||'New Candidate'} {f('position_applied') ? '· ' + f('position_applied') : ''}
                  {(candidate.resume_url||candidate.passport_img_url) && !autoScanned && <span style={{ color:'#fbbf24' }}> · Loading docs…</span>}
                  {autoScanned && !scanning && <span style={{ color:'#6ee7b7' }}> · Docs auto-filled</span>}
                </div>
              </div>
            </div>
            <div style={{ display:'flex', gap:'8px' }}>
              {/* Scan status + multi-doc upload */}
              <div style={{ display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap' }}>
                {scanning && (
                  <div style={{ background:'#1e3a5f', color:'#93c5fd', padding:'5px 12px', borderRadius:'7px', fontSize:'12px', display:'flex', alignItems:'center', gap:'7px' }}>
                    <div style={{ width:'12px', height:'12px', border:'2px solid #3b82f6', borderTopColor:'#93c5fd', borderRadius:'50%', animation:'spin 0.8s linear infinite', flexShrink:0 }}></div>
                    {scanMsg||'Scanning…'}
                  </div>
                )}
                {scanFiles.map((sf,i) => (
                  <div key={i} style={{ background:'#1e3a5f', color:'#93c5fd', padding:'4px 8px', borderRadius:'5px', fontSize:'11px', display:'flex', alignItems:'center', gap:'4px', maxWidth:'130px' }}>
                    <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }} title={sf.name}>{sf.name.length>14 ? sf.name.slice(0,12)+'…' : sf.name}</span>
                    <button type="button" onClick={()=>removeScanFile(i)} style={{ background:'none', border:'none', color:'#f87171', cursor:'pointer', fontSize:'13px', lineHeight:1, padding:0, flexShrink:0 }}>✕</button>
                  </div>
                ))}
                <label style={{ background:'#334155', color:'#fff', padding:'6px 12px', borderRadius:'7px', fontSize:'12px', fontWeight:600, cursor:scanning?'not-allowed':'pointer', display:'flex', alignItems:'center', gap:'5px', opacity:scanning?0.6:1 }}>
                  ➕ Add Doc
                  <input type="file" accept=".pdf,image/*" style={{ display:'none' }} disabled={scanning} multiple onChange={e=>{ Array.from(e.target.files).forEach(f=>addScanFile(f)); e.target.value=''; }} />
                </label>
                {scanFiles.length > 0 && (
                  <button type="button" onClick={scanAllDocs} disabled={scanning}
                    style={{ background: scanning?'#334155':'#059669', color:'#fff', border:'none', padding:'6px 12px', borderRadius:'7px', fontSize:'12px', fontWeight:600, cursor:scanning?'not-allowed':'pointer' }}>
                    {scanning ? `⏳ ${scanMsg||'Scanning…'}` : `🔍 Scan ${scanFiles.length} Doc${scanFiles.length>1?'s':''}`}
                  </button>

                {scanFiles.length === 0 && !scanning && (

    // ============================================================
    // INTERVIEW SHEET VIEW — embedded in HR portal nav
    // ============================================================
    function InterviewSheetView({ hiring, showToast, onOpenSheet }) {
      const [search, setSearch] = useState('');
      const [filter, setFilter] = useState('all');

      const candidates = hiring.filter(c => {
        if (filter === 'scored') return c.interview_score > 0;
        if (filter === 'selected') return c.interview_verdict === 'selected';
        if (filter === 'pending') return c.step === 'resume' && !c.interview_date;
        return true;
      }).filter(c => !search || (c.candidate_name||'').toLowerCase().includes(search.toLowerCase()) || (c.position||'').toLowerCase().includes(search.toLowerCase()));

      const gradeLabel = (score) => {
        const s = parseInt(score)||0;
        if (s >= 26) return { l:'Excellent', c:'#059669', bg:'#dcfce7' };
        if (s >= 21) return { l:'Good', c:'#2563eb', bg:'#dbeafe' };
        if (s >= 17) return { l:'Average', c:'#d97706', bg:'#fef3c7' };
        if (s > 0)   return { l:'Low', c:'#dc2626', bg:'#fee2e2' };
        return { l:'Not scored', c:'#94a3b8', bg:'#f1f5f9' };
      };

      const verdictBadge = (v) => {
        if (v === 'selected') return { l:'✅ Selected', c:'#059669', bg:'#dcfce7' };
        if (v === 'onhold')   return { l:'⏸ On Hold', c:'#d97706', bg:'#fef3c7' };
        if (v === 'rejected') return { l:'❌ Not Suitable', c:'#dc2626', bg:'#fee2e2' };
        return { l:'Pending', c:'#94a3b8', bg:'#f1f5f9' };
      };

      const openSheet = (c) => { onOpenSheet(c); return; // replaced window.open
        const params = new URLSearchParams({
          name: c.candidate_name||'', position: c.position||'', nationality: c.nationality||'',
          passport_no: c.passport_no||'', passport_expiry: c.passport_expiry_candidate||'',
          phone: c.phone||'', email: c.email||'', location: c.current_location||'',
          experience: c.experience||'', employer: c.current_employer||'', designation: c.current_designation||'',
          education: c.education||'', skills: c.skills||'', referred_by: c.referred_by||'',
          dob: c.dob_candidate||'', marital: c.marital_status||'', religion: c.religion||'',
          languages: c.languages||'', address: c.home_address||'',
          score_technical: c.interview_score_technical||'', score_comm: c.interview_score_comm||'',
          score_safety: c.interview_score_safety||'', score_exp: c.interview_score_exp||'',
          score_attitude: c.interview_score_attitude||'', score_docs: c.interview_score_docs||'',
          verdict: c.interview_verdict||'', verdict_reason: c.verdict_reason||'',
          int_notes: c.interview_notes||'', int_date: c.interview_date||'', int_mode: c.interview_mode||'',
          int_by: c.interviewed_by||'', basic_salary: c.basic_salary||'', allowance: c.allowance||'',
          deployment: c.deployment_site||'', me_exp: c.me_experience||'', me_notes: c.me_notes||'',
          medical: c.medical_conditions||'', gamka: c.gamka_result||'', gamka_date: c.gamka_date||'',
        });
        onOpenSheet(c); // opens overlay inside app
      };

      const scored = hiring.filter(c => c.interview_score > 0);
      const avgScore = scored.length ? (scored.reduce((a,c)=>a+(parseInt(c.interview_score)||0),0)/scored.length).toFixed(1) : '—';
      const selected = hiring.filter(c => c.interview_verdict === 'selected').length;
      const pending = hiring.filter(c => !c.interview_date).length;

      return (
        <div>
          {/* KPI Row */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'10px', marginBottom:'16px' }}>
            {[
              { label:'Total Candidates', value: hiring.length, icon:'👥', color:'#2563eb' },
              { label:'Interviews Done', value: scored.length, icon:'🎙️', color:'#059669' },
              { label:'Avg Score / 30', value: avgScore, icon:'⭐', color:'#d97706' },
              { label:'Selected', value: selected, icon:'✅', color:'#059669' },
            ].map(k => (
              <div key={k.label} className="hr-card" style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'10px', padding:'14px 16px' }}>
                <div style={{ fontSize:'20px', marginBottom:'6px' }}>{k.icon}</div>
                <div style={{ fontSize:'24px', fontWeight:800, color: k.color }}>{k.value}</div>
                <div style={{ fontSize:'11px', color:'#64748b', marginTop:'2px' }}>{k.label}</div>
              </div>
            ))}
          </div>

          {/* Info Banner */}
          <div style={{ background:'#eff6ff', border:'1px solid #bfdbfe', borderRadius:'10px', padding:'12px 18px', marginBottom:'14px', display:'flex', alignItems:'center', gap:'12px' }}>
            <span style={{ fontSize:'20px' }}>📝</span>
            <div style={{ fontSize:'12.5px', color:'#1e40af', lineHeight:1.6 }}>
              <strong>Interview Sheet Generator</strong> — Click <strong>📝 Open Sheet</strong> on any candidate to launch the printable A4 interview form with their details pre-filled.
              The sheet is also accessible from the <strong>🎙 Interview tab</strong> inside each candidate record in the Hiring Pipeline.
              Click <strong>Open Sheet</strong> on any candidate below, or double-click any candidate card in the Hiring Pipeline.
            </div>
          </div>

          {/* Filters */}
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'12px 16px', marginBottom:'12px', display:'flex', gap:'10px', alignItems:'center', flexWrap:'wrap' }}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search candidate or position…"
              style={{ flex:1, minWidth:'200px', padding:'7px 10px', border:'1px solid #cbd5e1', borderRadius:'6px', fontSize:'13px' }} />
            {[['all','All'],['scored','Scored'],['selected','Selected'],['pending','Pending Interview']].map(([v,l]) => (
              <button key={v} onClick={()=>setFilter(v)} style={{
                padding:'6px 14px', borderRadius:'16px', border:'1px solid', fontSize:'12px', fontWeight:600, cursor:'pointer', fontFamily:'inherit',
                background: filter===v ? '#2563eb' : '#f1f5f9', color: filter===v ? '#fff' : '#475569',
                borderColor: filter===v ? '#2563eb' : 'transparent'
              }}>{l}</button>
            ))}
          </div>

          {/* Candidate Cards */}
          <div style={{ display:'flex', flexDirection:'column', gap:'8px' }}>
            {candidates.length === 0 ? (
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'40px', textAlign:'center', color:'#94a3b8' }}>
                No candidates match the filter.
              </div>
            ) : candidates.map(c => {
              const grade = gradeLabel(c.interview_score);
              const verdict = verdictBadge(c.interview_verdict);
              const scoreCols = [
                { l:'Tech', v: c.interview_score_technical },
                { l:'Comm', v: c.interview_score_comm },
                { l:'Safety', v: c.interview_score_safety },
                { l:'Exp', v: c.interview_score_exp },
                { l:'Attitude', v: c.interview_score_attitude },
                { l:'Certs', v: c.interview_score_docs },
              ];
              return (
                <div key={c.id} className="hr-card" onDoubleClick={() => openSheet(c)} title="Double-click to open Interview Sheet" style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px 18px', cursor:'pointer' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'14px', flexWrap:'wrap' }}>
                    {/* Left: identity */}
                    <div style={{ flex:1, minWidth:'180px' }}>
                      <div style={{ fontWeight:700, fontSize:'14px', color:'#0f172a' }}>{c.candidate_name||'(no name)'}</div>
                      <div style={{ fontSize:'12px', color:'#64748b', marginTop:'2px' }}>{c.position||'—'} {c.nationality ? `· ${c.nationality}` : ''} {c.current_location ? `· ${c.current_location}` : ''}</div>
                      {c.interview_date && <div style={{ fontSize:'11px', color:'#94a3b8', marginTop:'2px' }}>Interview: {fmtDateDisplay(c.interview_date)} {c.interviewed_by ? `· By: ${c.interviewed_by}` : ''}</div>}
                    </div>

                    {/* Score breakdown */}
                    {c.interview_score > 0 && (
                      <div style={{ display:'flex', gap:'5px', flexWrap:'wrap' }}>
                        {scoreCols.map(({ l, v }) => (
                          <div key={l} style={{ textAlign:'center', minWidth:'36px' }}>
                            <div style={{ background: parseInt(v)>=4?'#dcfce7': parseInt(v)>=3?'#dbeafe': parseInt(v)>=2?'#fef3c7':'#fee2e2',
                              color: parseInt(v)>=4?'#059669': parseInt(v)>=3?'#1d4ed8': parseInt(v)>=2?'#92400e':'#991b1b',
                              borderRadius:'5px', padding:'3px 5px', fontWeight:800, fontSize:'13px', fontFamily:'monospace' }}>
                              {parseInt(v)||'—'}
                            </div>
                            <div style={{ fontSize:'9px', color:'#94a3b8', marginTop:'2px' }}>{l}</div>
                          </div>
                        ))}
                        <div style={{ textAlign:'center', minWidth:'40px' }}>
                          <div style={{ background: grade.bg, color: grade.c, borderRadius:'5px', padding:'3px 5px', fontWeight:800, fontSize:'13px', fontFamily:'monospace' }}>
                            {parseInt(c.interview_score)||0}
                          </div>
                          <div style={{ fontSize:'9px', color:'#94a3b8', marginTop:'2px' }}>Total</div>
                        </div>
                      </div>
                    )}

                    {/* Badges */}
                    <div style={{ display:'flex', gap:'6px', alignItems:'center', flexWrap:'wrap' }}>
                      <span style={{ background: grade.bg, color: grade.c, padding:'3px 10px', borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>{grade.l}</span>
                      <span style={{ background: verdict.bg, color: verdict.c, padding:'3px 10px', borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>{verdict.l}</span>
                      {c.me_experience === 'yes' && <span style={{ background:'#ede9fe', color:'#7c3aed', padding:'3px 10px', borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>🌍 ME Exp</span>}
                    </div>

                    {/* Action */}
                    <button onClick={() => openSheet(c)} style={{ background:'#1d4ed8', color:'#fff', border:'none', padding:'8px 16px', borderRadius:'8px', fontSize:'12px', fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', fontFamily:'inherit', flexShrink:0 }}>
                      📝 Open Sheet
                    </button>
                  </div>

                  {/* Medical / offer quick-view */}
                  {(c.gamka_result || c.basic_salary || c.deployment_site || c.medical_conditions) && (
                    <div style={{ marginTop:'10px', paddingTop:'10px', borderTop:'1px solid #f1f5f9', display:'flex', gap:'16px', flexWrap:'wrap' }}>
                      {c.basic_salary && <span style={{ fontSize:'11.5px', color:'#64748b' }}>💰 AED {Number(c.basic_salary).toLocaleString()} + {Number(c.allowance||0).toLocaleString()}</span>}
                      {c.deployment_site && <span style={{ fontSize:'11.5px', color:'#64748b' }}>📍 {c.deployment_site}</span>}
                      {c.gamka_result && <span style={{ fontSize:'11.5px', color: c.gamka_result==='FIT – valid'?'#059669':'#d97706' }}>🏥 Medical: {c.gamka_result}</span>}
                      {c.medical_conditions && c.medical_conditions !== 'None' && <span style={{ fontSize:'11.5px', color:'#dc2626' }}>⚕️ {c.medical_conditions}</span>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <div style={{ marginTop:'10px', fontSize:'12px', color:'#64748b' }}>{candidates.length} candidate{candidates.length!==1?'s':''}</div>
        </div>
      );
    }

      th: { textAlign:'left', padding:'10px 10px', fontSize:'10px', color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', fontWeight:600, borderBottom:'1px solid #e2e8f0', whiteSpace:'nowrap' },
      td: { padding:'10px 10px', color:'#334155', verticalAlign:'middle', whiteSpace:'nowrap' },
      chip: { background:'#f1f5f9', color:'#475569', border:'1px solid transparent', padding:'6px 11px', borderRadius:'16px', fontSize:'11.5px', fontWeight:600, cursor:'pointer' },
      chipActive: { background:'#dbeafe', color:'#1e40af', borderColor:'#93c5fd' },
      overlay: { position:'fixed', inset:0, background:'rgba(15,23,42,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100, animation:'fadeIn 0.15s' },
      modal: { background:'#fff', borderRadius:'12px', width:'90%', maxWidth:'780px', maxHeight:'88vh', display:'flex', flexDirection:'column', boxShadow:'0 25px 50px rgba(0,0,0,0.25)' },
    };

    // ============ ROOT ============
    function Root() {
      const [user, setUser] = useState(null);
      const [checking, setChecking] = useState(true);
      useEffect(() => {
        db.auth.getSession().then(({ data }) => { setUser(data.session?.user || null); setChecking(false); });
        const { data: sub } = db.auth.onAuthStateChange((_e, session) => setUser(session?.user || null));
        return () => sub.subscription.unsubscribe();
      }, []);
      const logout = async () => { await db.auth.signOut(); setUser(null); };
      if (checking) return <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh' }}><div className="spinner"></div></div>;
      if (!user) return <Login onLogin={setUser} />;
      return <HRApp user={user} onLogout={logout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

  </script>
</body>
</html>
