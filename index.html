                                <div><label style={S.label}>Certificate No</label>
                                  <input value={rec.certNo||''} onChange={e => setRec(tr.id, { certNo: e.target.value })}
                                    style={{ ...S.input, width:'100%' }} placeholder="Certificate number" /></div>
                                <div><label style={S.label}>Expiry Date</label>
                                  <input type="date" value={rec.expiry||''} onChange={e => setRec(tr.id, { expiry: e.target.value })}
                                    style={{ ...S.input, width:'100%' }} /></div>
                                <div><label style={S.label}>Issuing Company / Training Provider</label>
                                  <input value={rec.issuingCompany||''} onChange={e => setRec(tr.id, { issuingCompany: e.target.value })}
                                    style={{ ...S.input, width:'100%' }} placeholder="e.g. Crosswind, OPITO" /></div>
                                <div><label style={S.label}>Status</label>
                                  <select value={rec.status||''} onChange={e => setRec(tr.id, { status: e.target.value })}
                                    style={{ ...S.input, width:'100%' }}>
                                    <option value="">○ Pending</option>
                                    <option value="valid">✓ Valid</option>
                                    <option value="expired">⚠ Expired</option>
                                    <option value="not_required">— Not Required</option>
                                  </select>
                                </div>
                              </div>
                              <TrainingCertUploadPanel
                                trainingId={tr.id}
                                trainingLabel={tr.label}
                                empId={data.employee_id}
                                existingImgUrl={rec.imgData || null}
                                existingCertNo={rec.certNo || ''}
                                existingExpiry={rec.expiry || ''}
                                existingCourseName={rec.courseName || ''}
                                existingIssuingCompany={rec.issuingCompany || ''}
                                onApply={(vals) => {
                                  setRec(tr.id, {
                                    certNo: vals.certNo || rec.certNo,
                                    expiry: vals.expiry || rec.expiry,
                                    imgData: vals.imgData || rec.imgData,
                                    courseName: vals.courseName || rec.courseName,
                                    issuingCompany: vals.issuingCompany || rec.issuingCompany,
                                    status: vals.expiry ? (daysUntil(vals.expiry) >= 0 ? 'valid' : 'expired') : rec.status,
                                  });
                                }}
                              />
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                ) : null}
                {/* Notes */}
                <div style={{ marginTop:'16px' }}>
                  <label style={S.label}>General Notes</label>
                  <textarea value={data.notes||''} onChange={e => setData(d=>({...d, notes:e.target.value}))}
                    style={{ ...S.input, width:'100%', minHeight:'60px' }} placeholder="Any additional training notes..." />
                </div>
              </div>
            </div>

            <div style={{ padding:'14px 22px', borderTop:'1px solid #e2e8f0', display:'flex', justifyContent:'flex-end', gap:'10px' }}>
              <button className="hr-btn" style={S.btnSec} onClick={onClose}>Cancel</button>
              <button className="hr-btn" style={S.btnPri} onClick={handleSave}>💾 Save Training Record</button>
            </div>
          </div>
        </div>
      );
    }

    function TrainingView({ records, employees, onSave, onSyncAll, showToast, loadAll }) {
      const [search, setSearch] = useState('');
      const [editing, setEditing] = useState(null);
      const [catFilter, setCatFilter] = useState('all');

      const sorted = useMemo(() => {
        let r = [...records].sort((a,b) => (a.employee_id||'').localeCompare(b.employee_id||''));
        if (search) {
          const s = search.toLowerCase();
          r = r.filter(x => {
            if ((x.employee_id||'').toLowerCase().includes(s)) return true;
            if ((x.full_name||'').toLowerCase().includes(s)) return true;
            if ((x.position||'').toLowerCase().includes(s)) return true;
            if ((x.cicpa_locations||'').toLowerCase().includes(s)) return true;
            if ((x.notes||'').toLowerCase().includes(s)) return true;
            // Search inside training_records JSON for course names, issuing companies, cert nos
            try {
              const p = JSON.parse(x.training_records || '{}');
              // Standard trainings
              if (ALL_STANDARD_TRAININGS.some(t => {
                const rec = p[t.id];
                if (!rec) return false;
                return (t.label||'').toLowerCase().includes(s) ||
                       (rec.courseName||'').toLowerCase().includes(s) ||
                       (rec.issuingCompany||'').toLowerCase().includes(s) ||
                       (rec.certNo||'').toLowerCase().includes(s) ||
                       (rec.notes||'').toLowerCase().includes(s);
              })) return true;
              // Other/custom trainings
              if ((p.__other || []).some(ot =>
                (ot.label||'').toLowerCase().includes(s) ||
                (ot.issuingCompany||'').toLowerCase().includes(s) ||
                (ot.certNo||'').toLowerCase().includes(s) ||
                (ot.notes||'').toLowerCase().includes(s)
              )) return true;
            } catch {}
            return false;
          });
        }
        return r;
      }, [records, search]);

      const getStats = (rec) => {
        try {
          const p = JSON.parse(rec.training_records || '{}');
          const valid = ALL_STANDARD_TRAININGS.filter(t => p[t.id]?.status === 'valid').length;
          const expired = ALL_STANDARD_TRAININGS.filter(t => p[t.id]?.status === 'expired').length;
          const total = ALL_STANDARD_TRAININGS.length;
          const others = (p.__other || []).length;
          return { valid, expired, total, others };
        } catch { return { valid:0, expired:0, total: ALL_STANDARD_TRAININGS.length, others:0 }; }
      };

      const handleEdit = async (rec) => {
        // Fetch latest from DB before opening modal
        const { data } = await db.from('employee_trainings').select('*').eq('id', rec.id).single();
        setEditing(data || rec);
      };

      return (
        <div>
          {/* Toolbar */}
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', padding:'14px 18px', marginBottom:'14px', display:'flex', gap:'10px', alignItems:'center', flexWrap:'wrap' }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search by Emp ID, Name, Position, CICPA locations, Course, Issuer, Cert No, Notes…"
              style={{ ...S.input, flex:1, minWidth:'200px' }} />
            <button className="hr-btn" style={{ ...S.btnSec, background:'#f0fdf4', color:'#166534', border:'1px solid #86efac', fontWeight:700 }} onClick={onSyncAll}>
              🔄 Sync All from Employees
            </button>
          </div>

          {/* Category legend */}
          <div style={{ display:'flex', gap:'6px', flexWrap:'wrap', marginBottom:'14px' }}>
            {TRAINING_CATEGORIES.map(cat => (
              <div key={cat.id} style={{ background: cat.bg, color: cat.color, border:`1px solid ${cat.color}33`, padding:'3px 10px', borderRadius:'12px', fontSize:'11px', fontWeight:600 }}>
                {cat.label.split('—')[1]?.trim() || cat.label}
              </div>
            ))}
          </div>

          {/* Table */}
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
            <div style={{ overflowX:'auto' }} className="hr-scroll">
              <table style={{ width:'100%', borderCollapse:'collapse', minWidth:'700px' }}>
                <thead style={{ background:'#f8fafc' }}>
                  <tr>
                    <th style={S.th}>EMP ID</th>
                    <th style={S.th}>FULL NAME</th>
                    <th style={S.th}>POSITION</th>
                    <th style={S.th}>CICPA LOCATIONS</th>
                    <th style={S.th}>ILOE</th>
                    <th style={S.th}>CERTIFICATIONS</th>
                    <th style={S.th}>EXPIRY DATES</th>
                    <th style={S.th}>NOTES</th>
                    <th style={S.th}></th>
                  </tr>
                </thead>
                <tbody>
                  {sorted.length === 0 ? (
                    <tr><td colSpan={8} style={{ textAlign:'center', padding:'40px', color:'#94a3b8' }}>
                      {records.length === 0 ? 'No training records — click "Sync All from Employees" to create rows' : 'No results match your search'}
                    </td></tr>
                  ) : sorted.map(rec => {
                    const st = getStats(rec);
                    return (
                      <tr key={rec.id} className="hr-row" onDoubleClick={() => handleEdit(rec)} title="Double-click to edit" style={{ borderTop:'1px solid #f1f5f9', cursor:'pointer' }}>
                        <td style={{ ...S.td, fontFamily:'ui-monospace,monospace', fontWeight:700, color:'#2563eb' }}>{rec.employee_id}</td>
                        <td style={{ ...S.td, fontWeight:600 }}>
                          <div style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
                            <span>{rec.full_name}</span>
                            {(() => {
                              const { valid, expired, total, others } = st;
                              if (valid === 0 && expired === 0) return null;
                              return (
                                <div style={{ display:'flex', gap:'4px', flexWrap:'wrap' }}>
                                  {valid > 0 && <span style={{ background:'#dcfce7', color:'#166534', fontSize:'9.5px', fontWeight:700, padding:'1px 6px', borderRadius:'8px' }}>✓ {valid}/{total} valid</span>}
                                  {expired > 0 && <span style={{ background:'#fee2e2', color:'#991b1b', fontSize:'9.5px', fontWeight:700, padding:'1px 6px', borderRadius:'8px' }}>⚠ {expired} expired</span>}
                                  {others > 0 && <span style={{ background:'#eff6ff', color:'#1e40af', fontSize:'9.5px', fontWeight:700, padding:'1px 6px', borderRadius:'8px' }}>+{others} custom</span>}
                                </div>
                              );
                            })()}
                          </div>
                        </td>
                        <td style={{ ...S.td, fontSize:'12px' }}>{rec.position || '—'}</td>
                        <td style={{ ...S.td, fontSize:'11.5px' }}>
                          {rec.cicpa_locations ? (
                            <div style={{ display:'flex', gap:'3px', flexWrap:'wrap' }}>
                              {rec.cicpa_locations.split(',').map(l => l.trim()).filter(Boolean).map(l => (
                                <span key={l} style={{ background:'#f3e8ff', color:'#6b21a8', padding:'1px 7px', borderRadius:'10px', fontSize:'10.5px', fontWeight:600 }}>{l}</span>
                              ))}
                            </div>
                          ) : '—'}
                        </td>
                        <td style={{ ...S.td, fontSize:'11.5px', color:'#64748b', maxWidth:'220px' }}>
                          {(() => {
                            try {
                              const p = JSON.parse(rec.training_records || '{}');
                              // Standard trainings (cat 1-6) that have any data entered
                              const stdItems = ALL_STANDARD_TRAININGS
                                .map(t => ({ ...p[t.id], _label: t.label, _id: t.id }))
                                .filter(r => r.status === 'valid' || r.status === 'expired' || r.certNo || r.issuingCompany || r.expiry);
                              // Custom / other certs
                              const otherItems = (p.__other || []);
                              const allItems = [...stdItems, ...otherItems];
                              if (!allItems.length) return <span style={{ color:'#94a3b8', fontSize:'11px' }}>—</span>;
                              return (
                                <div style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
                                  {stdItems.map((r, i) => {
                                    const statusColor = r.status === 'valid' ? '#166534' : r.status === 'expired' ? '#991b1b' : '#64748b';
                                    const statusBg    = r.status === 'valid' ? '#dcfce7'  : r.status === 'expired' ? '#fee2e2'  : '#f1f5f9';
                                    const statusBdr   = r.status === 'valid' ? '#86efac'  : r.status === 'expired' ? '#fca5a5'  : '#e2e8f0';
                                    return (
                                      <div key={r._id + i}
                                        title={[r.courseName || r._label, r.issuingCompany, r.certNo, r.expiry ? 'Exp: '+fmtDateDisplay(r.expiry) : ''].filter(Boolean).join(' · ')}
                                        style={{ display:'flex', flexDirection:'column', background: statusBg, border:`1px solid ${statusBdr}`,
                                          padding:'3px 8px', borderRadius:'6px', fontSize:'10.5px' }}>
                                        <span style={{ fontWeight:700, color: statusColor, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:'170px' }}>
                                          {r.courseName || r._label}
                                        </span>
                                        {r.issuingCompany && <span style={{ color:'#475569', fontSize:'10px' }}>🏢 {r.issuingCompany}</span>}
                                        {r.certNo && <span style={{ color:'#64748b', fontSize:'9.5px', fontFamily:'ui-monospace,monospace' }}>{r.certNo}</span>}
                                      </div>
                                    );
                                  })}
                                  {otherItems.map((ot, i) => (
                                    <div key={'oth'+i}
                                      title={[ot.courseName||ot.label, ot.issuingCompany, ot.certNo, ot.expiry ? 'Exp: '+fmtDateDisplay(ot.expiry) : ''].filter(Boolean).join(' · ')}
                                      style={{ display:'flex', flexDirection:'column', background:'#eff6ff', border:'1px solid #bfdbfe',
                                        padding:'3px 8px', borderRadius:'6px', fontSize:'10.5px' }}>
                                      <span style={{ fontWeight:700, color:'#1e40af', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:'170px' }}>
                                        {ot.courseName || ot.label || `Cert ${i+1}`}
                                      </span>
                                      {ot.issuingCompany && <span style={{ color:'#475569', fontSize:'10px' }}>🏢 {ot.issuingCompany}</span>}
                                      {ot.certNo && <span style={{ color:'#64748b', fontSize:'9.5px', fontFamily:'ui-monospace,monospace' }}>{ot.certNo}</span>}
                                    </div>
                                  ))}
                                </div>
                              );
                            } catch { return <span style={{ color:'#94a3b8', fontSize:'11px' }}>—</span>; }
                          })()}
                        </td>
                        <td style={{ ...S.td, fontSize:'11.5px', minWidth:'160px' }}>
                          {(() => {
                            try {
                              const p = JSON.parse(rec.training_records || '{}');
                              // Standard trainings with expiry dates
                              const stdWithExpiry = ALL_STANDARD_TRAININGS
                                .map(t => ({ ...p[t.id], _label: t.label, _id: t.id }))
                                .filter(r => r.expiry);
                              // Custom certs with expiry
                              const otherWithExpiry = (p.__other || []).filter(c => c.expiry);
                              const allWithExpiry = [...stdWithExpiry, ...otherWithExpiry];
                              if (!allWithExpiry.length) return <span style={{ color:'#94a3b8', fontSize:'11px' }}>—</span>;
                              return (
                                <div style={{ display:'flex', flexDirection:'column', gap:'4px' }}>
                                  {allWithExpiry.map((item, i) => {
                                    const d = daysUntil(item.expiry);
                                    const expired = d !== null && d < 0;
                                    const col = d === null ? '#64748b' : expired ? '#dc2626' : d <= 30 ? '#d97706' : '#059669';
                                    const name = item.courseName || item._label || item.label || '';
                                    return (
                                      <div key={item._id || item.cid || i} style={{ display:'flex', flexDirection:'column', gap:'2px',
                                        background: expired ? '#fee2e2' : d !== null && d <= 30 ? '#fef3c7' : '#f0fdf4',
                                        border: `1px solid ${col}30`, borderRadius:'6px', padding:'4px 8px' }}>
                                        {name && <span style={{ fontSize:'9.5px', color:'#475569', fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:'150px' }} title={name}>{name}</span>}
                                        <div style={{ display:'flex', alignItems:'center', gap:'5px' }}>
                                          <span style={{ fontSize:'10px', color:'#64748b', whiteSpace:'nowrap' }}>{fmtDateDisplay(item.expiry)}</span>
                                          <span style={{ flexShrink:0, background: col, color:'#fff', padding:'1px 6px',
                                            borderRadius:'8px', fontSize:'10px', fontWeight:700, whiteSpace:'nowrap' }}>
                                            {d === null ? '?' : expired ? `${Math.abs(d)}d expired` : `${d}d left`}
                                          </span>
                                        </div>
                                      </div>
                                    );
                                  })}
                                  {(p.__other || []).filter(c => !c.expiry).length > 0 && (
                                    <span style={{ color:'#94a3b8', fontSize:'10px' }}>{(p.__other||[]).filter(c=>!c.expiry).length} no expiry set</span>
                                  )}
                                </div>
                              );
                            } catch { return <span style={{ color:'#94a3b8', fontSize:'11px' }}>—</span>; }
                          })()}
                        </td>
                        <td style={{ ...S.td, fontSize:'11.5px', maxWidth:'140px', color:'#64748b' }}>{rec.notes || '—'}</td>
                        <td style={{ ...S.td, textAlign:'right' }}>
                          <button onClick={() => handleEdit(rec)} style={S.iconBtn} title="Edit training">&#9998;</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{ marginTop:'10px', fontSize:'12px', color:'#64748b' }}>{sorted.length} record{sorted.length !== 1 ? 's' : ''}</div>

          {editing && <TrainingModal record={editing} employees={employees} onSave={async (d) => { await onSave(d); setEditing(null); }} onClose={() => setEditing(null)} showToast={showToast} />}
        </div>
      );
    }

  </script>

  <script type="text/babel" data-presets="react">
    // ── PART 3: Employee Modal · Contacts · MobDemob · Hiring Pipeline ──
    // ============ MODALS ============
    function EmployeeModal({ employee, onSave, onClose }) {
      const [data, setData] = useState(employee);
      const set = (k,v) => setData(d => ({ ...d, [k]:v }));
      const groups = { identity:'Identity', employment:'Employment', salary:'Salary', documents:'Documents', contact:'Contact', training:'Training' };
      const isNew = !employee.id;
      return (
        <div style={S.overlay} onClick={onClose}>
          <div style={S.modal} onClick={e=>e.stopPropagation()}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'18px 22px', borderBottom:'1px solid #e2e8f0' }}><h2 style={{ margin:0, fontSize:'17px' }}>{isNew?'Add Employee':`Edit: ${employee.full_name||employee.employee_id}`}</h2><button onClick={onClose} style={S.iconBtn}>✖</button></div>
            <div style={{ padding:'18px 22px', overflowY:'auto', flex:1 }}>
              {Object.entries(groups).map(([gk,gl])=>(
                <div key={gk} style={{ marginBottom:'20px' }}>
                  <h3 style={{ fontSize:'11px', textTransform:'uppercase', letterSpacing:'1px', color:'#94a3b8', margin:'0 0 10px', fontWeight:700 }}>{gl}</h3>

                  {/* Document upload panel only inside Documents group */}
                  {gk === 'documents' && (
                    <div style={{ marginBottom:'14px' }}>
                      <div style={{ fontSize:'11.5px', color:'#475569', fontWeight:600, marginBottom:'8px', display:'flex', alignItems:'center', gap:'6px' }}>
                        📎 Documents
                        <span style={{ fontSize:'10px', color:'#94a3b8', fontWeight:400 }}>Upload passport, EID, visa, insurance, or CICPA scans. Click "Use →" after scanning to copy detected values — then verify and correct if needed.</span>
                      </div>
                      <DocumentUploadPanel data={data} setField={set} employeeId={data.employee_id || data.id} />
                    </div>
                  )}

                  {/* Training section — upload certs directly from employee modal */}
                  {gk === 'training' && (
                    <TrainingInlinePanel employeeId={data.employee_id} employeeName={data.full_name} position={data.position} cicpaLocations={data.cicpa_locations} />
                  )}

                  <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:'10px' }}>
                    {gk !== 'training' && EMPLOYEE_FIELDS.filter(f=>f.group===gk && f.type !== 'img_url').map(f=>{
                      if (f.type === 'locations') {
                        const current = (data[f.key] || '').split(',').map(s=>s.trim()).filter(Boolean);
                        const presetSelected = current.filter(loc => CICPA_LOCATIONS.includes(loc));
                        const customLocations = current.filter(loc => !CICPA_LOCATIONS.includes(loc)).join(', ');
                        const toggle = (loc) => {
                          const next = presetSelected.includes(loc)
                            ? presetSelected.filter(x=>x!==loc)
                            : [...presetSelected, loc];
                          const customList = customLocations.split(',').map(s=>s.trim()).filter(Boolean);
                          const merged = [...next, ...customList].join(', ');
                          set(f.key, merged);
                        };
                        const updateCustom = (val) => {
                          const customList = val.split(',').map(s=>s.trim()).filter(Boolean);
                          const merged = [...presetSelected, ...customList].join(', ');
                          set(f.key, merged);
                        };
                        return (
                          <div key={f.key} style={{ gridColumn:'span 2', background:'#fafbfc', border:'1px solid #e2e8f0', borderRadius:'8px', padding:'12px' }}>
                            <label style={{ display:'block', fontSize:'11.5px', color:'#475569', marginBottom:'8px', fontWeight:600 }}>{f.label} <span style={{ color:'#94a3b8', fontWeight:400, fontSize:'10.5px' }}>(tick all that apply)</span></label>
                            <div style={{ display:'flex', flexWrap:'wrap', gap:'6px', marginBottom:'10px' }}>
                              {CICPA_LOCATIONS.map(loc => {
                                const active = presetSelected.includes(loc);
                                return (
                                  <button key={loc} type="button" onClick={()=>toggle(loc)}
                                    style={{ background: active ? '#7c3aed' : '#fff', color: active ? '#fff' : '#475569', border: active ? '1px solid #7c3aed' : '1px solid #cbd5e1', padding:'5px 11px', borderRadius:'16px', fontSize:'11.5px', fontWeight:600, cursor:'pointer' }}>
                                    {active ? '✓ ' : ''}{loc}
                                  </button>
                                );
                              })}
                            </div>
                            <label style={{ display:'block', fontSize:'10.5px', color:'#64748b', marginBottom:'4px' }}>Other ADNOC location(s) <span style={{ color:'#94a3b8' }}>— comma-separated</span></label>
                            <input type="text" value={customLocations} onChange={e=>updateCustom(e.target.value)} placeholder="e.g. Bu Hasa, Sahil" style={{ ...S.input, width:'100%' }} />
                            {current.length > 0 && <div style={{ marginTop:'8px', fontSize:'10.5px', color:'#7c3aed', fontWeight:600 }}>Selected: {current.join(' • ')}</div>}
                          </div>
                        );
                      }
                      // Insurance company dropdown
                      if (f.type === 'insurance_company') {
                        const currentVal = data[f.key] || '';
                        const isKnown = INSURANCE_COMPANIES.filter(c => c !== 'Other').includes(currentVal);
                        const selectVal = (currentVal === '__other__' || (!isKnown && currentVal !== '')) ? 'Other' : (isKnown ? currentVal : '');
                        return (
                          <div key={f.key}>
                            <label style={{ display:'block', fontSize:'11.5px', color:'#475569', marginBottom:'4px', fontWeight:500 }}>{f.label}</label>
                            <select value={selectVal} onChange={e => {
                              if (e.target.value === 'Other') set(f.key, '__other__');
                              else set(f.key, e.target.value);
                            }} style={{ ...S.input, width:'100%', marginBottom: selectVal === 'Other' ? '6px' : 0 }}>
                              <option value="">Select provider…</option>
                              {INSURANCE_COMPANIES.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                            {selectVal === 'Other' && (
                              <input type="text" value={currentVal === '__other__' ? '' : (!isKnown ? currentVal : '')}
                                onChange={e => set(f.key, e.target.value)}
                                placeholder="Type insurance company name…"
                                style={{ ...S.input, width:'100%' }} />
                            )}
                          </div>
                        );
                      }
                      // Date fields: always render as type="date" for calendar picker
                      if (f.type === 'date') {
                        const isExpiry = !!f.expiry;
                        return (
                          <div key={f.key}>
                            <label style={{ display:'block', fontSize:'11.5px', color:'#475569', marginBottom:'4px', fontWeight:500 }}>
                              {f.label}
                              {f.required && <span style={{color:'#dc2626'}}> *</span>}
                              {isExpiry && <span style={{color:'#ea580c',marginLeft:'4px',fontSize:'10px'}}>(tracked)</span>}
                            </label>
                            <input
                              type="date"
                              value={data[f.key] || ''}
                              onChange={e => set(f.key, e.target.value)}
                              style={{ ...S.input, width:'100%',
                                border: isExpiry && data[f.key] ? '1.5px solid #f59e0b' : '1px solid #cbd5e1' }}
                            />
                            {isExpiry && data[f.key] && (() => {
                              const d = daysUntil(data[f.key]);
                              if (d === null) return null;
                              const c = d < 0 ? '#dc2626' : d <= 30 ? '#ea580c' : '#059669';
                              return <div style={{ fontSize:'10.5px', color:c, marginTop:'3px', fontWeight:600 }}>
                                {d < 0 ? `⚠ Expired ${Math.abs(d)}d ago` : `✓ ${d} days remaining`}
                              </div>;
                            })()}
                          </div>
                        );
                      }
                      return (
                        <div key={f.key}><label style={{ display:'block', fontSize:'11.5px', color:'#475569', marginBottom:'4px', fontWeight:500 }}>{f.label}{f.required&&<span style={{color:'#dc2626'}}> *</span>}{f.expiry&&<span style={{color:'#ea580c',marginLeft:'4px',fontSize:'10px'}}>(tracked)</span>}</label>
                          <input type={f.type==='number'?'number':'text'} value={data[f.key]||''} onChange={e=>set(f.key,e.target.value)} style={{ ...S.input, width:'100%' }} /></div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
            <div style={{ padding:'14px 22px', borderTop:'1px solid #e2e8f0', display:'flex', justifyContent:'flex-end', gap:'10px' }}><button className="hr-btn" style={S.btnSec} onClick={onClose}>Cancel</button><button className="hr-btn" style={S.btnPri} onClick={()=>onSave(data)}>Save Employee</button></div>
          </div>
        </div>
      );
    }
    // ============ CONTACT DIRECTORY ============
    function ContactsView({ contacts, employees, onAdd, onEdit, onDelete, onSyncAll }) {
      const [search, setSearch] = useState('');
      const [filterBy, setFilterBy] = useState('all');

      const filtered = useMemo(() => {
        let r = contacts;
        if (search) {
          const s = search.toLowerCase();
          r = r.filter(c =>
            (c.employee_number||'').toLowerCase().includes(s) ||
            (c.full_name||'').toLowerCase().includes(s) ||
            (c.mobile_uae||'').includes(s) ||
            (c.mobile_home||'').includes(s) ||
            (c.email||'').toLowerCase().includes(s) ||
            (c.whatsapp||'').includes(s) ||
            (c.home_address||'').toLowerCase().includes(s) ||
            (c.uae_address||'').toLowerCase().includes(s) ||
            (c.emergency_name||'').toLowerCase().includes(s) ||
            (c.emergency_relation||'').toLowerCase().includes(s) ||
            (c.emergency_country||'').toLowerCase().includes(s) ||
            (c.emergency_mobile||'').includes(s) ||
            (c.notes||'').toLowerCase().includes(s)
          );
        }
        if (filterBy === 'has_uae') r = r.filter(c => c.mobile_uae);
        if (filterBy === 'has_home') r = r.filter(c => c.mobile_home);
        if (filterBy === 'has_emergency') r = r.filter(c => c.emergency_mobile);
        if (filterBy === 'incomplete') r = r.filter(c => !c.mobile_uae);
        return r;
      }, [contacts, search, filterBy]);

      // Build quick-lookup from employees table to enrich data
      const empMap = useMemo(() => {
        const m = {};
        employees.forEach(e => { if (e.employee_id) m[e.employee_id] = e; });
        return m;
      }, [employees]);

      return (
        <div>
          {/* Action bar */}
          <div style={{ display:'flex', gap:'12px', marginBottom:'14px', alignItems:'center', flexWrap:'wrap' }}>
            <div style={{ flex:1, background:'#eff6ff', border:'1px solid #bfdbfe', borderRadius:'10px', padding:'11px 16px', fontSize:'12.5px', color:'#1e40af' }}>
              Contact data is stored in the <strong>employee_contacts</strong> table. Run SQL in Settings &rarr; DB Setup if the table does not exist yet.
            </div>
            <button className="hr-btn" onClick={onSyncAll}
              style={{ background:'#0f172a', color:'#fff', border:'none', padding:'11px 18px', borderRadius:'10px', fontSize:'13px', fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:'8px' }}>
              Sync All from Employees
              <span style={{ background:'rgba(255,255,255,0.18)', fontSize:'11px', padding:'2px 8px', borderRadius:'8px', fontWeight:600 }}>{employees.length}</span>
            </button>
          </div>

          {/* Toolbar */}
          <div style={{ display:'flex', gap:'10px', marginBottom:'10px', flexWrap:'wrap', alignItems:'center' }}>
            <input value={search} onChange={e => setSearch(e.target.value)}
              placeholder="🔍 Search by Emp No, Name, Mobile, Email, Address, Emergency Contact, Notes…"
              style={{ ...S.input, flex:1, minWidth:'260px', maxWidth:'420px' }} />
            <select value={filterBy} onChange={e => setFilterBy(e.target.value)} style={S.input}>
              <option value="all">All contacts ({contacts.length})</option>
              <option value="has_uae">Has UAE Mobile</option>
              <option value="has_home">Has Home Country Mobile</option>
              <option value="has_emergency">Has Emergency Contact</option>
              <option value="incomplete">Incomplete (no UAE mobile)</option>
            </select>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ Add Contact</button>
          </div>
          {/* Sync status bar */}
          {(() => {
            const synced = contacts.filter(c => c.full_name && c.employee_number).length;
            const needsDetails = contacts.filter(c => !c.mobile_uae).length;
            return (
              <div style={{ display:'flex', gap:'10px', marginBottom:'12px', flexWrap:'wrap' }}>
                <div style={{ background:'#f0fdf4', border:'1px solid #86efac', borderRadius:'8px', padding:'7px 14px', fontSize:'12px', color:'#166534' }}>
                  ✅ <strong>{synced}</strong> employee{synced!==1?'s':''} synced from All Employees
                </div>
                {needsDetails > 0 && (
                  <div style={{ background:'#fffbeb', border:'1px solid #fcd34d', borderRadius:'8px', padding:'7px 14px', fontSize:'12px', color:'#92400e' }}>
                    ⚠️ <strong>{needsDetails}</strong> missing UAE mobile — click ✏️ to complete
                  </div>
                )}
              </div>
            );
          })()}

          {/* Sync status */}
          {(() => {
            const empIds = new Set(employees.map(e => e.employee_id).filter(Boolean));
            const synced = contacts.filter(c => empIds.has(c.employee_number)).length;
            const total = empIds.size;
            const missing = total - synced;
            const noMobile = contacts.filter(c => !c.mobile_uae).length;
            return (
              <div style={{ display:'flex', gap:'8px', marginBottom:'12px', flexWrap:'wrap' }}>
                <div style={{ background: synced === total && total > 0 ? '#f0fdf4' : '#fffbeb', border: '1px solid ' + (synced === total && total > 0 ? '#86efac' : '#fcd34d'), borderRadius:'8px', padding:'7px 14px', fontSize:'12px', color: synced === total && total > 0 ? '#166534' : '#92400e', fontWeight:600 }}>
                  {synced === total && total > 0 ? '✅' : '⚠️'} {synced}/{total} employees in directory
                  {missing > 0 && <span> &mdash; <strong>{missing} missing</strong> &mdash; click &ldquo;Sync All&rdquo; button above</span>}
                </div>
                {noMobile > 0 && (
                  <div style={{ background:'#fef3c7', border:'1px solid #fcd34d', borderRadius:'8px', padding:'7px 14px', fontSize:'12px', color:'#92400e', fontWeight:600 }}>
                    {noMobile} contacts missing UAE mobile &mdash; click edit to complete
                  </div>
                )}
              </div>
            );
          })()}
          {/* Table */}
          <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
            <div className="hr-scroll" style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'12px', minWidth:'1200px' }}>
                <thead>
                  <tr style={{ background:'#f8fafc' }}>
                    {['Emp No','Full Name','UAE Mobile','Home Mobile','WhatsApp','Email','UAE Address','Emergency Contact',''].map(h =>
                      <th key={h} style={S.th}>{h}</th>
                    )}
                  </tr>
                </thead>
                <tbody>
                  {filtered.length === 0
                    ? <tr><td colSpan={9} style={{ textAlign:'center', padding:'50px', color:'#94a3b8' }}>
                        {contacts.length === 0 ? '📞 No contacts yet — click "+ Add Contact" to get started' : 'No results match your search'}
                      </td></tr>
                    : filtered.map(c => (
                      <tr key={c.id} className="hr-row" onClick={(e) => { if(e.detail===2){ e.preventDefault(); onEdit(c); } }} title="Double-click to edit" style={{ borderTop:'1px solid #f1f5f9', cursor:'pointer' }}>
                        <td style={{ ...S.td, fontFamily:'ui-monospace,monospace', fontWeight:700, color:'#2563eb' }}>{c.employee_number || '—'}</td>

    // ============ STAGE DOCUMENT UPLOAD MODAL ============
    // Maps each hiring stage to the document(s) that should be uploaded at that stage
    const STAGE_DOC_MAP = {
      offer_sent:   [{ key:'offer_letter_url',   label:'📧 Offer Letter (PDF/Image)', accept:'.pdf,image/*' }],
      offer_signed: [{ key:'offer_signed_url',   label:'✍️ Signed Offer Letter',      accept:'.pdf,image/*' }],
      visa_medical: [{ key:'visa_medical_url',   label:'🏥 Pre-Employment Medical Report',      accept:'.pdf,image/*' }],
      docs_sent:    [{ key:'visa_docs_url',      label:'📨 Visa Documents Package',    accept:'.pdf,image/*' }],
      visa_stamped: [{ key:'visa_stamped_url',   label:'🛂 Visa Stamp / Entry Permit', accept:'.pdf,image/*' }],
      travel:       [{ key:'travel_doc_url',     label:'✈️ Travel / Ticket Booking',   accept:'.pdf,image/*' }],
      joined:       [{ key:'joining_doc_url',    label:'🏢 Joining Confirmation',       accept:'.pdf,image/*' }],
      resume:       [
        { key:'resume_url',      label:'📄 Resume / CV',  accept:'.pdf,image/*' },
        { key:'passport_img_url',label:'🛂 Passport Scan', accept:'image/*,.pdf' },
      ],
      interview:    [{ key:'interview_sheet_url', label:'📝 Filled Interview Sheet', accept:'.pdf,image/*' }],
    };

    function StageDocUploadModal({ candidate, stepId, stepLabel, stepColor, stepIcon, onSave, onClose, showToast }) {
      const docTypes = STAGE_DOC_MAP[stepId] || [];
      const [uploads, setUploads] = React.useState({}); // key → { dataUrl, name }
      const [saving, setSaving] = React.useState(false);
      const [stagePreview, setStagePreview] = React.useState(null); // { url, isPdf, label }
      const [stagePdfBlob, setStagePdfBlob] = React.useState(null);

      React.useEffect(() => {
        if (!stagePreview || !stagePreview.isPdf || !stagePreview.url) { setStagePdfBlob(null); return; }
        try {
          const b64 = stagePreview.url.split(',')[1];
          const bytes = atob(b64);
          const arr = new Uint8Array(bytes.length);
          for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
          const blob = new Blob([arr], { type: 'application/pdf' });
          const bUrl = URL.createObjectURL(blob);
          setStagePdfBlob(bUrl);
          return () => URL.revokeObjectURL(bUrl);
        } catch(e) { setStagePdfBlob(null); }
      }, [stagePreview]);

      const handleFile = (docKey, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setUploads(prev => ({ ...prev, [docKey]: { dataUrl: ev.target.result, name: file.name } }));
        };
        reader.readAsDataURL(file);
      };

      const handleSave = async () => {
        const keys = Object.keys(uploads);
        if (keys.length === 0) { showToast('Please select at least one file', 'error'); return; }
        setSaving(true);
        try {
          const updates = {};
          keys.forEach(k => { updates[k] = uploads[k].dataUrl; });
          await onSave(candidate.id, updates);
          showToast('Document(s) saved ✓', 'success');
          onClose();
        } catch(e) {
          showToast('Save failed: ' + e.message, 'error');
        }
        setSaving(false);
      };

      const existingCount = docTypes.filter(d => candidate[d.key]).length;

      return (
        <>
        <div onClick={onClose} style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.65)', zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center', animation:'fadeIn 0.15s' }}>
          <div onClick={e => e.stopPropagation()} style={{ background:'#fff', borderRadius:'14px', width:'96%', maxWidth:'480px', boxShadow:'0 25px 60px rgba(0,0,0,0.3)', overflow:'hidden' }}>

            {/* Header */}
            <div style={{ background: stepColor, padding:'16px 20px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <div>
                <div style={{ color:'#fff', fontWeight:800, fontSize:'15px' }}>{stepIcon} Upload — {stepLabel}</div>
                <div style={{ color:'rgba(255,255,255,0.8)', fontSize:'12px', marginTop:'2px' }}>{candidate.candidate_name} · {candidate.position||'—'}</div>
              </div>
              <button onClick={onClose} style={{ background:'rgba(255,255,255,0.2)', border:'none', color:'#fff', borderRadius:'8px', width:'32px', height:'32px', fontSize:'18px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
            </div>

            {/* Body */}
            <div style={{ padding:'20px' }}>
              {existingCount > 0 && (
                <div style={{ background:'#f0fdf4', border:'1px solid #86efac', borderRadius:'8px', padding:'8px 12px', marginBottom:'14px', fontSize:'12px', color:'#166534' }}>
                  ✅ {existingCount} document(s) already saved for this stage — uploading will replace them.
                </div>
              )}

              {docTypes.length === 0 ? (
                <div style={{ textAlign:'center', color:'#94a3b8', padding:'24px 0', fontSize:'13px' }}>No document upload defined for this stage.</div>
              ) : docTypes.map(doc => {
                const uploaded = uploads[doc.key];
                const existing = candidate[doc.key];
                const isPdf = uploaded
                  ? uploaded.dataUrl.startsWith('data:application/pdf')
                  : existing?.startsWith('data:application/pdf');
                return (
                  <div key={doc.key} style={{ marginBottom:'16px' }}>
                    <div style={{ fontSize:'12px', fontWeight:700, color:'#334155', marginBottom:'8px' }}>{doc.label}</div>

                    {/* Preview area */}
                    {(uploaded || existing) && (
                      <div style={{ marginBottom:'8px', background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:'8px', padding:'10px', display:'flex', alignItems:'center', gap:'10px' }}>
                        {isPdf ? (
                          <div
                            onClick={() => setStagePreview({ url: uploaded ? uploaded.dataUrl : existing, isPdf: true, label: doc.label })}
                            style={{ width:'44px', height:'44px', background:'#eff6ff', borderRadius:'6px', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'22px', flexShrink:0, cursor:'zoom-in', border:'2px solid #2563eb' }}
                            title="Click to view PDF">
                            📄
                          </div>
                        ) : (
                          <img
                            src={uploaded ? uploaded.dataUrl : existing} alt="preview"
                            onClick={() => setStagePreview({ url: uploaded ? uploaded.dataUrl : existing, isPdf: false, label: doc.label })}
                            style={{ width:'56px', height:'44px', objectFit:'cover', borderRadius:'6px', border:'1px solid #e2e8f0', flexShrink:0, cursor:'zoom-in' }} />
                        )}
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:'12px', fontWeight:600, color:'#0f172a', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                            {uploaded ? uploaded.name : (isPdf ? 'PDF saved' : 'Image saved')}
                          </div>
                          <div style={{ fontSize:'10.5px', color: uploaded ? '#059669' : '#94a3b8', marginTop:'2px' }}>
                            {uploaded ? '✓ Ready to save' : '(currently stored — upload new to replace)'}
                          </div>
                        </div>
                      </div>
                    )}

                    {/* Upload button */}
                    <label style={{ display:'inline-flex', alignItems:'center', gap:'7px', background:'#f1f5f9', border:'1.5px dashed #94a3b8', borderRadius:'8px', padding:'9px 14px', cursor:'pointer', fontSize:'12.5px', color:'#475569', fontWeight:600, width:'100%', justifyContent:'center', transition:'background 0.15s' }}
                      onMouseEnter={e=>e.currentTarget.style.background='#e2e8f0'}
                      onMouseLeave={e=>e.currentTarget.style.background='#f1f5f9'}>
                      📎 {uploaded || existing ? 'Replace file' : 'Choose file'}
                      <input type="file" accept={doc.accept} style={{ display:'none' }} onChange={e => { if (e.target.files[0]) handleFile(doc.key, e.target.files[0]); e.target.value=''; }} />
                    </label>
                  </div>
                );
              })}
            </div>

            {/* Footer */}
            <div style={{ padding:'14px 20px', borderTop:'1px solid #e2e8f0', display:'flex', justifyContent:'flex-end', gap:'10px' }}>
              <button onClick={onClose} style={{ background:'#fff', border:'1px solid #cbd5e1', color:'#475569', padding:'8px 18px', borderRadius:'8px', fontSize:'13px', fontWeight:600, cursor:'pointer' }}>Cancel</button>
              <button onClick={handleSave} disabled={saving || Object.keys(uploads).length===0}
                style={{ background: Object.keys(uploads).length===0 ? '#94a3b8' : stepColor, border:'none', color:'#fff', padding:'8px 20px', borderRadius:'8px', fontSize:'13px', fontWeight:700, cursor: Object.keys(uploads).length===0 ? 'not-allowed' : 'pointer', display:'flex', alignItems:'center', gap:'6px' }}>
                {saving ? '⏳ Saving…' : '💾 Save Document(s)'}
              </button>
            </div>
          </div>
        </div>

        {/* PDF/Image preview overlay */}
        {stagePreview && (
          <div onClick={()=>setStagePreview(null)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.85)', zIndex:10000, display:'flex', alignItems:'center', justifyContent:'center', padding:'20px' }}>
            <div onClick={e=>e.stopPropagation()} style={{ background:'#fff', borderRadius:'12px', overflow:'hidden', maxWidth: stagePreview.isPdf ? '92vw' : '90vw', maxHeight:'93vh', width: stagePreview.isPdf ? '88vw' : 'auto', display:'flex', flexDirection:'column', boxShadow:'0 25px 60px rgba(0,0,0,0.5)' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px', borderBottom:'1px solid #e2e8f0', background:'#f8fafc' }}>
                <span style={{ fontWeight:700, fontSize:'14px', color:'#0f172a' }}>📄 {stagePreview.label}</span>
                <div style={{ display:'flex', gap:'8px', alignItems:'center' }}>
                  {stagePreview.isPdf && stagePdfBlob && (
                    <button onClick={()=>window.open(stagePdfBlob,'_blank')} style={{ background:'#2563eb', color:'#fff', border:'none', padding:'6px 14px', borderRadius:'7px', fontSize:'12px', fontWeight:700, cursor:'pointer' }}>
                      🔗 Open in New Tab
                    </button>
                  )}
                  <button onClick={()=>{ const a=document.createElement('a'); a.href=stagePreview.url; a.download=stagePreview.label.replace(/[^a-z0-9]/gi,'_')+(stagePreview.isPdf?'.pdf':'.jpg'); a.click(); }} style={{ background:'#0f2744', color:'#fff', border:'none', padding:'6px 14px', borderRadius:'7px', fontSize:'12px', fontWeight:700, cursor:'pointer' }}>
                    💾 Save to Folder
                  </button>
                  <button onClick={()=>setStagePreview(null)} style={{ background:'none', border:'none', fontSize:'22px', cursor:'pointer', color:'#64748b', lineHeight:1 }}>✕</button>
                </div>
              </div>
              <div style={{ flex:1, overflow: stagePreview.isPdf ? 'hidden' : 'auto', display:'flex', alignItems:'center', justifyContent:'center' }}>
                {stagePreview.isPdf ? (
                  stagePdfBlob
                    ? <object data={stagePdfBlob} type="application/pdf" style={{ width:'100%', height:'85vh', border:'none' }}>
                        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'14px', padding:'40px', color:'#64748b' }}>
                          <div style={{ fontSize:'48px' }}>📄</div>
                          <div style={{ fontWeight:600 }}>PDF cannot display inline in this browser.</div>
                          <button onClick={()=>window.open(stagePdfBlob,'_blank')} style={{ background:'#2563eb', color:'#fff', border:'none', padding:'10px 22px', borderRadius:'8px', fontSize:'13px', fontWeight:700, cursor:'pointer' }}>🔗 Open PDF in New Tab</button>
                        </div>
                      </object>
                    : <div style={{ padding:'40px', textAlign:'center', color:'#64748b' }}><div style={{ fontSize:'48px' }}>📄</div><div style={{ marginTop:'12px', fontWeight:600 }}>Building PDF preview…</div></div>
                ) : (
                  <img src={stagePreview.url} alt="Document" style={{ maxWidth:'80vw', maxHeight:'85vh', objectFit:'contain', display:'block' }} />
                )}
              </div>
            </div>
          </div>
        )}
        </>
      );
    }
    // Steps common to both tracks
    const HIRING_STEPS_COMMON = [
      { id: 'resume',          label: 'Resume Received',         icon: '📄', days: 2,  color: '#6366f1', track: 'both' },
      { id: 'interview',       label: 'Interview Conducted',      icon: '🎙️', days: 5,  color: '#2563eb', track: 'both' },
      { id: 'offer_sent',      label: 'Offer Letter Sent',        icon: '📧', days: 3,  color: '#0891b2', track: 'both' },
      { id: 'offer_signed',    label: 'Offer Letter Signed',      icon: '✍️', days: 7,  color: '#059669', track: 'both' },
      // Overseas track (India / Pakistan / Nepal / Philippines / any non-UAE)
      { id: 'visa_medical',    label: 'Pre-Employment Medical',       icon: '🏥', days: 7,  color: '#ca8a04', track: 'overseas' },
      { id: 'docs_sent',       label: 'Visa Docs Sent (Overseas)',  icon: '📨', days: 3,  color: '#ea580c', track: 'overseas' },
      { id: 'visa_stamped',    label: 'Visa Stamped',               icon: '🛂', days: 14, color: '#dc2626', track: 'overseas' },
      { id: 'travel',          label: 'Travel to UAE',              icon: '✈️', days: 5,  color: '#7c3aed', track: 'overseas' },
      // UAE track (visa transfer / residence visa)
      { id: 'visa_cancel',     label: 'Employment Visa Cancellation', icon: '🚫', days: 7,  color: '#b45309', track: 'uae'      },
      { id: 'residence_visa',  label: 'Residence Visa (UAE)',       icon: '🪪', days: 21, color: '#0f766e', track: 'uae'      },
      // Common end
      { id: 'joined',          label: 'Joined',                   icon: '🏢', days: 0,  color: '#059669', track: 'both' },
    ];
    const HIRING_STEPS = HIRING_STEPS_COMMON; // alias used throughout
    // Helper: is candidate currently in UAE? (drives which visa track to use)
    // UAE-based → Residence Visa track (no pre-employment medical, no travel)
    // Overseas (India/Pakistan/Nepal/Philippines/any other) → New Employment Visa track (Medical → stamp → travel)
    const isUAEBased = (r) => {
      const loc = (r.current_location || '').toLowerCase().trim();
      return loc === 'uae' || loc.includes('united arab') || loc.includes('dubai') ||
             loc.includes('abu dhabi') || loc.includes('sharjah') || loc.includes('ajman') ||
             loc.includes('fujairah') || loc.includes('ras al') || loc.includes('umm al');
    };

    const HIRING_STATUS_COLORS = {
      'Active': '#059669', 'Offer Pending': '#2563eb', 'Offer Accepted': '#0891b2',
      'Visa Processing': '#ca8a04', 'Travelling': '#7c3aed', 'Joined': '#059669',
      'Withdrawn': '#dc2626', 'On Hold': '#94a3b8',
    };

    function HiringView({ records, onAdd, onEdit, onDelete, onSaveDoc, showToast, onOpenSheet }) {
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [stepFilter, setStepFilter] = useState('all');
      const [viewMode, setViewMode] = useState('pipeline'); // 'pipeline' | 'table'
      const [viewCandidate, setViewCandidate] = useState(null); // candidate record to show in detail popup
      const [stageUpload, setStageUpload] = useState(null); // { candidate, step }
      const today = new Date(); today.setHours(0,0,0,0);

      // Alert check: step_due_date overdue
      const overdue = records.filter(r => {
        if (!r.step_due_date || r.status === 'Joined' || r.status === 'Withdrawn') return false;
        const d = new Date(r.step_due_date); d.setHours(0,0,0,0);
        return d < today;
      });

      // Resolve effective step — location-aware two-track pipeline
      const resolveStep = (r) => {
        if (r.status === 'Joined') return 'joined';
        const uae = isUAEBased(r);
        if (uae) {
          // UAE track: offer_signed → visa_cancel → residence_visa → joined
          if (r.residence_visa_date)       return 'residence_visa';
          if (r.visa_cancel_date)          return 'visa_cancel';
          if (r.offer_accepted_date)       return 'offer_signed';
          if (r.offer_letter_date)    return 'offer_sent';
          if (r.interview_date)       return 'interview';
        } else {
          // Overseas track (India/Pakistan/Nepal/etc): offer_signed → medical → docs → stamped → travel → joined
          if (r.visa_stamped_date && r.expected_arrival_date) return 'travel';
          if (r.visa_stamped_date)         return 'visa_stamped';
          if (r.visa_documents_sent_date)  return 'docs_sent';
          if (r.visa_medical_date)         return 'visa_medical';
          if (r.offer_accepted_date)       return 'offer_signed';
          if (r.offer_letter_date)         return 'offer_sent';
          if (r.interview_date)            return 'interview';
        }
        // Fallback: respect manually-set step (ignore wrong travel promotions)
        if (r.step && r.step !== 'resume' && r.step !== 'travel') return r.step;
        if (r.step === 'travel' && (uae || !r.visa_stamped_date)) return 'interview';
        return 'resume';
      };

      const filtered = useMemo(() => {
        let r = records;
        if (search) { const s = search.toLowerCase(); r = r.filter(c => ['candidate_name','position','passport_no','referred_by','current_location','status'].some(k => String(c[k]||'').toLowerCase().includes(s))); }
        if (statusFilter !== 'all') r = r.filter(c => c.status === statusFilter);
        if (stepFilter !== 'all') {
          if (stepFilter === 'interview_conducted') r = r.filter(c => { const s=resolveStep(c); return ['interview','offer_sent','offer_signed','visa_medical','docs_sent','visa_stamped','travel','visa_cancel','residence_visa','joined'].includes(s); });
          else if (stepFilter === 'no_interview') r = r.filter(c => resolveStep(c) === 'resume');
          else if (stepFilter === 'visa_medical') r = r.filter(c => ['visa_medical','docs_sent','visa_stamped','visa_cancel','residence_visa'].includes(resolveStep(c)));
          else r = r.filter(c => resolveStep(c) === stepFilter);
        }
        return r;
      }, [records, search, statusFilter, stepFilter]);

      // Group by EFFECTIVE step for pipeline view
      const byStep = useMemo(() => {
        const m = {};
        HIRING_STEPS.forEach(s => { m[s.id] = []; });
        filtered.forEach(r => {
          const eff = resolveStep(r);
          if (m[eff]) m[eff].push(r); else m['resume'].push(r);
        });
        return m;
      }, [filtered]);

      const statuses = [...new Set(records.map(r => r.status).filter(Boolean))];

      return (
        <>
        <div>
          {/* Overdue Alert Banner */}
          {overdue.length > 0 && (
            <div style={{ background:'#fee2e2', border:'1px solid #fca5a5', borderRadius:'10px', padding:'12px 18px', marginBottom:'14px', display:'flex', alignItems:'center', gap:'12px' }}>
              <span style={{ fontSize:'20px' }}>⚠️</span>
              <div>
                <div style={{ fontWeight:700, color:'#991b1b', fontSize:'13.5px' }}>{overdue.length} candidate{overdue.length>1?'s':''} overdue for follow-up</div>
                <div style={{ fontSize:'12px', color:'#b91c1c', marginTop:'2px' }}>{overdue.map(r => r.candidate_name).join(', ')}</div>
              </div>
            </div>
          )}

          {/* KPI Row */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(6, 1fr)', gap:'10px', marginBottom:'16px' }}>
            {[
              { label:'Total Active', value: records.filter(r=>r.status!=='Joined'&&r.status!=='Withdrawn').length, icon:'👥', color:'#2563eb', filter:'all', sub:'in pipeline' },
              { label:'Awaiting Interview', value: records.filter(r=>resolveStep(r)==='resume').length, icon:'📄', color:'#6366f1', filter:'no_interview', sub:'resume received' },
              { label:'Offer Sent', value: records.filter(r=>resolveStep(r)==='offer_sent').length, icon:'📧', color:'#0891b2', filter:'offer_sent', sub:'awaiting signature' },
              { label:'Offer Signed', value: records.filter(r=>resolveStep(r)==='offer_signed').length, icon:'✍️', color:'#059669', filter:'offer_signed', sub:'accepted — next: visa' },
              { label:'Visa Processing', value: records.filter(r=>['visa_medical','docs_sent','visa_stamped','visa_cancel','residence_visa'].includes(resolveStep(r))).length, icon:'🛂', color:'#ca8a04', filter:'visa_medical', sub:'in progress' },
              { label:'Overdue Steps', value: overdue.length, icon:'⏰', color:'#dc2626', filter:null, sub: overdue.length>0 ? overdue.map(r=>r.candidate_name.split(' ')[0]).join(', ') : 'all on track' },
            ].map(k => (
              <div key={k.label} className="hr-card" onClick={k.filter ? ()=>setStepFilter(f=>f===k.filter?'all':k.filter) : undefined} style={{ background:'#fff', border:'1px solid #e2e8f0', borderLeft:`4px solid ${k.color}`, borderRadius:'12px', padding:'14px 12px', cursor: k.filter ? 'pointer' : 'default', position:'relative', overflow:'hidden' }}>
                <div style={{ position:'absolute', top:'10px', right:'12px', fontSize:'22px', opacity:0.12 }}>{k.icon}</div>
                <div style={{ fontSize:'10px', color:'#64748b', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:'5px', lineHeight:1.3 }}>{k.label}</div>
                <div style={{ fontSize:'28px', fontWeight:800, color: k.value>0&&k.label==='Overdue Steps'?'#dc2626':k.color, lineHeight:1, marginBottom:'4px' }}>{k.value}</div>
                <div style={{ fontSize:'10px', color:'#94a3b8', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{k.sub}</div>
              </div>
            ))}
          </div>

          {/* Toolbar */}
          <div style={{ display:'flex', gap:'10px', marginBottom:'10px', flexWrap:'wrap', alignItems:'center' }}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search name, position, passport, location…" style={{ ...S.input, flex:1, minWidth:'240px', maxWidth:'380px' }} />
            <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={S.input}>
              <option value="all">All Status</option>
              {statuses.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
            <div style={{ display:'flex', border:'1px solid #cbd5e1', borderRadius:'8px', overflow:'hidden' }}>
              {[['pipeline','🗂 Pipeline'],['table','📋 Table']].map(([k,l])=>(
                <button key={k} onClick={()=>setViewMode(k)} style={{ background:viewMode===k?'#2563eb':'#fff', color:viewMode===k?'#fff':'#475569', border:'none', padding:'7px 14px', fontSize:'12.5px', fontWeight:600, cursor:'pointer' }}>{l}</button>
              ))}
            </div>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ New Candidate</button>
            <button className="hr-btn" title="Fix candidates stuck in wrong pipeline column" onClick={async () => {
              const { data } = await db.from('hiring_pipeline').select('*');
              if (!data) return;
              const today = new Date().toISOString().slice(0,10);
              // Log all records so you can inspect in browser console
              console.log('[Fix Pipeline] All records:', data.map(r=>({name:r.candidate_name,step:r.step,interview_date:r.interview_date,score:r.interview_score,by:r.interviewed_by,verdict:r.interview_verdict,salary:r.basic_salary,mode:r.interview_mode,sheetUrl:r.interview_sheet_url})));
              // Fix anyone with interview evidence stuck at resume/null
              // Fix 1: demote wrongly-promoted travel records (no visa stamp yet)
              const wrongTravel = data.filter(r => r.step==='travel' && !r.visa_stamped_date);
              // Fix 2: promote resume-stuck records with interview evidence
              const toFix = data.filter(r => !r.interview_date && (!r.step || r.step==='resume') &&
                (Number(r.interview_score)>0 || r.interview_verdict || r.interviewed_by || r.interview_mode || r.basic_salary || r.interview_sheet_url));
              console.log('[Fix Pipeline] Wrong travel:', wrongTravel.map(r=>r.candidate_name));
              console.log('[Fix Pipeline] Stuck at resume:', toFix.map(r=>r.candidate_name));
              if (wrongTravel.length===0 && toFix.length===0) { alert('No stuck candidates found. Check browser Console (F12) to see all field values.'); return; }
              await Promise.all([
                ...wrongTravel.map(r => db.from('hiring_pipeline').update({step:'interview'}).eq('id',r.id)),
                ...toFix.map(r => db.from('hiring_pipeline').update({step:'interview', interview_date: today}).eq('id',r.id)),
              ]);
              const fixed = [...wrongTravel, ...toFix];
              const {data: fresh} = await db.from('hiring_pipeline').select('*').order('created_at',{ascending:false});
              if (fresh) { alert(`Fixed ${fixed.length} candidate(s): ${fixed.map(r=>r.candidate_name).join(', ')}`); }
              window.location.reload();
            }} style={{ background:'#7c3aed', color:'#fff', border:'none', padding:'7px 12px', borderRadius:'7px', fontSize:'11.5px', fontWeight:600, cursor:'pointer' }}>🔧 Fix Pipeline</button>
          </div>
          {/* Track Filter Bar */}
          <div style={{ display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'14px', alignItems:'center' }}>
            <span style={{ fontSize:'11px', fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', marginRight:'4px' }}>Filter:</span>
            {[
              { key:'all',          label:'All Candidates',           color:'#64748b',  emoji:'👥' },
              { key:'no_interview', label:'Resume Only',              color:'#b45309',  emoji:'📄' },
              { key:'interview',    label:'Interviewed',              color:'#2563eb',  emoji:'🎙️' },
              { key:'offer_sent',   label:'Offer Sent',               color:'#0891b2',  emoji:'📧' },
              { key:'offer_signed', label:'Offer Signed',             color:'#059669',  emoji:'✍️' },
              { key:'visa_medical', label:'Visa Processing',          color:'#ca8a04',  emoji:'🛂' },
              { key:'joined',       label:'Joined',                   color:'#065f46',  emoji:'🏢' },
            ].map(f => {
              const isActive = stepFilter === f.key;
              const cnt = f.key==='all' ? records.length
                : f.key==='no_interview' ? records.filter(r=>resolveStep(r)==='resume').length
                : f.key==='interview' ? records.filter(r=>resolveStep(r)==='interview').length
                : f.key==='visa_medical' ? records.filter(r=>['visa_medical','docs_sent','visa_stamped','visa_cancel','residence_visa'].includes(resolveStep(r))).length
                : records.filter(r=>resolveStep(r)===f.key).length;
              return (
                <button key={f.key} onClick={()=>setStepFilter(f.key==='interview'?'interview_conducted':f.key==='visa_medical'?'visa_medical':f.key)} style={{ background:isActive?f.color:'#fff', color:isActive?'#fff':f.color, border:`1.5px solid ${isActive?f.color:f.color+'40'}`, borderRadius:'20px', padding:'5px 13px', fontSize:'12px', fontWeight:600, cursor:'pointer', transition:'all 0.15s', display:'flex', alignItems:'center', gap:'5px' }}>
                  {f.emoji} {f.label} {cnt>0 && <span style={{ background:isActive?'rgba(255,255,255,0.3)':f.color+'20', padding:'0 6px', borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>{cnt}</span>}
                </button>
              );
            })}
          </div>

          {/* Pipeline Board - Two Track Swimlanes */}
          {viewMode === 'pipeline' && (() => {
            const COMMON_STEPS = HIRING_STEPS.filter(s => s.track === 'both');
            const OVERSEAS_STEPS = HIRING_STEPS.filter(s => s.track === 'overseas');
            const UAE_STEPS = HIRING_STEPS.filter(s => s.track === 'uae');

            const overseasCandidates = filtered.filter(r => !isUAEBased(r));
            const uaeCandidates = filtered.filter(r => isUAEBased(r));

            const StepColumn = ({ step, candidates, trackColor }) => {
              const cards = candidates.filter(c => resolveStep(c) === step.id);
              const due0 = cards.filter(c => c.step_due_date && daysUntil(c.step_due_date) < 0).length;
              return (
                <div style={{ width:'220px', flexShrink:0, display:'flex', flexDirection:'column' }}>
                  <div style={{ background:step.color, color:'#fff', borderRadius:'10px 10px 0 0', padding:'10px 12px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    <div>
                      <div style={{ fontSize:'13px', fontWeight:700 }}>{step.icon} {step.label}</div>
                      <div style={{ fontSize:'10px', opacity:0.8, marginTop:'1px' }}>Target: {step.days}d per candidate</div>
                    </div>
                    <div style={{ textAlign:'center', flexShrink:0, marginLeft:'8px' }}>
                      <div style={{ background:'rgba(255,255,255,0.25)', borderRadius:'10px', padding:'2px 10px', fontSize:'14px', fontWeight:800, minWidth:'28px', textAlign:'center' }}>{cards.length}</div>
                      {due0>0 && <div style={{ fontSize:'9px', marginTop:'2px', background:'#fee2e2', color:'#991b1b', borderRadius:'6px', padding:'0 5px', fontWeight:700 }}>⚠ {due0} overdue</div>}
                    </div>
                  </div>
                  <div style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderTop:'none', borderRadius:'0 0 10px 10px', flex:1, minHeight:'100px', padding:'8px', display:'flex', flexDirection:'column', gap:'8px' }}>
                    {cards.map(c => {
                      const due = c.step_due_date ? daysUntil(c.step_due_date) : null;
                      const isOverdue = due !== null && due < 0;
                      const hasDoc = STAGE_DOC_MAP[step.id] && STAGE_DOC_MAP[step.id].some(d => c[d.key]);
                      return (
                        <div key={c.id}
                          onClick={() => setViewCandidate(c)}
                          onDoubleClick={(e) => { e.stopPropagation(); setStageUpload({ candidate: c, step }); }}
                          style={{ background:'#fff', border:`1.5px solid ${isOverdue?'#fca5a5':step.color+'30'}`, borderRadius:'10px', padding:'11px 12px', cursor:'pointer', boxShadow: isOverdue?'0 0 0 2px #fee2e2':`0 1px 4px ${step.color}15`, position:'relative', transition:'box-shadow 0.15s' }}>
                          {hasDoc && <div style={{ position:'absolute', top:'8px', right:'8px', background:'#059669', borderRadius:'50%', width:'8px', height:'8px' }} title="Document uploaded" />}
                          <div style={{ fontWeight:700, fontSize:'13px', color:'#1e40af', marginBottom:'3px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{c.candidate_name||'(no name)'}</div>
                          <div style={{ fontSize:'11.5px', color:'#475569', marginBottom:'5px' }}>{c.position||'—'}</div>
                          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'3px' }}>
                            <span style={{ fontSize:'10.5px', color:'#64748b', background:'#f1f5f9', padding:'1px 7px', borderRadius:'6px' }}>{c.nationality||'—'}</span>
                            {c.is_supplier_hire==='yes' && <span style={{ fontSize:'10px', color:'#7c3aed', background:'#ede9fe', padding:'1px 7px', borderRadius:'6px', fontWeight:600 }}>🏢 Supplier</span>}
                          </div>
                          {due !== null && (
                            <div style={{ marginTop:'6px', fontSize:'11px', fontWeight:700, color:isOverdue?'#dc2626':'#059669', background:isOverdue?'#fee2e2':'#f0fdf4', padding:'2px 8px', borderRadius:'6px', display:'inline-block' }}>
                              {isOverdue ? `⚠ ${Math.abs(due)}d overdue` : `✓ ${due}d left`}
                            </div>
                          )}
                          <div style={{ marginTop:'6px', fontSize:'10px', color:'#cbd5e1', borderTop:'1px solid #f1f5f9', paddingTop:'5px' }}>👆 tap to view · dbl-click upload doc</div>
                        </div>
                      );
                    })}
                    {cards.length===0 && (
                      <div style={{ textAlign:'center', padding:'20px 0', color:'#cbd5e1' }}>
                        <div style={{ fontSize:'22px', marginBottom:'4px', opacity:0.4 }}>{step.icon}</div>
                        <div style={{ fontSize:'11px' }}>No candidates</div>
                      </div>
                    )}
                  </div>

    // -------- Hiring Modal --------
    // ── Uncontrolled field: lag-free text input that reads from dataRef ──
    function UF({ label, fieldKey, dataRef, type='text', opts, wide, placeholder, onBlur }) {
      const inputRef = React.useRef(null);
      React.useEffect(() => {
        if (inputRef.current) inputRef.current.value = dataRef.current[fieldKey] || '';
      }, [fieldKey]);
      const handleChange = (e) => { dataRef.current[fieldKey] = e.target.value; };
      const handleBlur = (e) => { dataRef.current[fieldKey] = e.target.value; if (onBlur) onBlur(fieldKey, e.target.value); };
      if (opts) {
        return (
          <div style={{ gridColumn: wide?'span 2':undefined }}>
            <label style={S.label}>{label}</label>
            <select data-fk={fieldKey} defaultValue={dataRef.current[fieldKey]||''} onChange={e=>{ dataRef.current[fieldKey]=e.target.value; }}
              style={{ ...S.input, width:'100%' }}>
              <option value="">— Select —</option>
              {opts.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          </div>
        );
      }
      if (type==='textarea') return (
        <div style={{ gridColumn: wide?'span 2':undefined }}>
          <label style={S.label}>{label}</label>
          <textarea data-fk={fieldKey} ref={inputRef} defaultValue={dataRef.current[fieldKey]||''} onChange={handleChange} onBlur={handleBlur}
            placeholder={placeholder} style={{ ...S.input, width:'100%', minHeight:'70px', resize:'vertical' }} />
        </div>
      );
      return (
        <div style={{ gridColumn: wide?'span 2':undefined }}>
          <label style={S.label}>{label}</label>
          <input data-fk={fieldKey} ref={inputRef} type={type} defaultValue={dataRef.current[fieldKey]||''} onChange={handleChange} onBlur={handleBlur}
            placeholder={placeholder} style={{ ...S.input, width:'100%' }} />
        </div>
      );
    }

    function HiringModal({ record, onSave, onClose, showToast, onOpenSheet }) {
      // Use ref for data so text inputs don't cause re-renders
      const dataRef = React.useRef({ step:'resume', status:'Active', ...record });

          const b64 = previewDoc.url.split(',')[1];
          const bytes = atob(b64);
          const arr = new Uint8Array(bytes.length);
          for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
          const blob = new Blob([arr], { type: 'application/pdf' });
          const bUrl = URL.createObjectURL(blob);
          setPdfBlobUrl(bUrl);
          return () => URL.revokeObjectURL(bUrl);
        } catch(e) { setPdfBlobUrl(null); }
      }, [previewDoc]);

      const updateField = (k, v) => { dataRef.current[k] = v; };

          ocrPrompt:`Read this resume/CV and extract the following fields. For meExperience: answer "yes" if the candidate has worked in any Middle East country (UAE, Saudi Arabia, Qatar, Kuwait, Bahrain, Oman, Iraq), otherwise "no". For meNotes: list ALL companies from the experience table regardless of country — format as "Company (Country) — Role, Period; ..." for every row. Do NOT extract or guess notice period or availability date — leave that null. Reply ONLY with valid JSON, no markdown:
{"fullName":"...","passportNo":"...","passportExpiry":"YYYY-MM-DD","placeOfIssue":"...","experienceYears":"...","position":"...","phone":"...","email":"...","currentEmployer":"...","currentDesignation":"...","skills":"...","meExperience":"yes or no","meNotes":"full experience history with companies, countries, roles and periods","noticePeriod":null}
Use null for missing fields.` },
        { key:'interview_sheet_url', label:'📝 Filled Interview Sheet', accept:'image/jpeg,image/png,application/pdf',
          ocrPrompt:`This is a filled SATCO Arabia Candidate Interview Sheet. Extract every piece of data written or typed in the form fields. Reply ONLY as valid JSON, no markdown fences, no preamble:
{
  "fullName": "candidate full name",
  "dob": "YYYY-MM-DD or null",
  "nationality": "nationality",
  "passportNo": "passport number",
  "passportExpiry": "YYYY-MM-DD or null",
  "placeOfIssue": "place of issue",

}
Use null for any field not found or left blank.`,
          applyFn: 'interview_sheet' },
        { key:'offer_signed_url', label:'✍️ Signed Offer Letter', accept:'image/*,.pdf', ocrPrompt:null },

      ];

      const handleDocFile = async (docKey, file) => {
        if (!file) return;
        const docType = HIRING_DOC_TYPES.find(d => d.key === docKey);
        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        const isImage = file.type.startsWith('image/');

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const dataUrl = ev.target.result;
          dataRef.current[docKey] = dataUrl;
          setDocState(s => ({ ...s, [docKey]: { preview: dataUrl, scanning: !!docType?.ocrPrompt, ocr: null, applied: false } }));

          if (!docType?.ocrPrompt) return;

          try {
            const base64 = dataUrl.split(',')[1];
            let contentParts;
            if (isPdf) {
              // PDFs use document type
              contentParts = [
                { type:'document', source:{ type:'base64', media_type:'application/pdf', data:base64 } },
                { type:'text', text: docType.ocrPrompt }
              ];
            } else {
              // Images use image type
              const mtype = isImage ? file.type : 'image/jpeg';
              contentParts = [
                { type:'image', source:{ type:'base64', media_type:mtype, data:base64 } },
                { type:'text', text: docType.ocrPrompt }
              ];
            }

            const res = await fetch('/api/claude', {
              method:'POST',
              headers:{ 'Content-Type':'application/json' },
              body: JSON.stringify({
                model:'claude-haiku-4-5-20251001',
                max_tokens: docKey === 'interview_sheet_url' ? 3000 : 1000,
                messages:[{ role:'user', content: contentParts }]
              })
            });
            if (!res.ok) {
              const errText = await res.text();
              throw new Error(`API error ${res.status}: ${errText.slice(0,120)}`);
            }
            const json = await res.json();
            const raw = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
            let ocr = {};
            try {
              ocr = parseClaudeJson(raw);
            } catch(e) {
              // Show full diagnostic: error + first 200 chars of raw
              ocr = { error: 'Parse failed: ' + e.message + ' | raw: ' + raw.slice(0,200) };
            }
            setDocState(s => ({ ...s, [docKey]: { ...s[docKey], scanning: false, ocr } }));
          } catch(e) {
            setDocState(s => ({ ...s, [docKey]: { ...s[docKey], scanning: false, ocr: { error: e.message } } }));
          }
        };
        reader.readAsDataURL(file);
      };

      const applyOcr = async (docKey) => {

        const dt = HIRING_DOC_TYPES.find(d => d.key === docKey);
