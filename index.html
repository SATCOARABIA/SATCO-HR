    // ============ HIRING PIPELINE ============
    const HIRING_STEPS = [
      { id: 'resume',       label: 'Resume Received',         icon: '📄', days: 2,  color: '#6366f1' },
      { id: 'interview',    label: 'Interview Conducted',      icon: '🎙️', days: 5,  color: '#2563eb' },
      { id: 'offer_sent',   label: 'Offer Letter Sent',        icon: '📧', days: 3,  color: '#0891b2' },
      { id: 'offer_signed', label: 'Offer Letter Signed',      icon: '✍️', days: 7,  color: '#059669' },
      { id: 'visa_medical', label: 'Visa Medical (GAMKA)',     icon: '🏥', days: 7,  color: '#ca8a04' },
      { id: 'docs_sent',    label: 'Visa Docs Sent to India',  icon: '📨', days: 3,  color: '#ea580c' },
      { id: 'visa_stamped', label: 'Visa Stamped',            icon: '🛂', days: 14, color: '#dc2626' },
      { id: 'travel',       label: 'Travel to UAE',           icon: '✈️', days: 5,  color: '#7c3aed' },
      { id: 'joined',       label: 'Joined',                  icon: '🏢', days: 0,  color: '#059669' },
    ];

    const HIRING_STATUS_COLORS = {
      'Active': '#059669', 'Offer Pending': '#2563eb', 'Offer Accepted': '#0891b2',
      'Visa Processing': '#ca8a04', 'Travelling': '#7c3aed', 'Joined': '#059669',
      'Withdrawn': '#dc2626', 'On Hold': '#94a3b8',
    };

    function HiringView({ records, onAdd, onEdit, onDelete, showToast }) {
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [viewMode, setViewMode] = useState('pipeline'); // 'pipeline' | 'table'
      const [viewCandidate, setViewCandidate] = useState(null); // candidate record to show in detail popup
      const today = new Date(); today.setHours(0,0,0,0);

      // Alert check: step_due_date overdue
      const overdue = records.filter(r => {
        if (!r.step_due_date || r.status === 'Joined' || r.status === 'Withdrawn') return false;
        const d = new Date(r.step_due_date); d.setHours(0,0,0,0);
        return d < today;
      });

      const filtered = useMemo(() => {
        let r = records;
        if (search) { const s = search.toLowerCase(); r = r.filter(c => ['candidate_name','position','passport_no','referred_by','current_location','status'].some(k => String(c[k]||'').toLowerCase().includes(s))); }
        if (statusFilter !== 'all') r = r.filter(c => c.status === statusFilter);
        return r;
      }, [records, search, statusFilter]);

      // Group by step for pipeline view
      const byStep = useMemo(() => {
        const m = {};
        HIRING_STEPS.forEach(s => { m[s.id] = []; });
        filtered.forEach(r => { if (m[r.step]) m[r.step].push(r); else m['resume'] = [...(m['resume']||[]), r]; });
        return m;
      }, [filtered]);

      const statuses = [...new Set(records.map(r => r.status).filter(Boolean))];

      return (
        <div>
          {/* Overdue Alert Banner */}
          {overdue.length > 0 && (
            <div style={{ background:'#fee2e2', border:'1px solid #fca5a5', borderRadius:'10px', padding:'12px 18px', marginBottom:'14px', display:'flex', alignItems:'center', gap:'12px' }}>
              <span style={{ fontSize:'20px' }}>⚠️</span>
              <div>
                <div style={{ fontWeight:700, color:'#991b1b', fontSize:'13.5px' }}>{overdue.length} candidate{overdue.length>1?'s':''} overdue for follow-up</div>
                <div style={{ fontSize:'12px', color:'#b91c1c', marginTop:'2px' }}>{overdue.map(r => r.candidate_name).join(', ')}</div>
              </div>
            </div>
          )}

          {/* KPI Row */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:'10px', marginBottom:'16px' }}>
            {[
              { label:'Total Candidates', value: records.length, icon:'👥', color:'#2563eb' },
              { label:'Active', value: records.filter(r=>!['Joined','Withdrawn'].includes(r.status)).length, icon:'🔄', color:'#059669' },
              { label:'Offer Pending', value: records.filter(r=>r.status==='Offer Pending').length, icon:'📧', color:'#0891b2' },
              { label:'Visa Processing', value: records.filter(r=>r.status==='Visa Processing').length, icon:'🛂', color:'#ca8a04' },
              { label:'Overdue Steps', value: overdue.length, icon:'⏰', color:'#dc2626' },
            ].map(k => (
              <div key={k.label} className="hr-card" style={{ background:'#fff', border:'1px solid #e2e8f0', borderLeft:`3px solid ${k.color}`, borderRadius:'12px', padding:'14px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'6px' }}><div style={{ fontSize:'11.5px', color:'#64748b', fontWeight:600, lineHeight:1.3 }}>{k.label}</div><div style={{ fontSize:'16px' }}>{k.icon}</div></div>
                <div style={{ fontSize:'26px', fontWeight:700, color: k.value>0&&k.label==='Overdue Steps'?'#dc2626':'#0f172a', lineHeight:1 }}>{k.value}</div>
              </div>
            ))}
          </div>

          {/* Toolbar */}
          <div style={{ display:'flex', gap:'10px', marginBottom:'14px', flexWrap:'wrap', alignItems:'center' }}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search name, position, passport, location…" style={{ ...S.input, flex:1, minWidth:'240px', maxWidth:'380px' }} />
            <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={S.input}>
              <option value="all">All Status</option>
              {statuses.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
            <div style={{ display:'flex', border:'1px solid #cbd5e1', borderRadius:'8px', overflow:'hidden' }}>
              {[['pipeline','🗂 Pipeline'],['table','📋 Table']].map(([k,l])=>(
                <button key={k} onClick={()=>setViewMode(k)} style={{ background:viewMode===k?'#2563eb':'#fff', color:viewMode===k?'#fff':'#475569', border:'none', padding:'7px 14px', fontSize:'12.5px', fontWeight:600, cursor:'pointer' }}>{l}</button>
              ))}
            </div>
            <button className="hr-btn" style={S.btnPri} onClick={onAdd}>+ New Candidate</button>
          </div>

          {/* Pipeline Board */}
          {viewMode === 'pipeline' && (
            <div className="hr-scroll" style={{ overflowX:'auto', paddingBottom:'8px' }}>
              <div style={{ display:'flex', gap:'12px', minWidth: HIRING_STEPS.length * 220 + 'px' }}>
                {HIRING_STEPS.map(step => {
                  const cards = byStep[step.id] || [];
                  return (
                    <div key={step.id} style={{ width:'200px', flexShrink:0 }}>
                      <div style={{ background:step.color, color:'#fff', borderRadius:'8px 8px 0 0', padding:'8px 12px', fontSize:'12px', fontWeight:700, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                        <span>{step.icon} {step.label}</span>
                        <span style={{ background:'rgba(255,255,255,0.25)', borderRadius:'10px', padding:'1px 8px', fontSize:'11px' }}>{cards.length}</span>
                      </div>
                      <div style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderTop:'none', borderRadius:'0 0 8px 8px', minHeight:'120px', padding:'8px', display:'flex', flexDirection:'column', gap:'7px' }}>
                        {cards.map(c => {
                          const due = c.step_due_date ? daysUntil(c.step_due_date) : null;
                          const isOverdue = due !== null && due < 0;
                          return (
                            <div key={c.id} style={{ background:'#fff', border:`1px solid ${isOverdue?'#fca5a5':'#e2e8f0'}`, borderRadius:'8px', padding:'9px 10px', cursor:'pointer', boxShadow:isOverdue?'0 0 0 2px #fee2e2':'none' }}>
                              <div onClick={()=>setViewCandidate(c)} style={{ fontWeight:700, fontSize:'12px', color:'#2563eb', marginBottom:'3px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', textDecoration:'underline', textDecorationStyle:'dotted' }}>{c.candidate_name||'(no name)'}</div>
                              <div onClick={()=>onEdit(c)} style={{ fontSize:'10.5px', color:'#64748b', marginBottom:'4px' }}>{c.position||'—'}</div>
                              <div onClick={()=>onEdit(c)} style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                <span style={{ fontSize:'10px', color:'#94a3b8' }}>{c.nationality}</span>
                                {due !== null && <span style={{ fontSize:'10px', fontWeight:700, color:isOverdue?'#dc2626':'#059669', background:isOverdue?'#fee2e2':'#f0fdf4', padding:'1px 6px', borderRadius:'8px' }}>{isOverdue?`${Math.abs(due)}d overdue`:`${due}d left`}</span>}
                              </div>
                            </div>
                          );
                        })}
                        {cards.length===0 && <div style={{ textAlign:'center', color:'#cbd5e1', fontSize:'11px', padding:'16px 0' }}>Empty</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Table View */}
          {viewMode === 'table' && (
            <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden' }}>
              <div className="hr-scroll" style={{ overflowX:'auto' }}>
                <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'12.5px', minWidth:'1200px' }}>
                  <thead><tr style={{ background:'#f8fafc' }}>
                    {['Candidate','Position','Nationality','Email','Phone','Exp.','Location','Interview','Score','Referred By','Salary','Status','Step','Due Date',''].map(h=><th key={h} style={S.th}>{h}</th>)}
                  </tr></thead>
                  <tbody>
                    {filtered.length===0 ? <tr><td colSpan={15} style={{ textAlign:'center', padding:'40px', color:'#94a3b8' }}>No candidates found</td></tr> :
                      filtered.map(c => {
                        const due = c.step_due_date ? daysUntil(c.step_due_date) : null;
                        const isOverdue = due !== null && due < 0;
                        const step = HIRING_STEPS.find(s=>s.id===c.step);
                        const statusColor = HIRING_STATUS_COLORS[c.status] || '#64748b';
                        return (
                          <tr key={c.id} className="hr-row" style={{ borderTop:'1px solid #f1f5f9', background: isOverdue?'#fff7f7':'#fff' }}>
                            <td style={{ ...S.td, fontWeight:600 }} title={c.skills ? `Skills: ${c.skills}` : ''}>
                              <span onClick={()=>setViewCandidate(c)} style={{ color:'#2563eb', cursor:'pointer', textDecoration:'underline', textDecorationStyle:'dotted' }}>{c.candidate_name||'—'}</span>
                              <div style={{ fontSize:'10.5px', color:'#94a3b8', fontFamily:'mono' }}>{c.passport_no}</div>
                              {c.skills && <div style={{ fontSize:'10px', color:'#6366f1', marginTop:'2px', maxWidth:'140px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>🎯 {c.skills}</div>}
                            </td>
                            <td style={S.td}>{c.position||'—'}</td>
                            <td style={S.td}>{c.nationality||'—'}</td>
                            <td style={S.td}><a href={`mailto:${c.email}`} style={{ color:'#2563eb', textDecoration:'none', fontSize:'11.5px' }}>{c.email||'—'}</a></td>
                            <td style={S.td}>{c.phone||'—'}</td>
                            <td style={{ ...S.td, textAlign:'center' }}>{c.experience ? <span style={{ background:'#eff6ff', color:'#1d4ed8', padding:'2px 8px', borderRadius:'10px', fontWeight:700, fontSize:'11px' }}>{c.experience}yr</span> : '—'}</td>
                            <td style={S.td}>{c.current_location||'—'}</td>
                            <td style={S.td}>{c.interview_date?fmtDateDisplay(c.interview_date):'—'}<div style={{ fontSize:'10.5px', color:'#94a3b8' }}>{c.interview_type}</div></td>
                            <td style={{ ...S.td, textAlign:'center' }}>
                              {c.interview_score ? <span style={{ background: c.interview_score>=8?'#d1fae5':c.interview_score>=6?'#fef3c7':'#fee2e2', color: c.interview_score>=8?'#065f46':c.interview_score>=6?'#92400e':'#991b1b', padding:'2px 8px', borderRadius:'10px', fontWeight:700, fontSize:'12px' }}>{c.interview_score}/10</span> : '—'}
                            </td>
                            <td style={S.td}>{c.referred_by||'—'}</td>
                            <td style={S.td}>{c.basic_salary?`AED ${Number(c.basic_salary).toLocaleString()}`:'—'}<div style={{ fontSize:'10.5px', color:'#94a3b8' }}>{c.allowance?`+AED ${Number(c.allowance).toLocaleString()} allow.`:''}</div></td>
                            <td style={S.td}><span style={{ background:statusColor+'18', color:statusColor, padding:'2px 8px', borderRadius:'10px', fontSize:'11px', fontWeight:600 }}>{c.status||'—'}</span></td>
                            <td style={S.td}>{step ? <span style={{ display:'flex', alignItems:'center', gap:'4px', fontSize:'11.5px' }}>{step.icon} {step.label}</span> : '—'}</td>
                            <td style={S.td}>{due!==null?<span style={{ color:isOverdue?'#dc2626':'#475569', fontWeight:isOverdue?700:400, fontSize:'11.5px' }}>{isOverdue?`⚠ ${Math.abs(due)}d overdue`:fmtDateDisplay(c.step_due_date)}</span>:'—'}</td>
                            <td style={{ ...S.td, textAlign:'right', whiteSpace:'nowrap' }}>
                              <button onClick={()=>onEdit(c)} style={S.iconBtn}>✏️</button>
                              <button onClick={()=>onDelete(c.id)} style={S.iconBtn}>🗑️</button>
                            </td>
                          </tr>
                        );
                      })
                    }
                  </tbody>
                </table>
              </div>
            </div>
          )}
          <div style={{ marginTop:'10px', fontSize:'12px', color:'#64748b' }}>{filtered.length} candidate{filtered.length!==1?'s':''} shown</div>
        </div>

        {/* ── Candidate Detail Popup ── */}
        {viewCandidate && (() => {
          const c = viewCandidate;
          let wh = [];
          try { wh = JSON.parse(c.work_history || '[]'); } catch {}
          const step = HIRING_STEPS.find(s=>s.id===c.step);
          const statusColor = HIRING_STATUS_COLORS[c.status] || '#64748b';
          const Row = ({ label, value }) => value ? (
            <div style={{ display:'flex', gap:'8px', padding:'6px 0', borderBottom:'1px solid #f1f5f9' }}>
              <span style={{ minWidth:'160px', fontSize:'12px', color:'#64748b', fontWeight:600, flexShrink:0 }}>{label}</span>
              <span style={{ fontSize:'12px', color:'#0f172a' }}>{value}</span>
            </div>
          ) : null;
          return (
            <div onClick={()=>setViewCandidate(null)} style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.6)', zIndex:9999, display:'flex', alignItems:'center', justifyContent:'flex-end' }}>
              <div onClick={e=>e.stopPropagation()} style={{ width:'520px', maxWidth:'95vw', height:'100vh', background:'#fff', display:'flex', flexDirection:'column', boxShadow:'-8px 0 40px rgba(0,0,0,0.15)', overflowY:'auto' }} className="hr-scroll">
                {/* Header */}
                <div style={{ background:'linear-gradient(135deg,#1e3a5f,#2563eb)', color:'#fff', padding:'20px 24px', flexShrink:0 }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                    <div>
                      <div style={{ fontSize:'20px', fontWeight:800, marginBottom:'4px' }}>{c.candidate_name||'(no name)'}</div>
                      <div style={{ fontSize:'13px', opacity:0.85 }}>{c.position||''} {c.nationality ? `· ${c.nationality}` : ''}</div>
                      <div style={{ marginTop:'8px', display:'flex', gap:'8px', flexWrap:'wrap' }}>
                        <span style={{ background:'rgba(255,255,255,0.2)', padding:'2px 10px', borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>{step?.icon} {step?.label||c.step}</span>
                        <span style={{ background:statusColor, padding:'2px 10px', borderRadius:'10px', fontSize:'11px', fontWeight:700 }}>{c.status}</span>
                        {c.experience && <span style={{ background:'rgba(255,255,255,0.15)', padding:'2px 10px', borderRadius:'10px', fontSize:'11px' }}>⏱ {c.experience} yrs exp</span>}
                      </div>

    // -------- Hiring Modal --------
    // ── Uncontrolled field: lag-free text input that reads from dataRef ──
    function UF({ label, fieldKey, dataRef, type='text', opts, wide, placeholder, onBlur }) {
      const inputRef = React.useRef(null);
      // Initialise value once from dataRef
      React.useEffect(() => {
        if (inputRef.current) inputRef.current.value = dataRef.current[fieldKey] || '';
      }, [fieldKey]);
      const handleBlur = (e) => {
        dataRef.current[fieldKey] = e.target.value;
        if (onBlur) onBlur(fieldKey, e.target.value);
      };
      const handleChange = (e) => { dataRef.current[fieldKey] = e.target.value; };
      if (opts) {
        return (
          <div style={{ gridColumn: wide?'span 2':undefined }}>
            <label style={S.label}>{label}</label>
            <select defaultValue={dataRef.current[fieldKey]||''} onChange={e=>{ dataRef.current[fieldKey]=e.target.value; }}
              style={{ ...S.input, width:'100%' }}>
              <option value="">— Select —</option>
              {opts.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          </div>
        );
      }
      if (type==='textarea') return (
        <div style={{ gridColumn: wide?'span 2':undefined }}>
          <label style={S.label}>{label}</label>
          <textarea ref={inputRef} defaultValue={dataRef.current[fieldKey]||''} onBlur={handleBlur} onChange={handleChange}
            placeholder={placeholder} style={{ ...S.input, width:'100%', minHeight:'70px', resize:'vertical' }} />
        </div>
      );
      return (
        <div style={{ gridColumn: wide?'span 2':undefined }}>
          <label style={S.label}>{label}</label>
          <input ref={inputRef} type={type} defaultValue={dataRef.current[fieldKey]||''} onBlur={handleBlur} onChange={handleChange}
            placeholder={placeholder} style={{ ...S.input, width:'100%' }} />
        </div>
      );
    }

    function HiringModal({ record, onSave, onClose, showToast }) {
      // Use ref for data so text inputs don't cause re-renders
      const dataRef = React.useRef({ step:'resume', status:'Active', ...record });
      const [activeTab, setActiveTab] = useState('candidate');
      const [docState, setDocState] = useState({}); // per-docKey: { preview, scanning, ocr, applied }
      const [renderKey, setRenderKey] = useState(0); // force re-render when needed
      const [previewDoc, setPreviewDoc] = useState(null); // { url, isPdf, label }

      const updateField = (k, v) => { dataRef.current[k] = v; };

      // Collect current values from dataRef for saving
      const collectAndSave = () => {
        // Also flush any uncontrolled inputs that may not have fired blur
        onSave({ ...dataRef.current });
      };

      const HIRING_DOC_TYPES = [
        { key:'passport_img_url', label:'🛂 Passport', accept:'image/jpeg,image/png,image/webp,application/pdf',
          ocrPrompt:`OCR this passport. Extract:
1. Full name (surname + given names)
2. Passport number
3. Date of birth (YYYY-MM-DD)
4. Nationality
5. Expiry date (YYYY-MM-DD)
Reply ONLY as valid JSON, no markdown:
{"fullName":"...","passportNo":"...","dob":"YYYY-MM-DD","nationality":"...","expiryDate":"YYYY-MM-DD"}
Use null for missing fields.` },
        { key:'resume_url', label:'📄 Resume / CV', accept:'image/jpeg,image/png,application/pdf',
          ocrPrompt:`Read this resume/CV/bio-data carefully and extract ALL available information.
Reply ONLY as valid JSON, no markdown, no extra text:
{
  "fullName": "...",
  "email": "...",
  "phone": "...",
  "dob": "YYYY-MM-DD or null",
  "nationality": "...",
  "religion": "...",
  "maritalStatus": "...",
  "languages": "...",
  "address": "...",
  "passportNo": "...",
  "passportExpiry": "YYYY-MM-DD or null",
  "experienceYears": "number as string",
  "position": "primary job title/position applied for",
  "education": "highest qualification",
  "currentEmployer": "most recent company name",
  "currentDesignation": "most recent job title",
  "currentLocation": "most recent work location/country",
  "skills": "comma-separated key skills (max 8)",
  "workHistory": "JSON array string: [{company,designation,location,from,to}] for ALL jobs listed"
}
Use null for any missing fields. workHistory must be a JSON array stringified into a string.` },
        { key:'offer_signed_url', label:'✍️ Signed Offer Letter', accept:'image/*,.pdf', ocrPrompt:null },
        { key:'certificates_url', label:'🎓 Certificates', accept:'.pdf,image/*', ocrPrompt:null },
      ];

      const handleDocFile = async (docKey, file) => {
        if (!file) return;
        const docType = HIRING_DOC_TYPES.find(d => d.key === docKey);
        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        const isImage = file.type.startsWith('image/');

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const dataUrl = ev.target.result;
          dataRef.current[docKey] = dataUrl;
          setDocState(s => ({ ...s, [docKey]: { preview: dataUrl, scanning: !!docType?.ocrPrompt, ocr: null, applied: false } }));

          if (!docType?.ocrPrompt) return;

          try {
            const base64 = dataUrl.split(',')[1];
            let contentParts;
            if (isPdf) {
              // PDFs use document type
              contentParts = [
                { type:'document', source:{ type:'base64', media_type:'application/pdf', data:base64 } },
                { type:'text', text: docType.ocrPrompt }
              ];
            } else {
              // Images use image type
              const mtype = isImage ? file.type : 'image/jpeg';
              contentParts = [
                { type:'image', source:{ type:'base64', media_type:mtype, data:base64 } },
                { type:'text', text: docType.ocrPrompt }
              ];
            }

            const res = await fetch('/api/claude', {
              method:'POST',
              headers:{ 'Content-Type':'application/json', 'x-api-key':ANTHROPIC_KEY, 'anthropic-dangerous-direct-browser-calls':'true' },
              body: JSON.stringify({
                model:'claude-haiku-4-5-20251001',
                max_tokens:600,
                messages:[{ role:'user', content: contentParts }]
              })
            });
            if (!res.ok) {
              const errText = await res.text();
              throw new Error(`API error ${res.status}: ${errText.slice(0,120)}`);
            }
            const json = await res.json();
            const raw = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
            let ocr = {};
            try { ocr = JSON.parse(raw.replace(/```json|```/g,'').trim()); } catch { ocr = { error:'Parse failed — ' + raw.slice(0,80) }; }
            setDocState(s => ({ ...s, [docKey]: { ...s[docKey], scanning: false, ocr } }));
          } catch(e) {
            setDocState(s => ({ ...s, [docKey]: { ...s[docKey], scanning: false, ocr: { error: e.message } } }));
          }
        };
        reader.readAsDataURL(file);
      };

      const applyOcr = (docKey) => {
        const ocr = docState[docKey]?.ocr;
        if (!ocr || ocr.error) return;
        // Passport fields
        if (docKey === 'passport_img_url') {
          if (ocr.fullName)    { dataRef.current.candidate_name = ocr.fullName; }
          if (ocr.passportNo)  { dataRef.current.passport_no    = ocr.passportNo; }
          if (ocr.nationality) { dataRef.current.nationality    = ocr.nationality; }
          if (ocr.dob)         { dataRef.current.dob            = ocr.dob; }
        }
        // Resume fields
        if (docKey === 'resume_url') {
          if (ocr.fullName)          { dataRef.current.candidate_name    = ocr.fullName; }
          if (ocr.email)             { dataRef.current.email             = ocr.email; }
          if (ocr.phone)             { dataRef.current.phone             = ocr.phone; }
          if (ocr.position)          { dataRef.current.position          = ocr.position; }
          if (ocr.experienceYears)   { dataRef.current.experience        = String(ocr.experienceYears); }
          if (ocr.skills)            { dataRef.current.skills            = ocr.skills; }
          if (ocr.nationality)       { dataRef.current.nationality       = ocr.nationality; }
          if (ocr.dob)               { dataRef.current.dob_candidate     = ocr.dob; }
          if (ocr.passportNo)        { dataRef.current.passport_no       = ocr.passportNo; }
          if (ocr.passportExpiry)    { dataRef.current.passport_expiry_candidate = ocr.passportExpiry; }
          if (ocr.address)           { dataRef.current.home_address      = ocr.address; }
          if (ocr.maritalStatus)     { dataRef.current.marital_status    = ocr.maritalStatus; }
          if (ocr.religion)          { dataRef.current.religion          = ocr.religion; }
          if (ocr.languages)         { dataRef.current.languages         = ocr.languages; }
          if (ocr.education)         { dataRef.current.education         = ocr.education; }
          if (ocr.currentEmployer)   { dataRef.current.current_employer  = ocr.currentEmployer; }
          if (ocr.currentDesignation){ dataRef.current.current_designation = ocr.currentDesignation; }
          if (ocr.currentLocation)   { dataRef.current.current_location  = ocr.currentLocation; }
          if (ocr.workHistory)       { dataRef.current.work_history      = ocr.workHistory; }
        }
        setDocState(s => ({ ...s, [docKey]: { ...s[docKey], applied: true } }));
        setRenderKey(k => k+1); // re-mount text fields to show updated values
        setTimeout(() => setDocState(s => ({ ...s, [docKey]: { ...s[docKey], applied: false } })), 3000);
        showToast('Details auto-filled from document ✓');
      };

      const rescanDoc = async (docKey, docType) => {
        const savedUrl = dataRef.current[docKey];
        if (!savedUrl || !docType?.ocrPrompt) return;
        const isPdf = savedUrl.startsWith('data:application/pdf');
        const isImage = savedUrl.startsWith('data:image');
        setDocState(s => ({ ...s, [docKey]: { ...s[docKey], scanning: true, ocr: null } }));
        try {
          const base64 = savedUrl.split(',')[1];
          let contentParts;
          if (isPdf) {
            contentParts = [
              { type:'document', source:{ type:'base64', media_type:'application/pdf', data:base64 } },
              { type:'text', text: docType.ocrPrompt }
            ];
          } else {
            const mtype = isImage ? savedUrl.split(';')[0].split(':')[1] : 'image/jpeg';
            contentParts = [
              { type:'image', source:{ type:'base64', media_type:mtype, data:base64 } },
              { type:'text', text: docType.ocrPrompt }
            ];
          }
          const res = await fetch('/api/claude', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:600, messages:[{ role:'user', content: contentParts }] })
          });
          if (!res.ok) { const t = await res.text(); throw new Error(`API error ${res.status}: ${t.slice(0,120)}`); }
          const json = await res.json();
          const raw = (json.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
          let ocr = {};
          try { ocr = JSON.parse(raw.replace(/```json|```/g,'').trim()); } catch { ocr = { error:'Parse failed — ' + raw.slice(0,80) }; }
          setDocState(s => ({ ...s, [docKey]: { ...s[docKey], scanning: false, ocr } }));
        } catch(e) {
          setDocState(s => ({ ...s, [docKey]: { ...s[docKey], scanning: false, ocr: { error: e.message } } }));
        }
      };

      const tabs = [
        { id:'candidate', label:'👤 Candidate' },
        { id:'interview', label:'🎙 Interview' },
        { id:'offer',     label:'📄 Offer' },
        { id:'pipeline',  label:'🔄 Pipeline' },

        setRenderKey(k => k+1);

      return (

              )}

              {/* ── TAB: Interview ── */}
              {activeTab==='interview' && (
                <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
                  <SectionHead label="Interview Details" />
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'12px' }}>
                    <F label="Interview Date" fieldKey="interview_date" type="date" />
                    <F label="Interview Type" fieldKey="interview_type" opts={['In Person','Online / Video','Phone']} />
                    <F label="Interviewed By" fieldKey="interviewed_by" placeholder="Name of interviewer" />
                    <F label="Interview Score (out of 10)" fieldKey="interview_score" type="number" placeholder="e.g. 8" />
                    <F label="Interview Notes / Observations" fieldKey="interview_notes" type="textarea" wide placeholder="Skills assessed, remarks, language proficiency…" />
                  </div>
                  <SectionHead label="Offer Details (from Offer Letter)" />
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'12px' }}>
                    <F label="Basic Salary (AED)" fieldKey="basic_salary" type="number" placeholder="e.g. 4000" />
                    <F label="Allowance (AED)" fieldKey="allowance" type="number" placeholder="e.g. 1000" />
                    <div style={{ gridColumn:'span 2', display:'flex', alignItems:'flex-end', gap:'10px' }}>
                      <div style={{ flex:1 }}>
                        <label style={S.label}>Total Gross Salary (AED)</label>
                        <input key={`total-${renderKey}`} type="number" defaultValue={dataRef.current.total_salary||''} readOnly
                          style={{ ...S.input, width:'100%', background:'#f8fafc', fontWeight:700 }} placeholder="Click ⟳ to calculate" />
                      </div>
                      <button onClick={autoCalcTotal} style={{ background:'#eff6ff', border:'1px solid #bfdbfe', color:'#1d4ed8', padding:'8px 14px', borderRadius:'6px', fontSize:'12px', cursor:'pointer', fontWeight:600, whiteSpace:'nowrap', flexShrink:0 }}>⟳ Calculate</button>
                    </div>
                    <F label="Accommodation" fieldKey="accommodation" opts={['Provided by SATCO','Self-arranged']} />
                    <F label="Air Ticket (initial)" fieldKey="air_ticket" opts={['Borne by Employee','Provided by SATCO']} />
                  </div>
                </div>
              )}

              {/* ── TAB: Offer ── */}
              {activeTab==='offer' && (
                <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
                  <SectionHead label="Offer Letter Tracking" />
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'12px' }}>
                    <F label="Offer Letter Date" fieldKey="offer_letter_date" type="date" />
                    <F label="Offer Accepted Date" fieldKey="offer_accepted_date" type="date" />
                    <F label="Offer Status" fieldKey="offer_status" opts={['Draft','Sent','Accepted','Rejected','Withdrawn']} />
                  </div>
                  <div style={{ background:'#eff6ff', border:'1px solid #bfdbfe', borderRadius:'8px', padding:'12px', fontSize:'12px', color:'#1e40af', lineHeight:1.6 }}>
                    💡 Upload the signed offer letter in the <strong>📁 Documents</strong> tab.
                  </div>
                </div>
              )}

              {/* ── TAB: Pipeline ── */}
              {activeTab==='pipeline' && (
                <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
                  <SectionHead label="Hiring Workflow Status" />
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'12px' }}>
                    <F label="Overall Status" fieldKey="status" opts={['Active','Offer Pending','Offer Accepted','Visa Processing','Travelling','Joined','On Hold','Withdrawn']} />
                    <F label="Current Step" fieldKey="step" opts={HIRING_STEPS.map(s=>s.id)} />
                    <F label="Step Due Date" fieldKey="step_due_date" type="date" />
                  </div>
                  {/* Step tracker — reads from dataRef live */}
                  <div>
                    <div style={{ fontSize:'11.5px', fontWeight:700, color:'#475569', textTransform:'uppercase', letterSpacing:'0.8px', marginBottom:'12px' }}>Step-by-Step Progress</div>
                    <div style={{ display:'flex', flexDirection:'column' }}>
                      {HIRING_STEPS.map((step, idx) => {
                        const curStep = dataRef.current.step || 'resume';
                        const stepIdx = HIRING_STEPS.findIndex(s => s.id === curStep);
                        const done = idx < stepIdx; const active = idx === stepIdx;
                        const dateMap = { resume:'created_at', interview:'interview_date', offer_sent:'offer_letter_date', offer_signed:'offer_accepted_date', visa_medical:'visa_medical_date', docs_sent:'visa_documents_sent_date', visa_stamped:'visa_stamped_date', travel:'expected_arrival_date', joined:'available_from' };
                        const dateFld = dataRef.current[dateMap[step.id]];
                        return (
                          <div key={step.id} style={{ display:'flex', gap:'14px' }}>
                            <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
                              <div style={{ width:'32px', height:'32px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'14px', background: done||active?step.color:'#e2e8f0', color: done||active?'#fff':'#94a3b8', fontWeight:700, flexShrink:0, boxShadow: active?`0 0 0 3px ${step.color}33`:'none' }}>{done?'✓':step.icon}</div>
                              {idx < HIRING_STEPS.length-1 && <div style={{ width:'2px', flex:'1', minHeight:'24px', background: done?step.color:'#e2e8f0', margin:'2px 0' }}></div>}
                            </div>
                            <div style={{ flex:1, paddingBottom:'16px', paddingTop:'4px' }}>
                              <div style={{ display:'flex', justifyContent:'space-between' }}>
                                <div style={{ fontSize:'13px', fontWeight: active?700:600, color: done?'#059669':active?step.color:'#94a3b8' }}>{step.label}</div>
                                <div style={{ fontSize:'10.5px', color:'#94a3b8' }}>Target: {step.days}d</div>
                              </div>
                              {dateFld && <div style={{ fontSize:'11px', color:'#64748b', marginTop:'2px' }}>📅 {fmtDateDisplay(dateFld)}</div>}
                              {active && <span style={{ fontSize:'11px', color:step.color, fontWeight:600, background:step.color+'12', padding:'1px 8px', borderRadius:'8px' }}>← Current</span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  <SectionHead label="Key Dates" />
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'12px' }}>
                    <F label="Visa Medical Date (GAMKA)" fieldKey="visa_medical_date" type="date" />
                    <F label="Visa Docs Sent to India" fieldKey="visa_documents_sent_date" type="date" />
                    <F label="Visa Stamped Date" fieldKey="visa_stamped_date" type="date" />
                    <F label="Expected Arrival (UAE)" fieldKey="expected_arrival_date" type="date" />
                  </div>
                  <F label="Remarks / Notes" fieldKey="remarks" type="textarea" wide placeholder="Any follow-up actions, HR notes…" />
                </div>
              )}

              {/* ── TAB: Documents ── */}
              {activeTab==='documents' && (
                <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
                  <SectionHead label="Document Uploads with AI Auto-Detection" />
                  <div style={{ background:'#eff6ff', border:'1px solid #bfdbfe', borderRadius:'8px', padding:'12px', fontSize:'12px', color:'#1e40af', lineHeight:1.7 }}>
                    🤖 <strong>AI-powered:</strong> Upload Passport or Resume — Claude will automatically read and fill in the candidate's name, passport number, nationality, email, phone, and more. Click <strong>"Apply to Form"</strong> to confirm.
                  </div>

                  <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
                    {HIRING_DOC_TYPES.map(dt => {
                      const st = docState[dt.key] || {};
                      const savedUrl = dataRef.current[dt.key];
                      const preview = st.preview || (savedUrl?.startsWith('data:') ? savedUrl : null);
                      const isImg = preview?.startsWith('data:image');
                      const hasDoc = !!(st.preview || savedUrl);
                      return (
                        <div key={dt.key} style={{ border:'1px solid #e2e8f0', borderRadius:'12px', overflow:'hidden', background:'#fff' }}>
                          {/* Doc header row */}
                          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px', background: hasDoc?'#f0fdf4':'#f8fafc', borderBottom: hasDoc?'1px solid #86efac':'1px solid #e2e8f0' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                              <span style={{ fontSize:'14px' }}>{hasDoc?'✅':''}</span>
                              <span style={{ fontWeight:700, fontSize:'13px', color:'#0f172a' }}>{dt.label}</span>
                              {dt.ocrPrompt && <span style={{ fontSize:'10.5px', background:'#dbeafe', color:'#1d4ed8', padding:'1px 7px', borderRadius:'8px', fontWeight:600 }}>🤖 AI scan</span>}
                            </div>
                            <div style={{ display:'flex', gap:'8px', alignItems:'center' }}>
                              {hasDoc && savedUrl && !savedUrl.startsWith('data:') && (
                                <a href={savedUrl} target="_blank" rel="noopener noreferrer" style={{ fontSize:'11.5px', color:'#2563eb', fontWeight:600 }}>📎 View</a>
                              )}
                              {hasDoc && (
                                <button onClick={()=>{ dataRef.current[dt.key]=''; setDocState(s=>({...s,[dt.key]:{}})); }} style={{ ...S.iconBtn, fontSize:'11px', color:'#dc2626' }}>✖ Remove</button>
                              )}
                              <label style={{ background:'#2563eb', color:'#fff', padding:'5px 12px', borderRadius:'6px', fontSize:'11.5px', fontWeight:600, cursor:'pointer' }}>
                                {hasDoc?'↺ Replace':'⬆ Upload'}
                                <input type="file" accept={dt.accept} style={{ display:'none' }} onChange={e=>e.target.files[0]&&handleDocFile(dt.key,e.target.files[0])} />
                              </label>
                            </div>
                          </div>

                          {/* Preview */}
                          {hasDoc && (
                            <div style={{ padding:'14px 16px', display:'flex', gap:'16px', flexWrap:'wrap' }}>
                              {/* Clickable thumbnail */}
                              <div style={{ flexShrink:0 }}>
                                {(st.preview||savedUrl||'').startsWith('data:image') ? (
                                  <img
                                    src={st.preview||savedUrl} alt="doc"
                                    onClick={()=>setPreviewDoc({ url: st.preview||savedUrl, isPdf:false, label:dt.label })}
                                    style={{ width:'120px', height:'80px', objectFit:'cover', borderRadius:'8px', border:'2px solid #2563eb', cursor:'zoom-in' }}
                                    title="Click to view full size"
                                  />
                                ) : (
                                  <div
                                    onClick={()=>setPreviewDoc({ url: st.preview||savedUrl, isPdf:true, label:dt.label })}
                                    style={{ width:'120px', height:'80px', background:'#eff6ff', borderRadius:'8px', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'4px', border:'2px solid #2563eb', cursor:'zoom-in' }}
                                    title="Click to view document"
                                  >
                                    <span style={{ fontSize:'28px' }}>📄</span>
                                    <span style={{ fontSize:'10px', fontWeight:700, color:'#2563eb' }}>Click to View</span>
                                  </div>
                                )}
                              </div>

                              {/* OCR panel */}
                              <div style={{ flex:1 }}>
                                {st.scanning && (
                                  <div style={{ display:'flex', alignItems:'center', gap:'8px', color:'#2563eb', fontSize:'12.5px', fontWeight:600 }}>
                                    <div style={{ width:'14px', height:'14px', border:'2px solid #93c5fd', borderTopColor:'#2563eb', borderRadius:'50%', animation:'spin 0.8s linear infinite', flexShrink:0 }}></div>
                                    🤖 AI is reading the document…
                                  </div>
                                )}
                                {!st.scanning && st.ocr && !st.ocr.error && (
                                  <div>
                                    <div style={{ fontSize:'11.5px', fontWeight:700, color:'#059669', marginBottom:'8px' }}>✅ AI detected the following:</div>
                                    <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'4px 12px', marginBottom:'10px' }}>
                                      {Object.entries(st.ocr).filter(([k,v])=>v&&k!=='error').map(([k,v])=>(
                                        <div key={k} style={{ fontSize:'11px' }}>
                                          <span style={{ color:'#64748b', textTransform:'capitalize' }}>{k.replace(/([A-Z])/g,' $1').toLowerCase()}: </span>
                                          <span style={{ fontWeight:600, color:'#0f172a' }}>{String(v)}</span>
                                        </div>
                                      ))}
                                    </div>
                                    <div style={{ display:'flex', gap:'8px' }}>
                                      <button onClick={()=>applyOcr(dt.key)} style={{ background: st.applied?'#059669':'#2563eb', color:'#fff', border:'none', padding:'6px 14px', borderRadius:'6px', fontSize:'12px', fontWeight:700, cursor:'pointer', transition:'background 0.2s' }}>
                                        {st.applied ? '✓ Applied to form!' : '⬇ Apply to Form'}
                                      </button>
                                      {dt.ocrPrompt && <button onClick={()=>rescanDoc(dt.key, dt)} style={{ background:'#f8fafc', color:'#475569', border:'1px solid #cbd5e1', padding:'6px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>🔄 Re-scan</button>}
                                    </div>
                                  </div>
                                )}
                                {!st.scanning && st.ocr?.error && (
                                  <div>
                                    <div style={{ fontSize:'11.5px', color:'#dc2626', marginBottom:'8px' }}>⚠ Could not read document: {st.ocr.error}</div>
                                    {dt.ocrPrompt && <button onClick={()=>rescanDoc(dt.key, dt)} style={{ background:'#fef2f2', color:'#dc2626', border:'1px solid #fca5a5', padding:'5px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>🔄 Retry Scan</button>}
                                  </div>
                                )}
                                {!st.scanning && !st.ocr && !dt.ocrPrompt && (
                                  <div style={{ fontSize:'12px', color:'#64748b' }}>Document uploaded successfully.</div>
                                )}
                                {!st.scanning && !st.ocr && dt.ocrPrompt && hasDoc && (
                                  <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                                    <span style={{ fontSize:'12px', color:'#94a3b8' }}>Document saved.</span>
                                    <button onClick={()=>rescanDoc(dt.key, dt)} style={{ background:'#eff6ff', color:'#2563eb', border:'1px solid #bfdbfe', padding:'5px 12px', borderRadius:'6px', fontSize:'12px', fontWeight:600, cursor:'pointer' }}>🤖 Scan Now</button>
                                  </div>
                                )}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>

            {/* Document Preview Lightbox */}
            {previewDoc && (
              <div onClick={()=>setPreviewDoc(null)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.85)', zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center', padding:'20px' }}>
                <div onClick={e=>e.stopPropagation()} style={{ background:'#fff', borderRadius:'12px', overflow:'hidden', maxWidth:'90vw', maxHeight:'90vh', display:'flex', flexDirection:'column', boxShadow:'0 25px 60px rgba(0,0,0,0.5)' }}>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px', borderBottom:'1px solid #e2e8f0', background:'#f8fafc' }}>
                    <span style={{ fontWeight:700, fontSize:'14px', color:'#0f172a' }}>{previewDoc.label}</span>
                    <button onClick={()=>setPreviewDoc(null)} style={{ background:'none', border:'none', fontSize:'20px', cursor:'pointer', color:'#64748b', lineHeight:1 }}>✕</button>
                  </div>
                  <div style={{ overflow:'auto', flex:1, padding:'8px' }}>
                    {previewDoc.isPdf ? (
                      <iframe src={previewDoc.url} style={{ width:'75vw', height:'80vh', border:'none' }} title="Document Preview" />
                    ) : (
                      <img src={previewDoc.url} alt="Document" style={{ maxWidth:'80vw', maxHeight:'80vh', objectFit:'contain', display:'block' }} />
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Footer */}
            <div style={{ padding:'14px 22px', borderTop:'1px solid #e2e8f0', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div style={{ fontSize:'11.5px', color:'#94a3b8' }}>
                {record.id ? `Last updated: ${record.updated_at ? new Date(record.updated_at).toLocaleDateString('en-GB') : '—'}` : 'New candidate record'}
              </div>
              <div style={{ display:'flex', gap:'10px' }}>
                <button className="hr-btn" style={S.btnSec} onClick={onClose}>Cancel</button>
                <button className="hr-btn" style={S.btnPri} onClick={collectAndSave}>💾 Save Candidate</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SectionHead({ label }) {
      return <div style={{ fontSize:'11px', fontWeight:700, color:'#475569', textTransform:'uppercase', letterSpacing:'0.8px', paddingBottom:'6px', borderBottom:'2px solid #e2e8f0' }}>{label}</div>;
    }

    // ============ STYLES ============
    const S = {
      app: { display:'flex', minHeight:'100vh' },
      sidebar: { width:'230px', background:'linear-gradient(180deg, #0f172a 0%, #1e293b 100%)', color:'#cbd5e1', display:'flex', flexDirection:'column', flexShrink:0 },
      logo: { padding:'18px 16px', display:'flex', alignItems:'center', gap:'12px', borderBottom:'1px solid #1e293b', color:'#fff' },
      navItem: { display:'flex', alignItems:'center', gap:'12px', padding:'10px 16px', cursor:'pointer', fontSize:'13.5px' },
      main: { flex:1, display:'flex', flexDirection:'column', overflow:'hidden' },
      topbar: { background:'#fff', padding:'14px 22px', borderBottom:'1px solid #e2e8f0', display:'flex', justifyContent:'space-between', alignItems:'center' },
      content: { padding:'20px 22px', overflowY:'auto', flex:1 },
      btnPri: { background:'#2563eb', color:'#fff', border:'none', padding:'8px 14px', borderRadius:'6px', fontSize:'12.5px', fontWeight:600, cursor:'pointer' },
      btnSec: { background:'#fff', color:'#0f172a', border:'1px solid #cbd5e1', padding:'8px 14px', borderRadius:'6px', fontSize:'12.5px', fontWeight:600, cursor:'pointer' },
      iconBtn: { background:'transparent', border:'none', padding:'5px', cursor:'pointer', fontSize:'14px', borderRadius:'4px' },
      link: { background:'transparent', border:'none', color:'#2563eb', fontSize:'12px', cursor:'pointer', fontWeight:600 },
      input: { padding:'7px 10px', border:'1px solid #cbd5e1', borderRadius:'6px', fontSize:'12.5px', color:'#0f172a', background:'#fff' },
      label: { display:'block', fontSize:'11.5px', color:'#475569', marginBottom:'4px', fontWeight:500 },
      th: { textAlign:'left', padding:'10px 12px', fontSize:'10.5px', color:'#64748b', textTransform:'uppercase', letterSpacing:'0.5px', fontWeight:600, borderBottom:'1px solid #e2e8f0', whiteSpace:'nowrap' },
      td: { padding:'10px 12px', color:'#334155', verticalAlign:'middle' },
      chip: { background:'#f1f5f9', color:'#475569', border:'1px solid transparent', padding:'6px 11px', borderRadius:'16px', fontSize:'11.5px', fontWeight:600, cursor:'pointer' },
      chipActive: { background:'#dbeafe', color:'#1e40af', borderColor:'#93c5fd' },
      overlay: { position:'fixed', inset:0, background:'rgba(15,23,42,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100, animation:'fadeIn 0.15s' },
      modal: { background:'#fff', borderRadius:'12px', width:'90%', maxWidth:'780px', maxHeight:'88vh', display:'flex', flexDirection:'column', boxShadow:'0 25px 50px rgba(0,0,0,0.25)' },
    };

    // ============ ROOT ============
    function Root() {
      const [user, setUser] = useState(null);
      const [checking, setChecking] = useState(true);
      useEffect(() => {
        db.auth.getSession().then(({ data }) => { setUser(data.session?.user || null); setChecking(false); });
        const { data: sub } = db.auth.onAuthStateChange((_e, session) => setUser(session?.user || null));
        return () => sub.subscription.unsubscribe();
      }, []);
      const logout = async () => { await db.auth.signOut(); setUser(null); };
      if (checking) return <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh' }}><div className="spinner"></div></div>;
      if (!user) return <Login onLogin={setUser} />;
      return <HRApp user={user} onLogout={logout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
